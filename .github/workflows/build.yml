name: Validate and release

# The release file is never stored in the repository. Every entry lives in its
# own YAML file under effects/; this workflow checks them on every push and pull
# request and, on a tag v*, bundles them into effects.json and attaches it to a
# GitHub Release together with vocabulary.json, NOTICE.md and LICENSE.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate entries and build effects.json
    runs-on: ubuntu-latest
    permissions:
      # Only the release step needs write access; it is gated on a tag below.
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate and build
        env:
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            python tools/build.py --version "${TAG#v}"
          else
            python tools/build.py --version "dev-${GITHUB_SHA::7}"
          fi

      - name: Upload the build as a workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: open-effects-catalog
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Attach the files to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Create the release if the tag does not have one yet, then upload
          # (--clobber keeps a re-run of the same tag idempotent).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber
