text:
  de:
    name: Druckwechsel-Adsorption
    description: >-
      Ein Gasgemisch wird unter erhöhtem Druck durch ein Bett aus Adsorbens wie Zeolith, Aktivkohle
      oder Kohlenstoffmolekularsieb geleitet, das bestimmte Komponenten bevorzugt festhält,
      während die übrigen hindurchströmen. Senkt man danach den Druck, geben die beladenen
      Körner das adsorbierte Gas wieder ab; mit zwei oder mehr Betten im Wechsel entsteht
      ein kontinuierlicher Produktstrom.
    example: >-
      Sauerstoffkonzentratoren für Patienten, Stickstoffgeneratoren mit Kohlenstoffmolekularsieb,
      Wasserstoffreinigung in Raffinerien, Aufbereitung von Biogas zu Biomethan, Drucklufttrocknung
    conditions: >-
      Ein Adsorbens, das die Gaskomponenten unterschiedlich stark oder unterschiedlich schnell
      bindet, sowie Verdichter und Ventilsteuerung.
    limits: >-
      Sehr hohe Reinheiten und große Mengen erreicht man wirtschaftlicher mit Tieftemperatur-Luftzerlegung;
      Sauerstoff aus Zeolith-Anlagen erreicht höchstens etwa 95 %, weil Argon mit ihm durchtritt.
    sideEffects: >-
      Die Verdichtung kostet Energie, die Ventile takten laut, und Feuchte oder Verunreinigungen
      können das Adsorbens dauerhaft schädigen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Pressure swing adsorption
    description: >-
      A gas mixture is passed under elevated pressure through a bed of adsorbent such as zeolite,
      activated carbon or carbon molecular sieve, which preferentially retains certain components
      while the others flow through. When the pressure is then lowered, the loaded grains
      release the adsorbed gas; with two or more beds alternating, a continuous product stream
      is obtained.
    example: >-
      Medical oxygen concentrators, nitrogen generators with carbon molecular sieve, hydrogen
      purification in refineries, upgrading biogas to biomethane, compressed-air drying
    conditions: >-
      An adsorbent that binds the gas components with different strength or at different rates,
      plus a compressor and valve control.
    limits: >-
      Very high purities and large volumes are more economical with cryogenic air separation;
      oxygen from zeolite units reaches at most about 95 % because argon passes through with
      it.
    sideEffects: >-
      Compression costs energy, the valves cycle noisily, and moisture or contaminants can
      permanently damage the adsorbent.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
