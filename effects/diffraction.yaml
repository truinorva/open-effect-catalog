text:
  de:
    name: Beugung
    description: >-
      Trifft eine Welle auf ein Hindernis, einen Spalt oder eine periodische Struktur, breitet
      sie sich auch in den geometrischen Schattenraum aus. Die von verschiedenen Stellen ausgehenden
      Teilwellen überlagern sich und bilden je nach Wellenlänge und Strukturgröße charakteristische
      Muster aus hellen und dunklen Bereichen. Am stärksten ist die Beugung, wenn die Strukturen
      etwa so groß sind wie die Wellenlänge.
    example: >-
      Beugungsgitter in Spektrometern, Laserbeugung zur Partikelgrößenmessung, Hologramme,
      Strukturfarben, Regenbogenmuster auf CDs und DVDs, Schall, der um Hausecken dringt
    conditions: >-
      Wellen (Licht, Schall, Röntgenstrahlen, Materiewellen) und Strukturen, die nicht viel
      größer sind als die Wellenlänge.
    limits: >-
      Die Beugung begrenzt die Auflösung optischer Instrumente: Mit herkömmlicher Optik lassen
      sich Details unterhalb etwa der halben Wellenlänge nicht mehr trennen.
    sideEffects: Unschärfe und Lichtverluste an Blenden und Kanten optischer Systeme.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Diffraction
    description: >-
      When a wave meets an obstacle, a slit or a periodic structure, it also spreads into
      the geometric shadow. The partial waves from different points overlap and form characteristic
      patterns of bright and dark regions that depend on wavelength and structure size. Diffraction
      is strongest when the structures are about as large as the wavelength.
    example: >-
      Diffraction gratings in spectrometers, laser diffraction for particle sizing, holograms,
      structural colours, rainbow patterns on CDs and DVDs, sound bending around building
      corners
    conditions: >-
      Waves (light, sound, X-rays, matter waves) and structures not much larger than the wavelength.
    limits: >-
      Diffraction limits the resolution of optical instruments: conventional optics cannot
      resolve details smaller than about half the wavelength.
    sideEffects: Blurring and loss of light at apertures and edges in optical systems.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
