text:
  de:
    name: Synthetischer Diamant
    description: >-
      Synthetische Diamanten werden entweder unter sehr hohem Druck und hoher Temperatur aus
      Graphit mit einem Metall als Lösungsmittel kristallisiert (Hochdruck-Hochtemperatur-Verfahren)
      oder aus einem kohlenstoffhaltigen Gasplasma Schicht für Schicht auf einem Substrat
      abgeschieden (chemische Gasphasenabscheidung). Sie haben dieselbe Kristallstruktur wie
      natürliche Diamanten und damit deren außergewöhnliche Härte, Wärmeleitfähigkeit und
      optische Durchlässigkeit, lassen sich aber in gleichbleibender Qualität und gezielt
      mit Fremdatomen dotiert herstellen.
    example: >-
      Schleif-, Säge- und Bohrwerkzeuge, Schneidplatten, Wärmespreizer für Hochleistungselektronik
      und Laser, Fenster für Hochleistungslaser, Strahlungsdetektoren, Schmucksteine
    conditions: ''
    limits: >-
      Bei der Bearbeitung von Eisenwerkstoffen reagiert Diamant bei hohen Temperaturen mit
      dem Eisen und verschleißt schnell.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Synthetic diamond
    description: >-
      Synthetic diamonds are either crystallised from graphite at very high pressure and temperature
      with a metal acting as solvent (high-pressure high-temperature process), or deposited
      layer by layer onto a substrate from a carbon-containing gas plasma (chemical vapour
      deposition). They have the same crystal structure as natural diamonds and therefore
      the same exceptional hardness, thermal conductivity and optical transparency, but can
      be produced in consistent quality and deliberately doped with foreign atoms.
    example: >-
      Grinding, sawing and drilling tools, cutting inserts, heat spreaders for high-power
      electronics and lasers, windows for high-power lasers, radiation detectors, gemstones
    conditions: ''
    limits: >-
      When machining ferrous materials at high temperatures, diamond reacts with the iron
      and wears quickly.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
