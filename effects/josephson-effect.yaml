text:
  de:
    name: Josephson-Effekt
    description: >-
      Zwischen zwei Supraleitern, die durch eine nur wenige Nanometer dünne Barriere getrennt
      sind, können Cooper-Paare hindurchtunneln, so dass ein Suprastrom ohne Spannungsabfall
      fließt (Gleichstrom-Josephson-Effekt). Liegt dagegen eine Gleichspannung an, schwingt
      der Strom mit einer Frequenz, die genau proportional zur Spannung ist, rund 483,6 GHz
      pro Millivolt (Wechselstrom-Josephson-Effekt). Der maximale Suprastrom hängt außerdem
      sehr empfindlich vom magnetischen Fluss durch die Anordnung ab.
    example: >-
      SQUID-Magnetometer, Josephson-Spannungsnormal für das Volt, supraleitende Qubits, Detektoren
      für Mikrowellen- und Submillimeterstrahlung, supraleitende Logikschaltungen
    conditions: >-
      Temperatur unterhalb der Sprungtemperatur der Supraleiter, meist tiefe Kryotemperaturen,
      und eine sehr dünne isolierende oder normalleitende Barriere.
    limits: >-
      Oberhalb des kritischen Stroms bricht der Suprastrom zusammen; die Bauelemente müssen
      gegen magnetische Störfelder abgeschirmt werden.
    sideEffects: Die Kühlung mit flüssigem Helium oder Kryokühlern ist aufwendig.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Josephson effect
    description: >-
      Between two superconductors separated by a barrier only a few nanometres thick, Cooper
      pairs can tunnel through, so a supercurrent flows without any voltage drop (DC Josephson
      effect). If a DC voltage is applied instead, the current oscillates at a frequency exactly
      proportional to the voltage, about 483.6 GHz per millivolt (AC Josephson effect). The
      maximum supercurrent also depends very sensitively on the magnetic flux through the
      arrangement.
    example: >-
      SQUID magnetometers, Josephson voltage standard for the volt, superconducting qubits,
      detectors for microwave and submillimetre radiation, superconducting logic circuits
    conditions: >-
      Temperature below the critical temperature of the superconductors, usually deep cryogenic,
      and a very thin insulating or normal-conducting barrier.
    limits: >-
      Above the critical current the supercurrent breaks down; the devices have to be shielded
      against magnetic interference.
    sideEffects: Cooling with liquid helium or cryocoolers is costly.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
