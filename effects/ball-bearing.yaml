text:
  de:
    name: Kugellager
    description: >-
      Im Kugellager laufen Kugeln in Laufbahnen zwischen einem Innen- und einem Außenring
      und werden von einem Käfig auf Abstand gehalten. Statt zu gleiten, rollen die Kugeln
      ab, sodass eine Welle mit sehr geringer Reibung drehen kann; zugleich nimmt das Lager
      radiale und je nach Bauart auch axiale Kräfte auf.
    example: >-
      Elektromotoren, Fahrradnaben und Tretlager, Getriebe, Inlineskates, Lüfter, Werkzeugmaschinenspindeln
    conditions: >-
      Saubere, geschmierte Laufbahnen und eine Belastung innerhalb der Tragzahl.
    limits: >-
      Wegen der punktförmigen Kontakte tragen Kugellager weniger als Rollenlager gleicher
      Größe, und ihre Lebensdauer ist durch Ermüdung der Laufflächen begrenzt.
    sideEffects: >-
      Verschmutzte oder beschädigte Laufbahnen erzeugen Geräusche und Vibrationen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Ball bearing
    description: >-
      In a ball bearing, balls run in raceways between an inner and an outer ring and are
      kept apart by a cage. Instead of sliding, the balls roll, so a shaft can turn with very
      little friction; at the same time the bearing takes radial and, depending on its design,
      axial loads.
    example: >-
      Electric motors, bicycle hubs and bottom brackets, gearboxes, inline skates, fans, machine
      tool spindles
    conditions: Clean, lubricated raceways and a load within the rated capacity.
    limits: >-
      Because of the point contacts, ball bearings carry less than roller bearings of the
      same size, and their life is limited by fatigue of the raceways.
    sideEffects: Contaminated or damaged raceways cause noise and vibration.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
