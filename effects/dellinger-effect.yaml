text:
  de:
    name: Mögel-Dellinger-Effekt
    description: >-
      Bei einer starken Sonneneruption treffen Röntgen- und extreme UV-Strahlung auf die Tagseite
      der Erde und ionisieren die unterste Schicht der Ionosphäre, die D-Schicht, zusätzlich.
      Die vielen freien Elektronen stoßen dort häufig mit Gasmolekülen zusammen und absorbieren
      dadurch Kurzwellen-Funksignale, so dass der Funkverkehr für Minuten bis Stunden schlagartig
      ausfällt.
    example: >-
      Plötzliche Ausfälle im Kurzwellenfunk, Nachweis von Sonneneruptionen mit Längstwellenempfängern
      (SID-Monitore), Weltraumwetter-Warnungen
    conditions: >-
      Eine starke Sonneneruption, wobei nur die der Sonne zugewandte Tagseite betroffen ist.
    limits: ''
    sideEffects: Störungen von Flug-, See- und Amateurfunk im Kurzwellenbereich.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Dellinger effect
    description: >-
      During a strong solar flare, X-rays and extreme ultraviolet radiation reach the dayside
      of the Earth and additionally ionise the lowest layer of the ionosphere, the D layer.
      The many free electrons there collide frequently with gas molecules and thereby absorb
      shortwave radio signals, so that radio communication suddenly fades out for minutes
      to hours.
    example: >-
      Sudden shortwave radio fade-outs, detection of solar flares with very-low-frequency
      receivers (SID monitors), space weather warnings
    conditions: A strong solar flare, with only the dayside facing the Sun affected.
    limits: ''
    sideEffects: >-
      Disruption of aeronautical, maritime and amateur radio in the shortwave band.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
