text:
  de:
    name: Pyknometer
    description: >-
      Ein Pyknometer ist ein Glas- oder Metallgefäß mit genau bekanntem Volumen, meist mit
      einem Stopfen mit feiner Kapillare, durch die überschüssige Flüssigkeit austritt. Aus
      den Wägungen leer, mit einer Referenzflüssigkeit und mit der Probe ergibt sich die Dichte
      einer Flüssigkeit; für Feststoffe und Pulver misst man das verdrängte Flüssigkeitsvolumen
      oder, im Gaspyknometer, das verdrängte Heliumvolumen.
    example: >-
      Dichtebestimmung von Ölen, Lösungen und Getränken, Reindichte von Pulvern, Zement und
      keramischen Rohstoffen mit dem Heliumpyknometer, Korndichte von Böden
    conditions: >-
      Eine genaue Waage und konstante Temperatur, weil Dichte und Volumen temperaturabhängig
      sind.
    limits: >-
      Luftblasen und anhaftende Luft verfälschen das Ergebnis; geschlossene Poren erreicht
      auch Helium nicht, sodass nur die Skelettdichte bestimmt wird.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Pycnometer
    description: >-
      A pycnometer is a glass or metal vessel of precisely known volume, usually with a stopper
      containing a fine capillary through which excess liquid escapes. Weighing it empty,
      filled with a reference liquid and with the sample gives the density of a liquid; for
      solids and powders the volume of displaced liquid, or of displaced helium in a gas pycnometer,
      is measured.
    example: >-
      Density of oils, solutions and beverages, true density of powders, cement and ceramic
      raw materials with the helium pycnometer, particle density of soils
    conditions: >-
      An accurate balance and constant temperature, since density and volume depend on temperature.
    limits: >-
      Air bubbles and adhering air distort the result; closed pores are not reached even by
      helium, so only the skeletal density is measured.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
