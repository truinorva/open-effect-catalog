text:
  de:
    name: Schiefe Ebene
    description: >-
      Auf einer schiefen Ebene muss eine Last nicht senkrecht gehoben werden, sondern wird
      über eine längere, geneigte Strecke hinaufbewegt. Die nötige Kraft sinkt dabei im Verhältnis
      von Höhe zu Weglänge, während die zu leistende Arbeit ohne Reibung gleich bleibt; umgekehrt
      gleiten Güter auf einer Schräge von selbst hinab.
    example: >-
      Rampen und Serpentinenstraßen, Keile und Meißel, Rutschen und Schurren, Schraubengewinde
      als aufgewickelte schiefe Ebene, geneigte Schiffshebewerke
    conditions: ''
    limits: Reibung erhöht den Kraftbedarf, und flache Rampen brauchen viel Platz.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Inclined plane
    description: >-
      On an inclined plane a load does not have to be lifted vertically but is moved up along
      a longer, sloping path. The force required drops in proportion to the ratio of height
      to path length, while the work done stays the same if friction is ignored; conversely,
      goods slide down a slope by themselves.
    example: >-
      Ramps and switchback roads, wedges and chisels, slides and chutes, screw threads as
      a wound-up inclined plane, inclined boat lifts
    conditions: ''
    limits: >-
      Friction increases the force required, and shallow ramps need a lot of space.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
