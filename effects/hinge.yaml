text:
  de:
    name: Scharnier
    description: >-
      Ein Scharnier verbindet zwei Teile so, dass sie sich nur um eine gemeinsame Achse gegeneinander
      drehen lassen, während alle anderen Bewegungen gesperrt sind. Neben Bauformen mit Bolzen
      gibt es Filmscharniere: dünne, biegsame Stege in einem Kunststoffteil, die durch elastisches
      Biegen als Gelenk wirken.
    example: >-
      Türen und Fenster, Deckel und Klappen, Klappverschlüsse von Flaschen und Tuben mit Filmscharnier,
      Laptop-Gelenke
    conditions: ''
    limits: >-
      Filmscharniere funktionieren nur mit dafür geeigneten zähen Kunststoffen wie Polypropylen.
    sideEffects: Lagerspiel und Verschleiß führen mit der Zeit zu Wackeln und Quietschen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Hinge
    description: >-
      A hinge connects two parts so that they can only rotate relative to each other about
      a common axis, while all other movements are blocked. Besides designs with a pin, there
      are living hinges: thin, flexible webs in a plastic part that act as a joint by bending
      elastically.
    example: >-
      Doors and windows, lids and flaps, flip-top caps on bottles and tubes with living hinges,
      laptop hinges
    conditions: ''
    limits: >-
      Living hinges only work with suitable tough plastics such as polypropylene.
    sideEffects: Play and wear lead to wobbling and squeaking over time.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
