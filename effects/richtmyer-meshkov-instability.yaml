text:
  de:
    name: Richtmyer-Meshkov-Instabilität
    description: >-
      Läuft eine Stoßwelle über eine gestörte Grenzfläche zwischen zwei Fluiden unterschiedlicher
      Dichte, wird die Grenzfläche impulsartig beschleunigt. Weil Druck- und Dichtegradient
      an den Störungen nicht parallel liegen, entsteht dort Wirbelstärke, und die Störungen
      wachsen, anders als bei der Rayleigh-Taylor-Instabilität, unabhängig davon, ob der Stoß
      vom leichten ins schwere Fluid läuft oder umgekehrt, zunächst linear mit der Zeit und
      später zu einer turbulenten Mischzone.
    example: >-
      Durchmischung von Brennstoff und Hüllenmaterial in der Trägheitsfusion, Mischvorgänge
      in Überschall-Staustrahltriebwerken (Scramjets), Supernova-Überreste, Stoßrohrversuche
    conditions: >-
      Eine Stoßwelle oder eine andere impulsartige Beschleunigung, eine Grenzfläche mit Dichtesprung
      und anfängliche Störungen dieser Grenzfläche.
    limits: ''
    sideEffects: >-
      In der Trägheitsfusion verschlechtert eingemischtes Hüllenmaterial die Kompression und
      damit die Energieausbeute.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Richtmyer–Meshkov instability
    description: >-
      When a shock wave passes over a perturbed interface between two fluids of different
      density, the interface is accelerated impulsively. Because the pressure and density
      gradients are not parallel at the perturbations, vorticity is deposited there, and,
      unlike the Rayleigh–Taylor instability, the perturbations grow whether the shock travels
      from the light to the heavy fluid or vice versa, first linearly with time and later
      into a turbulent mixing zone.
    example: >-
      Mixing of fuel and shell material in inertial confinement fusion, mixing in supersonic
      combustion ramjets (scramjets), supernova remnants, shock tube experiments
    conditions: >-
      A shock wave or other impulsive acceleration, an interface with a density jump, and
      initial perturbations of that interface.
    limits: ''
    sideEffects: >-
      In inertial confinement fusion, mixed-in shell material degrades compression and thus
      energy yield.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
