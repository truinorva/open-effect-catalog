text:
  de:
    name: Piezolumineszenz
    description: >-
      Manche Festkörper senden Licht aus, wenn sie mechanisch zusammengedrückt werden, ohne
      dabei zu zerbrechen. Die Verformung setzt Ladungsträger frei, die zuvor in Störstellen
      gefangen waren, oder erzeugt in piezoelektrischen Kristallen elektrische Felder, die
      Leuchtzentren anregen; beim Rückfall in den Grundzustand wird Licht abgegeben. Im Unterschied
      zur Tribolumineszenz sind weder Bruch noch Reibung nötig.
    example: >-
      Beobachtet an bestimmten Mineralen und Kristallen, Forschung zu druckempfindlichen Leuchtschichten
      und Spannungssensoren
    conditions: >-
      Ein Kristall mit geeigneten Leuchtzentren oder gefangenen Ladungsträgern und ausreichend
      hoher Druck.
    limits: >-
      Das abgegebene Licht ist meist sehr schwach und nur mit empfindlichen Detektoren nachweisbar.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Piezoluminescence
    description: >-
      Some solids emit light when compressed mechanically without breaking. The deformation
      releases charge carriers previously captured at defects, or in piezoelectric crystals
      creates electric fields that excite luminescence centres; light is emitted as they return
      to the ground state. Unlike triboluminescence, neither fracture nor friction is required.
    example: >-
      Observed in certain minerals and crystals, research on pressure-sensitive luminescent
      layers and stress sensors
    conditions: >-
      A crystal with suitable luminescence centres or trapped charge carriers and a sufficiently
      high pressure.
    limits: >-
      The emitted light is usually very weak and can only be detected with sensitive detectors.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
