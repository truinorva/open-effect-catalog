text:
  de:
    name: Elektrostatischer Luftbeschleuniger (Ionenwind-Gebläse)
    description: >-
      Ein Gebläse ohne bewegliche Teile: An dünnen Koronaelektroden wird Luft ionisiert, die
      Ionen wandern im elektrischen Feld zu Kollektorelektroden und reißen durch Stöße die
      neutrale Luft mit. Mehrere hintereinander angeordnete Stufen erhöhen Volumenstrom und
      Druck; in Ionenwind-Luftreinigern dienen die Kollektoren zugleich als Staubabscheider.
    example: >-
      Geräuschlose Luftreiniger mit Ionenwind, Kühlung von Elektronik in der Entwicklung
    conditions: Hochspannung von mehreren Kilovolt; ionisierbares Gas.
    limits: >-
      Geringer Druckaufbau und Wirkungsgrad im Vergleich zu mechanischen Lüftern.
    sideEffects: Ozonbildung; Staub lagert sich an den Elektroden ab.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electrostatic fluid accelerator
    description: >-
      A blower with no moving parts: air is ionised at thin corona electrodes, and the ions
      migrate in the electric field towards collector electrodes, dragging the neutral air
      along through collisions. Several stages in series increase flow rate and pressure;
      in ionic-wind air purifiers, the collectors also serve as dust collectors.
    example: Silent ionic-wind air purifiers, electronics cooling under development
    conditions: High voltage of several kilovolts; ionisable gas.
    limits: Low pressure rise and efficiency compared with mechanical fans.
    sideEffects: Ozone formation; dust builds up on the electrodes.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
