text:
  de:
    name: Verdrängung (Flüssigkeitsverdrängung)
    description: >-
      Ein Körper, der in eine Flüssigkeit eintaucht, verdrängt genau so viel Flüssigkeit,
      wie sein eingetauchtes Volumen beträgt; der Flüssigkeitsspiegel steigt entsprechend,
      oder die verdrängte Menge läuft über. So lässt sich das Volumen auch unregelmäßig geformter
      Körper direkt messen, und umgekehrt kann man mit einem eingetauchten Körper Flüssigkeit
      anheben oder abmessen.
    example: >-
      Volumenbestimmung im Überlaufgefäß, Messzylinder-Methode für Steine und Bauteile, Wasserverdrängung
      von Schiffen, Verdrängerkörper in Füllstandsmessern, Wasserspar-Einsätze im Spülkasten
    conditions: Der Körper darf die Flüssigkeit weder aufsaugen noch sich in ihr lösen.
    limits: >-
      Luftblasen an der Oberfläche oder poröse Körper verfälschen das gemessene Volumen.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Fluid displacement
    description: >-
      A body immersed in a liquid displaces exactly as much liquid as its immersed volume;
      the liquid level rises accordingly or the displaced amount overflows. This allows the
      volume of even irregularly shaped bodies to be measured directly, and conversely an
      immersed body can be used to raise or meter liquid.
    example: >-
      Volume determination with an overflow can, measuring-cylinder method for stones and
      components, displacement of ships, displacers in level gauges, water-saving inserts
      in toilet cisterns
    conditions: The body must neither soak up the liquid nor dissolve in it.
    limits: Air bubbles on the surface or porous bodies falsify the measured volume.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
