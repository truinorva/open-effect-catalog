text:
  de:
    name: Formgedächtnispolymer
    description: >-
      Formgedächtnispolymere lassen sich oberhalb einer Schalttemperatur verformen und durch
      Abkühlen in dieser vorübergehenden Form fixieren. Wird das Material wieder über die
      Schalttemperatur erwärmt, kehrt es von selbst in seine ursprüngliche Form zurück, die
      durch Vernetzungspunkte im Polymer festgelegt ist. Je nach Material können statt Wärme
      auch Licht, Feuchte oder ein Magnetfeld über eingelagerte Partikel die Rückverformung
      auslösen.
    example: >-
      Schrumpfschläuche und Schrumpffolien, selbstentfaltende Strukturen in der Raumfahrt,
      selbstexpandierende Stents und chirurgisches Nahtmaterial, Textilien mit Formrückstellung
    conditions: >-
      Eine vorherige Programmierung durch Verformen oberhalb und Abkühlen unterhalb der Schalttemperatur
      sowie ein Auslösereiz, meist Erwärmung.
    limits: >-
      Die Rückstellkräfte sind deutlich kleiner als bei Formgedächtnislegierungen, und die
      Zahl der Zyklen ist begrenzt.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Shape memory polymer
    description: >-
      Shape memory polymers can be deformed above a switching temperature and fixed in this
      temporary shape by cooling. When the material is heated above the switching temperature
      again, it returns by itself to its original shape, which is defined by crosslinks in
      the polymer. Depending on the material, light, moisture or a magnetic field acting on
      embedded particles can trigger the recovery instead of heat.
    example: >-
      Heat-shrink tubing and shrink film, self-deploying structures in spaceflight, self-expanding
      stents and surgical sutures, textiles with shape recovery
    conditions: >-
      Prior programming by deforming above and cooling below the switching temperature, and
      a trigger, usually heating.
    limits: >-
      The recovery forces are much smaller than those of shape memory alloys, and the number
      of cycles is limited.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
