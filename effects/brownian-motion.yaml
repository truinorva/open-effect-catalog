text:
  de:
    name: Brownsche Bewegung
    description: >-
      Sehr kleine Teilchen, die in einer Flüssigkeit oder einem Gas schweben, führen eine
      unregelmäßige Zitterbewegung aus. Sie entsteht, weil die umgebenden Moleküle durch ihre
      Wärmebewegung ständig und ungleichmäßig von allen Seiten gegen das Teilchen stoßen.
      Je kleiner das Teilchen, je höher die Temperatur und je geringer die Viskosität, desto
      stärker ist die Bewegung.
    example: >-
      Diffusion und Durchmischung ohne Rühren, Schwebestabilität von Kolloiden, dynamische
      Lichtstreuung zur Partikelgrößenmessung, Partikel-Tracking-Analyse, Abscheidung feinster
      Partikel in Faserfiltern
    conditions: >-
      Teilchen im Bereich von Nanometern bis wenigen Mikrometern in einem Fluid.
    limits: >-
      Bei größeren Teilchen überwiegen Schwerkraft und Strömung, und die Bewegung wird vernachlässigbar.
    sideEffects: >-
      Sie begrenzt als thermisches Rauschen die Genauigkeit sehr empfindlicher mechanischer
      Messgeräte.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Brownian motion
    description: >-
      Very small particles suspended in a liquid or gas perform an irregular jittering movement.
      It arises because the surrounding molecules, through their thermal motion, constantly
      and unevenly hit the particle from all sides. The smaller the particle, the higher the
      temperature and the lower the viscosity, the stronger the movement.
    example: >-
      Diffusion and mixing without stirring, settling stability of colloids, dynamic light
      scattering for particle sizing, nanoparticle tracking analysis, capture of ultrafine
      particles in fibrous filters
    conditions: Particles from nanometres to a few micrometres in a fluid.
    limits: >-
      For larger particles gravity and flow dominate and the movement becomes negligible.
    sideEffects: >-
      As thermal noise, it limits the accuracy of very sensitive mechanical instruments.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
