text:
  de:
    name: Schaumkeramik (Keramikschaum)
    description: >-
      Schaumkeramik ist ein hochporöser keramischer Werkstoff mit offenen, untereinander verbundenen
      Zellen. Meist wird ein Polyurethanschaum mit Keramikschlicker getränkt, getrocknet und
      gebrannt; dabei brennt der Kunststoff aus und hinterlässt ein keramisches Abbild des
      Schaums. Das Ergebnis ist leicht, temperaturbeständig, gut durchströmbar und hat eine
      große innere Oberfläche.
    example: >-
      Filter für Metallschmelzen in Gießereien, Katalysatorträger, Porenbrenner, Wärmedämmung
      bei hohen Temperaturen
    conditions: ''
    limits: >-
      Wegen der hohen Porosität ist die mechanische Festigkeit gering, und das Material ist
      spröde und stoßempfindlich.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Ceramic foam
    description: >-
      Ceramic foam is a highly porous ceramic material with open, interconnected cells. Usually
      a polyurethane foam is soaked in ceramic slurry, dried and fired; the polymer burns
      out and leaves a ceramic replica of the foam. The result is light, temperature-resistant,
      easy to flow through and has a large internal surface.
    example: >-
      Filters for molten metal in foundries, catalyst supports, porous burners, high-temperature
      thermal insulation
    conditions: ''
    limits: >-
      Because of the high porosity, mechanical strength is low, and the material is brittle
      and sensitive to impact.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
