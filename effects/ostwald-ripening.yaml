text:
  de:
    name: Ostwald-Reifung
    description: >-
      In einer Dispersion aus Kristallen, Tröpfchen oder Bläschen unterschiedlicher Größe
      wachsen die großen auf Kosten der kleinen. Kleine Teilchen haben wegen ihrer stärker
      gekrümmten Oberfläche eine höhere Löslichkeit bzw. einen höheren Dampfdruck; ihr Material
      geht in das umgebende Medium über, diffundiert und lagert sich an den größeren Teilchen
      an. Mit der Zeit sinkt so die Teilchenzahl, und die mittlere Teilchengröße steigt.
    example: >-
      Digerieren von Niederschlägen für bessere Filtrierbarkeit in der Analytik, Vergröberung
      von Ausscheidungen in Legierungen, grobe Eiskristalle in gelagertem Speiseeis, Alterung
      von Emulsionen und Schäumen
    conditions: >-
      Teilchen unterschiedlicher Größe in einem Medium, in dem ihr Material zumindest etwas
      löslich ist oder diffundieren kann.
    limits: >-
      Der Vorgang verlangsamt sich mit wachsender Teilchengröße und kommt bei sehr geringer
      Löslichkeit praktisch zum Stillstand.
    sideEffects: >-
      Emulsionen und Schäume werden instabil, Speiseeis wird körnig, und überalterte Legierungen
      verlieren Festigkeit.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Ostwald ripening
    description: >-
      In a dispersion of crystals, droplets or bubbles of different sizes, the large ones
      grow at the expense of the small ones. Small particles have a higher solubility or vapour
      pressure because of their more strongly curved surface; their material passes into the
      surrounding medium, diffuses and deposits on the larger particles. Over time the number
      of particles falls and the mean particle size rises.
    example: >-
      Digestion of precipitates for better filterability in analytical chemistry, coarsening
      of precipitates in alloys, coarse ice crystals in stored ice cream, ageing of emulsions
      and foams
    conditions: >-
      Particles of different sizes in a medium in which their material is at least slightly
      soluble or can diffuse.
    limits: >-
      The process slows down as particles grow and practically stops when solubility is very
      low.
    sideEffects: >-
      Emulsions and foams become unstable, ice cream turns grainy, and over-aged alloys lose
      strength.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
