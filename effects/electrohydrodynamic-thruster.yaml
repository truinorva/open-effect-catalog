text:
  de:
    name: Elektrohydrodynamischer Antrieb (Ionenwind-Antrieb, Lifter)
    description: >-
      Zwischen einem dünnen Emitterdraht unter Hochspannung und einer großflächigen Gegenelektrode
      ionisiert eine Koronaentladung die Luft. Die Ionen werden im elektrischen Feld zur Gegenelektrode
      beschleunigt und geben ihren Impuls durch Stöße an neutrale Luftmoleküle ab; der entstehende
      Ionenwind erzeugt Schub ohne bewegliche Teile.
    example: >-
      Lifter-Demonstrationsmodelle, Versuchsflugzeug des MIT mit Ionenwindantrieb (2018)
    conditions: >-
      Spannungen von einigen zehn Kilovolt; Luft oder ein anderes ionisierbares Gas.
    limits: >-
      Schub je Leistung und je Fläche sind gering; im Vakuum funktioniert der Antrieb nicht.
    sideEffects: Ozonbildung durch die Koronaentladung.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electrohydrodynamic thruster (ionic wind propulsion)
    description: >-
      Between a thin emitter wire at high voltage and a large collector electrode, a corona
      discharge ionises the air. The ions are accelerated towards the collector in the electric
      field and transfer their momentum to neutral air molecules through collisions; the resulting
      ionic wind produces thrust with no moving parts.
    example: >-
      Lifter demonstration models, MIT experimental aircraft with ionic wind propulsion (2018)
    conditions: Voltages of several tens of kilovolts; air or another ionisable gas.
    limits: >-
      Thrust per unit power and per unit area is low; the drive does not work in a vacuum.
    sideEffects: Ozone formation by the corona discharge.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
