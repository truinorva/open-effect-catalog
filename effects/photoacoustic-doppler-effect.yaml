text:
  de:
    name: Photoakustischer Doppler-Effekt
    description: >-
      Bestrahlt man bewegte, lichtabsorbierende Teilchen wie rote Blutkörperchen mit in der
      Stärke moduliertem Licht, senden sie über den photoakustischen Effekt Schallwellen mit
      der Modulationsfrequenz aus. Weil sich die Teilchen relativ zum Schallempfänger bewegen,
      ist die empfangene Frequenz gegenüber der Modulationsfrequenz verschoben. Aus dieser
      Doppler-Verschiebung lässt sich die Strömungsgeschwindigkeit berechnen.
    example: >-
      Messung der Blutflussgeschwindigkeit in Gefäßen (Forschung), Strömungsmessung in trüben
      Medien
    conditions: >-
      Lichtabsorbierende Teilchen in der Strömung, intensitätsmoduliertes Licht und ein Ultraschallempfänger.
    limits: >-
      Die Signale sind schwach, und erfasst wird nur die Geschwindigkeitskomponente in Richtung
      des Schallempfängers.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Photoacoustic Doppler effect
    description: >-
      When moving, light-absorbing particles such as red blood cells are illuminated with
      intensity-modulated light, they emit sound waves at the modulation frequency through
      the photoacoustic effect. Because the particles move relative to the acoustic receiver,
      the received frequency is shifted from the modulation frequency. The flow velocity can
      be calculated from this Doppler shift.
    example: >-
      Measuring blood flow velocity in vessels (research), flow measurement in turbid media
    conditions: >-
      Light-absorbing particles in the flow, intensity-modulated light and an ultrasound receiver.
    limits: >-
      The signals are weak, and only the velocity component along the direction of the receiver
      is captured.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
