text:
  de:
    name: Nanoporöse Materialien
    description: >-
      Nanoporöse Materialien enthalten ein Netz aus Poren mit Durchmessern unter 100 nm; nach
      IUPAC unterscheidet man dabei Mikroporen unter 2 nm und Mesoporen von 2 bis 50 nm. Dadurch
      erreichen sie innere Oberflächen von Hunderten bis zu mehreren tausend Quadratmetern
      pro Gramm. An diesen Flächen lagern sich Gase und gelöste Stoffe an, und die Porenweite
      bestimmt, welche Moleküle hineinpassen; darauf beruhen Adsorption, Trennung, Katalyse
      und Gasspeicherung.
    example: >-
      Aktivkohlefilter, Zeolith-Katalysatoren beim katalytischen Cracken, metallorganische
      Gerüstverbindungen (MOF) zur Gasspeicherung, mesoporöses Silica als Wirkstoffträger,
      Silicagel als Trockenmittel
    conditions: >-
      Die Poren müssen zugänglich und frei von zuvor angelagerten Stoffen sein, was oft eine
      Aktivierung durch Erhitzen oder Vakuum erfordert.
    limits: >-
      Sehr enge Poren verlangsamen den Stofftransport, und Feuchte oder größere Moleküle können
      die Poren blockieren.
    sideEffects: >-
      Manche Gerüste, etwa einige MOF, sind feuchte- oder hitzeempfindlich und verlieren dabei
      ihre Porenstruktur.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Nanoporous materials
    description: >-
      Nanoporous materials contain a network of pores below 100 nm in diameter; IUPAC distinguishes
      micropores below 2 nm and mesopores from 2 to 50 nm. This gives them internal surfaces
      of hundreds to several thousand square metres per gram. Gases and dissolved substances
      attach to these surfaces, and the pore width decides which molecules fit inside; adsorption,
      separation, catalysis and gas storage rest on this.
    example: >-
      Activated carbon filters, zeolite catalysts in catalytic cracking, metal-organic frameworks
      (MOFs) for gas storage, mesoporous silica as drug carrier, silica gel as desiccant
    conditions: >-
      The pores must be accessible and free of previously adsorbed substances, which often
      requires activation by heating or vacuum.
    limits: >-
      Very narrow pores slow down mass transport, and moisture or larger molecules can block
      the pores.
    sideEffects: >-
      Some frameworks, such as certain MOFs, are sensitive to moisture or heat and lose their
      pore structure.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
