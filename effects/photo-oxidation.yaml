text:
  de:
    name: Photooxidation
    description: >-
      Bei der Photooxidation reagiert ein Stoff unter dem Einfluss von Licht, vor allem UV-Strahlung,
      mit Sauerstoff. In Kunststoffen spaltet die absorbierte Strahlung Bindungen und erzeugt
      Radikale, die mit Sauerstoff Kettenreaktionen auslösen; dabei werden Polymerketten zerschnitten
      oder vernetzt, und es bilden sich sauerstoffhaltige Gruppen. Der Werkstoff vergilbt,
      kreidet aus, wird spröde und reißt.
    example: >-
      Alterung von Kunststoffen, Lacken und Gummi im Freien, beschleunigte Bewitterungsprüfung,
      lichtgetriebener Abbau von Schadstoffen in Gewässern, gezielt photoabbaubare Kunststoffe
    conditions: >-
      Licht passender Wellenlänge, meist UV, und Zutritt von Sauerstoff; Wärme, Feuchte und
      Katalysatorrückstände beschleunigen den Abbau.
    limits: >-
      UV-Absorber, Lichtschutzmittel wie HALS und Pigmente wie Ruß verlangsamen den Abbau
      erheblich.
    sideEffects: >-
      Versprödete Kunststoffe zerfallen zu Mikroplastik, und flüchtige Abbauprodukte können
      Gerüche verursachen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Photo-oxidation
    description: >-
      In photo-oxidation a substance reacts with oxygen under the influence of light, especially
      UV radiation. In plastics the absorbed radiation breaks bonds and creates radicals that
      start chain reactions with oxygen; polymer chains are cut or cross-linked, and oxygen-containing
      groups form. The material yellows, chalks, becomes brittle and cracks.
    example: >-
      Outdoor ageing of plastics, paints and rubber, accelerated weathering tests, light-driven
      breakdown of pollutants in water bodies, deliberately photodegradable plastics
    conditions: >-
      Light of a suitable wavelength, usually UV, and access of oxygen; heat, moisture and
      catalyst residues accelerate degradation.
    limits: >-
      UV absorbers, light stabilisers such as HALS and pigments such as carbon black slow
      degradation considerably.
    sideEffects: >-
      Embrittled plastics break down into microplastics, and volatile degradation products
      can cause odours.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
