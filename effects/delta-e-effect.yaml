text:
  de:
    name: Delta-E-Effekt
    description: >-
      Bei ferromagnetischen Werkstoffen hängt der Elastizitätsmodul vom Magnetisierungszustand
      ab. Unter mechanischer Spannung drehen sich die magnetischen Domänen und liefern über
      die Magnetostriktion eine zusätzliche Dehnung, so dass der Werkstoff nachgiebiger wirkt;
      ein Magnetfeld, das die Domänen bereits festlegt, unterdrückt diesen Beitrag, und der
      Modul steigt. Besonders groß ist der Effekt bei amorphen Legierungen mit hoher Magnetostriktion.
    example: >-
      Magnetoelastische Warensicherungsetiketten im Handel, abstimmbare mechanische Resonatoren,
      Magnetfeldsensoren auf Basis verstimmter Resonatoren
    conditions: >-
      Ein ferromagnetischer Werkstoff mit ausgeprägter Magnetostriktion und ein definiertes
      Vormagnetisierungsfeld.
    limits: >-
      Der Effekt ist nur im Bereich unvollständiger Magnetisierung nutzbar und verschwindet
      bei Sättigung.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Delta-E effect
    description: >-
      In ferromagnetic materials Young's modulus depends on the state of magnetisation. Under
      mechanical stress the magnetic domains rotate and, via magnetostriction, contribute
      additional strain, so the material appears more compliant; a magnetic field that already
      fixes the domains suppresses this contribution and the modulus rises. The effect is
      particularly large in amorphous alloys with high magnetostriction.
    example: >-
      Magnetoelastic anti-theft tags in retail, tunable mechanical resonators, magnetic field
      sensors based on detuned resonators
    conditions: >-
      A ferromagnetic material with pronounced magnetostriction and a defined bias magnetic
      field.
    limits: >-
      The effect can be used only in the range of incomplete magnetisation and disappears
      at saturation.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
