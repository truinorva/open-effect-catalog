text:
  de:
    name: Grenzschichtabsaugung
    description: >-
      Durch Schlitze oder eine fein perforierte Oberfläche wird der langsame, energiearme
      Teil der Grenzschicht abgesaugt. Die verbleibende Strömung liegt dadurch energiereicher
      an der Wand an: Die Ablösung wird verzögert, und eine laminare Grenzschicht bleibt über
      längere Strecken erhalten. Das senkt den Reibungswiderstand und erlaubt größere Anstellwinkel
      oder stärkere Strömungsumlenkung.
    example: >-
      Laminarhaltung an Tragflächen und Leitwerken (Hybrid Laminar Flow Control), Versuchsflugzeuge,
      Windkanäle, Diffusoren mit Absaugung
    conditions: >-
      Eine Saugquelle, z. B. eine Pumpe oder ein Druckgefälle, und eine durchlässige oder
      geschlitzte Wand.
    limits: >-
      Die eingesparte Widerstandsleistung muss größer sein als die Leistung für das Absaugen;
      feine Perforationen können durch Schmutz oder Eis verstopfen.
    sideEffects: Zusätzliches Gewicht und höhere Komplexität durch Leitungen und Pumpen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Boundary layer suction
    description: >-
      The slow, low-energy part of the boundary layer is sucked away through slots or a finely
      perforated surface. The remaining flow hugs the wall with more energy: separation is
      delayed and a laminar boundary layer is maintained over longer distances. This lowers
      skin-friction drag and allows higher angles of attack or stronger flow deflection.
    example: >-
      Laminar flow control on wings and tail surfaces (hybrid laminar flow control), research
      aircraft, wind tunnels, diffusers with suction
    conditions: >-
      A suction source, e.g. a pump or a pressure difference, and a permeable or slotted wall.
    limits: >-
      The drag power saved must exceed the power needed for suction; fine perforations can
      clog with dirt or ice.
    sideEffects: Extra weight and complexity from ducts and pumps.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
