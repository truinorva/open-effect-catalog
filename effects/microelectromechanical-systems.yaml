text:
  de:
    name: Mikroelektromechanische Systeme (MEMS)
    description: >-
      Mikroelektromechanische Systeme sind winzige Bauteile, in denen mechanische Strukturen
      wie Balken, Membranen, Federn und Spiegel mit Abmessungen im Mikrometerbereich zusammen
      mit Elektronik auf einem Chip gefertigt werden. Hergestellt werden sie mit Verfahren
      der Halbleitertechnik, vor allem durch Ätzen von Silizium. Die beweglichen Strukturen
      wandeln Beschleunigung, Drehung, Druck oder Schall in elektrische Signale um oder werden
      umgekehrt elektrisch angetrieben, etwa elektrostatisch oder piezoelektrisch.
    example: >-
      Beschleunigungs- und Drehratensensoren in Smartphones und Airbags, Mikrofone, Drucksensoren,
      Tintenstrahldruckköpfe, Mikrospiegel in Projektoren, Mikropumpen
    conditions: >-
      Fertigung im Reinraum mit Halbleiterprozessen und eine Verkapselung, die die beweglichen
      Teile schützt.
    limits: >-
      Stellkräfte und Hübe sind sehr klein; Feuchte, Partikel und das Aneinanderhaften der
      Strukturen können die Funktion stören.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Microelectromechanical systems (MEMS)
    description: >-
      Microelectromechanical systems are tiny devices in which mechanical structures such
      as beams, membranes, springs and mirrors with dimensions in the micrometre range are
      fabricated on a chip together with electronics. They are made with semiconductor processes,
      mainly by etching silicon. The moving structures convert acceleration, rotation, pressure
      or sound into electrical signals or, conversely, are driven electrically, for example
      electrostatically or piezoelectrically.
    example: >-
      Acceleration and yaw-rate sensors in smartphones and airbags, microphones, pressure
      sensors, inkjet print heads, micromirrors in projectors, micropumps
    conditions: >-
      Cleanroom fabrication with semiconductor processes and packaging that protects the moving
      parts.
    limits: >-
      Actuation forces and strokes are very small; moisture, particles and the structures
      sticking together can impair operation.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
