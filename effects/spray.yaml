text:
  de:
    name: Sprühen (Zerstäuben mit Düsen)
    description: >-
      Eine Flüssigkeit wird durch eine Düse gepresst oder von einem Gasstrom mitgerissen und
      dabei in viele kleine Tropfen zerteilt. Der austretende Strahl oder Film wird instabil
      und zerfällt, weil die Oberflächenspannung kleine Störungen zu Einschnürungen verstärkt;
      so erhält wenig Flüssigkeit eine sehr große Oberfläche. Diese beschleunigt Verdunstung,
      Wärmeübergang und Stoffaustausch mit dem umgebenden Gas.
    example: >-
      Einspritzdüsen in Verbrennungsmotoren, Lackierpistolen, Sprühtrocknung von Milchpulver,
      Sprühkühlung beim Härten, Gaswäscher, Pflanzenschutzspritzen
    conditions: >-
      Ausreichender Flüssigkeitsdruck oder Gasstrom; Düse passend zu Viskosität und gewünschter
      Tropfengröße.
    limits: >-
      Sehr zähe Flüssigkeiten lassen sich nur schlecht fein zerstäuben; Feststoffe können
      die Düse verstopfen.
    sideEffects: Feine Tropfen können abdriften und eingeatmet werden (Sprühnebel).
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Spray (atomisation by nozzles)
    description: >-
      A liquid is forced through a nozzle or entrained by a gas stream and broken up into
      many small droplets. The emerging jet or sheet becomes unstable and disintegrates because
      surface tension amplifies small disturbances into necks; a small amount of liquid thus
      acquires a very large surface area. This speeds up evaporation, heat transfer and mass
      exchange with the surrounding gas.
    example: >-
      Fuel injectors in combustion engines, paint spray guns, spray drying of milk powder,
      spray quenching in heat treatment, gas scrubbers, crop sprayers
    conditions: >-
      Sufficient liquid pressure or gas flow; nozzle matched to the viscosity and desired
      droplet size.
    limits: >-
      Highly viscous liquids are hard to atomise finely; solids can clog the nozzle.
    sideEffects: Fine droplets can drift and be inhaled (overspray).
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
