text:
  de:
    name: Kolloidaler Kristall
    description: >-
      Gleich große kolloidale Kugeln, etwa aus Kieselsäure oder Polystyrol, ordnen sich beim
      Absetzen, Trocknen oder durch elektrostatische Abstoßung von selbst zu einem regelmäßigen
      dreidimensionalen Gitter. Da der Gitterabstand im Bereich der Lichtwellenlänge liegt,
      werden bestimmte Farben durch Bragg-Beugung zurückgeworfen, und das Material schillert
      ohne Farbstoff. Ändert sich der Abstand, z. B. durch Quellen, Dehnen oder Temperatur,
      verschiebt sich die Farbe.
    example: >-
      Edelopal, photonische Kristalle und inverse Opale, farbumschlagende Sensoren für Feuchte
      oder Chemikalien, Strukturfarben in Beschichtungen, Template für poröse Werkstoffe
    conditions: >-
      Teilchen von sehr einheitlicher Größe und Bedingungen, die eine geordnete Anlagerung
      zulassen.
    limits: >-
      Fehlstellen, Risse und Korngrenzen im Kristall mindern die Farbreinheit, und großflächige
      fehlerfreie Kristalle sind schwer herzustellen.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Colloidal crystal
    description: >-
      Equal-sized colloidal spheres, e.g. of silica or polystyrene, arrange themselves into
      a regular three-dimensional lattice during settling, drying or through electrostatic
      repulsion. Because the lattice spacing is in the range of light wavelengths, certain
      colours are reflected by Bragg diffraction and the material shimmers without any dye.
      If the spacing changes, e.g. through swelling, stretching or temperature, the colour
      shifts.
    example: >-
      Precious opal, photonic crystals and inverse opals, colour-changing sensors for humidity
      or chemicals, structural colours in coatings, templates for porous materials
    conditions: >-
      Particles of very uniform size and conditions that allow ordered assembly.
    limits: >-
      Defects, cracks and grain boundaries in the crystal reduce colour purity, and large
      defect-free crystals are hard to make.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
