text:
  de:
    name: Klebstoff
    description: >-
      Ein Klebstoff verbindet Fügeteile, indem er sie im flüssigen oder pastösen Zustand benetzt
      und anschließend fest wird. Die Haftung an den Oberflächen (Adhäsion) beruht auf zwischenmolekularen
      Kräften und teils auf chemischen Bindungen, die innere Festigkeit (Kohäsion) entsteht
      durch Trocknen, Abkühlen oder chemisches Aushärten. Zugleich kann die Klebschicht die
      Fuge gegen Flüssigkeiten und Gase abdichten.
    example: >-
      Strukturkleben im Fahrzeug- und Flugzeugbau, Holzleim, Sekundenkleber, Schmelzklebstoff,
      Klebebänder, eingeklebte Autoscheiben
    conditions: >-
      Saubere, gut benetzbare Oberflächen; viele Klebstoffe brauchen Zeit, Wärme, Feuchte
      oder Licht zum Aushärten.
    limits: >-
      Die meisten Klebstoffe verlieren bei höheren Temperaturen an Festigkeit, und auf Schälen
      ist eine Klebung deutlich schwächer belastbar als auf Schub.
    sideEffects: >-
      Klebungen lassen sich oft nur schwer wieder lösen, was Reparatur und Recycling erschwert,
      und manche Klebstoffe geben Lösemittel ab.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Adhesive
    description: >-
      An adhesive joins parts by wetting them in a liquid or paste-like state and then becoming
      solid. Adhesion to the surfaces rests on intermolecular forces and partly on chemical
      bonds, while internal strength (cohesion) develops through drying, cooling or chemical
      curing. The adhesive layer can also seal the joint against liquids and gases.
    example: >-
      Structural bonding in car and aircraft manufacturing, wood glue, superglue, hot-melt
      adhesive, adhesive tapes, bonded windscreens
    conditions: >-
      Clean, easily wetted surfaces; many adhesives need time, heat, moisture or light to
      cure.
    limits: >-
      Most adhesives lose strength at elevated temperatures, and a bonded joint carries much
      less load in peel than in shear.
    sideEffects: >-
      Bonded joints are often hard to take apart, which complicates repair and recycling,
      and some adhesives release solvents.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
