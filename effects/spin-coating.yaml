text:
  de:
    name: Rotationsbeschichtung (Spin-Coating)
    description: >-
      Eine Lösung wird auf die Mitte eines flachen Substrats gegeben, das anschließend mit
      hoher Drehzahl rotiert. Die Fliehkraft treibt die Flüssigkeit nach außen, der Überschuss
      wird über den Rand abgeschleudert, und gleichzeitig verdunstet das Lösungsmittel; zurück
      bleibt ein sehr gleichmäßiger dünner Film. Seine Dicke lässt sich über Drehzahl, Viskosität
      und Feststoffgehalt der Lösung einstellen.
    example: >-
      Auftragen von Fotolack auf Siliziumwafer, Antireflexschichten, Schichten für organische
      Elektronik und Solarzellen, Sol-Gel-Beschichtungen im Labor
    conditions: >-
      Ebenes, mittig eingespanntes Substrat; Lösung mit flüchtigem Lösungsmittel.
    limits: >-
      Nur für flache Substrate begrenzter Größe geeignet; am Rand bildet sich oft ein dickerer
      Wulst.
    sideEffects: Der größte Teil der Lösung wird abgeschleudert und geht verloren.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Spin coating
    description: >-
      A solution is placed in the centre of a flat substrate, which is then spun at high speed.
      Centrifugal force drives the liquid outwards, the excess is flung off the edge, and
      at the same time the solvent evaporates, leaving a very uniform thin film. Its thickness
      is set by the spin speed and by the viscosity and solids content of the solution.
    example: >-
      Applying photoresist to silicon wafers, anti-reflective coatings, layers for organic
      electronics and solar cells, sol–gel coatings in the laboratory
    conditions: Flat substrate clamped at its centre; solution with a volatile solvent.
    limits: >-
      Suitable only for flat substrates of limited size; a thicker bead often forms at the
      edge.
    sideEffects: Most of the solution is flung off and lost.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
