text:
  de:
    name: Absorptionsspektroskopie
    description: >-
      Strahlung mit bekanntem Spektrum durchläuft eine Probe, und ein Detektor misst, welcher
      Anteil bei jeder Wellenlänge fehlt. Da jede Substanz bei charakteristischen Wellenlängen
      absorbiert, zeigt die Lage der Absorptionsbanden, welche Stoffe vorliegen, und ihre
      Stärke nach dem Lambert-Beer-Gesetz, wie viel davon.
    example: >-
      UV-Vis-Photometrie im Labor, Infrarot-Gasanalysatoren für CO2 und CO, Pulsoximeter,
      Atomabsorptionsspektrometrie für Schwermetalle, Fernerkundung der Atmosphäre
    conditions: >-
      Der gesuchte Stoff muss im gewählten Spektralbereich absorbieren, und die Probe muss
      genug Strahlung durchlassen.
    limits: >-
      Bei hohen Konzentrationen weicht das Signal vom linearen Zusammenhang ab, und überlappende
      Banden mehrerer Stoffe erschweren die Zuordnung.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Absorption spectroscopy
    description: >-
      Radiation with a known spectrum passes through a sample, and a detector records how
      much is missing at each wavelength. Since every substance absorbs at characteristic
      wavelengths, the position of the absorption bands reveals which substances are present,
      and their strength, via the Beer-Lambert law, how much of each.
    example: >-
      UV-Vis photometry in the lab, infrared gas analysers for CO2 and CO, pulse oximeters,
      atomic absorption spectrometry for heavy metals, atmospheric remote sensing
    conditions: >-
      The target substance must absorb in the chosen spectral range, and the sample must transmit
      enough radiation.
    limits: >-
      At high concentrations the signal departs from linearity, and overlapping bands of several
      substances make assignment difficult.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
