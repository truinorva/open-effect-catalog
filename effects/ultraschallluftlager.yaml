text:
  de:
    name: Ultraschallluftlager
    description: >-
      Durch den Nahfeldeffekt im Ultraschallfeld kann ein nahe an der Ultraschallquelle liegender
      Gegenstand durch die Kompression des Gases im Spalt (ähnlich fluiddynamischen Lager)
      in einem Abstand von 50-500 µm schweben. Durch Kombination mit Vakuum, kann damit auch
      von oben gegriffen werden. Gegenstände mit wenigen Millimeter Größe bis 2,5 Meter große
      Glasscheiben können transportiert, gelagert und gegriffen werden.
    example: Halbleiterindustrie, Ultra-Dünnes Glas
    conditions: ''
    limits: ''
    sideEffects: ''
    kind: original
    author: Robert Adunka
    model: ''
    updated: '2026-09-16'
  en:
    name: Ultrasonic air bearings
    description: >-
      Due to the near-field effect in the ultrasonic field, an object located close to the
      ultrasonic source can levitate at a distance of 50-500 µm due to the compression of
      the gas in the gap (similar to fluid dynamic bearings). By combining it with vacuum,
      it can also be gripped from above. Objects ranging from a few millimeters in size to
      2.5 meter large glass panes can be transported, stored, and gripped.
    example: Semiconductor industry, ultra-thin glass
    conditions: ''
    limits: ''
    sideEffects: ''
    kind: geprueft
    author: Robert Adunka
    model: ''
    updated: '2026-09-16'
