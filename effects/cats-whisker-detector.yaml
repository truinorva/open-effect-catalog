text:
  de:
    name: Kristalldetektor (Katzenbart-Detektor)
    description: >-
      Ein feiner Metalldraht, der Katzenbart, wird auf eine empfindliche Stelle eines Halbleiterkristalls
      wie Bleiglanz gedrückt. Der Punktkontakt wirkt als Gleichrichter (Schottky-Diode): Er
      lässt Strom vorwiegend in eine Richtung durch und demoduliert so amplitudenmodulierte
      Funksignale, die dann ohne Batterie im Kopfhörer hörbar werden.
    example: >-
      Detektorempfänger der frühen Rundfunkzeit, Mikrowellen-Detektordioden in Radargeräten
      des Zweiten Weltkriegs, Vorläufer von Halbleiterdiode und Transistor
    conditions: >-
      Ein geeigneter Kristall (Bleiglanz, Silizium, Pyrit), eine empfindliche Kontaktstelle
      und ein Schwingkreis zur Senderwahl.
    limits: >-
      Die Kontaktstelle muss mühsam gesucht werden und verstellt sich durch Erschütterungen;
      die Empfindlichkeit ist gering.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Cat's-whisker detector
    description: >-
      A fine metal wire, the cat's whisker, is pressed onto a sensitive spot of a semiconductor
      crystal such as galena. The point contact acts as a rectifier (Schottky diode): it lets
      current pass mainly in one direction and thus demodulates amplitude-modulated radio
      signals, which then become audible in headphones without a battery.
    example: >-
      Crystal radio receivers of the early broadcasting era, microwave detector diodes in
      World War II radar sets, forerunner of the semiconductor diode and transistor
    conditions: >-
      A suitable crystal (galena, silicon, pyrite), a sensitive contact spot and a tuned circuit
      for station selection.
    limits: >-
      The contact spot has to be searched for tediously and shifts with vibration; sensitivity
      is low.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
