text:
  de:
    name: Akustische Linse
    description: >-
      Eine akustische Linse bündelt oder streut Schallwellen, so wie eine Glaslinse Licht.
      Sie besteht aus einem Material, in dem sich Schall langsamer oder schneller ausbreitet
      als in der Umgebung, und ist so geformt, dass die Wellenfronten auf einen Brennpunkt
      zulaufen; neuere Ausführungen erreichen dasselbe mit akustischen Metamaterialien aus
      regelmäßig angeordneten Strukturen.
    example: >-
      Fokussierte Ultraschallwandler in der medizinischen Bildgebung, Ultraschallmikroskop,
      Ultraschall-Werkstoffprüfung, fokussierter Ultraschall in der Therapie
    conditions: >-
      Ein deutlicher Unterschied der Schallgeschwindigkeit zwischen Linse und Umgebung und
      eine Linse, die viel größer als die Wellenlänge ist.
    limits: >-
      Herkömmliche Linsen können Schall wegen der Beugung nicht schärfer als auf etwa eine
      halbe Wellenlänge bündeln, und an ihren Grenzflächen geht ein Teil der Energie durch
      Reflexion verloren.
    sideEffects: Das Linsenmaterial dämpft den Schall und erwärmt sich dabei.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Acoustic lens
    description: >-
      An acoustic lens focuses or spreads sound waves in the same way a glass lens does with
      light. It is made of a material in which sound travels slower or faster than in the
      surroundings and is shaped so that the wavefronts converge on a focal point; newer designs
      achieve the same with acoustic metamaterials made of regularly arranged structures.
    example: >-
      Focused ultrasound transducers in medical imaging, scanning acoustic microscopes, ultrasonic
      material testing, focused ultrasound therapy
    conditions: >-
      A clear difference in sound speed between lens and surroundings, and a lens much larger
      than the wavelength.
    limits: >-
      Because of diffraction, conventional lenses cannot focus sound more tightly than about
      half a wavelength, and part of the energy is lost to reflection at their interfaces.
    sideEffects: The lens material attenuates the sound and warms up in the process.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
