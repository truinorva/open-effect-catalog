text:
  de:
    name: Wiedemann-Effekt
    description: >-
      Ein ferromagnetischer Draht, der in einem Längsmagnetfeld von Strom durchflossen wird,
      verdrillt sich. Das ringförmige Magnetfeld des Stroms und das Längsfeld überlagern sich
      zu einem schraubenförmigen Feld, und die Magnetostriktion entlang dieser Schraubenlinie
      erzeugt eine Torsion. In Wegsensoren löst ein Strompuls so am Ort eines Positionsmagneten
      eine Torsionswelle aus, deren Laufzeit die Position angibt.
    example: >-
      Magnetostriktive Wegaufnehmer in Hydraulikzylindern, Füllstandssensoren mit Schwimmermagnet
    conditions: >-
      Magnetostriktiver, ferromagnetischer Draht; Strom und Längsfeld gleichzeitig.
    limits: >-
      Die Verdrillung ist sehr klein und nur als Wellenimpuls oder mit empfindlichen Aufnehmern
      nutzbar.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Wiedemann effect
    description: >-
      A ferromagnetic wire carrying a current in a longitudinal magnetic field twists. The
      circular magnetic field of the current and the longitudinal field combine into a helical
      field, and magnetostriction along this helix produces torsion. In position sensors,
      a current pulse thus launches a torsional wave at the location of a position magnet,
      and its travel time gives the position.
    example: >-
      Magnetostrictive position transducers in hydraulic cylinders, level sensors with float
      magnets
    conditions: >-
      Magnetostrictive ferromagnetic wire; current and longitudinal field at the same time.
    limits: >-
      The twist is very small and usable only as a wave pulse or with sensitive pickups.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
