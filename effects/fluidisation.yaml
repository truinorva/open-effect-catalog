text:
  de:
    name: Fluidisierung
    description: >-
      Strömt ein Gas oder eine Flüssigkeit von unten durch eine Schüttung, wächst der Druckverlust
      mit der Geschwindigkeit, bis er dem Gewicht der Schüttung je Fläche entspricht. Dann
      werden die Teilchen vom Fluid getragen, die Schüttung lockert sich auf und verhält sich
      wie eine Flüssigkeit: Sie fließt, bildet eine waagerechte Oberfläche, und leichte Körper
      schwimmen auf ihr.
    example: >-
      Wirbelschichtreaktoren und -trockner, Fließrinnen zur pneumatischen Förderung von Pulvern,
      trockene Dichtesortierung von Kohle, Wirbelsintern
    conditions: >-
      Fluidgeschwindigkeit zwischen der Lockerungsgeschwindigkeit und der Sinkgeschwindigkeit
      der Teilchen.
    limits: >-
      Sehr feine, kohäsive Pulver bilden Kanäle statt zu fluidisieren, sehr grobe Teilchen
      neigen zu Blasen- und Stoßbildung.
    sideEffects: Abrieb der Teilchen und Austrag von Feinanteilen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Fluidisation
    description: >-
      When a gas or liquid flows upwards through a bed of particles, the pressure drop rises
      with velocity until it equals the weight of the bed per unit area. The particles are
      then carried by the fluid, the bed loosens and behaves like a liquid: it flows, forms
      a level surface, and light objects float on it.
    example: >-
      Fluidised bed reactors and dryers, air slides for pneumatic conveying of powders, dry
      density separation of coal, fluidised bed powder coating
    conditions: >-
      Fluid velocity between the minimum fluidisation velocity and the terminal settling velocity
      of the particles.
    limits: >-
      Very fine, cohesive powders form channels instead of fluidising, while very coarse particles
      tend towards bubbling and slugging.
    sideEffects: Particle attrition and carry-over of fines.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
