text:
  de:
    name: Regelfläche
    description: >-
      Eine Regelfläche entsteht, wenn eine Gerade durch den Raum bewegt wird; durch jeden
      Punkt der Fläche verläuft mindestens eine Gerade, die ganz in ihr liegt. Neben Zylinder,
      Kegel und Wendelfläche gehören auch doppelt gekrümmte Flächen wie das einschalige Hyperboloid
      und das hyperbolische Paraboloid dazu, die sich deshalb aus geraden Stäben, Brettern
      oder Schalungen aufbauen lassen.
    example: >-
      Hyperboloid-Kühltürme und Gittertürme nach Schuchow, Hyparschalen-Dächer aus Beton,
      Heißdrahtschneiden von Schaumstoff, Flankenfräsen auf Fünf-Achs-Maschinen
    conditions: ''
    limits: >-
      Allgemeine Freiformflächen sind keine Regelflächen und lassen sich nur näherungsweise
      aus Geraden aufbauen.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Ruled surface
    description: >-
      A ruled surface is generated by moving a straight line through space; through every
      point of the surface runs at least one straight line lying entirely in it. Besides cylinders,
      cones and helicoids, this includes doubly curved surfaces such as the hyperboloid of
      one sheet and the hyperbolic paraboloid, which can therefore be built from straight
      bars, boards or formwork.
    example: >-
      Hyperboloid cooling towers and Shukhov lattice towers, hypar shell roofs in concrete,
      hot-wire cutting of foam, flank milling on five-axis machines
    conditions: ''
    limits: >-
      General free-form surfaces are not ruled and can only be approximated by straight lines.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
