text:
  de:
    name: Adsorptionskältemaschine
    description: >-
      Ein Kältemittel, meist Wasser, verdampft bei niedrigem Druck und entzieht dabei einem
      Kaltwasserkreis Wärme; der Dampf wird von einem Adsorbens wie Kieselgel oder Zeolith
      aufgenommen. Ist das Adsorbens gesättigt, wird es mit Wärme, etwa Abwärme oder Solarwärme,
      wieder getrocknet, der ausgetriebene Dampf kondensiert, und der Zyklus beginnt von vorn.
      Statt eines mechanischen Verdichters treibt also Wärme die Kälteerzeugung an.
    example: >-
      Kühlung von Rechenzentren mit Abwärme, solare Klimatisierung, Kraft-Wärme-Kälte-Kopplung,
      Kühlung von Prozesswasser
    conditions: >-
      Eine Wärmequelle mit mäßiger Temperatur, häufig unter 100 °C, und eine Möglichkeit,
      die Adsorptions- und Kondensationswärme abzuführen.
    limits: >-
      Die Leistungszahl ist deutlich niedriger als bei Kompressionskältemaschinen, und die
      Geräte sind bei gleicher Leistung groß und schwer.
    sideEffects: >-
      Weil Adsorption und Desorption abwechselnd ablaufen, schwankt die Kälteleistung, sofern
      nicht mehrere Adsorber im Wechsel arbeiten.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Adsorption refrigerator (adsorption chiller)
    description: >-
      A refrigerant, usually water, evaporates at low pressure and draws heat from a chilled-water
      circuit in doing so; the vapour is taken up by an adsorbent such as silica gel or zeolite.
      Once the adsorbent is saturated, it is dried again with heat, for example waste heat
      or solar heat, the expelled vapour condenses and the cycle starts over. Heat rather
      than a mechanical compressor thus drives the cooling.
    example: >-
      Cooling data centres with waste heat, solar air conditioning, trigeneration, cooling
      of process water
    conditions: >-
      A heat source of moderate temperature, often below 100 °C, and a way to reject the heat
      of adsorption and condensation.
    limits: >-
      The coefficient of performance is clearly lower than that of compression chillers, and
      for the same output the units are large and heavy.
    sideEffects: >-
      Because adsorption and desorption alternate, cooling output fluctuates unless several
      adsorbers operate in turn.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
