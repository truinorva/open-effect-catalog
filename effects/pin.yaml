text:
  de:
    name: Stecknadel
    description: >-
      Eine Stecknadel ist ein dünner, spitzer Metallstift mit Kopf, der sich leicht durch
      Stoff, Papier oder andere weiche Werkstoffe stechen lässt. Das verdrängte Material legt
      sich eng um den Schaft und hält ihn durch Reibung fest, während der Kopf das Durchrutschen
      verhindert. So lassen sich Lagen vorübergehend zusammenheften oder Gegenstände an einer
      weichen Unterlage befestigen, ohne Klebstoff und fast ohne bleibende Spuren.
    example: >-
      Zusammenstecken von Stofflagen beim Nähen, Pinnwände und Landkarten, Insektensammlungen,
      Anstecknadeln
    conditions: >-
      Ein Material, das sich durchstechen lässt und sich um den Schaft schließt.
    limits: >-
      Die Haltekraft ist gering, und bei Zug oder Vibration rutscht die Nadel heraus.
    sideEffects: >-
      Es bleiben kleine Löcher, und Stahlnadeln können auf feuchten Stoffen Rostflecken hinterlassen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Pin
    description: >-
      A pin is a thin, pointed metal shank with a head that can easily be pushed through fabric,
      paper or other soft materials. The displaced material closes tightly around the shank
      and holds it by friction, while the head stops it from slipping through. Layers can
      thus be fastened together temporarily or objects attached to a soft backing, without
      glue and with hardly any lasting marks.
    example: >-
      Pinning fabric layers together in sewing, pinboards and maps, insect collections, brooches
      and badges
    conditions: A material that can be pierced and closes around the shank.
    limits: >-
      The holding force is low, and under tension or vibration the pin works its way out.
    sideEffects: >-
      Small holes remain, and steel pins can leave rust stains on damp fabrics.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
