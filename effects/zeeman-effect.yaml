text:
  de:
    name: Zeeman-Effekt
    description: >-
      In einem Magnetfeld spalten die Energieniveaus von Atomen auf, weil das magnetische
      Moment der Elektronen je nach seiner Ausrichtung zum Feld eine etwas andere Energie
      hat. Spektrallinien zerfallen dadurch in mehrere polarisierte Komponenten, deren Abstand
      in schwachen Feldern proportional zur Feldstärke ist. Aus der Aufspaltung lässt sich
      das Magnetfeld bestimmen, und über die feldabhängige Verschiebung lassen sich Atome
      gezielt ansprechen.
    example: >-
      Messung von Magnetfeldern auf der Sonne und auf Sternen, Zeeman-Untergrundkorrektur
      in der Atomabsorptionsspektrometrie, Zeeman-Abbremser für Atomstrahlen, optisch gepumpte
      Magnetometer, Elektronenspinresonanz
    conditions: Magnetfeld und schmale Spektrallinien; hochauflösende Spektroskopie.
    limits: >-
      In Laborfeldern ist die Aufspaltung sehr klein und nur mit hochauflösenden Instrumenten
      sichtbar.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Zeeman effect
    description: >-
      In a magnetic field the energy levels of atoms split, because the magnetic moment of
      the electrons has a slightly different energy depending on its orientation to the field.
      Spectral lines thus break up into several polarised components whose spacing, in weak
      fields, is proportional to the field strength. The magnetic field can be determined
      from the splitting, and the field-dependent shift allows atoms to be addressed selectively.
    example: >-
      Measuring magnetic fields on the Sun and stars, Zeeman background correction in atomic
      absorption spectrometry, Zeeman slowers for atomic beams, optically pumped magnetometers,
      electron spin resonance
    conditions: Magnetic field and narrow spectral lines; high-resolution spectroscopy.
    limits: >-
      In laboratory fields the splitting is very small and visible only with high-resolution
      instruments.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
