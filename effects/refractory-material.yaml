text:
  de:
    name: Feuerfester Werkstoff
    description: >-
      Feuerfeste Werkstoffe sind überwiegend keramische, nichtmetallische Stoffe, die auch
      oberhalb von etwa 1500 °C fest, formbeständig und chemisch beständig bleiben. Sie bestehen
      meist aus hochschmelzenden Oxiden wie Aluminium-, Magnesium-, Silizium- oder Zirkoniumoxid
      oder aus Kohlenstoff und Siliziumcarbid und kleiden Öfen, Pfannen und Reaktoren aus,
      damit Schmelzen und heiße Gase den Stahlmantel nicht erreichen.
    example: >-
      Ausmauerung von Hochöfen, Stahlpfannen und Konvertern, Glasschmelzwannen, Zementdrehrohröfen,
      Schamottesteine in Kaminen, Feuerleichtsteine und Keramikfasermatten zur Wärmedämmung
    conditions: >-
      Ein Werkstoff, der zu Temperatur, Schlacke und Ofenatmosphäre passt, also sauer, basisch
      oder neutral gewählt wird.
    limits: >-
      Schlacken, Schmelzen und Temperaturwechsel greifen die Auskleidung an, sodass sie regelmäßig
      erneuert werden muss.
    sideEffects: >-
      Keramikfasern und quarzhaltige Stäube können beim Ein- und Ausbau die Atemwege schädigen,
      und verbrauchte Ausmauerung fällt als Abfall an.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Refractory material
    description: >-
      Refractories are mostly ceramic, non-metallic materials that remain solid, dimensionally
      stable and chemically resistant even above about 1500 °C. They usually consist of high-melting
      oxides such as alumina, magnesia, silica or zirconia, or of carbon and silicon carbide,
      and line furnaces, ladles and reactors so that melts and hot gases do not reach the
      steel shell.
    example: >-
      Linings of blast furnaces, steel ladles and converters, glass melting tanks, cement
      rotary kilns, firebricks in fireplaces, insulating firebricks and ceramic fibre blankets
    conditions: >-
      A material chosen to suit temperature, slag and furnace atmosphere, i.e. acidic, basic
      or neutral.
    limits: >-
      Slags, melts and thermal cycling attack the lining, so it must be renewed regularly.
    sideEffects: >-
      Ceramic fibres and silica-containing dusts can damage the airways during installation
      and removal, and spent linings become waste.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
