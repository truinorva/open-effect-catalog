text:
  de:
    name: Pseudo-Stirling-Kreisprozess
    description: >-
      Der Pseudo-Stirling- oder adiabatische Stirling-Kreisprozess beschreibt Stirlingmaschinen
      wirklichkeitsnäher als der ideale Stirling-Prozess: Das Arbeitsgas wird in den Kompressions-
      und Expansionsräumen adiabat, also ohne Wärmeaustausch, verdichtet und entspannt, während
      Wärme nur in Erhitzer und Kühler bei konstanter Temperatur übertragen wird. Dadurch
      schwankt die Gastemperatur in den Arbeitsräumen, und der Wirkungsgrad liegt unter dem
      des idealen, isothermen Prozesses.
    example: >-
      Auslegung und Simulation von Stirlingmotoren, Stirling-Kryokühlern und Freikolben-Stirlinggeneratoren
    conditions: ''
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
