    updated: '2026-11-19'
  en:
    name: Pseudo-Stirling cycle
    description: >-
      The pseudo-Stirling or adiabatic Stirling cycle describes Stirling machines more realistically
      than the ideal Stirling cycle: the working gas is compressed and expanded adiabatically,
      i.e. without heat exchange, in the compression and expansion spaces, while heat is transferred
      only in the heater and cooler at constant temperature. As a result the gas temperature
      in the working spaces fluctuates, and the efficiency falls below that of the ideal isothermal
      cycle.
    example: >-
      Design and simulation of Stirling engines, Stirling cryocoolers and free-piston Stirling
      generators
    conditions: ''
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
