text:
  de:
    name: Negative Brechung
    description: >-
      Bei negativer Brechung wird eine Welle an einer Grenzfläche nicht wie gewohnt auf die
      andere Seite des Einfallslots gelenkt, sondern auf dieselbe Seite, von der sie kommt.
      Das geschieht, wenn ein Medium einen negativen Brechungsindex hat, also elektrische
      Permittivität und magnetische Permeabilität zugleich negativ sind, oder in photonischen
      Kristallen in bestimmten Frequenzbereichen. Natürliche Werkstoffe zeigen den Effekt
      praktisch nicht; er wird mit künstlich strukturierten Materialien erzeugt.
    example: >-
      Flache Linsen ohne gekrümmte Oberflächen, Superlinsen jenseits der Beugungsgrenze (Forschung),
      Strahlformung bei Mikrowellenantennen, Tarnkappen-Konzepte
    conditions: >-
      Strukturen, deren Bauelemente deutlich kleiner als die Wellenlänge sind, oder photonische
      Kristalle mit passender Bandstruktur.
    limits: >-
      Der Effekt ist meist schmalbandig, und die Strukturen absorbieren viel Energie, besonders
      bei optischen Frequenzen.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Negative refraction
    description: >-
      In negative refraction, a wave at an interface is not bent to the far side of the normal
      as usual, but to the same side it comes from. This happens when a medium has a negative
      refractive index, meaning electric permittivity and magnetic permeability are both negative,
      or in photonic crystals within certain frequency ranges. Natural materials practically
      do not show the effect; it is produced with artificially structured materials.
    example: >-
      Flat lenses without curved surfaces, superlenses beyond the diffraction limit (research),
      beam shaping for microwave antennas, cloaking concepts
    conditions: >-
      Structures whose building blocks are much smaller than the wavelength, or photonic crystals
      with a suitable band structure.
    limits: >-
      The effect is usually narrow-band, and the structures absorb much energy, especially
      at optical frequencies.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
