text:
  de:
    name: Brillouin-Streuung
    description: >-
      Licht wird an Schallwellen bzw. thermischen Dichteschwankungen in einem Stoff unelastisch
      gestreut. Das gestreute Licht ist um die Frequenz der beteiligten Schallwelle verschoben,
      typischerweise um einige Gigahertz; aus dieser Verschiebung ergeben sich Schallgeschwindigkeit
      und elastische Eigenschaften. Bei hoher Lichtintensität kann das Licht die Schallwelle
      selbst verstärken (stimulierte Brillouin-Streuung).
    example: >-
      Verteilte Temperatur- und Dehnungsmessung in Glasfasern, Brillouin-Mikroskopie von Zellen
      und Gewebe, Bestimmung elastischer Konstanten, Phasenkonjugation in Lasern
    conditions: >-
      Monochromatisches Licht, meist von einem Laser, und ein hochauflösendes Spektrometer
      oder Interferometer zur Auswertung.
    limits: >-
      Das Signal ist schwach und die Frequenzverschiebung klein, sodass aufwendige Spektroskopie
      nötig ist.
    sideEffects: >-
      In Glasfasern begrenzt die stimulierte Brillouin-Streuung die Leistung, die schmalbandige
      Laser übertragen können.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Brillouin scattering
    description: >-
      Light is scattered inelastically by sound waves or thermal density fluctuations in a
      material. The scattered light is shifted by the frequency of the sound wave involved,
      typically a few gigahertz; this shift yields the speed of sound and the elastic properties.
      At high light intensity the light can itself amplify the sound wave (stimulated Brillouin
      scattering).
    example: >-
      Distributed temperature and strain sensing in optical fibres, Brillouin microscopy of
      cells and tissue, determination of elastic constants, phase conjugation in lasers
    conditions: >-
      Monochromatic light, usually from a laser, and a high-resolution spectrometer or interferometer
      for analysis.
    limits: >-
      The signal is weak and the frequency shift small, so demanding spectroscopy is needed.
    sideEffects: >-
      In optical fibres, stimulated Brillouin scattering limits the power that narrow-linewidth
      lasers can transmit.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
