text:
  de:
    name: Kapillarkondensation
    description: >-
      In engen Poren und Spalten eines benetzbaren Festkörpers kondensiert Dampf bereits unterhalb
      seines Sättigungsdampfdrucks. Grund ist der stark gekrümmte, nach innen gewölbte Flüssigkeitsmeniskus,
      über dem der Gleichgewichtsdampfdruck niedriger ist als über einer ebenen Fläche (Kelvin-Gleichung).
      Je feiner die Poren, desto früher füllen sie sich mit Flüssigkeit.
    example: >-
      Trockenmittel wie Silicagel, Porengrößenbestimmung durch Gassorption (BJH-Methode),
      Verbacken feuchter Pulver, Haftung durch Flüssigkeitsbrücken, Feuchtespeicherung in
      Baustoffen
    conditions: >-
      Benetzbare Poren, typischerweise im Bereich von etwa 2 bis 50 Nanometern, und ein ausreichend
      hoher Dampfpartialdruck.
    limits: >-
      In sehr feinen Mikroporen versagt die Kelvin-Gleichung, weil die Flüssigkeit dort nicht
      mehr als zusammenhängende Phase vorliegt.
    sideEffects: >-
      Beim Entleeren der Poren tritt eine Hysterese auf; kondensierte Flüssigkeitsbrücken
      lassen Pulver verbacken und Mikrobauteile aneinanderhaften.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Capillary condensation
    description: >-
      In narrow pores and gaps of a wettable solid, vapour condenses even below its saturation
      vapour pressure. The reason is the strongly curved, concave liquid meniscus, above which
      the equilibrium vapour pressure is lower than above a flat surface (Kelvin equation).
      The finer the pores, the earlier they fill with liquid.
    example: >-
      Desiccants such as silica gel, pore size analysis by gas sorption (BJH method), caking
      of moist powders, adhesion through liquid bridges, moisture storage in building materials
    conditions: >-
      Wettable pores, typically in the range of about 2 to 50 nanometres, and a sufficiently
      high vapour partial pressure.
    limits: >-
      In very fine micropores the Kelvin equation fails because the liquid no longer exists
      there as a continuous phase.
    sideEffects: >-
      Emptying of the pores shows hysteresis; condensed liquid bridges make powders cake and
      micro-components stick together.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
