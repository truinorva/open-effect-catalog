text:
  de:
    name: Stewart-Plattform (Hexapod)
    description: >-
      Eine bewegliche Plattform ist über sechs längenveränderliche Beine, die paarweise an
      Gelenkpunkten angreifen, mit einer festen Basis verbunden. Durch gleichzeitiges Verändern
      der sechs Beinlängen lässt sich die Plattform in allen sechs Freiheitsgraden bewegen,
      also in drei Verschiebungen und drei Drehungen. Weil sich die Last auf alle Beine verteilt,
      die nur auf Zug und Druck beansprucht werden, ist die Anordnung sehr steif und genau.
    example: >-
      Bewegungsplattformen von Flugsimulatoren, Präzisionspositionierer in Optik und Halbleitertechnik,
      Schwingungsprüfstände, Ausrichtung von Teleskop-Sekundärspiegeln
    conditions: >-
      Sechs einzeln geregelte Linearantriebe und eine Steuerung, die die Beinlängen aus der
      gewünschten Lage berechnet.
    limits: >-
      Der Arbeitsraum ist im Verhältnis zur Baugröße klein, besonders bei Drehungen.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Stewart platform (hexapod)
    description: >-
      A movable platform is connected to a fixed base by six legs of variable length that
      attach in pairs at joint points. Changing the six leg lengths together moves the platform
      in all six degrees of freedom, that is three translations and three rotations. Because
      the load is shared by all legs, which carry only tension and compression, the arrangement
      is very stiff and precise.
    example: >-
      Motion platforms of flight simulators, precision positioners in optics and semiconductor
      manufacturing, vibration test rigs, alignment of telescope secondary mirrors
    conditions: >-
      Six individually controlled linear actuators and a controller that calculates the leg
      lengths from the desired pose.
    limits: >-
      The workspace is small relative to the size of the device, especially for rotations.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
