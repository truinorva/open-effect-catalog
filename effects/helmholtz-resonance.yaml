text:
  de:
    name: Helmholtz-Resonanz
    description: >-
      Ein Hohlraum mit einer engen Öffnung oder einem Hals bildet ein schwingungsfähiges System:
      Die Luft im Hals wirkt als Masse, die eingeschlossene Luft im Hohlraum als Feder. Bei
      der Resonanzfrequenz, die vom Hohlraumvolumen sowie von Querschnitt und Länge des Halses
      abhängt, schwingt die Luft im Hals stark hin und her.
    example: >-
      Ton beim Anblasen einer Flasche, Helmholtz-Absorber in der Raumakustik, Schalldämpfer,
      Bassreflexgehäuse, Schwingsaugrohre bei Verbrennungsmotoren, Okarina
    conditions: Hohlraumabmessungen klein gegenüber der Schallwellenlänge.
    limits: >-
      Die Wirkung ist auf ein schmales Frequenzband um die Resonanz beschränkt.
    sideEffects: >-
      Unerwünschte Resonanzen erzeugen Dröhnen, etwa das Wummern bei geöffnetem Seitenfenster
      im fahrenden Auto.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Helmholtz resonance
    description: >-
      A cavity with a narrow opening or neck forms an oscillating system: the air in the neck
      acts as a mass, the enclosed air in the cavity as a spring. At the resonance frequency,
      which depends on the cavity volume and the cross-section and length of the neck, the
      air in the neck oscillates strongly back and forth.
    example: >-
      Tone when blowing across a bottle, Helmholtz absorbers in room acoustics, silencers,
      bass-reflex loudspeaker enclosures, tuned intake manifolds on combustion engines, ocarina
    conditions: Cavity dimensions small compared with the sound wavelength.
    limits: The effect is confined to a narrow frequency band around the resonance.
    sideEffects: >-
      Unwanted resonances cause booming, such as the buffeting with an open side window in
      a moving car.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
