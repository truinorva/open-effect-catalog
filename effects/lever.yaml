text:
  de:
    name: Hebel
    description: >-
      Ein Hebel ist ein starrer Körper, der sich um einen Drehpunkt drehen kann. Im Gleichgewicht
      sind die Drehmomente auf beiden Seiten gleich, also jeweils Kraft mal Hebelarm; eine
      kleine Kraft an einem langen Hebelarm hält deshalb einer großen Kraft an einem kurzen
      das Gleichgewicht. Was an Kraft gewonnen wird, muss an Weg zugesetzt werden, so dass
      die Arbeit gleich bleibt.
    example: >-
      Brechstange, Schubkarre, Zange und Schere, Nussknacker, Wippe, Balkenwaage, Bremspedal,
      Kipphebel im Motor
    conditions: Ein ausreichend steifer Hebelarm und ein fester Drehpunkt.
    limits: >-
      Großer Kraftgewinn erfordert lange Hebelarme und große Wege auf der Antriebsseite; der
      Hebel muss die Biegebelastung ohne Bruch aufnehmen.
    sideEffects: >-
      Reibung im Drehpunkt und Durchbiegung des Hebels mindern die übertragene Kraft.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Lever
    description: >-
      A lever is a rigid body that can rotate about a pivot. In equilibrium the torques on
      both sides are equal, i.e. force times lever arm; a small force on a long arm therefore
      balances a large force on a short arm. What is gained in force has to be paid for in
      distance, so the work stays the same.
    example: >-
      Crowbar, wheelbarrow, pliers and scissors, nutcracker, seesaw, beam balance, brake pedal,
      rocker arm in an engine
    conditions: A sufficiently stiff lever arm and a fixed pivot.
    limits: >-
      A large force gain requires long lever arms and long travel on the input side; the lever
      must withstand the bending load without breaking.
    sideEffects: >-
      Friction at the pivot and bending of the lever reduce the transmitted force.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
