text:
  de:
    name: Effusion
    description: >-
      Strömt ein Gas durch eine sehr kleine Öffnung ins Vakuum oder in einen Raum niedrigeren
      Drucks und ist die Öffnung kleiner als die mittlere freie Weglänge der Moleküle, treten
      die Moleküle einzeln und ohne Stöße untereinander hindurch. Die Austrittsrate ist dann
      umgekehrt proportional zur Wurzel aus der Molmasse (Grahamsches Gesetz): Leichte Moleküle
      entweichen schneller als schwere, so dass sich das Gas hinter der Öffnung an leichten
      Bestandteilen anreichert.
    example: >-
      Urananreicherung durch Gasdiffusion von Uranhexafluorid, Effusionszellen (Knudsen-Zellen)
      in der Molekularstrahlepitaxie, Bestimmung von Dampfdrücken nach der Knudsen-Methode
    conditions: >-
      Eine Öffnung, die kleiner ist als die mittlere freie Weglänge, also niedriger Gasdruck
      oder sehr feine Poren.
    limits: >-
      Der Trennfaktor pro Stufe ist klein (bei den Uranisotopen nur etwa 1,004), so dass sehr
      viele Stufen und viel Energie nötig sind.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Effusion
    description: >-
      If a gas flows through a very small opening into a vacuum or a space at lower pressure,
      and the opening is smaller than the mean free path of the molecules, the molecules pass
      through individually without colliding with each other. The rate of escape is then inversely
      proportional to the square root of the molar mass (Graham's law): light molecules escape
      faster than heavy ones, so the gas behind the opening becomes enriched in light components.
    example: >-
      Uranium enrichment by gaseous diffusion of uranium hexafluoride, effusion cells (Knudsen
      cells) in molecular beam epitaxy, determination of vapour pressures by the Knudsen method
    conditions: >-
      An opening smaller than the mean free path, i.e. low gas pressure or very fine pores.
    limits: >-
      The separation factor per stage is small (only about 1.004 for the uranium isotopes),
      so a very large number of stages and much energy are needed.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
