text:
  de:
    name: Faradayscher Käfig
    description: >-
      Eine geschlossene Hülle oder ein engmaschiges Gitter aus leitfähigem Material schirmt
      den Innenraum gegen äußere elektrische Felder ab. Die Ladungsträger in der Hülle verschieben
      sich so, dass ihr Feld das äußere Feld im Inneren aufhebt; bei elektromagnetischen Wellen
      wirken zusätzlich induzierte Ströme, sofern die Maschen deutlich kleiner als die Wellenlänge
      sind.
    example: >-
      Blitzschutz von Insassen in Auto und Flugzeug, Sichtfenster des Mikrowellenherds, abgeschirmte
      Messräume, Kabelschirme, abgeschirmte Elektronikgehäuse
    conditions: >-
      Leitfähige, möglichst geschlossene Hülle; Öffnungen klein gegenüber der Wellenlänge.
    limits: >-
      Statische und niederfrequente Magnetfelder werden kaum abgeschirmt; dafür sind hochpermeable
      Werkstoffe nötig.
    sideEffects: Funkempfang im Inneren wird unterbunden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Faraday cage
    description: >-
      A closed shell or fine-meshed grid of conductive material shields its interior against
      external electric fields. The charge carriers in the shell rearrange so that their field
      cancels the external field inside; for electromagnetic waves, induced currents also
      contribute, provided the mesh openings are much smaller than the wavelength.
    example: >-
      Lightning protection of occupants in cars and aircraft, microwave oven viewing window,
      shielded test rooms, cable shields, shielded electronics enclosures
    conditions: >-
      Conductive, preferably closed shell; openings small compared with the wavelength.
    limits: >-
      Static and low-frequency magnetic fields are hardly shielded; that requires materials
      of high permeability.
    sideEffects: Radio reception inside is blocked.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
