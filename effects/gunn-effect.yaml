text:
  de:
    name: Gunn-Effekt
    description: >-
      In n-dotiertem Galliumarsenid oder Indiumphosphid werden Elektronen oberhalb einer Schwellfeldstärke
      in höher liegende Energietäler gestreut, in denen sie schwerer und langsamer sind. Dadurch
      sinkt der Strom bei steigender Spannung (negativer differentieller Widerstand); es bilden
      sich Ladungsdomänen, die periodisch durch den Kristall laufen und eine Schwingung im
      Mikrowellenbereich erzeugen.
    example: >-
      Gunn-Dioden als Mikrowellenoszillatoren in Radar-Geschwindigkeitsmessern, Bewegungsmeldern
      und Türöffnern, Signalquellen im Labor
    conditions: >-
      Halbleiter mit geeigneter Bandstruktur (Nebentäler) und eine Feldstärke über dem Schwellwert.
    limits: >-
      Ausgangsleistung und Wirkungsgrad sind gering; die Frequenz hängt von der Länge der
      aktiven Zone ab.
    sideEffects: Der größte Teil der zugeführten Leistung wird als Wärme frei.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Gunn effect
    description: >-
      In n-doped gallium arsenide or indium phosphide, electrons above a threshold field strength
      are scattered into higher energy valleys in which they are heavier and slower. As a
      result, current falls as voltage rises (negative differential resistance); charge domains
      form and travel periodically through the crystal, generating an oscillation in the microwave
      range.
    example: >-
      Gunn diodes as microwave oscillators in radar speed guns, motion detectors and door
      openers, laboratory signal sources
    conditions: >-
      A semiconductor with a suitable band structure (satellite valleys) and a field strength
      above the threshold.
    limits: >-
      Output power and efficiency are low; the frequency depends on the length of the active
      region.
    sideEffects: Most of the power supplied is released as heat.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
