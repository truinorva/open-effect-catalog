text:
  de:
    name: Tyndall-Effekt
    description: >-
      Kolloidal verteilte Teilchen, die etwas kleiner oder etwa so groß wie die Lichtwellenlänge
      sind, streuen Licht seitlich aus einem Strahl heraus, sodass sein Weg durch Nebel, Rauch
      oder eine kolloide Lösung sichtbar wird. Bei kleinen Teilchen wird kurzwelliges Licht
      stärker gestreut, weshalb das Streulicht bläulich und das durchgehende Licht rötlich
      erscheint. Echte Lösungen zeigen den Effekt kaum, daher unterscheidet er Kolloide von
      gelösten Stoffen.
    example: >-
      Streulicht-Rauchmelder, Trübungsmessung (Nephelometrie) in Trinkwasser und Getränken,
      Lichtkegel von Scheinwerfern im Nebel, bläulicher Zigarettenrauch
    conditions: >-
      Teilchen mit anderer Brechzahl als das umgebende Medium; Beobachtung seitlich zum Strahl.
    limits: >-
      Sehr große Teilchen streuen alle Farben gleich stark (weißes Streulicht), einzelne gelöste
      Moleküle kaum noch.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Tyndall effect
    description: >-
      Colloidal particles somewhat smaller than or comparable to the wavelength of light scatter
      light sideways out of a beam, so its path through fog, smoke or a colloidal solution
      becomes visible. With small particles, short-wavelength light is scattered more strongly,
      which is why the scattered light looks bluish and the transmitted light reddish. True
      solutions hardly show the effect, so it distinguishes colloids from dissolved substances.
    example: >-
      Scattered-light smoke detectors, turbidity measurement (nephelometry) in drinking water
      and beverages, headlight beams in fog, bluish cigarette smoke
    conditions: >-
      Particles with a refractive index different from the surrounding medium; observation
      from the side of the beam.
    limits: >-
      Very large particles scatter all colours equally (white scattered light), individual
      dissolved molecules hardly at all.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
