text:
  de:
    name: Stockbridge-Dämpfer (Schwingungstilger)
    description: >-
      Ein kurzes Stück Stahlseil mit je einem Gewicht an beiden Enden wird in der Mitte mit
      einer Klemme an einer Freileitung befestigt. Regt der Wind das Leiterseil zu Schwingungen
      an, schwingen die Gewichte auf dem biegsamen Tragseil mit, und die innere Reibung zwischen
      dessen Drähten wandelt die Schwingungsenergie in Wärme um. Die beiden Massen sind meist
      unterschiedlich ausgelegt, damit mehrere Eigenfrequenzen abgedeckt werden.
    example: Hochspannungsfreileitungen, Abspannseile von Masten, Erdseile
    conditions: >-
      Schlanke, gespannte Seile, die von gleichmäßigem Wind zu Schwingungen angeregt werden.
    limits: >-
      Wirksam vor allem gegen windinduzierte Schwingungen kleiner Amplitude bei höheren Frequenzen;
      gegen großamplitudiges Seiltanzen (Galloping) hilft er kaum.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Stockbridge damper
    description: >-
      A short length of steel cable with a weight at each end is clamped at its centre to
      an overhead line. When wind excites the conductor to vibrate, the weights swing on the
      flexible messenger cable, and internal friction between its strands converts the vibration
      energy into heat. The two masses are usually designed differently so that several natural
      frequencies are covered.
    example: High-voltage overhead lines, guy wires of masts, earth wires
    conditions: Slender, tensioned cables excited to vibrate by steady wind.
    limits: >-
      Effective mainly against small-amplitude, higher-frequency wind-induced vibrations;
      it does little against large-amplitude galloping.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
