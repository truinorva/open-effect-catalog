text:
  de:
    name: Reuleaux-Dreieck
    description: >-
      Das Reuleaux-Dreieck entsteht aus einem gleichseitigen Dreieck, dessen Seiten durch
      Kreisbögen um die jeweils gegenüberliegende Ecke ersetzt werden. Es hat in jeder Richtung
      dieselbe Breite (Gleichdick): Zwischen zwei parallelen Geraden lässt es sich drehen
      und berührt dabei stets beide, und in einem passenden Quadrat kann es rotieren und dabei
      alle vier Seiten berühren.
    example: >-
      Bohrer für nahezu quadratische Löcher (Watts-Bohrer), Greiferantrieb in Filmprojektoren,
      Schachtdeckel, die nicht durch ihre Öffnung fallen können, Münzen mit Gleichdickform,
      ähnliche Läuferform im Wankelmotor
    conditions: ''
    limits: >-
      Ein im Quadrat rotierendes Reuleaux-Dreieck überstreicht nicht die ganze Fläche: Die
      Ecken bleiben leicht gerundet, und sein Mittelpunkt wandert auf einer Bahn, statt fest
      zu stehen.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Reuleaux triangle
    description: >-
      The Reuleaux triangle is formed from an equilateral triangle whose sides are replaced
      by circular arcs centred on the opposite corner. It has the same width in every direction
      (a curve of constant width): it can turn between two parallel lines while always touching
      both, and inside a matching square it can rotate while touching all four sides.
    example: >-
      Drills for almost square holes (Watts drill), claw drives in film projectors, manhole
      covers that cannot fall through their opening, coins of constant width, similar rotor
      shape in the Wankel engine
    conditions: ''
    limits: >-
      A Reuleaux triangle rotating in a square does not sweep the whole area: the corners
      remain slightly rounded, and its centre moves along a path rather than staying fixed.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
