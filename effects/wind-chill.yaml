text:
  de:
    name: Windchill-Effekt
    description: >-
      Bewegte Luft trägt die warme Grenzschicht um einen Körper ständig ab und ersetzt sie
      durch kühlere Luft, sodass er schneller Wärme verliert als in ruhender Luft. Ein warmer
      Körper wie die menschliche Haut kühlt dadurch rascher ab und empfindet die Temperatur
      als niedriger, als sie ist. Der Effekt beruht auf erzwungener Konvektion und wächst
      mit der Windgeschwindigkeit.
    example: >-
      Gefühlte Temperatur im Wetterbericht, Pusten auf heiße Suppe, Ventilatoren zur Kühlung,
      Erfrierungsgefahr bei Wind
    conditions: Körper wärmer als die Umgebungsluft; Luftbewegung.
    limits: >-
      Ohne Verdunstung kann Wind einen trockenen Körper nicht unter die Lufttemperatur abkühlen.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Wind chill
    description: >-
      Moving air continually strips away the warm boundary layer around a body and replaces
      it with cooler air, so the body loses heat faster than in still air. A warm body such
      as human skin therefore cools down more quickly and perceives the temperature as lower
      than it is. The effect is based on forced convection and grows with wind speed.
    example: >-
      Felt temperature in weather reports, blowing on hot soup, fans for cooling, risk of
      frostbite in wind
    conditions: Body warmer than the ambient air; air movement.
    limits: >-
      Without evaporation, wind cannot cool a dry body below the air temperature.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
