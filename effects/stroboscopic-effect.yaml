text:
  de:
    name: Stroboskopeffekt
    description: >-
      Sieht man einen periodisch bewegten Gegenstand nur in kurzen Lichtblitzen oder Einzelbildern,
      deren Takt mit der Bewegung übereinstimmt, erscheint er jedes Mal in derselben Lage
      und scheint stillzustehen. Weicht die Blitzfrequenz leicht ab, scheint er sich langsam
      vorwärts oder rückwärts zu bewegen. So lassen sich schnelle Bewegungen wie in Zeitlupe
      betrachten und Drehzahlen oder Frequenzen bestimmen.
    example: >-
      Stroboskop-Drehzahlmesser, Einstellen des Zündzeitpunkts mit der Stroboskoplampe, Prüfen
      laufender Druck- und Textilmaschinen, Stroboskopscheibe am Plattenspieler, scheinbar
      rückwärts drehende Räder im Film
    conditions: >-
      Blitz- oder Belichtungsdauer sehr kurz im Vergleich zur Bewegung; Blitzfrequenz gleich
      der Bewegungsfrequenz oder in ganzzahligem Verhältnis dazu.
    limits: >-
      Auch bei ganzzahligen Vielfachen oder Bruchteilen der Frequenz scheint die Bewegung
      stillzustehen, was zu Fehlablesungen führen kann.
    sideEffects: >-
      Flimmerndes Licht kann laufende Maschinen stillstehend erscheinen lassen und so Unfälle
      verursachen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Stroboscopic effect
    description: >-
      When a periodically moving object is seen only in short flashes or frames whose rate
      matches the motion, it appears in the same position each time and seems to stand still.
      If the flash rate differs slightly, it seems to move slowly forwards or backwards. Fast
      movements can thus be observed as if in slow motion, and rotational speeds or frequencies
      can be determined.
    example: >-
      Stroboscopic tachometer, ignition timing with a timing light, inspection of running
      printing and textile machines, turntable strobe disc, wheels that seem to turn backwards
      in films
    conditions: >-
      Flash or exposure time very short compared with the motion; flash rate equal to the
      motion frequency or in an integer ratio to it.
    limits: >-
      The motion also appears frozen at integer multiples or fractions of the frequency, which
      can lead to wrong readings.
    sideEffects: >-
      Flickering light can make running machinery appear stationary and so cause accidents.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
