text:
  de:
    name: Flattern (aeroelastisch)
    description: >-
      Die Strömungskräfte auf einem elastischen Bauteil hängen von dessen Verformung ab; unter
      bestimmten Bedingungen speisen sie Energie in eine gekoppelte Biege- und Torsionsschwingung
      ein, statt sie zu dämpfen. Oberhalb einer kritischen Strömungsgeschwindigkeit wächst
      die Schwingung dann von selbst an, bis Nichtlinearitäten sie begrenzen oder das Bauteil
      versagt.
    example: >-
      Flügel- und Ruderflattern bei Flugzeugen, Einsturz der Tacoma-Narrows-Brücke 1940, flatternde
      Fahnen, Energiegewinnung mit flatternden Membranen
    conditions: >-
      Eine elastische, schwach gedämpfte Struktur in einer Strömung oberhalb der kritischen
      Flattergeschwindigkeit.
    limits: ''
    sideEffects: >-
      Die Schwingung kann sehr schnell anwachsen und das Bauteil innerhalb kurzer Zeit zerstören.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Aeroelastic flutter
    description: >-
      The aerodynamic forces on an elastic component depend on how it deforms; under certain
      conditions they feed energy into a coupled bending and torsional oscillation instead
      of damping it. Above a critical flow speed the oscillation then grows by itself until
      nonlinearities limit it or the component fails.
    example: >-
      Wing and control surface flutter in aircraft, collapse of the Tacoma Narrows Bridge
      in 1940, flapping flags, energy harvesting with fluttering membranes
    conditions: >-
      An elastic, lightly damped structure in a flow above the critical flutter speed.
    limits: ''
    sideEffects: >-
      The oscillation can grow very quickly and destroy the component within a short time.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
