text:
  de:
    name: Elektromagnetischer Antrieb
    description: >-
      Ein Körper oder Fluid wird ohne mechanische Kraftübertragung allein durch elektromagnetische
      Kräfte beschleunigt: Ein wanderndes oder gepulstes Magnetfeld wirkt auf Ströme im bewegten
      Objekt, die entweder von außen zugeführt oder durch Induktion erzeugt werden. Typische
      Bauformen sind Linearmotoren, Spulenbeschleuniger, Schienenbeschleuniger und magnetohydrodynamische
      Antriebe für leitfähige Flüssigkeiten.
    example: >-
      Magnetschwebebahn mit Langstator-Linearmotor, elektromagnetisches Flugzeugkatapult (EMALS),
      Achterbahnstart mit Linearmotoren, Versuchsschiff Yamato 1 mit MHD-Antrieb
    conditions: >-
      Elektrisch leitfähiges oder magnetisierbares Objekt bzw. Fluid und eine leistungsstarke
      Stromversorgung.
    limits: ''
    sideEffects: >-
      Hohe Pulsströme verursachen Erwärmung und bei Schienenbeschleunigern starken Verschleiß
      der Schienen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electromagnetic propulsion
    description: >-
      A body or fluid is accelerated purely by electromagnetic forces, without mechanical
      power transmission: a travelling or pulsed magnetic field acts on currents in the moving
      object, which are either supplied from outside or induced. Typical designs are linear
      motors, coilguns, railguns and magnetohydrodynamic drives for conductive liquids.
    example: >-
      Maglev train with long-stator linear motor, electromagnetic aircraft launch system (EMALS),
      linear-motor launched roller coasters, Yamato 1 experimental ship with MHD drive
    conditions: >-
      Electrically conductive or magnetisable object or fluid and a powerful power supply.
    limits: ''
    sideEffects: High pulse currents cause heating and, in railguns, severe rail wear.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
