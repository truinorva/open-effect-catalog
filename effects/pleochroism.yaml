text:
  de:
    name: Pleochroismus
    description: >-
      Manche doppelbrechenden Kristalle absorbieren Licht je nach seiner Schwingungsrichtung
      unterschiedlich stark und in unterschiedlichen Wellenlängenbereichen. Betrachtet man
      sie aus verschiedenen Richtungen oder dreht man sie unter polarisiertem Licht, wechseln
      sie deshalb Farbe oder Farbtiefe; bei zwei Farben spricht man von Dichroismus, bei drei
      von Trichroismus.
    example: >-
      Bestimmung von Mineralen im Polarisationsmikroskop, Erkennen von Edelsteinen wie Turmalin,
      Iolith und Tansanit, Ausrichten des Rohsteins vor dem Schleifen, Turmalin als früher
      Polarisator
    conditions: >-
      Ein optisch anisotroper, also nicht kubischer Kristall mit richtungsabhängiger Absorption,
      betrachtet in polarisiertem Licht oder aus verschiedenen Richtungen.
    limits: >-
      Kubische Kristalle und amorphe Stoffe wie Glas zeigen keinen Pleochroismus; bei schwach
      gefärbten Kristallen ist der Effekt kaum sichtbar.
    sideEffects: >-
      Die Farbwirkung eines geschliffenen Steins hängt davon ab, wie er zur Kristallachse
      orientiert ist.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Pleochroism
    description: >-
      Some birefringent crystals absorb light to a different degree and in different wavelength
      ranges depending on its direction of vibration. Viewed from different directions, or
      rotated under polarised light, they therefore change colour or depth of colour; with
      two colours this is called dichroism, with three trichroism.
    example: >-
      Mineral identification under the polarising microscope, recognising gemstones such as
      tourmaline, iolite and tanzanite, orienting rough stones before cutting, tourmaline
      as an early polariser
    conditions: >-
      An optically anisotropic, i.e. non-cubic, crystal with direction-dependent absorption,
      viewed in polarised light or from different directions.
    limits: >-
      Cubic crystals and amorphous materials such as glass show no pleochroism; in weakly
      coloured crystals the effect is hardly visible.
    sideEffects: >-
      The colour of a cut stone depends on how it is oriented relative to the crystal axis.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
