text:
  de:
    name: Coulter-Zähler
    description: >-
      Teilchen in einer Elektrolytlösung werden durch eine winzige Öffnung gesaugt, an der
      zwei Elektroden einen konstanten Strom anlegen. Jedes Teilchen verdrängt beim Durchtritt
      leitende Flüssigkeit und erhöht kurz den elektrischen Widerstand; die Zahl der Pulse
      ergibt die Teilchenzahl, ihre Höhe das Teilchenvolumen.
    example: >-
      Zählung von Blutzellen im Hämatologie-Analysator, Partikelgrößenanalyse von Pulvern
      und Emulsionen, Zellzählung in Bioreaktoren
    conditions: >-
      Die Teilchen müssen in einem leitfähigen Elektrolyten verteilt und kleiner als die Messöffnung
      sein.
    limits: >-
      Passieren zwei Teilchen gleichzeitig die Öffnung, werden sie als ein großes gezählt,
      und sehr große Teilchen verstopfen die Öffnung.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Coulter counter
    description: >-
      Particles suspended in an electrolyte are drawn through a tiny aperture across which
      two electrodes drive a constant current. As each particle passes, it displaces conducting
      liquid and briefly increases the electrical resistance; the number of pulses gives the
      particle count and their height the particle volume.
    example: >-
      Blood cell counting in haematology analysers, particle size analysis of powders and
      emulsions, cell counting in bioreactors
    conditions: >-
      The particles must be dispersed in a conductive electrolyte and be smaller than the
      aperture.
    limits: >-
      If two particles pass the aperture at the same time they are counted as one large particle,
      and very large particles block the aperture.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
