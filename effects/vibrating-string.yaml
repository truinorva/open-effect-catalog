text:
  de:
    name: Saitenschwingung
    description: >-
      Eine zwischen zwei Punkten gespannte Saite schwingt in stehenden Wellen mit einer Grundfrequenz
      und deren ganzzahligen Vielfachen. Die Grundfrequenz steigt mit der Wurzel aus der Spannkraft
      und sinkt mit der Länge und der Masse je Längeneinheit. Deshalb lässt sich die Tonhöhe
      über die Spannung einstellen, und umgekehrt verrät die gemessene Frequenz die Kraft
      in der Saite.
    example: >-
      Saiteninstrumente, Schwingsaiten-Dehnungsaufnehmer in Staudämmen und Tunneln, Schwingsaiten-Piezometer
      für Porenwasserdruck, Schwingsaiten-Kraftaufnehmer
    conditions: An beiden Enden fest eingespannte, vorgespannte Saite.
    limits: >-
      Temperaturänderungen verändern die Spannung über die Wärmedehnung und müssen ausgeglichen
      werden.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Vibrating string
    description: >-
      A string stretched between two points vibrates in standing waves at a fundamental frequency
      and its integer multiples. The fundamental frequency rises with the square root of the
      tension and falls with the length and the mass per unit length. This is why the pitch
      can be set via the tension and, conversely, the measured frequency reveals the force
      in the string.
    example: >-
      String instruments, vibrating-wire strain gauges in dams and tunnels, vibrating-wire
      piezometers for pore water pressure, vibrating-wire load cells
    conditions: String fixed at both ends and under tension.
    limits: >-
      Temperature changes alter the tension through thermal expansion and must be compensated.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
