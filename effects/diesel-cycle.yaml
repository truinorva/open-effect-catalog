text:
  de:
    name: Diesel-Kreisprozess
    description: >-
      Der Diesel-Kreisprozess ist das idealisierte Modell des Dieselmotors: Luft wird adiabat
      so stark verdichtet, dass sie sich über die Selbstzündungstemperatur des Kraftstoffs
      erhitzt. Der eingespritzte Kraftstoff entzündet sich von selbst und verbrennt im Idealfall
      bei konstantem Druck; danach expandiert das Gas unter Arbeitsabgabe und wird bei konstantem
      Volumen abgekühlt.
    example: >-
      Dieselmotoren in Lastwagen, Schiffen, Lokomotiven, Baumaschinen und Notstromaggregaten
    conditions: >-
      Ein hohes Verdichtungsverhältnis von etwa 14:1 bis 22:1 und ein zündwilliger Kraftstoff.
    limits: >-
      Bei gleichem Verdichtungsverhältnis ist der Wirkungsgrad geringer als beim Otto-Prozess,
      und reale Motoren weichen durch Wärmeverluste und endliche Verbrennungsgeschwindigkeit
      vom Idealprozess ab.
    sideEffects: Stickoxid- und Rußemissionen sowie Verbrennungsgeräusch (Nageln).
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Diesel cycle
    description: >-
      The Diesel cycle is the idealised model of the diesel engine: air is compressed adiabatically
      so strongly that it heats up above the auto-ignition temperature of the fuel. The injected
      fuel ignites by itself and, ideally, burns at constant pressure; the gas then expands
      while doing work and is cooled at constant volume.
    example: >-
      Diesel engines in trucks, ships, locomotives, construction machinery and emergency generators
    conditions: >-
      A high compression ratio of about 14:1 to 22:1 and a fuel that ignites readily.
    limits: >-
      At the same compression ratio the efficiency is lower than that of the Otto cycle, and
      real engines deviate from the ideal cycle through heat losses and finite combustion
      speed.
    sideEffects: Nitrogen oxide and soot emissions, and combustion noise (diesel knock).
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
