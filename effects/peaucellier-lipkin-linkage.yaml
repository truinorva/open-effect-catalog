text:
  de:
    name: Inversor von Peaucellier-Lipkin
    description: >-
      Der Inversor von Peaucellier und Lipkin ist ein ebenes Gelenkgetriebe, das eine Kreisbewegung
      exakt in eine geradlinige Bewegung umsetzt. Ein Rhombus aus vier gleich langen Stäben
      und zwei längere, an einem festen Punkt gelagerte Stäbe halten zwei Gelenkpunkte stets
      in inverser Lage zueinander bezüglich eines Kreises. Führt ein weiterer Stab den einen
      Punkt auf einem Kreis durch das Inversionszentrum, bewegt sich der andere auf einer
      Geraden, ganz ohne Führungsschiene.
    example: >-
      Lehrmodelle der Getriebelehre, Geradführungen ohne Gleitschiene, Zeichengeräte für die
      Kreisinversion
    conditions: Genaue Stablängen und spielarme Gelenke.
    limits: >-
      Gelenkspiel und Fertigungstoleranzen führen zu Abweichungen von der idealen Geraden,
      und der Mechanismus braucht viele Glieder und Bauraum.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Peaucellier–Lipkin linkage
    description: >-
      The Peaucellier–Lipkin linkage is a planar linkage that converts circular motion exactly
      into straight-line motion. A rhombus of four equal bars and two longer bars mounted
      on a fixed pivot keep two joints always in inverse positions with respect to a circle.
      If an additional bar guides one of these joints along a circle passing through the centre
      of inversion, the other moves along a straight line, without any guide rail.
    example: >-
      Teaching models in kinematics, straight-line guides without slide rails, drawing instruments
      for circle inversion
    conditions: Precise bar lengths and low-play joints.
    limits: >-
      Joint play and manufacturing tolerances cause deviations from the ideal straight line,
      and the mechanism needs many links and space.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
