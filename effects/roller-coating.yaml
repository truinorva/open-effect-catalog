text:
  de:
    name: Walzenbeschichtung (Walzenauftrag)
    description: >-
      Bei der Walzenbeschichtung nimmt eine rotierende Walze flüssigen Lack, Klebstoff oder
      eine andere Beschichtungsmasse auf, die durch einen Spalt oder eine Rakel auf eine definierte
      Schichtdicke abgestreift wird, und überträgt sie auf ein vorbeilaufendes Band oder eine
      Platte. Im Rolle-zu-Rolle-Verfahren laufen Folien, Papier oder Metallbänder dabei kontinuierlich
      von einer Abwickel- zu einer Aufwickelrolle, sodass große Flächen schnell und gleichmäßig
      beschichtet werden.
    example: >-
      Bandbeschichtung von Stahl- und Aluminiumblech (Coil Coating), Beschichtung von Papier
      und Etiketten, Kaschieren von Folien, Beschichtung von Batterieelektroden, gedruckte
      Elektronik und Dünnschicht-Solarzellen
    conditions: >-
      Eine fließfähige Beschichtungsmasse passender Viskosität und ein ebenes, band- oder
      plattenförmiges Substrat.
    limits: >-
      Das Verfahren eignet sich für ebene Flächen; dreidimensional geformte Teile lassen sich
      so nicht beschichten.
    sideEffects: >-
      Bei ungünstiger Viskosität oder Geschwindigkeit entstehen Streifen und Rillenmuster,
      und beim Trocknen werden Lösemittel freigesetzt.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Roller coating
    description: >-
      In roller coating, a rotating roll picks up liquid paint, adhesive or another coating
      material, which is metered to a defined thickness by a gap or doctor blade, and transfers
      it to a passing strip or panel. In roll-to-roll processing, films, paper or metal strip
      run continuously from an unwind to a rewind roll, so that large areas are coated quickly
      and evenly.
    example: >-
      Coil coating of steel and aluminium strip, coating of paper and labels, film lamination,
      coating of battery electrodes, printed electronics and thin-film solar cells
    conditions: >-
      A flowable coating material of suitable viscosity and a flat strip or panel substrate.
    limits: >-
      The process suits flat surfaces; three-dimensionally shaped parts cannot be coated this
      way.
    sideEffects: >-
      Unfavourable viscosity or speed produces streaks and ribbing patterns, and solvents
      are released during drying.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
