text:
  de:
    name: Verdichter (Kompressor)
    description: >-
      Ein Verdichter verringert das Volumen eines Gases und erhöht so seinen Druck, entweder
      indem er es in einem Arbeitsraum einschließt und diesen verkleinert (Kolben-, Schrauben-,
      Scrollverdichter) oder indem er es in einem Laufrad beschleunigt und anschließend verzögert
      (Radial-, Axialverdichter). Weil die Verdichtungsarbeit das Gas erwärmt, wird bei hohen
      Druckverhältnissen mehrstufig mit Zwischenkühlung verdichtet.
    example: >-
      Druckluftversorgung, Kältemittelverdichter in Kühlschrank und Wärmepumpe, Turbolader,
      Verdichter in Gasturbinen, Erdgasverdichter an Pipelines
    conditions: ''
    limits: >-
      Bei Strömungsverdichtern begrenzt die Pumpgrenze den nutzbaren Betriebsbereich.
    sideEffects: >-
      Erwärmung des Gases, Lärm und bei ölgeschmierten Maschinen Ölnebel in der Druckluft.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Gas compressor
    description: >-
      A compressor reduces the volume of a gas and so raises its pressure, either by enclosing
      it in a working chamber that is then made smaller (piston, screw and scroll compressors)
      or by accelerating it in an impeller and then slowing it down (centrifugal and axial
      compressors). Since compression work heats the gas, high pressure ratios are achieved
      in several stages with intercooling.
    example: >-
      Compressed-air supply, refrigerant compressors in refrigerators and heat pumps, turbochargers,
      gas turbine compressors, natural gas pipeline compressors
    conditions: ''
    limits: >-
      In dynamic compressors, the surge limit restricts the usable operating range.
    sideEffects: >-
      Heating of the gas, noise and, in oil-lubricated machines, oil mist in the compressed
      air.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
