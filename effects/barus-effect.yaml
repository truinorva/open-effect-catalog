text:
  de:
    name: Strangaufweitung (Barus-Effekt)
    description: >-
      Tritt eine viskoelastische Schmelze oder Lösung aus einer Düse, wird der Strang dicker
      als die Düsenöffnung. In der Düse werden die langen Polymerketten gestreckt und speichern
      elastische Energie; hinter dem Austritt fällt der Zwang weg, die Ketten knäueln sich
      wieder zusammen, und der Strang zieht sich in Längsrichtung zusammen und weitet sich
      quer auf.
    example: >-
      Auslegung von Extrusionsdüsen für Profile, Rohre und Kabelummantelungen, Blasformen,
      Faserspinnen, Prüfung von Polymerschmelzen
    conditions: >-
      Eine viskoelastische Flüssigkeit, typischerweise eine Polymerschmelze oder -lösung mit
      langen Molekülketten.
    limits: >-
      Längere Düsen und geringere Austrittsgeschwindigkeiten geben den Ketten Zeit zur Entspannung
      und verringern die Aufweitung.
    sideEffects: >-
      Bei ungleichmäßigen Profilen weitet sich der Strang ungleichmäßig auf, sodass die Düsenform
      von der gewünschten Endkontur abweichen muss.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Die swell (Barus effect)
    description: >-
      When a viscoelastic melt or solution leaves a die, the extrudate becomes thicker than
      the die opening. Inside the die the long polymer chains are stretched and store elastic
      energy; once outside, the constraint is gone, the chains coil up again, and the strand
      contracts lengthwise and swells crosswise.
    example: >-
      Design of extrusion dies for profiles, pipes and cable sheathing, blow moulding, fibre
      spinning, testing of polymer melts
    conditions: >-
      A viscoelastic liquid, typically a polymer melt or solution with long molecular chains.
    limits: >-
      Longer dies and lower exit speeds give the chains time to relax and reduce the swell.
    sideEffects: >-
      With irregular profiles the extrudate swells unevenly, so the die shape has to differ
      from the desired final contour.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
