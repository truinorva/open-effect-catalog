text:
  de:
    name: Behälter (physischer Einschluss)
    description: >-
      Ein Behälter umschließt einen Stoff mit festen Wänden und hält ihn so an einem Ort,
      getrennt von der Umgebung. Je nach Wandwerkstoff, Dichtungen und Druckfestigkeit hält
      er Flüssigkeiten, Schüttgüter oder Gase zurück, schützt den Inhalt vor Luft, Feuchte,
      Licht oder Verschmutzung und die Umgebung vor gefährlichen Stoffen. Mehrere ineinanderliegende
      Barrieren erhöhen die Sicherheit, wie bei Laboren hoher Schutzstufe oder dem Sicherheitsbehälter
      eines Kernreaktors.
    example: >-
      Tanks, Flaschen und Silos, Druckgasbehälter, Konservendosen, Handschuhkästen, Sicherheitswerkbänke
      und Labore der Schutzstufen, Sicherheitsbehälter von Kernreaktoren
    conditions: >-
      Ein Wandwerkstoff, der gegenüber dem Inhalt beständig und für ihn ausreichend dicht
      ist.
    limits: >-
      Druck, Temperatur und chemischer Angriff begrenzen, was ein Behälter dauerhaft sicher
      aufnehmen kann.
    sideEffects: >-
      Stoffe aus der Behälterwand können in den Inhalt übergehen, und eingeschlossene Gase
      können bei Erwärmung gefährlichen Überdruck aufbauen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Container (physical containment)
    description: >-
      A container encloses a substance with solid walls and so keeps it in one place, separated
      from its surroundings. Depending on wall material, seals and pressure rating, it retains
      liquids, bulk solids or gases, protects the contents from air, moisture, light or contamination,
      and protects the surroundings from hazardous substances. Several nested barriers increase
      safety, as in high-containment laboratories or the containment building of a nuclear
      reactor.
    example: >-
      Tanks, bottles and silos, gas cylinders, food cans, glove boxes, biosafety cabinets
      and containment laboratories, reactor containment
    conditions: >-
      A wall material that resists the contents and is sufficiently tight for them.
    limits: >-
      Pressure, temperature and chemical attack limit what a container can hold safely over
      time.
    sideEffects: >-
      Substances from the container wall can migrate into the contents, and enclosed gases
      can build up dangerous overpressure when heated.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
