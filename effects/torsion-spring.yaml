text:
  de:
    name: Torsionsfeder und Drehpendel
    description: >-
      Eine Torsionsfeder, etwa ein verdrillter Stab, ein Draht oder eine Schenkelfeder, erzeugt
      beim Verdrehen ein rückstellendes Drehmoment, das im elastischen Bereich proportional
      zum Drehwinkel ist. Sie speichert so Energie und hält Teile in einer Lage; zusammen
      mit einer trägen Masse bildet sie einen Drehschwinger, dessen Periode nur von Trägheitsmoment
      und Federsteifigkeit abhängt. Ein sehr dünner Torsionsfaden spricht auf winzige Drehmomente
      an und macht kleinste Kräfte messbar.
    example: >-
      Wäscheklammer, Mausefalle, Drehstabfederung in Fahrzeugen, Unruh mit Spiralfeder in
      mechanischen Uhren, Drehpendeluhr, Torsionswaage von Coulomb und Cavendish
    conditions: Belastung im elastischen Bereich des Werkstoffs.
    limits: >-
      Bei zu großem Drehwinkel verformt sich die Feder bleibend oder bricht durch Ermüdung.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Torsion spring and torsion pendulum
    description: >-
      A torsion spring, such as a twisted bar, a wire or a leg spring, produces a restoring
      torque when twisted that is proportional to the angle of twist within the elastic range.
      It thus stores energy and holds parts in position; combined with an inertial mass it
      forms a torsional oscillator whose period depends only on the moment of inertia and
      the spring stiffness. A very thin torsion fibre responds to tiny torques and makes the
      smallest forces measurable.
    example: >-
      Clothes peg, mousetrap, torsion bar suspension in vehicles, balance wheel and hairspring
      in mechanical watches, torsion pendulum clocks, Coulomb's and Cavendish's torsion balances
    conditions: Loading within the elastic range of the material.
    limits: >-
      If the angle of twist is too large, the spring deforms permanently or fails by fatigue.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
