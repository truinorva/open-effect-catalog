text:
  de:
    name: Galvanisieren (galvanische Abscheidung)
    description: >-
      Das zu beschichtende Werkstück taucht als Kathode in eine Lösung mit Metallionen; fließt
      Gleichstrom, werden die Ionen an seiner Oberfläche zu Metall reduziert und bilden eine
      haftende Schicht. Die Anode besteht meist aus dem Beschichtungsmetall und löst sich
      dabei auf, so dass die Ionenkonzentration im Bad erhalten bleibt. Schichtdicke und -eigenschaften
      werden über Stromdichte, Zeit und Badzusammensetzung eingestellt.
    example: >-
      Verzinken, Verchromen, Vergolden von Steckkontakten, Kupferleiterbahnen auf Leiterplatten,
      Galvanoformung
    conditions: >-
      Elektrisch leitfähige oder leitfähig gemachte Oberfläche; saubere, entfettete Werkstücke.
    limits: >-
      An Kanten wächst die Schicht dicker, in Vertiefungen dünner, weil sich die Stromdichte
      ungleich verteilt.
    sideEffects: >-
      Bei manchen Verfahren dringt Wasserstoff in den Grundwerkstoff ein und kann hochfeste
      Stähle verspröden; viele Bäder enthalten giftige Stoffe wie Cyanide oder sechswertiges
      Chrom.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electroplating (electrodeposition)
    description: >-
      The workpiece to be coated is immersed as the cathode in a solution of metal ions; when
      direct current flows, the ions are reduced to metal on its surface and form an adherent
      layer. The anode usually consists of the coating metal and dissolves in the process,
      keeping the ion concentration in the bath constant. Layer thickness and properties are
      set via current density, time and bath composition.
    example: >-
      Zinc plating, chrome plating, gold plating of connector contacts, copper tracks on circuit
      boards, electroforming
    conditions: >-
      Electrically conductive surface, or one made conductive; clean, degreased workpieces.
    limits: >-
      Layers grow thicker at edges and thinner in recesses because the current density is
      unevenly distributed.
    sideEffects: >-
      In some processes hydrogen enters the base metal and can embrittle high-strength steels;
      many baths contain toxic substances such as cyanides or hexavalent chromium.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
