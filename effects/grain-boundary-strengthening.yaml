text:
  de:
    name: Feinkornhärtung (Korngrenzenverfestigung)
    description: >-
      Korngrenzen behindern die Bewegung von Versetzungen, weil die Gleitebenen von Korn zu
      Korn ihre Richtung ändern; die Versetzungen stauen sich dort auf. Je feiner das Korn,
      desto mehr Grenzen gibt es und desto höher liegt die Streckgrenze, näherungsweise umgekehrt
      proportional zur Wurzel des Korndurchmessers (Hall-Petch-Beziehung). Anders als die
      meisten Verfestigungsarten verbessert feines Korn zugleich die Zähigkeit.
    example: >-
      Thermomechanisch gewalzte Feinkornbaustähle, mikrolegierte Stähle mit Niob, Titan oder
      Vanadium, Kornfeinung von Aluminiumguss mit Titan-Bor-Vorlegierungen
    conditions: >-
      Polykristalliner Werkstoff; Kornwachstum muss durch Prozessführung oder Legierungszusätze
      verhindert werden.
    limits: >-
      Bei Korngrößen im Bereich weniger zehn Nanometer kehrt sich der Effekt um, und das Material
      wird wieder weicher.
    sideEffects: >-
      Feines Korn verringert die Kriechfestigkeit bei hohen Temperaturen, weil die Korngrenzen
      dann abgleiten können.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Grain boundary strengthening
    description: >-
      Grain boundaries hinder the movement of dislocations because the slip planes change
      direction from grain to grain; the dislocations pile up there. The finer the grain,
      the more boundaries there are and the higher the yield strength, roughly in inverse
      proportion to the square root of the grain diameter (Hall-Petch relationship). Unlike
      most strengthening mechanisms, a fine grain also improves toughness.
    example: >-
      Thermomechanically rolled fine-grained structural steels, microalloyed steels with niobium,
      titanium or vanadium, grain refinement of aluminium castings with titanium-boron master
      alloys
    conditions: >-
      Polycrystalline material; grain growth must be prevented by process control or alloying
      additions.
    limits: >-
      At grain sizes of a few tens of nanometres the effect reverses and the material becomes
      softer again.
    sideEffects: >-
      Fine grain reduces creep resistance at high temperatures, because the grain boundaries
      can then slide.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
