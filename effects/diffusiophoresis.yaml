text:
  de:
    name: Diffusiophorese
    description: >-
      Kolloidale Teilchen in einer Flüssigkeit oder einem Gas bewegen sich spontan entlang
      des Konzentrationsgefälles eines gelösten Stoffes. In Elektrolytlösungen entsteht der
      Antrieb, weil ein Salzgradient an der geladenen Teilchenoberfläche ein elektrisches
      Feld und eine Grenzflächenströmung erzeugt; bei neutralen gelösten Stoffen wirkt der
      ungleiche osmotische Druck in der Grenzschicht. Je nach Oberflächenladung wandern die
      Teilchen zur höheren oder zur niedrigeren Konzentration.
    example: >-
      Membranlose Wasseraufbereitung mit gelöstem CO₂ (Forschung), Partikeltransport und -fokussierung
      in der Mikrofluidik, Abscheidung von Aerosolteilchen an Flächen, an denen Dampf kondensiert
    conditions: >-
      Ein Konzentrationsgefälle eines gelösten Stoffes über kurze Abstände und kolloidale
      Teilchen.
    limits: >-
      Die Geschwindigkeiten liegen meist nur bei Mikrometern pro Sekunde, und das Gefälle
      muss aufrechterhalten werden.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Diffusiophoresis
    description: >-
      Colloidal particles in a liquid or gas move spontaneously along the concentration gradient
      of a dissolved substance. In electrolyte solutions the drive arises because a salt gradient
      creates an electric field and an interfacial flow at the charged particle surface; with
      neutral solutes, the uneven osmotic pressure in the boundary layer acts. Depending on
      their surface charge, the particles migrate towards higher or lower concentration.
    example: >-
      Membrane-free water treatment with dissolved CO₂ (research), particle transport and
      focusing in microfluidics, deposition of aerosol particles on surfaces where vapour
      condenses
    conditions: >-
      A concentration gradient of a dissolved substance over short distances, and colloidal
      particles.
    limits: >-
      Speeds are usually only micrometres per second, and the gradient has to be maintained.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
