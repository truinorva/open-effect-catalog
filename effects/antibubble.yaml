text:
  de:
    name: Antiblase (Antibläschen)
    description: >-
      Eine Antiblase ist ein Flüssigkeitstropfen, der von einem dünnen Gasfilm umhüllt in
      einer Flüssigkeit schwebt, also das Gegenstück zur Seifenblase. Sie entsteht etwa, wenn
      tensidhaltige Flüssigkeit in ein Bad derselben Flüssigkeit tropft oder strömt und dabei
      eine Lufthülle mitreißt; das Tensid stabilisiert den Gasfilm, sodass der innere Tropfen
      eine Zeit lang von der Umgebung getrennt bleibt.
    example: >-
      Physikalische Demonstrationen, Forschung zu Wirkstoffkapseln und Ultraschallkontrastmitteln
    conditions: Eine tensidhaltige Flüssigkeit, damit der Gasfilm nicht sofort reißt.
    limits: >-
      Antiblasen sind kurzlebig und zerfallen meist nach Sekunden bis Minuten, wenn der Gasfilm
      abfließt und reißt.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Antibubble
    description: >-
      An antibubble is a liquid droplet wrapped in a thin film of gas and suspended in a liquid,
      the counterpart of a soap bubble. It forms, for example, when a liquid containing surfactant
      drips or flows into a bath of the same liquid and drags a shell of air along; the surfactant
      stabilises the gas film, so the inner droplet stays separate from its surroundings for
      a while.
    example: >-
      Physics demonstrations, research on drug capsules and ultrasound contrast agents
    conditions: >-
      A liquid containing surfactant, so that the gas film does not rupture at once.
    limits: >-
      Antibubbles are short-lived and usually collapse within seconds to minutes as the gas
      film drains and breaks.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
