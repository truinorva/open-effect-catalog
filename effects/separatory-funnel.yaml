text:
  de:
    name: Scheidetrichter
    description: >-
      Ein Scheidetrichter ist ein birnen- oder kegelförmiges Gefäß mit einem Hahn am unteren
      Ende, in dem sich zwei nicht mischbare Flüssigkeiten nach dem Schütteln wieder nach
      ihrer Dichte schichten. Öffnet man den Hahn, läuft die untere Phase ab, bis die Grenzfläche
      den Auslauf erreicht; so lassen sich die Phasen trennen und gelöste Stoffe von einer
      Phase in die andere ausschütteln.
    example: >-
      Flüssig-flüssig-Extraktion im Labor, Abtrennen von Öl und Wasser, Aufarbeitung organischer
      Synthesen
    conditions: Zwei nicht mischbare Flüssigkeiten mit unterschiedlicher Dichte.
    limits: >-
      Emulsionen trennen sich nur langsam oder gar nicht; das Verfahren ist auf kleine Mengen
      im Chargenbetrieb beschränkt.
    sideEffects: >-
      Beim Schütteln flüchtiger Lösemittel baut sich Überdruck auf, der regelmäßig abgelassen
      werden muss.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Separatory funnel
    description: >-
      A separatory funnel is a pear-shaped or conical vessel with a stopcock at the bottom,
      in which two immiscible liquids settle back into layers by density after shaking. Opening
      the stopcock drains the lower phase until the interface reaches the outlet; this separates
      the phases and allows dissolved substances to be extracted from one phase into the other.
    example: >-
      Liquid-liquid extraction in the laboratory, separating oil and water, work-up of organic
      syntheses
    conditions: Two immiscible liquids of different density.
    limits: >-
      Emulsions separate slowly or not at all; the method is limited to small batches.
    sideEffects: >-
      Shaking volatile solvents builds up pressure that has to be vented regularly.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
