text:
  de:
    name: Wind
    description: >-
      Wind ist bewegte Luft, die von Gebieten höheren zu Gebieten niedrigeren Luftdrucks strömt.
      Die Druckunterschiede entstehen vor allem durch ungleichmäßige Erwärmung durch die Sonne,
      und die Erddrehung lenkt die Strömung großräumig ab. Wind trägt Bewegungsenergie, transportiert
      Wärme, Feuchte und Partikel und kann Körper antreiben.
    example: >-
      Segelschiffe und Drachen, Windkraftanlagen und Windmühlen, Trocknen von Wäsche und Heu,
      Worfeln von Getreide, natürliche Lüftung und Windtürme
    conditions: ''
    limits: Stärke und Richtung schwanken und sind nur begrenzt vorhersagbar.
    sideEffects: Bodenerosion, Verwehungen und Sturmschäden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Wind
    description: >-
      Wind is moving air that flows from areas of higher to areas of lower air pressure. The
      pressure differences arise mainly from uneven heating by the sun, and the Earth's rotation
      deflects the flow on a large scale. Wind carries kinetic energy, transports heat, moisture
      and particles and can propel bodies.
    example: >-
      Sailing ships and kites, wind turbines and windmills, drying laundry and hay, winnowing
      grain, natural ventilation and wind towers
    conditions: ''
    limits: >-
      Strength and direction fluctuate and can be predicted only to a limited extent.
    sideEffects: Soil erosion, drifts and storm damage.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
