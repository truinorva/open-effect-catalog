text:
  de:
    name: Weißsieden (Münzherstellung)
    description: >-
      Münzrohlinge aus einer Silber-Kupfer-Legierung werden geglüht, wobei das Kupfer an der
      Oberfläche zu dunklem Kupferoxid oxidiert. Ein anschließendes Bad in verdünnter Säure
      löst dieses Oxid, sodass eine dünne, silberreiche Oberfläche zurückbleibt. Die Münze
      wirkt dadurch silberner, als es ihrem tatsächlichen Feingehalt entspricht.
    example: >-
      Herstellung historischer Silber- und Billonmünzen, Aufhellen von Silberlegierungen in
      der Silberschmiedetechnik
    conditions: >-
      Eine Silberlegierung mit einem unedleren Legierungsmetall, meist Kupfer, und eine oxidierende
      Glühatmosphäre.
    limits: >-
      Die silberreiche Schicht ist sehr dünn und nutzt sich im Umlauf ab, sodass das kupferreichere
      Metall darunter wieder zum Vorschein kommt.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Blanching (coinage)
    description: >-
      Coin blanks made of a silver-copper alloy are annealed, which oxidises the copper at
      the surface to dark copper oxide. A subsequent bath in dilute acid dissolves this oxide
      and leaves a thin, silver-rich surface. The coin therefore looks more silvery than its
      actual fineness would suggest.
    example: >-
      Production of historical silver and billon coins, whitening of silver alloys in silversmithing
    conditions: >-
      A silver alloy with a less noble alloying metal, usually copper, and an oxidising annealing
      atmosphere.
    limits: >-
      The silver-rich layer is very thin and wears off in circulation, so the copper-richer
      metal underneath shows through again.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
