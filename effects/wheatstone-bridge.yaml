text:
  de:
    name: Wheatstonesche Messbrücke
    description: >-
      Vier Widerstände bilden eine Raute; an die eine Diagonale wird eine Spannung gelegt,
      an der anderen wird die Brückenspannung gemessen. Sie ist null, wenn die Widerstandsverhältnisse
      beider Brückenhälften gleich sind, unabhängig von der Speisespannung; ändert sich ein
      Widerstand nur wenig, entsteht eine dazu nahezu proportionale, gut messbare Spannung.
      So lassen sich sehr kleine Widerstandsänderungen von Sensoren genau erfassen.
    example: >-
      Dehnungsmessstreifen in Wägezellen, Platin-Widerstandsthermometer, Hitzdraht-Anemometer,
      Wärmeleitfähigkeitsdetektoren in Gaschromatographen, Pellistor-Gassensoren
    conditions: Stabile Speisespannung und Widerstände mit gleichem Temperaturverhalten.
    limits: >-
      Widerstände der Zuleitungen und Temperaturdrift verfälschen kleine Signale, wenn sie
      nicht ausgeglichen werden.
    sideEffects: Der Brückenstrom erwärmt die Sensoren selbst.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Wheatstone bridge
    description: >-
      Four resistors form a diamond; a voltage is applied across one diagonal and the bridge
      voltage is measured across the other. It is zero when the resistance ratios of both
      halves are equal, regardless of the supply voltage; if one resistance changes slightly,
      a nearly proportional, easily measurable voltage appears. Very small resistance changes
      of sensors can thus be detected precisely.
    example: >-
      Strain gauges in load cells, platinum resistance thermometers, hot-wire anemometers,
      thermal conductivity detectors in gas chromatographs, pellistor gas sensors
    conditions: Stable supply voltage and resistors with matching temperature behaviour.
    limits: >-
      Lead resistances and temperature drift falsify small signals unless they are compensated.
    sideEffects: The bridge current heats the sensors themselves.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
