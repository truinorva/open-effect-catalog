text:
  de:
    name: Tomografie
    description: >-
      Ein Objekt wird aus vielen Richtungen mit Röntgenstrahlen, Ultraschall, elektrischen
      Feldern oder anderen Sonden durchleuchtet. Aus den Projektionen berechnet ein Rekonstruktionsverfahren
      Schnittbilder oder ein dreidimensionales Modell des Inneren, ohne das Objekt zu zerlegen.
      So werden innere Strukturen, Fehlstellen und Dichteverteilungen sichtbar.
    example: >-
      Medizinische Computertomografie, industrielle CT von Gussteilen, Magnetresonanztomografie,
      Positronen-Emissions-Tomografie, Prozesstomografie von Mehrphasenströmungen, seismische
      Tomografie
    conditions: >-
      Messungen aus vielen Winkeln und ausreichend Rechenleistung für die Rekonstruktion.
    limits: >-
      Auflösung und Messzeit hängen von Objektgröße und Strahlendosis ab; dichte Metalle schwächen
      Röntgenstrahlen stark.
    sideEffects: >-
      Röntgen- und nuklearmedizinische Verfahren belasten mit ionisierender Strahlung; Metallteile
      erzeugen Bildartefakte.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Tomography
    description: >-
      An object is probed from many directions with X-rays, ultrasound, electric fields or
      other probes. A reconstruction algorithm computes cross-sectional images or a three-dimensional
      model of the interior from the projections, without cutting the object apart. Internal
      structures, defects and density distributions thus become visible.
    example: >-
      Medical computed tomography, industrial CT of castings, magnetic resonance imaging,
      positron emission tomography, process tomography of multiphase flows, seismic tomography
    conditions: >-
      Measurements from many angles and enough computing power for reconstruction.
    limits: >-
      Resolution and scan time depend on object size and radiation dose; dense metals strongly
      attenuate X-rays.
    sideEffects: >-
      X-ray and nuclear medicine methods involve ionising radiation; metal parts cause image
      artefacts.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
