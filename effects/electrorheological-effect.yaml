text:
  de:
    name: Elektrorheologischer Effekt
    description: >-
      Elektrorheologische Flüssigkeiten sind Suspensionen feiner, polarisierbarer Partikel
      in einem isolierenden Öl. In einem elektrischen Feld werden die Partikel polarisiert,
      ziehen einander an und bilden Ketten zwischen den Elektroden; innerhalb von Millisekunden
      steigt dadurch die scheinbare Viskosität stark an, bis sich die Flüssigkeit wie ein
      weicher Feststoff mit Fließgrenze verhält. Nach dem Abschalten wird sie ebenso schnell
      wieder flüssig.
    example: >-
      Stellbare Dämpfer, Kupplungen und Bremsen, haptische Bedienelemente, Ventile ohne bewegliche
      Teile in Forschungsanwendungen
    conditions: Feldstärken von einigen Kilovolt pro Millimeter.
    limits: >-
      Die erreichbare Fließspannung ist meist geringer als bei magnetorheologischen Flüssigkeiten,
      und die Partikel neigen zur Sedimentation.
    sideEffects: >-
      Hohe Spannungen erfordern sorgfältige Isolation; Leckströme erwärmen die Flüssigkeit.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electrorheological effect
    description: >-
      Electrorheological fluids are suspensions of fine, polarisable particles in an insulating
      oil. In an electric field the particles become polarised, attract each other and form
      chains between the electrodes; within milliseconds the apparent viscosity rises sharply
      until the fluid behaves like a soft solid with a yield stress. When the field is switched
      off, it becomes fluid again just as quickly.
    example: >-
      Adjustable dampers, clutches and brakes, haptic controls, valves without moving parts
      in research applications
    conditions: Field strengths of a few kilovolts per millimetre.
    limits: >-
      The achievable yield stress is usually lower than with magnetorheological fluids, and
      the particles tend to settle.
    sideEffects: >-
      High voltages require careful insulation; leakage currents heat the fluid.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
