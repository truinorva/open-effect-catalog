text:
  de:
    name: Lidar
    description: >-
      Ein Lidar sendet kurze Laserpulse aus und misst die Zeit, bis das von einem Objekt zurückgestreute
      Licht wieder beim Empfänger ankommt; daraus ergibt sich die Entfernung. Durch schnelles
      Schwenken des Strahls entsteht eine dreidimensionale Punktwolke der Umgebung. Aus Stärke
      und Dopplerverschiebung des Streulichts lassen sich außerdem Aerosole, Wolken und Windgeschwindigkeiten
      in der Atmosphäre bestimmen.
    example: >-
      Umfelderfassung autonomer Fahrzeuge, Geländevermessung aus dem Flugzeug, Windmessung
      für Windkraftanlagen, Aerosol- und Wolkenforschung, Geschwindigkeitsmessung im Straßenverkehr,
      Raumerfassung in Smartphones
    conditions: Sichtverbindung zum Ziel und ein Ziel, das genügend Licht zurückstreut.
    limits: >-
      Nebel, Regen, Schnee und Staub dämpfen und streuen den Strahl und verkürzen die Reichweite;
      spiegelnde oder sehr dunkle Flächen liefern schwache Echos.
    sideEffects: >-
      Leistungsstarke Systeme müssen so ausgelegt werden, dass sie die Augensicherheit nicht
      gefährden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Lidar
    description: >-
      A lidar emits short laser pulses and measures the time until the light scattered back
      by an object returns to the receiver, which gives the distance. Rapidly sweeping the
      beam produces a three-dimensional point cloud of the surroundings. The strength and
      Doppler shift of the scattered light also reveal aerosols, clouds and wind speeds in
      the atmosphere.
    example: >-
      Environment sensing for autonomous vehicles, airborne terrain mapping, wind measurement
      for wind turbines, aerosol and cloud research, traffic speed enforcement, room scanning
      in smartphones
    conditions: >-
      Line of sight to the target and a target that scatters back enough light.
    limits: >-
      Fog, rain, snow and dust attenuate and scatter the beam and shorten the range; reflective
      or very dark surfaces give weak echoes.
    sideEffects: High-power systems must be designed so as not to endanger eye safety.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
