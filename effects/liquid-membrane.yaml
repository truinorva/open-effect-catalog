text:
  de:
    name: Flüssigmembran
    description: >-
      Eine Flüssigmembran ist eine dünne Schicht einer Flüssigkeit, meist eines organischen
      Lösungsmittels, die zwei wässrige Phasen voneinander trennt. Ein darin gelöster Träger
      bindet einen bestimmten Stoff auf der einen Seite, transportiert ihn durch die Membran
      und gibt ihn auf der anderen Seite wieder ab. Ist der Transport an einen Gegenstrom
      anderer Ionen gekoppelt, lässt sich der Stoff sogar gegen sein Konzentrationsgefälle
      anreichern.
    example: >-
      Rückgewinnung von Metallionen wie Zink, Kupfer oder Chrom aus Abwässern, Anreicherung
      von Wertstoffen aus verdünnten Lösungen, Entfernung von Phenol aus Abwasser
    conditions: >-
      Eine mit den wässrigen Phasen nicht mischbare Membranflüssigkeit, ein selektiver Träger
      und als Stütze entweder ein poröser Feststoff oder eine Emulsion.
    limits: >-
      Die Membranflüssigkeit kann allmählich in die wässrigen Phasen ausgewaschen werden,
      was die Langzeitstabilität begrenzt.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Liquid membrane
    description: >-
      A liquid membrane is a thin layer of liquid, usually an organic solvent, that separates
      two aqueous phases. A carrier dissolved in it binds a specific substance on one side,
      transports it through the membrane and releases it on the other side. If the transport
      is coupled to a counterflow of other ions, the substance can even be enriched against
      its concentration gradient.
    example: >-
      Recovery of metal ions such as zinc, copper or chromium from waste water, enrichment
      of valuable substances from dilute solutions, removal of phenol from waste water
    conditions: >-
      A membrane liquid immiscible with the aqueous phases, a selective carrier and, as support,
      either a porous solid or an emulsion.
    limits: >-
      The membrane liquid can gradually be washed out into the aqueous phases, which limits
      long-term stability.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
