text:
  de:
    name: Umlaufrädergetriebe (Planetengetriebe)
    description: >-
      Ein oder mehrere Planetenräder laufen auf einem drehbaren Steg um ein zentrales Sonnenrad
      und kämmen zugleich mit einem innenverzahnten Hohlrad. Je nachdem, welches der drei
      Glieder festgehalten, angetrieben oder abgetrieben wird, ergeben sich unterschiedliche
      Übersetzungen auf gleicher Achse; ist keines festgehalten, verteilt das Getriebe die
      Leistung wie ein Differential auf zwei Wellen. Weil sich die Last auf mehrere Planeten
      verteilt, überträgt es bei kleiner Bauform hohe Drehmomente.
    example: >-
      Automatikgetriebe, Achsdifferential, Getriebe von Windkraftanlagen, Akkuschrauber, Fahrrad-Nabenschaltung,
      Leistungsverzweigung im Hybridantrieb
    conditions: ''
