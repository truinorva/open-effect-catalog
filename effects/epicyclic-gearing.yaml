    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Epicyclic gearing (planetary gear)
    description: >-
      One or more planet gears on a rotating carrier revolve around a central sun gear while
      meshing with an internally toothed ring gear. Depending on which of the three members
      is held, driven or used as output, different ratios are obtained on a common axis; if
      none is held, the gearbox splits power between two shafts like a differential. Because
      the load is shared among several planets, it transmits high torques in a compact design.
    example: >-
      Automatic transmissions, axle differential, wind turbine gearboxes, cordless screwdrivers,
      bicycle hub gears, power split in hybrid drives
    conditions: ''
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
