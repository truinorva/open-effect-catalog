text:
  de:
    name: Schwerelosigkeit
    description: >-
      Im freien Fall, etwa im Erdorbit, im Fallturm oder auf einer Parabelflugbahn, fallen
      alle Teile gleich schnell, sodass zwischen ihnen keine Gewichtskräfte mehr wirken. Damit
      entfallen Auftrieb, Sedimentation, hydrostatischer Druck und die dadurch angetriebene
      Konvektion. Flüssigkeiten und Schmelzen formen sich unter der Oberflächenspannung zu
      Kugeln, und Gemische unterschiedlicher Dichte entmischen sich nicht.
    example: >-
      Kristallzucht und Legierungsexperimente auf der ISS, Fallturm Bremen, Parabelflüge,
      behälterfreies Schmelzen, Verbrennungsforschung mit kugelförmigen Flammen
    conditions: >-
      Freier Fall; im Fallturm wenige Sekunden, beim Parabelflug rund 20 Sekunden, im Orbit
      dauerhaft.
    limits: >-
      Restbeschleunigungen durch Luftwiderstand und Vibrationen lassen sich nicht ganz vermeiden
      (Mikrogravitation).
    sideEffects: >-
      Beim Menschen bauen sich Knochen und Muskeln ab; Flüssigkeiten lassen sich schwer handhaben,
      weil sie nicht von selbst nach unten fließen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Weightlessness
    description: >-
      In free fall, for example in Earth orbit, in a drop tower or on a parabolic flight path,
      all parts fall at the same rate, so no weight forces act between them. Buoyancy, sedimentation,
      hydrostatic pressure and the convection they drive disappear. Liquids and melts form
      spheres under surface tension, and mixtures of different densities do not separate.
    example: >-
      Crystal growth and alloy experiments on the ISS, Bremen drop tower, parabolic flights,
      containerless melting, combustion research with spherical flames
    conditions: >-
      Free fall; a few seconds in a drop tower, around 20 seconds in a parabolic flight, permanently
      in orbit.
    limits: >-
      Residual accelerations due to air drag and vibration cannot be avoided completely (microgravity).
    sideEffects: >-
      In humans, bone and muscle mass decline; liquids are hard to handle because they do
      not flow downwards by themselves.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
