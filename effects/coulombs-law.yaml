text:
  de:
    name: Coulombsches Gesetz
    description: >-
      Zwei elektrische Ladungen ziehen sich an, wenn sie ungleichnamig sind, und stoßen sich
      ab, wenn sie gleichnamig sind. Die Kraft ist proportional zum Produkt der Ladungen und
      nimmt mit dem Quadrat des Abstands ab; ein Dielektrikum zwischen den Ladungen schwächt
      sie um seine Permittivitätszahl. Diese elektrostatische Kraft kann leichte Teilchen
      bewegen, festhalten oder voneinander trennen.
    example: >-
      Elektrostatische Pulverbeschichtung, Toner im Laserdrucker, elektrostatische Spannvorrichtungen
      (Chucks) für Wafer, Elektrofilter, elektrostatische Sortierung von Kunststoffen und
      Mineralen
    conditions: >-
      Elektrisch geladene Körper oder Teilchen in trockener, gut isolierender Umgebung.
    limits: >-
      Die Kraft fällt mit dem Abstand rasch ab und ist für schwere Körper meist zu klein,
      und Feuchtigkeit lässt die Ladungen abfließen.
    sideEffects: Staubanziehung, Funkenentladungen und Zündgefahr bei hoher Aufladung.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Coulomb's law
    description: >-
      Two electric charges attract each other if they are of opposite sign and repel each
      other if they are of the same sign. The force is proportional to the product of the
      charges and falls off with the square of the distance; a dielectric between the charges
      weakens it by its relative permittivity. This electrostatic force can move, hold or
      separate light particles.
    example: >-
      Electrostatic powder coating, toner in laser printers, electrostatic chucks for wafers,
      electrostatic precipitators, electrostatic sorting of plastics and minerals
    conditions: >-
      Electrically charged bodies or particles in dry, well-insulating surroundings.
    limits: >-
      The force drops rapidly with distance and is usually too small for heavy bodies, and
      moisture lets the charges leak away.
    sideEffects: >-
      Dust attraction, spark discharges and a risk of ignition at high charge levels.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
