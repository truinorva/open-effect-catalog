text:
  de:
    name: Reibschweißen
    description: >-
      Zwei Werkstücke werden unter axialem Druck gegeneinander gedreht oder gerieben, bis
      die Reibungswärme die Fügezone teigig macht. Dann wird die Bewegung gestoppt und die
      Teile werden zusammengestaucht; es entsteht eine Verbindung im festen Zustand, ohne
      dass der Werkstoff schmilzt.
    example: >-
      Wellen und Achsen, Bimetallverbindungen aus Aluminium und Kupfer, Bohrgestänge, Ventile
      für Verbrennungsmotoren, Rührreibschweißen von Aluminiumblechen
    conditions: >-
      Beim Rotationsreibschweißen muss mindestens ein Teil rotationssymmetrisch sein; die
      Maschine muss hohe Axialkräfte aufbringen.
    limits: >-
      Die Bauteilgeometrie ist eingeschränkt, und die Teile müssen die Stauchkräfte aushalten.
    sideEffects: >-
      Es bildet sich ein Stauchwulst, der oft abgearbeitet werden muss, und die Teile werden
      kürzer.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Friction welding
    description: >-
      Two workpieces are rotated or rubbed against each other under axial pressure until frictional
      heat makes the joint zone plastic. The motion is then stopped and the parts are forged
      together, producing a solid-state joint without melting the material.
    example: >-
      Shafts and axles, aluminium-copper bimetal joints, drill pipes, engine valves, friction
      stir welding of aluminium sheets
    conditions: >-
      For rotary friction welding at least one part must be rotationally symmetric; the machine
      must apply high axial forces.
    limits: >-
      Part geometry is restricted, and the parts must withstand the forging forces.
    sideEffects: >-
      A flash bead forms that often has to be machined off, and the parts become shorter.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
