text:
  de:
    name: Niedrigschmelzende Legierung (Schmelzlegierung)
    description: >-
      Schmelzlegierungen sind meist eutektische Gemische aus Bismut, Blei, Zinn, Cadmium oder
      Indium, die weit unter dem Schmelzpunkt ihrer Bestandteile schmelzen, manche schon unter
      100 °C. Weil sie bei einer genau festgelegten Temperatur flüssig werden, dienen sie
      als Temperaturauslöser, als leicht wieder entfernbares Füll- oder Spannmittel und als
      Lot.
    example: >-
      Schmelzlote in Sprinklern und Feuerschutztüren, Thermosicherungen, Schmelzpfropfen in
      Dampfkesseln, Einbetten empfindlicher Werkstücke zum Zerspanen, Füllen von Rohren beim
      Biegen, Woodsches Metall
    conditions: ''
    limits: >-
      Die Festigkeit ist gering, und schon bei Raumtemperatur neigen die Legierungen zum Kriechen.
    sideEffects: >-
      Viele klassische Legierungen enthalten giftiges Blei oder Cadmium; bismutreiche Legierungen
      dehnen sich beim Erstarren leicht aus.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Fusible alloy
    description: >-
      Fusible alloys are mostly eutectic mixtures of bismuth, lead, tin, cadmium or indium
      that melt far below the melting points of their constituents, some even below 100 °C.
      Because they become liquid at a precisely defined temperature, they serve as temperature
      triggers, as easily removable fillers or clamping media and as solders.
    example: >-
      Fusible links in sprinklers and fire doors, thermal fuses, fusible plugs in steam boilers,
      embedding delicate workpieces for machining, filling tubes for bending, Wood's metal
    conditions: ''
    limits: Strength is low, and the alloys tend to creep even at room temperature.
    sideEffects: >-
      Many classic alloys contain toxic lead or cadmium; bismuth-rich alloys expand slightly
      when they solidify.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
