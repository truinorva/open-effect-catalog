text:
  de:
    name: Diamantstempelzelle
    description: >-
      Zwei Diamanten mit abgeflachten Spitzen pressen eine winzige Probe in einer Metalldichtung
      zusammen. Weil die Kraft auf eine Fläche von oft nur wenigen Hundertstel Millimetern
      Durchmesser wirkt, entstehen Drücke von über hundert Gigapascal. Da die Diamanten durchsichtig
      sind, lässt sich die Probe während des Versuchs mit Licht, Röntgenstrahlen oder Lasern
      untersuchen und aufheizen.
    example: >-
      Hochdruckforschung an Mineralen des Erdinneren, Synthese neuer Hochdruckphasen, Druckmessung
      über die Rubinfluoreszenz, Untersuchung von Supraleitern unter Druck
    conditions: >-
      Sehr genau ausgerichtete, fehlerfreie Diamanten und eine Dichtung, die die Probe seitlich
      einschließt.
    limits: >-
      Das Probenvolumen ist winzig, und bei extremen Drücken können die Diamanten brechen.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Diamond anvil cell
    description: >-
      Two diamonds with flattened tips press a tiny sample together inside a metal gasket.
      Because the force acts on an area often only a few hundredths of a millimetre across,
      pressures of more than a hundred gigapascals are reached. As the diamonds are transparent,
      the sample can be examined and heated with light, X-rays or lasers during the experiment.
    example: >-
      High-pressure research on minerals of the Earth's interior, synthesis of new high-pressure
      phases, pressure measurement via ruby fluorescence, studies of superconductors under
      pressure
    conditions: >-
      Very precisely aligned, flawless diamonds and a gasket that encloses the sample laterally.
    limits: >-
      The sample volume is tiny, and at extreme pressures the diamonds can break.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
