  en:
    name: Guided-rotor compressor
    description: >-
      The guided-rotor compressor is a rotary positive-displacement compressor: a rotor, positively
      guided by a mechanism, moves eccentrically inside a housing. The chambers between rotor
      and housing wall periodically grow and shrink, so gas is drawn in, compressed and pushed
      out.
