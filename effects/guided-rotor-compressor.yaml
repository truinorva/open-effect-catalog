  de:
    name: Guided-Rotor-Verdichter
    description: >-
      Der Guided-Rotor-Verdichter ist ein rotierender Verdrängerverdichter: Ein Rotor läuft,
      durch einen Mechanismus zwangsgeführt, exzentrisch in einem Gehäuse um. Die Kammern
      zwischen Rotor und Gehäusewand vergrößern und verkleinern sich dabei periodisch, sodass
      Gas angesaugt, verdichtet und ausgeschoben wird.
