text:
  de:
    name: Chromatographie
    description: >-
      Ein Stoffgemisch wird von einer mobilen Phase (Gas oder Flüssigkeit) an einer stationären
      Phase vorbeigetragen, etwa einem Pulver in einer Säule oder einer Schicht auf einer
      Platte. Weil die einzelnen Bestandteile unterschiedlich stark an der stationären Phase
      haften oder sich in ihr lösen, wandern sie verschieden schnell und verlassen die Trennstrecke
      nacheinander. So lassen sich Gemische auftrennen, ihre Bestandteile identifizieren und
      deren Mengen bestimmen.
    example: >-
      Gaschromatographie in der Umweltanalytik, HPLC in der Arzneimittelprüfung, Dünnschichtchromatographie,
      präparative Reinigung von Proteinen und Wirkstoffen, Dopingkontrollen
    conditions: >-
      Bestandteile, die sich in ihrer Wechselwirkung mit der stationären Phase unterscheiden.
    limits: >-
      Präparative Trennungen großer Mengen sind aufwendig und teuer, weil viel Lösungsmittel
      und Trennmaterial nötig ist.
    sideEffects: >-
      Hoher Verbrauch an Lösungsmitteln, die entsorgt oder aufbereitet werden müssen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Chromatography
    description: >-
      A mixture is carried by a mobile phase (gas or liquid) past a stationary phase, such
      as a powder in a column or a layer on a plate. Because the individual components adhere
      to or dissolve in the stationary phase to different degrees, they travel at different
      speeds and leave the separation path one after another. This allows mixtures to be separated,
      their components identified and their amounts determined.
    example: >-
      Gas chromatography in environmental analysis, HPLC in pharmaceutical testing, thin-layer
      chromatography, preparative purification of proteins and active ingredients, doping
      control
    conditions: Components that differ in their interaction with the stationary phase.
    limits: >-
      Preparative separation of large quantities is laborious and expensive because much solvent
      and separation material is needed.
    sideEffects: High consumption of solvents that must be disposed of or recycled.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
