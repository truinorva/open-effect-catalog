text:
  de:
    name: Bergauf-Diffusion (umgekehrte Diffusion)
    description: >-
      Diffusion gleicht gewöhnlich Konzentrationsunterschiede aus, ihre eigentliche Triebkraft
      ist aber ein Gefälle des chemischen Potentials und nicht der Konzentration. Wo die freie
      Enthalpie eines Gemischs über der Zusammensetzung nach unten gekrümmt ist, etwa im Spinodalbereich
      einer Mischungslücke, oder wo ein dritter Stoff das chemische Potential beeinflusst,
      wandern Atome oder Moleküle zum Ort höherer Konzentration, sodass sich Unterschiede
      verstärken und das Gemisch entmischt.
    example: >-
      Spinodale Entmischung von Legierungen und Gläsern, Herstellung poröser Vycor-Gläser
      durch Entmischen und Auslaugen, Darkens Versuch mit Kohlenstoff in siliziumhaltigem
      Stahl, Entmischung von Polymerblends
    conditions: >-
      Ein Gemisch innerhalb einer Mischungslücke, besonders im Spinodalbereich, oder ein Mehrkomponentensystem
      mit starker Wechselwirkung der Komponenten, dazu ausreichende Beweglichkeit der Teilchen,
      etwa bei erhöhter Temperatur.
    limits: >-
      Die Grenzflächenenergie unterdrückt sehr kurzwellige Schwankungen, sodass sich ein charakteristischer
      Strukturabstand einstellt.
    sideEffects: >-
      Ungewollte Entmischung kann Werkstoffe verspröden, etwa bei der 475-°C-Versprödung ferritischer
      Chromstähle.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Reverse diffusion (uphill diffusion)
    description: >-
      Diffusion normally evens out differences in concentration, but its actual driving force
      is a gradient of chemical potential, not of concentration. Where the free energy of
      a mixture curves downwards with composition, as in the spinodal region of a miscibility
      gap, or where a third component affects the chemical potential, atoms or molecules move
      towards higher concentration, so that differences grow and the mixture separates.
    example: >-
      Spinodal decomposition of alloys and glasses, production of porous Vycor glass by phase
      separation and leaching, Darken's experiment with carbon in silicon-containing steel,
      demixing of polymer blends
    conditions: >-
      A mixture inside a miscibility gap, especially in the spinodal region, or a multicomponent
      system with strong interaction between components, plus sufficient mobility of the particles,
      e.g. at elevated temperature.
    limits: >-
      The interfacial gradient energy suppresses very short-wavelength fluctuations, so a
      characteristic structure spacing develops.
    sideEffects: >-
      Unwanted phase separation can embrittle materials, as in the 475 °C embrittlement of
      ferritic chromium steels.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
