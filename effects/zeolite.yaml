text:
  de:
    name: Zeolith
    description: >-
      Zeolithe sind kristalline Alumosilicate, deren Gerüst regelmäßige Poren und Hohlräume
      von Molekülgröße enthält. Sie lagern Wasser und andere kleine Moleküle nach Größe und
      Polarität ein und wirken so als Molekularsiebe, tauschen locker gebundene Kationen gegen
      andere aus und dienen als feste Säurekatalysatoren. Beim Adsorbieren von Wasser setzen
      sie viel Wärme frei; durch Erhitzen oder Druckabsenkung werden sie wieder regeneriert.
    example: >-
      Molekularsiebe zum Trocknen von Gasen und Lösemitteln, Sauerstoffkonzentratoren, Wasserenthärtung
      in Waschmitteln, Crackkatalysatoren in Raffinerien, Trocknung in Geschirrspülern, Adsorptionswärmepumpen,
      Katzenstreu
    conditions: ''
    limits: >-
      Die Aufnahmefähigkeit ist begrenzt; danach muss der Zeolith unter Energieaufwand regeneriert
      werden.
    sideEffects: >-
      Die beim Adsorbieren frei werdende Wärme kann Schüttungen stark erwärmen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Zeolite
    description: >-
      Zeolites are crystalline aluminosilicates whose framework contains regular pores and
      cavities of molecular size. They take up water and other small molecules according to
      size and polarity, acting as molecular sieves, exchange loosely bound cations for others
      and serve as solid acid catalysts. When adsorbing water they release a lot of heat;
      heating or lowering the pressure regenerates them.
    example: >-
      Molecular sieves for drying gases and solvents, oxygen concentrators, water softening
      in detergents, cracking catalysts in refineries, drying in dishwashers, adsorption heat
      pumps, cat litter
    conditions: ''
    limits: >-
      Capacity is limited; afterwards the zeolite must be regenerated, which takes energy.
    sideEffects: The heat released during adsorption can heat packed beds considerably.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
