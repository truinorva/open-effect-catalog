text:
  de:
    name: Flüssigkristalle
    description: >-
      Flüssigkristalle sind Stoffe aus meist stäbchen- oder scheibenförmigen Molekülen, die
      wie eine Flüssigkeit fließen, sich aber wie ein Kristall bevorzugt in eine Richtung
      ausrichten. Dadurch sind sie optisch doppelbrechend und drehen oder verändern die Polarisation
      durchgehenden Lichts. Schon ein schwaches elektrisches Feld kann die Ausrichtung umstellen,
      und bei cholesterischen Flüssigkristallen hängt die reflektierte Farbe stark von der
      Temperatur ab.
    example: >-
      Flüssigkristallbildschirme (LCD), schaltbare Fenster und Brillen, Thermometerstreifen
      und thermochrome Folien, hochfeste Fasern aus flüssigkristallinen Lösungen wie Aramid
    conditions: >-
      Eine Temperatur im flüssigkristallinen Bereich zwischen Schmelz- und Klärpunkt; für
      Anzeigen ausrichtende Grenzflächen und Polarisatoren.
    limits: >-
      Oberhalb des Klärpunkts wird der Stoff zur isotropen Flüssigkeit, in der Kälte werden
      die Schaltzeiten lang.
    sideEffects: >-
      Polarisatoren schlucken mehr als die Hälfte des Lichts, so dass LCDs eine helle Hintergrundbeleuchtung
      brauchen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Liquid crystals
    description: >-
      Liquid crystals are substances made of mostly rod- or disc-shaped molecules that flow
      like a liquid but, like a crystal, align preferentially in one direction. As a result
      they are optically birefringent and rotate or alter the polarisation of light passing
      through. Even a weak electric field can switch the alignment, and in cholesteric liquid
      crystals the reflected colour depends strongly on temperature.
    example: >-
      Liquid crystal displays (LCD), switchable windows and glasses, thermometer strips and
      thermochromic films, high-strength fibres spun from liquid-crystalline solutions such
      as aramid
    conditions: >-
      A temperature within the liquid-crystalline range between melting point and clearing
      point; for displays, aligning surfaces and polarisers.
    limits: >-
      Above the clearing point the substance becomes an isotropic liquid; in the cold, switching
      times become long.
    sideEffects: >-
      Polarisers absorb more than half of the light, so LCDs need bright backlighting.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
