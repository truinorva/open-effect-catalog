text:
  de:
    name: Luftporenbildung im Beton
    description: >-
      Ein Zusatzmittel aus grenzflächenaktiven Stoffen stabilisiert beim Mischen von Beton
      winzige, gleichmäßig verteilte Luftbläschen von meist deutlich unter einem Millimeter
      Durchmesser. Gefriert später Wasser in den Kapillarporen des erhärteten Betons, kann
      es sich in diese Luftporen hinein ausdehnen, sodass der Eisdruck das Gefüge nicht sprengt.
    example: >-
      Straßen- und Brückenbeton, Flugbetriebsflächen, Bauteile unter Tausalzbelastung, Becken
      von Kläranlagen
    conditions: >-
      Viele kleine Poren mit geringem Abstand zueinander; der Luftgehalt muss bei der Herstellung
      überwacht werden.
    limits: >-
      Die Druckfestigkeit sinkt mit steigendem Luftgehalt, grob um einige Prozent je Prozentpunkt
      Luft.
    sideEffects: >-
      Die Luftbläschen machen den Frischbeton zugleich geschmeidiger und verringern das Absondern
      von Wasser an der Oberfläche.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Air entrainment in concrete
    description: >-
      An admixture of surface-active agents stabilises tiny, evenly distributed air bubbles,
      mostly well below one millimetre in diameter, while concrete is mixed. When water later
      freezes in the capillary pores of the hardened concrete, it can expand into these air
      voids, so that the ice pressure does not burst the structure.
    example: >-
      Road and bridge concrete, airfield pavements, members exposed to de-icing salt, sewage
      treatment tanks
    conditions: >-
      Many small voids closely spaced; the air content has to be checked during production.
    limits: >-
      Compressive strength drops as air content rises, roughly by a few percent per percentage
      point of air.
    sideEffects: >-
      The bubbles also make fresh concrete more workable and reduce bleeding of water to the
      surface.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
