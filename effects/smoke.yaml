text:
  de:
    name: Rauch
    description: >-
      Rauch ist ein Aerosol aus feinen festen und flüssigen Teilchen, das bei unvollständiger
      Verbrennung oder beim Verschwelen organischer Stoffe entsteht und von heißen Gasen mitgetragen
      wird. Die Teilchen streuen und schlucken Licht, folgen aber wegen ihrer Kleinheit fast
      jeder Luftbewegung; das macht Strömungen und Brände sichtbar oder messbar. Manche Bestandteile,
      etwa Phenole, wirken zudem antimikrobiell und oxidationshemmend.
    example: >-
      Rauchmelder, Strömungssichtbarmachung im Windkanal, Rauchprobe zur Lecksuche an Lüftungsanlagen,
      Räuchern von Fisch und Fleisch, Nebelwände
    conditions: >-
      Unvollständige Verbrennung oder Verschwelung; für die Sichtbarmachung eine gerichtete
      Beleuchtung.
    limits: ''
    sideEffects: >-
      Rauch enthält giftige und krebserregende Stoffe, behindert die Sicht und verschmutzt
      Oberflächen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Smoke
    description: >-
      Smoke is an aerosol of fine solid and liquid particles that forms during incomplete
      combustion or smouldering of organic material and is carried along by hot gases. The
      particles scatter and absorb light but, being tiny, follow almost every air movement;
      this makes air flows and fires visible or detectable. Some components, such as phenols,
      also have antimicrobial and antioxidant effects.
    example: >-
      Smoke detectors, flow visualisation in wind tunnels, smoke testing for leaks in ventilation
      systems, smoking of fish and meat, smoke screens
    conditions: >-
      Incomplete combustion or smouldering; directed illumination for visualisation.
    limits: ''
    sideEffects: >-
      Smoke contains toxic and carcinogenic substances, obscures vision and soils surfaces.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
