text:
  de:
    name: Rayleigh-Taylor-Instabilität
    description: >-
      Liegt ein schwereres Fluid über einem leichteren oder wird die Grenzfläche vom leichteren
      zum schwereren Fluid hin beschleunigt, ist sie instabil. Kleine Wellen an der Grenzfläche
      wachsen exponentiell, schwere Finger sinken als Strähnen nach unten, leichte Blasen
      steigen auf, und es entsteht eine pilzförmige, zunehmend turbulente Mischzone.
    example: >-
      Wasser, das aus einem umgedrehten Glas fällt, Pilzwolken von Explosionen, Filamente
      im Krebsnebel, Durchmischung in Supernovae, Störung der Implosion in der Trägheitsfusion
    conditions: >-
      Ein Dichteunterschied, bei dem das leichtere Fluid das schwerere gegen Schwerkraft oder
      Beschleunigung trägt oder antreibt.
    limits: >-
      Oberflächenspannung und Viskosität dämpfen kurzwellige Störungen; in einem ausreichend
      engen Gefäß kann die Oberflächenspannung die Schichtung stabil halten.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Rayleigh–Taylor instability
    description: >-
      When a heavier fluid lies above a lighter one, or when the interface is accelerated
      from the lighter towards the heavier fluid, the interface is unstable. Small ripples
      grow exponentially, heavy fingers sink as spikes, light bubbles rise, and a mushroom-shaped,
      increasingly turbulent mixing zone develops.
    example: >-
      Water falling out of an upturned glass, mushroom clouds of explosions, filaments in
      the Crab Nebula, mixing in supernovae, disruption of implosions in inertial confinement
      fusion
    conditions: >-
      A density difference in which the lighter fluid supports or pushes the heavier one against
      gravity or acceleration.
    limits: >-
      Surface tension and viscosity damp short-wavelength disturbances; in a sufficiently
      narrow vessel surface tension can keep the stratification stable.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
