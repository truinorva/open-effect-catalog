text:
  de:
    name: Elektrochromie
    description: >-
      Elektrochrome Materialien ändern ihre Farbe oder Lichtdurchlässigkeit umkehrbar, wenn
      eine kleine elektrische Spannung angelegt wird. Ursache ist eine Redoxreaktion, bei
      der Ionen und Elektronen in das Material ein- oder aus ihm ausgelagert werden und so
      seine Lichtabsorption verändern, etwa wenn Lithium- oder Wasserstoffionen in Wolframoxid
      eingelagert werden. Der eingestellte Zustand bleibt ohne Strom weitgehend erhalten.
    example: >-
      Selbstabblendende Rückspiegel, dimmbare Fenster in Gebäuden und Flugzeugen (z. B. Boeing
      787), elektrochrome Anzeigen
    conditions: >-
      Schichtaufbau aus elektrochromer Schicht, Ionenleiter und Ionenspeicher zwischen transparenten
      Elektroden.
    limits: Das Umschalten großer Flächen dauert Sekunden bis Minuten.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electrochromism
    description: >-
      Electrochromic materials change their colour or light transmission reversibly when a
      small voltage is applied. The cause is a redox reaction in which ions and electrons
      are inserted into or extracted from the material, altering its light absorption, as
      when lithium or hydrogen ions are inserted into tungsten oxide. The state once set is
      largely retained without current.
    example: >-
      Self-dimming rear-view mirrors, dimmable windows in buildings and aircraft (e.g. Boeing
      787), electrochromic displays
    conditions: >-
      Layer stack of electrochromic layer, ion conductor and ion storage layer between transparent
      electrodes.
    limits: Switching large areas takes seconds to minutes.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
