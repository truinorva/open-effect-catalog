text:
  de:
    name: Venturi-Effekt
    description: >-
      Strömt ein Fluid durch eine Verengung, wird es dort schneller und sein statischer Druck
      sinkt. Den Unterdruck an der engsten Stelle kann man nutzen, um ein zweites Fluid anzusaugen
      und beizumischen oder um aus dem Druckunterschied die Durchflussmenge zu bestimmen.
    example: Wasserstrahlpumpe, Vergaser, Venturi-Durchflussmesser, Zerstäuber
    conditions: Strömendes Gas oder Flüssigkeit; Verengung mit stetigem Übergang.
    limits: >-
      Bei Flüssigkeiten kann der Druck an der Engstelle unter den Dampfdruck fallen; dann
      setzt Kavitation ein.
    sideEffects: >-
      Druckverlust in der Leitung, wenn sich die Strömung hinter der Engstelle nicht verlustarm
      wieder erweitert.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Venturi effect
    description: >-
      When a fluid flows through a constriction, it speeds up there and its static pressure
      drops. The low pressure at the narrowest point can be used to draw in and mix a second
      fluid, or to determine the flow rate from the pressure difference.
    example: Water jet pump, carburettor, Venturi flow meter, atomiser
    conditions: Flowing gas or liquid; constriction with a smooth transition.
    limits: >-
      In liquids the pressure at the constriction can fall below the vapour pressure; cavitation
      then sets in.
    sideEffects: >-
      Pressure loss in the line if the flow does not expand again smoothly behind the constriction.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
