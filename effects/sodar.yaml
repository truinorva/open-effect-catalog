text:
  de:
    name: SODAR
    description: >-
      Ein SODAR sendet kurze Schallimpulse senkrecht und schräg in die Atmosphäre und empfängt
      den kleinen Anteil, der an Temperatur- und Windturbulenzen zurückgestreut wird. Aus
      der Laufzeit ergibt sich die Höhe der streuenden Luftschicht, aus der Doppler-Verschiebung
      der Frequenz die Windgeschwindigkeit in Strahlrichtung; mehrere Strahlrichtungen zusammen
      liefern ein Windprofil über die Höhe.
    example: >-
      Windmessung für die Standortplanung von Windenergieanlagen, Überwachung der atmosphärischen
      Grenzschicht an Flughäfen und in der Meteorologie
    conditions: >-
      Turbulente Luft, die den Schall zurückstreut; ruhige Umgebung ohne starke Störgeräusche.
    limits: >-
      Die Reichweite beträgt typischerweise einige hundert Meter; Regen und Umgebungslärm
      verschlechtern die Messung.
    sideEffects: Die hörbaren Schallimpulse können Anwohner stören.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: SODAR (sonic detection and ranging)
    description: >-
      A SODAR emits short sound pulses vertically and at an angle into the atmosphere and
      receives the small fraction scattered back by temperature and wind turbulence. The travel
      time gives the height of the scattering air layer, and the Doppler shift of the frequency
      gives the wind speed along the beam; several beam directions together yield a wind profile
      over height.
    example: >-
      Wind measurement for siting wind turbines, monitoring the atmospheric boundary layer
      at airports and in meteorology
    conditions: >-
      Turbulent air that scatters the sound back; quiet surroundings without strong background
      noise.
    limits: >-
      The range is typically a few hundred metres; rain and ambient noise degrade the measurement.
    sideEffects: The audible sound pulses can disturb residents.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
