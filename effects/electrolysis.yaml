text:
  de:
    name: Elektrolyse
    description: >-
      Gleichstrom, der über zwei Elektroden durch eine ionenleitende Lösung oder Schmelze
      fließt, erzwingt dort Redoxreaktionen, die von selbst nicht ablaufen würden: An der
      Kathode werden Stoffe reduziert, an der Anode oxidiert. So werden Verbindungen in ihre
      Bestandteile zerlegt, etwa Wasser in Wasserstoff und Sauerstoff; nach den Faradayschen
      Gesetzen ist die umgesetzte Stoffmenge proportional zur geflossenen Ladung.
    example: >-
      Wasserelektrolyse zur Wasserstofferzeugung, Chloralkali-Elektrolyse, Aluminiumgewinnung
      aus der Tonerdeschmelze, Kupferraffination
    conditions: >-
      Elektrolyt mit beweglichen Ionen; Spannung oberhalb der Zersetzungsspannung.
    limits: >-
      Überspannungen an den Elektroden erhöhen den Energiebedarf über den theoretischen Wert.
    sideEffects: >-
      Joulesche Wärme im Elektrolyten; je nach Elektrolyt entstehen Nebenprodukte wie Chlor
      oder Knallgas.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electrolysis
    description: >-
      Direct current passed through an ion-conducting solution or melt via two electrodes
      drives redox reactions that would not occur spontaneously: substances are reduced at
      the cathode and oxidised at the anode. Compounds are thus split into their components,
      such as water into hydrogen and oxygen; according to Faraday's laws, the amount converted
      is proportional to the charge passed.
    example: >-
      Water electrolysis for hydrogen production, chlor-alkali process, aluminium smelting
      from alumina melt, copper refining
    conditions: Electrolyte with mobile ions; voltage above the decomposition voltage.
    limits: >-
      Overpotentials at the electrodes raise the energy demand above the theoretical value.
    sideEffects: >-
      Joule heating in the electrolyte; depending on the electrolyte, by-products such as
      chlorine or oxyhydrogen form.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
