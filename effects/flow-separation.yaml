text:
  de:
    name: Strömungsablösung (Grenzschichtablösung)
    description: >-
      Strömt ein Fluid an einer Wand entlang in einen Bereich steigenden Drucks, etwa hinter
      der dicksten Stelle eines Körpers, verliert die wandnahe, durch Reibung verlangsamte
      Grenzschicht ihre Bewegungsenergie. Sie kommt zum Stillstand, kehrt sich um und löst
      sich von der Oberfläche; dahinter entsteht ein wirbelreiches Totwassergebiet mit niedrigem
      Druck, das den Druckwiderstand stark erhöht und an Tragflügeln zum Strömungsabriss führt.
    example: >-
      Bremsklappen und Spoiler an Flugzeugen, Abrisskante am Fahrzeugheck, Strömungsabriss
      am Tragflügel, Wirbelbildung hinter Störkörpern zur besseren Durchmischung
    conditions: >-
      Druckanstieg in Strömungsrichtung, z. B. an stark gekrümmten Konturen oder bei großem
      Anstellwinkel.
    limits: ''
    sideEffects: Auftriebsverlust, Druckverluste, Schwingungen und Lärm.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Flow separation
    description: >-
      When a fluid flows along a wall into a region of rising pressure, such as behind the
      thickest point of a body, the boundary layer next to the wall, slowed by friction, loses
      its kinetic energy. It comes to a halt, reverses and detaches from the surface; behind
      it forms a turbulent wake of low pressure that greatly increases pressure drag and causes
      stall on wings.
    example: >-
      Airbrakes and spoilers on aircraft, sharp trailing edge at the rear of vehicles, stall
      on wings, vortex shedding behind bluff bodies for better mixing
    conditions: >-
      Adverse pressure gradient in the direction of flow, e.g. on strongly curved contours
      or at a high angle of attack.
    limits: ''
    sideEffects: Loss of lift, pressure losses, vibration and noise.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
