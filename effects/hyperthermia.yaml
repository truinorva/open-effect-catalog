text:
  de:
    name: Hyperthermie
    description: >-
      Wird Körpergewebe über die normale Körpertemperatur hinaus erwärmt, werden Zellen zunehmend
      geschädigt, weil sich Proteine entfalten und Reparaturvorgänge gestört werden. In der
      Krebsbehandlung erwärmt man Tumoren gezielt auf etwa 40 bis 44 °C; schlecht durchblutetes
      Tumorgewebe führt die Wärme schlechter ab und wird dadurch empfindlicher für Strahlen-
      und Chemotherapie.
    example: >-
      Regionale Tiefenhyperthermie mit Radiowellen, Ganzkörperhyperthermie, magnetische Hyperthermie
      mit Eisenoxid-Nanopartikeln, hypertherme intraperitoneale Chemotherapie (HIPEC)
    conditions: Genaue Temperaturführung, typischerweise über etwa eine Stunde.
    limits: >-
      Tief liegendes Gewebe lässt sich nur schwer gleichmäßig und genau erwärmen, und seine
      Temperatur ist schwer zu messen.
    sideEffects: >-
      Verbrennungen, Schmerzen und Belastung des Kreislaufs; übermäßige Erwärmung des ganzen
      Körpers ist lebensbedrohlich (Hitzschlag).
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Hyperthermia
    description: >-
      When body tissue is heated above normal body temperature, cells are increasingly damaged
      because proteins unfold and repair processes are disrupted. In cancer treatment, tumours
      are deliberately heated to about 40 to 44 °C; poorly perfused tumour tissue dissipates
      the heat less well and thereby becomes more sensitive to radiotherapy and chemotherapy.
    example: >-
      Regional deep hyperthermia with radio waves, whole-body hyperthermia, magnetic hyperthermia
      with iron oxide nanoparticles, hyperthermic intraperitoneal chemotherapy (HIPEC)
    conditions: Precise temperature control, typically for about an hour.
    limits: >-
      Deep-seated tissue is hard to heat evenly and accurately, and its temperature is hard
      to measure.
    sideEffects: >-
      Burns, pain and strain on the circulation; excessive heating of the whole body is life-threatening
      (heatstroke).
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
