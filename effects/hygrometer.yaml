text:
  de:
    name: Hygrometer
    description: >-
      Ein Hygrometer bestimmt die Luftfeuchte über eine Eigenschaft, die sich mit ihr verändert.
      Haarhygrometer nutzen die Längenänderung von Haaren, Psychrometer die Verdunstungskühlung
      an einem befeuchteten Thermometer, kapazitive Sensoren die Feuchteaufnahme eines dünnen
      Polymerfilms und Taupunktspiegel die Temperatur, bei der sich Tau bildet.
    example: >-
      Wetterstationen, Klimaregelung in Gebäuden und Museen, Lager- und Reiferäume, Trocknungsprozesse,
      Feuchtesensoren in Haushaltsgeräten
    conditions: ''
    limits: >-
      Viele Sensoren driften und müssen regelmäßig kalibriert werden; bei Betauung oder sehr
      hoher Feuchte werden sie ungenau.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Hygrometer
    description: >-
      A hygrometer determines humidity through a property that changes with it. Hair hygrometers
      use the change in length of hairs, psychrometers the evaporative cooling of a wetted
      thermometer, capacitive sensors the moisture uptake of a thin polymer film, and chilled-mirror
      instruments the temperature at which dew forms.
    example: >-
      Weather stations, climate control in buildings and museums, storage and ripening rooms,
      drying processes, humidity sensors in household appliances
    conditions: ''
    limits: >-
      Many sensors drift and must be calibrated regularly; they become inaccurate with condensation
      or very high humidity.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
