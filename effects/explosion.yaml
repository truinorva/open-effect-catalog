text:
  de:
    name: Explosion
    description: >-
      Bei einer Explosion wird in sehr kurzer Zeit eine große Energiemenge frei, meist durch
      eine schnelle chemische Reaktion, die heiße Gase erzeugt, aber auch durch plötzliches
      Verdampfen oder das Bersten eines Druckbehälters. Die Gase dehnen sich schlagartig aus
      und erzeugen eine Druck- oder Stoßwelle, die Gegenstände beschleunigt, verformt oder
      zertrümmert.
    example: >-
      Sprengungen im Bergbau und beim Abbruch, Explosionsumformen, Gasgenerator im Airbag,
      Sprengniete, Treibladungen
    conditions: >-
      Ausreichend schnelle Energiefreisetzung; bei chemischen Explosionen ein Explosivstoff
      oder ein Brennstoff-Oxidator-Gemisch und eine Zündung.
    limits: ''
    sideEffects: >-
      Druckwelle, Splitterflug, Lärm, Hitze und giftige Schwaden gefährden Menschen und Umgebung.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Explosion
    description: >-
      In an explosion, a large amount of energy is released within a very short time, usually
      through a fast chemical reaction that produces hot gases, but also through sudden vaporisation
      or the bursting of a pressure vessel. The gases expand abruptly and generate a pressure
      or shock wave that accelerates, deforms or shatters objects.
    example: >-
      Blasting in mining and demolition, explosive forming, airbag gas generator, explosive
      rivets, propellant charges
    conditions: >-
      Sufficiently fast energy release; for chemical explosions, an explosive or a fuel–oxidiser
      mixture and ignition.
    limits: ''
    sideEffects: >-
      Blast wave, flying fragments, noise, heat and toxic fumes endanger people and surroundings.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
