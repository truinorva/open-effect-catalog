text:
  de:
    name: Galvanometer
    description: >-
      Im Drehspul-Galvanometer fließt der zu messende Strom durch eine drehbar gelagerte Spule
      im Feld eines Dauermagneten. Die Lorentzkraft erzeugt ein Drehmoment, das die Spule
      gegen eine Rückstellfeder auslenkt, bis beide im Gleichgewicht sind; der Ausschlagwinkel
      ist dem Strom proportional.
    example: >-
      Analoge Zeigermessgeräte, Spiegelgalvanometer, Galvo-Scanner für Laserbeschriftung und
      Lasershows, Lichtstrahl-Oszillografen
    conditions: ''
    limits: >-
      Das bewegte System hat Trägheit, sodass schnelle Stromänderungen nur begrenzt verfolgt
      werden; die Lagerung ist stoßempfindlich.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Galvanometer
    description: >-
      In a moving-coil galvanometer, the current to be measured flows through a pivoted coil
      in the field of a permanent magnet. The Lorentz force produces a torque that deflects
      the coil against a restoring spring until both balance; the deflection angle is proportional
      to the current.
    example: >-
      Analogue panel meters, mirror galvanometers, galvo scanners for laser marking and laser
      shows, light-beam oscillographs
    conditions: ''
    limits: >-
      The moving system has inertia, so rapid current changes can only be followed to a limited
      extent; the bearings are sensitive to shock.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
