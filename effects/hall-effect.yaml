text:
  de:
    name: Hall-Effekt
    description: >-
      Fließt Strom durch einen Leiter in einem Magnetfeld, lenkt das Feld die Ladungsträger
      zur Seite ab. Quer zum Strom entsteht dadurch eine Spannung, die proportional zur magnetischen
      Flussdichte ist.
    example: >-
      Magnetfeldsensoren, berührungslose Positions- und Drehzahlgeber, Strommesszangen, bürstenlose
      Motoren
    conditions: >-
      Stromdurchflossener Leiter oder Halbleiter; Magnetfeld senkrecht zum Strom.
    limits: >-
      In Metallen ist die Spannung sehr klein, deshalb nimmt man Halbleiter; das Signal hängt
      von der Temperatur ab.
    sideEffects: Offset und Temperaturdrift müssen ausgeglichen werden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Hall effect
    description: >-
      When current flows through a conductor in a magnetic field, the field deflects the charge
      carriers sideways. This creates a voltage across the current that is proportional to
      the magnetic flux density.
    example: >-
      Magnetic field sensors, contactless position and speed sensors, current clamps, brushless
      motors
    conditions: >-
      Current-carrying conductor or semiconductor; magnetic field perpendicular to the current.
    limits: >-
      In metals the voltage is very small, so semiconductors are used; the signal depends
      on temperature.
    sideEffects: Offset and temperature drift must be compensated.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
