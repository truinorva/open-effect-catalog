text:
  de:
    name: Turbulenz
    description: >-
      Oberhalb einer kritischen Reynolds-Zahl wird eine Strömung instabil und zerfällt in
      unregelmäßige Wirbel aller Größen. Diese Wirbel transportieren Impuls, Wärme und Stoff
      um Größenordnungen schneller als die molekulare Diffusion. Ihre Bewegungsenergie wandert
      zu immer kleineren Wirbeln, bis die Zähigkeit sie in Wärme umwandelt, sodass sich das
      Fluid erwärmt.
    example: >-
      Rührkessel und statische Mischer, Wärmetauscher, Verbrennung in Motoren und Brennern,
      Verteilung von Schadstoffen in der Atmosphäre, Erwärmung von Flüssigkeiten durch kräftiges
      Rühren
    conditions: Hohe Reynolds-Zahl, in Rohren etwa über 2300.
    limits: ''
    sideEffects: Höherer Strömungswiderstand und Druckverlust, Lärm und Schwingungen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Turbulence
    description: >-
      Above a critical Reynolds number, a flow becomes unstable and breaks up into irregular
      eddies of all sizes. These eddies transport momentum, heat and mass orders of magnitude
      faster than molecular diffusion. Their kinetic energy cascades to ever smaller eddies
      until viscosity converts it into heat, so the fluid warms up.
    example: >-
      Stirred tanks and static mixers, heat exchangers, combustion in engines and burners,
      dispersion of pollutants in the atmosphere, heating of liquids by vigorous stirring
    conditions: High Reynolds number, in pipes above about 2300.
    limits: ''
    sideEffects: Higher flow resistance and pressure drop, noise and vibration.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
