text:
  de:
    name: Faserflor (Strich) von Textilien
    description: >-
      Durch Rauen oder Bürsten werden Faserenden aus der Gewebeoberfläche herausgezogen und
      stehen dann als dichte, meist in eine Richtung geneigte Faserschicht ab. Diese Schicht
      hält ruhende Luft fest und dämmt dadurch Wärme, fühlt sich weich an und hält Flüssigkeit
      zwischen den Fasern. Weil die Fasern geneigt sind, ist der Gleitwiderstand mit dem Strich
      klein und gegen den Strich groß, und je nach Blickrichtung wirkt der Stoff heller oder
      dunkler.
    example: >-
      Flanell und Fleece für warme Kleidung, Velours und Loden, Steigfelle für Tourenski,
      Farbroller, Poliertücher
    conditions: >-
      Fasern, die sich aus dem Garn herausarbeiten lassen, und eine Oberfläche, die nicht
      zu stark gepresst oder verfilzt wird.
    limits: >-
      Der Faserflor drückt sich mit der Zeit platt und verliert dann Dämmwirkung und Richtungseffekt.
    sideEffects: Geraute Stoffe neigen zu Knötchenbildung (Pilling) und verlieren Fasern.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Nap (fabric)
    description: >-
      Raising or brushing pulls fibre ends out of the fabric surface so that they stand off
      as a dense fibre layer, usually inclined in one direction. This layer traps still air
      and therefore insulates, feels soft and holds liquid between the fibres. Because the
      fibres are inclined, sliding resistance is low with the nap and high against it, and
      the fabric looks lighter or darker depending on the viewing direction.
    example: >-
      Flannel and fleece for warm clothing, velour and loden, climbing skins for ski touring,
      paint rollers, polishing cloths
    conditions: >-
      Fibres that can be worked out of the yarn and a surface that is not pressed or felted
      too much.
    limits: >-
      Over time the nap is flattened and loses its insulation and directional effect.
    sideEffects: Napped fabrics tend to pill and shed fibres.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
