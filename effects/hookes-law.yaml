text:
  de:
    name: Hookesches Gesetz
    description: >-
      Solange ein Körper elastisch verformt wird, ist seine Verformung proportional zur einwirkenden
      Kraft; für eine Feder gilt F = k · x mit der Federkonstante k. Wird die Kraft weggenommen,
      kehrt der Körper vollständig in seine Ausgangsform zurück, sodass sich Kräfte über Wege
      oder Dehnungen messen und elastische Energie speichern lassen.
    example: >-
      Federwaagen, Kraftmessdosen mit Dehnungsmessstreifen, Federn in Uhren und Fahrzeugfederungen,
      Drehmomentschlüssel, Torsionswaagen
    conditions: Verformung unterhalb der Elastizitätsgrenze.
    limits: >-
      Oberhalb der Proportionalitätsgrenze wird der Zusammenhang nichtlinear, und es bleiben
      Verformungen zurück; Gummi und viele Kunststoffe folgen dem Gesetz nur näherungsweise.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Hooke's law
    description: >-
      As long as a body is deformed elastically, its deformation is proportional to the applied
      force; for a spring, F = k · x with spring constant k. When the force is removed, the
      body returns completely to its original shape, so forces can be measured via displacements
      or strains and elastic energy can be stored.
    example: >-
      Spring balances, load cells with strain gauges, springs in clocks and vehicle suspensions,
      torque wrenches, torsion balances
    conditions: Deformation below the elastic limit.
    limits: >-
      Beyond the proportional limit the relationship becomes non-linear and permanent deformation
      remains; rubber and many plastics follow the law only approximately.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
