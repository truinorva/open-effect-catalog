text:
  de:
    name: Segnersches Wasserrad
    description: >-
      Beim Segnerschen Wasserrad strömt Wasser aus einem senkrechten Behälter in waagerechte,
      drehbar gelagerte Rohrarme und tritt an deren Enden seitlich, also tangential, aus.
      Der Rückstoß der austretenden Strahlen erzeugt ein Drehmoment, das die Arme entgegen
      der Strahlrichtung in Drehung versetzt; das Gerät gilt als frühe Reaktionsturbine aus
      dem 18. Jahrhundert.
    example: >-
      Rasensprenger mit rotierenden Armen, Drehsprenger in Tropfkörper-Kläranlagen, historische
      Antriebe für Mühlen und Sägen, Lehrmodell für das Rückstoßprinzip
    conditions: >-
      Ein Wasserzulauf mit ausreichender Fallhöhe oder ausreichendem Druck und reibungsarm
      gelagerte Rohrarme.
    limits: >-
      Der Wirkungsgrad ist gering, weil das Wasser mit hoher Restgeschwindigkeit austritt;
      zur Energieerzeugung haben moderne Turbinen das Prinzip abgelöst.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Segner wheel
    description: >-
      In the Segner wheel, water flows from a vertical vessel into horizontal, rotatable pipe
      arms and leaves sideways, i.e. tangentially, at their ends. The recoil of the emerging
      jets produces a torque that turns the arms opposite to the jet direction; the device
      is regarded as an early reaction turbine from the 18th century.
    example: >-
      Lawn sprinklers with rotating arms, rotary distributors in trickling filter plants,
      historic drives for mills and saws, teaching model for the reaction principle
    conditions: >-
      A water supply with sufficient head or pressure and pipe arms on low-friction bearings.
    limits: >-
      Efficiency is low because the water leaves with high residual velocity; for power generation
      modern turbines have replaced the principle.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
