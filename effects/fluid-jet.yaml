text:
  de:
    name: Fluidstrahl (Freistrahl)
    description: >-
      Tritt ein Fluid mit hoher Geschwindigkeit aus einer Düse in eine ruhende Umgebung aus,
      bildet es einen gebündelten Strahl, der seinen Impuls über eine gewisse Strecke weiterträgt.
      An seinem Rand reißt der Strahl durch Scherung umgebendes Fluid mit, wird dadurch breiter
      und langsamer und vermischt sich mit der Umgebung. Der austretende Impuls erzeugt zugleich
      eine Rückstoßkraft auf die Düse.
    example: >-
      Strahltriebwerk und Raketenantrieb, Wasserstrahlschneiden, Hochdruckreiniger, Luftmesser
      zum Abblasen, Strahlpumpe, Gasbrenner
    conditions: >-
      Eine Druckdifferenz über einer Düse oder Öffnung, die das Fluid beschleunigt.
    limits: >-
      Mit zunehmender Entfernung von der Düse nehmen Geschwindigkeit und Bündelung ab; Flüssigkeitsstrahlen
      zerfallen zudem nach einer gewissen Länge in Tropfen.
    sideEffects: >-
      Schnelle Gasstrahlen erzeugen starken Lärm; Strahlen mit Feststoffanteil tragen Düsen
      und angeströmte Flächen ab.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Fluid jet
    description: >-
      When a fluid leaves a nozzle at high speed into a still surrounding, it forms a concentrated
      jet that carries its momentum over a certain distance. At its edges, shear makes the
      jet drag surrounding fluid along, so it widens, slows down and mixes with its surroundings.
      The momentum leaving the nozzle also produces a reaction force on it.
    example: >-
      Jet engine and rocket propulsion, water-jet cutting, pressure washer, air knife for
      blowing off, jet pump, gas burner
    conditions: >-
      A pressure difference across a nozzle or orifice that accelerates the fluid.
    limits: >-
      Speed and focus decrease with distance from the nozzle; liquid jets also break up into
      drops after a certain length.
    sideEffects: >-
      Fast gas jets cause strong noise; jets carrying solids wear nozzles and the surfaces
      they hit.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
