text:
  de:
    name: Kugel (Ball)
    description: >-
      Eine Kugel hat bei gegebenem Volumen die kleinste Oberfläche aller Körper und sieht
      aus jeder Richtung gleich aus. Sie berührt eine ebene Fläche nur in einem Punkt und
      kann deshalb in jede Richtung mit sehr geringem Widerstand rollen, und unter Innendruck
      verteilt sich die Spannung in ihrer Wand gleichmäßig.
    example: >-
      Wälzkörper in Kugellagern, Kugelschreiber, Kugelgelenke, Kugelhähne und Rückschlagkugeln,
      Kugeltanks für Druckgase, Kugelmühlen, Spielbälle
    conditions: ''
    limits: >-
      Durch die punktförmige Berührung entstehen unter Last sehr hohe Flächenpressungen (Hertzsche
      Pressung).
    sideEffects: >-
      Ohne Führung liegt eine Kugel nicht stabil, sondern rollt bei der kleinsten Neigung
      weg.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Ball (sphere)
    description: >-
      For a given volume a sphere has the smallest surface of all bodies, and it looks the
      same from every direction. It touches a flat surface at a single point and can therefore
      roll in any direction with very little resistance, and under internal pressure the stress
      in its wall is distributed evenly.
    example: >-
      Rolling elements in ball bearings, ballpoint pens, ball joints, ball valves and check
      balls, spherical tanks for pressurised gases, ball mills, sports balls
    conditions: ''
    limits: >-
      The point contact produces very high contact pressures under load (Hertzian contact
      stress).
    sideEffects: >-
      Without guidance a ball does not stay put but rolls away at the slightest tilt.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
