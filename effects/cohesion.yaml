text:
  de:
    name: Kohäsion
    description: >-
      Kohäsion ist der innere Zusammenhalt eines Stoffes durch die Anziehungskräfte zwischen
      seinen eigenen Teilchen, etwa Wasserstoffbrücken, Van-der-Waals- oder Ionenkräfte. Sie
      bewirkt, dass Flüssigkeiten Tropfen bilden, eine Oberflächenspannung haben und unter
      Zug gesetzt werden können, ohne sofort abzureißen. In feinen Pulvern sorgen dieselben
      Kräfte dafür, dass die Körner aneinanderhaften und schlecht fließen.
    example: >-
      Wassertransport in hohen Bäumen (Kohäsionstheorie), Tropfenbildung, Zusammenballen feiner
      Pulver
    conditions: ''
    limits: >-
      Flüssigkeitssäulen unter Zug reißen ab, sobald sich Gasblasen bilden (Kavitation).
    sideEffects: >-
      Starke Kohäsion feiner Pulver führt zu Brückenbildung in Silos und erschwert das Dosieren.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Cohesion
    description: >-
      Cohesion is the internal holding together of a substance through attractive forces between
      its own particles, such as hydrogen bonds, van der Waals or ionic forces. It makes liquids
      form drops, gives them surface tension and allows them to be put under tension without
      immediately tearing apart. In fine powders the same forces make the grains stick together
      and flow poorly.
    example: >-
      Water transport in tall trees (cohesion-tension theory), drop formation, clumping of
      fine powders
    conditions: ''
    limits: >-
      Liquid columns under tension break as soon as gas bubbles form (cavitation).
    sideEffects: >-
      Strong cohesion of fine powders leads to bridging in silos and makes metering difficult.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
