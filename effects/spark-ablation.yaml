text:
  de:
    name: Funkenablation (Nanopartikelerzeugung)
    description: >-
      In einem Gasstrom werden zwischen zwei Elektroden aus dem gewünschten Material wiederholt
      Funken gezündet. Jeder Funke verdampft an den Elektroden eine kleine Materialmenge;
      der Dampf kühlt im Gas rasch ab und kondensiert zu Nanopartikeln, die der Gasstrom abtransportiert.
    example: >-
      Herstellung von Metall- und Legierungs-Nanopartikeln für Katalyse- und Sensorforschung,
      Nanopartikel-Druck
    conditions: >-
      Elektrisch leitfähiges Elektrodenmaterial; inertes Trägergas wie Argon oder Stickstoff.
    limits: ''
    sideEffects: Die Partikel neigen im Gas zur Agglomeration.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Spark ablation (nanoparticle generation)
    description: >-
      Sparks are fired repeatedly in a gas flow between two electrodes made of the desired
      material. Each spark vaporises a small amount of material from the electrodes; the vapour
      cools rapidly in the gas and condenses into nanoparticles that the gas flow carries
      away.
    example: >-
      Production of metal and alloy nanoparticles for catalysis and sensor research, nanoparticle
      printing
    conditions: >-
      Electrically conductive electrode material; inert carrier gas such as argon or nitrogen.
    limits: ''
    sideEffects: The particles tend to agglomerate in the gas.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
