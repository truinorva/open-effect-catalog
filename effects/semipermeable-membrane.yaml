text:
  de:
    name: Semipermeable Membran
    description: >-
      Eine semipermeable Membran ist eine dünne Trennschicht, die bestimmte Teilchen durchlässt
      und andere zurückhält, je nach ihrer Größe, Ladung oder Löslichkeit im Membranmaterial.
      Typischerweise lässt sie das Lösungsmittel Wasser passieren, gelöste Salze oder größere
      Moleküle aber nicht; dieses Ungleichgewicht ist die Voraussetzung für Osmose, Dialyse
      und Umkehrosmose.
    example: >-
      Zellmembranen und Pergamentpapier in Osmoseversuchen, Dialysemembranen der künstlichen
      Niere, Membranen für Umkehrosmose und Nanofiltration, Gastrennmembranen, Ionenaustauschermembranen
      in Brennstoffzellen und Elektrolyseuren
    conditions: >-
      Ein Konzentrations-, Druck- oder Potentialunterschied zwischen beiden Seiten als Triebkraft.
    limits: >-
      Keine Membran trennt vollkommen; die Trennschärfe sinkt meist mit zunehmender Durchlässigkeit,
      und Verschmutzung verringert den Durchsatz.
    sideEffects: >-
      Ablagerungen und Bewuchs (Fouling) verstopfen die Oberfläche, und manche Membranen vertragen
      weder Chlor noch extreme pH-Werte.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Semipermeable membrane
    description: >-
      A semipermeable membrane is a thin barrier layer that lets certain particles through
      and holds others back, depending on their size, charge or solubility in the membrane
      material. Typically it passes the solvent water but not dissolved salts or larger molecules;
      this imbalance is the precondition for osmosis, dialysis and reverse osmosis.
    example: >-
      Cell membranes and parchment paper in osmosis experiments, dialysis membranes of the
      artificial kidney, membranes for reverse osmosis and nanofiltration, gas separation
      membranes, ion exchange membranes in fuel cells and electrolysers
    conditions: >-
      A difference in concentration, pressure or potential between the two sides as driving
      force.
    limits: >-
      No membrane separates perfectly; selectivity usually decreases as permeability increases,
      and fouling reduces throughput.
    sideEffects: >-
      Deposits and biological growth (fouling) clog the surface, and some membranes tolerate
      neither chlorine nor extreme pH.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
