text:
  de:
    name: Strömungsgrenzschicht
    description: >-
      Strömt ein Fluid an einer Wand entlang, haftet es unmittelbar an der Oberfläche, und
      seine Geschwindigkeit steigt erst in einer dünnen wandnahen Schicht auf den Wert der
      Außenströmung an. In dieser Grenzschicht wird durch Reibung Impuls an die Wand abgegeben,
      was den Reibungswiderstand verursacht; zugleich bestimmt sie den Wärme- und Stoffübergang
      zwischen Wand und Fluid. Sie kann laminar oder turbulent sein und bei in Strömungsrichtung
      steigendem Druck von der Wand ablösen.
    example: >-
      Reibungswiderstand von Flugzeugen und Schiffen, Wärmeübergang in Wärmetauschern, Dellen
      im Golfball zum Umschlagen der Grenzschicht, Grenzschichtzäune und Wirbelgeneratoren
      an Tragflächen, ruhende Luftschicht an Gebäudeoberflächen
    conditions: Ein viskoses Fluid, das sich relativ zu einer festen Oberfläche bewegt.
    limits: ''
    sideEffects: >-
      Löst die Grenzschicht ab, steigen Druckwiderstand und Verwirbelung stark an; an Tragflächen
      bricht der Auftrieb ein (Strömungsabriss).
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Boundary layer
    description: >-
      When a fluid flows along a wall, it sticks to the surface, and its velocity only rises
      to that of the outer flow within a thin layer near the wall. In this boundary layer,
      friction transfers momentum to the wall, which causes skin-friction drag; at the same
      time the layer governs heat and mass transfer between wall and fluid. It can be laminar
      or turbulent and may separate from the wall when the pressure rises in the flow direction.
    example: >-
      Skin-friction drag of aircraft and ships, heat transfer in heat exchangers, golf ball
      dimples that trip the boundary layer, wing fences and vortex generators, still air layer
      on building surfaces
    conditions: A viscous fluid moving relative to a solid surface.
    limits: ''
    sideEffects: >-
      When the boundary layer separates, pressure drag and turbulence rise sharply; on wings,
      lift collapses (stall).
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
