text:
  de:
    name: Aerosol
    description: >-
      Ein Aerosol ist ein Gemisch aus einem Gas und darin schwebenden festen oder flüssigen
      Teilchen von wenigen Nanometern bis etwa hundert Mikrometern Größe. Feine Teilchen sinken
      wegen ihrer geringen Masse und des Luftwiderstands nur sehr langsam ab, folgen den Luftbewegungen
      und bleiben deshalb lange in der Schwebe; so lassen sich Stoffe fein verteilt und über
      weite Strecken transportieren.
    example: >-
      Sprühdosen, Inhalatoren für Medikamente, Nebel und Wolken, Löschnebel, Sprühtrocknung,
      Rauch und Feinstaub
    conditions: >-
      Ausreichend kleine Teilchen, deren Sinkgeschwindigkeit gegenüber den Luftbewegungen
      gering bleibt.
    limits: >-
      Große Tropfen und Teilchen setzen sich schnell ab, und sehr feine Teilchen lagern sich
      mit der Zeit zu größeren zusammen.
    sideEffects: >-
      Eingeatmete feine Partikel dringen tief in die Lunge ein, und Aerosole aus brennbaren
      Stoffen können explodieren.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Aerosol
    description: >-
      An aerosol is a mixture of a gas with solid or liquid particles suspended in it, ranging
      from a few nanometres to about a hundred micrometres in size. Fine particles settle
      only very slowly because of their small mass and air resistance, follow the air movements
      and therefore stay airborne for a long time; substances can thus be finely dispersed
      and carried over long distances.
    example: >-
      Spray cans, medical inhalers, fog and clouds, water mist fire suppression, spray drying,
      smoke and fine dust
    conditions: >-
      Particles small enough that their settling speed stays low compared with the air movements.
    limits: >-
      Large droplets and particles settle quickly, and very fine particles gradually coalesce
      into larger ones.
    sideEffects: >-
      Inhaled fine particles penetrate deep into the lungs, and aerosols of combustible substances
      can explode.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
