text:
  de:
    name: Laser
    description: >-
      Ein Laser verstärkt Licht durch stimulierte Emission: In einem aktiven Medium wird durch
      Energiezufuhr eine Besetzungsinversion erzeugt, und ein durchlaufendes Photon löst die
      Aussendung weiterer, gleichartiger Photonen aus. Ein optischer Resonator aus Spiegeln
      schickt das Licht immer wieder durch das Medium, so dass ein gebündelter, kohärenter
      und meist sehr schmalbandiger Strahl entsteht. Dieser lässt sich auf winzige Flecke
      fokussieren und erreicht dort sehr hohe Leistungsdichten.
    example: >-
      Laserschneiden und -schweißen, Abstands- und Geschwindigkeitsmessung, Glasfaser-Datenübertragung,
      Barcodescanner, Augenchirurgie, Laserdrucker, Materialbeschriftung
    conditions: >-
      Ein aktives Medium mit Besetzungsinversion durch optisches, elektrisches oder chemisches
      Pumpen und ein Resonator mit ausreichend geringen Verlusten.
    limits: >-
      Der Wirkungsgrad reicht von unter einem Prozent bis über fünfzig Prozent bei Diodenlasern;
      die verfügbaren Wellenlängen hängen vom aktiven Medium ab.
    sideEffects: >-
      Direkte oder reflektierte Strahlung kann Augen und Haut schwer schädigen; ein großer
      Teil der Pumpenergie fällt als Abwärme an.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Laser
    description: >-
      A laser amplifies light by stimulated emission: energy input creates a population inversion
      in an active medium, and a passing photon triggers the emission of further identical
      photons. An optical resonator of mirrors sends the light through the medium again and
      again, producing a collimated, coherent and usually very narrow-band beam. This beam
      can be focused to tiny spots, where it reaches very high power densities.
    example: >-
      Laser cutting and welding, distance and speed measurement, fibre-optic data transmission,
      barcode scanners, eye surgery, laser printers, material marking
    conditions: >-
      An active medium with population inversion through optical, electrical or chemical pumping,
      and a resonator with sufficiently low losses.
    limits: >-
      Efficiency ranges from below one per cent to over fifty per cent for diode lasers; the
      available wavelengths depend on the active medium.
    sideEffects: >-
      Direct or reflected radiation can severely damage eyes and skin; much of the pump energy
      ends up as waste heat.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
