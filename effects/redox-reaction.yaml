text:
  de:
    name: Redoxreaktion (Oxidation und Reduktion)
    description: >-
      Bei einer Redoxreaktion gibt ein Stoff Elektronen ab und wird dabei oxidiert, während
      ein anderer sie aufnimmt und reduziert wird; beide Teilreaktionen laufen immer gemeinsam
      ab. Welcher Stoff Elektronen abgibt, hängt von den Redoxpotenzialen der Beteiligten
      ab. Trennt man die Teilreaktionen räumlich und verbindet sie über einen Leiter, fließt
      der Elektronenaustausch als elektrischer Strom; umgekehrt treibt ein von außen angelegter
      Strom Redoxreaktionen an.
    example: >-
      Batterien und Brennstoffzellen, Verhüttung von Erzen, Galvanisieren und Elektrolyse,
      Verbrennung, Korrosion und Opferanoden, Bleichen und Desinfizieren
    conditions: >-
      Ein Elektronenspender und ein Elektronenempfänger mit ausreichend unterschiedlichem
      Redoxpotenzial.
    limits: ''
    sideEffects: >-
      Unerwünschte Oxidation führt zu Korrosion von Metallen, Alterung von Kunststoffen und
      Verderb von Lebensmitteln.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Redox reaction (oxidation and reduction)
    description: >-
      In a redox reaction one substance gives up electrons and is oxidised while another takes
      them up and is reduced; the two half-reactions always occur together. Which substance
      donates electrons depends on the redox potentials of the partners. If the half-reactions
      are separated in space and connected by a conductor, the electron exchange flows as
      an electric current; conversely, an externally applied current drives redox reactions.
    example: >-
      Batteries and fuel cells, smelting of ores, electroplating and electrolysis, combustion,
      corrosion and sacrificial anodes, bleaching and disinfection
    conditions: >-
      An electron donor and an electron acceptor with sufficiently different redox potentials.
    limits: ''
    sideEffects: >-
      Unwanted oxidation causes corrosion of metals, ageing of plastics and spoilage of food.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
