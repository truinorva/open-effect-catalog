text:
  de:
    name: Achse (Maschinenelement)
    description: >-
      Eine Achse ist ein stab- oder bolzenförmiges Maschinenelement, das drehende Teile wie
      Räder oder Rollen trägt und führt. Im strengen Sinn überträgt sie anders als eine Welle
      kein Drehmoment, sondern nimmt vor allem Biege- und Querkräfte auf; die Räder drehen
      sich entweder in Lagern auf der feststehenden Achse oder zusammen mit ihr.
    example: >-
      Anhängerachsen, Achsen von Lauf- und Umlenkrollen, Seilrollen, Vorderradachse des Fahrrads
    conditions: ''
    limits: >-
      Unter wechselnder Biegung, vor allem bei umlaufenden Achsen, droht Ermüdungsbruch an
      Querschnittsübergängen und Kerben.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Axle
    description: >-
      An axle is a rod- or pin-shaped machine element that carries and guides rotating parts
      such as wheels or rollers. In the strict engineering sense it transmits no torque, unlike
      a shaft, and mainly carries bending and shear loads; the wheels either turn on bearings
      on a fixed axle or rotate together with it.
    example: >-
      Trailer axles, axles of idler and deflection rollers, rope pulleys, bicycle front wheel
      axle
    conditions: ''
    limits: >-
      Under alternating bending, especially with rotating axles, fatigue fracture threatens
      at changes of cross-section and notches.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
