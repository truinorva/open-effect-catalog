text:
  de:
    name: Moiré-Effekt
    description: >-
      Werden zwei regelmäßige Muster wie Linienraster oder Punktgitter übereinandergelegt,
      entsteht ein grobes Streifenmuster, das in keinem der beiden enthalten ist. Es entspricht
      einer Schwebung der beiden Raumfrequenzen, sodass schon eine winzige Verschiebung, Drehung
      oder Dehnung eines Rasters die Moiré-Streifen weit wandern lässt. Kleine Lageänderungen
      werden dadurch stark vergrößert sichtbar und messbar.
    example: >-
      Inkrementale Längen- und Winkelmessgeber, Dehnungs- und Verformungsmessung, Moiré-Topografie
      von Oberflächen, Sicherheitsmerkmale auf Dokumenten, Justiermarken in der Lithografie
    conditions: >-
      Zwei Raster mit ähnlicher Periode, die sich überlagern lassen, etwa durch Durchsicht,
      Projektion oder Abbildung.
    limits: >-
      Die Empfindlichkeit hängt von der Rasterteilung ab; sehr feine Raster erfordern Beugungs-
      und Interferenzverfahren.
    sideEffects: >-
      Unerwünschte Moirés stören beim Scannen von Druckvorlagen, bei Digitalfotos feiner Textilien
      und auf Bildschirmen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Moiré effect
    description: >-
      When two regular patterns such as line gratings or dot screens are superimposed, a coarse
      fringe pattern appears that is contained in neither of them. It is a beat between the
      two spatial frequencies, so even a tiny shift, rotation or stretch of one grating makes
      the moiré fringes travel a long way. Small changes in position thus become greatly magnified,
      visible and measurable.
    example: >-
      Incremental linear and rotary encoders, strain and deformation measurement, moiré topography
      of surfaces, security features on documents, alignment marks in lithography
    conditions: >-
      Two gratings of similar period that can be superimposed, for example by looking through
      them, by projection or by imaging.
    limits: >-
      Sensitivity depends on the grating pitch; very fine gratings require diffraction and
      interference methods.
    sideEffects: >-
      Unwanted moiré disturbs scans of printed originals, digital photos of fine textiles
      and displays.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
