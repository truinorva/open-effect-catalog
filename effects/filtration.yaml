text:
  de:
    name: Filtration
    description: >-
      Ein Fluid strömt durch ein poröses Filtermittel wie Gewebe, Vlies, Papier, eine Membran
      oder eine Schüttschicht, das die darin enthaltenen Feststoffteilchen zurückhält. Größere
      Teilchen werden an der Oberfläche wie in einem Sieb abgefangen und bilden dort einen
      Filterkuchen, kleinere bleiben in der Tiefe des Filtermittels durch Trägheit, Sperreffekt,
      Diffusion oder Anhaften hängen.
    example: >-
      Kaffeefilter, Luftfilter in Lüftungsanlagen und Motoren, Sandfilter in der Wasseraufbereitung,
      Filterpressen, Staubsaugerbeutel
    conditions: >-
      Druckunterschied über dem Filtermittel; Teilchen, die größer als die Poren sind oder
      sich in ihnen abfangen lassen.
    limits: >-
      Mit wachsender Beladung steigt der Druckverlust, so dass das Filter gereinigt oder gewechselt
      werden muss.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Filtration
    description: >-
      A fluid flows through a porous filter medium such as fabric, nonwoven, paper, a membrane
      or a packed bed, which retains the solid particles it contains. Larger particles are
      caught at the surface as in a sieve and build up a filter cake there; smaller ones are
      trapped deep within the medium by inertia, interception, diffusion or adhesion.
    example: >-
      Coffee filter, air filters in ventilation systems and engines, sand filters in water
      treatment, filter presses, vacuum cleaner bags
    conditions: >-
      Pressure difference across the filter medium; particles larger than the pores or capable
      of being trapped within them.
    limits: >-
      As loading increases, pressure drop rises, so the filter must be cleaned or replaced.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
