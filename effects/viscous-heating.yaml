text:
  de:
    name: Viskose Erwärmung (Scherwärme)
    description: >-
      Wird ein zähes Fluid geschert, wandelt die innere Reibung zwischen den Fluidschichten
      mechanische Arbeit in Wärme um. Die erzeugte Wärmeleistung wächst mit der Viskosität
      und mit dem Quadrat der Schergeschwindigkeit. In hochviskosen Kunststoffschmelzen kann
      diese Scherwärme einen großen Teil der zum Schmelzen nötigen Energie liefern.
    example: >-
      Plastifizieren in Kunststoffextrudern und Spritzgießmaschinen, Erwärmung von Schmierfilmen
      in Gleitlagern, Temperaturanstieg in Rührwerken und Pumpen
    conditions: >-
      Hohe Viskosität und hohe Schergeschwindigkeit, etwa in engen Spalten mit schnell bewegten
      Wänden.
    limits: >-
      Bei Fluiden niedriger Viskosität wie Wasser oder Luft ist die Erwärmung meist vernachlässigbar.
    sideEffects: >-
      Örtliche Überhitzung kann Kunststoffe und Schmierstoffe zersetzen, und weil die Viskosität
      mit der Temperatur sinkt, werden Viskositätsmessungen verfälscht.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Viscous heating
    description: >-
      When a viscous fluid is sheared, internal friction between the fluid layers converts
      mechanical work into heat. The heat generated increases with the viscosity and with
      the square of the shear rate. In highly viscous polymer melts this shear heating can
      supply a large part of the energy needed for melting.
    example: >-
      Plasticising in plastic extruders and injection moulding machines, heating of lubricating
      films in plain bearings, temperature rise in agitators and pumps
    conditions: >-
      High viscosity and a high shear rate, for example in narrow gaps with fast-moving walls.
    limits: >-
      In low-viscosity fluids such as water or air the heating is usually negligible.
    sideEffects: >-
      Local overheating can degrade plastics and lubricants, and since viscosity falls with
      temperature, viscosity measurements are distorted.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
