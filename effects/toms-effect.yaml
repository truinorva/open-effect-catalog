text:
  de:
    name: Toms-Effekt
    description: >-
      Schon wenige Millionstel Anteile langkettiger Polymere senken den Reibungswiderstand
      turbulenter Rohrströmungen drastisch. Die gestreckten Makromoleküle dämpfen die kleinen
      Wirbel nahe der Rohrwand, die sonst einen Großteil der Energie verzehren; bei gleichem
      Druck fließt so deutlich mehr Flüssigkeit durch das Rohr.
    example: >-
      Durchsatzsteigerung in Rohöl- und Produktpipelines wie der Trans-Alaska-Pipeline, Löschwasser
      mit höherem Durchfluss und größerer Wurfweite
    conditions: Turbulente Strömung; sehr lange Polymerketten in geringer Konzentration.
    limits: >-
      Hohe Scherung in Pumpen zerreißt die Polymerketten und hebt die Wirkung auf; in laminarer
      Strömung wirkt der Zusatz nicht.
    sideEffects: Das Polymer bleibt im geförderten Produkt.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Toms effect
    description: >-
      Just a few parts per million of long-chain polymers drastically reduce the frictional
      drag of turbulent pipe flow. The stretched macromolecules damp the small eddies near
      the pipe wall that would otherwise dissipate much of the energy; at the same pressure,
      considerably more liquid flows through the pipe.
    example: >-
      Increasing throughput in crude oil and product pipelines such as the Trans-Alaska Pipeline,
      fire-fighting water with higher flow and longer reach
    conditions: Turbulent flow; very long polymer chains at low concentration.
    limits: >-
      High shear in pumps breaks the polymer chains and cancels the effect; in laminar flow
      the additive has no effect.
    sideEffects: The polymer remains in the transported product.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
