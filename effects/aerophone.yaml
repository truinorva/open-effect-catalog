text:
  de:
    name: Aerophon
    description: >-
      Bei Aerophonen schwingt eine Luftsäule oder die Luft selbst und erzeugt so den Ton.
      Angeregt wird sie durch einen Luftstrahl, der an einer Kante bricht, durch schwingende
      Rohrblätter oder durch die Lippen des Spielers, und Länge und Form des Resonators legen
      die Tonhöhe fest.
    example: >-
      Flöten, Orgelpfeifen, Klarinetten und Saxophone, Trompeten, Trillerpfeifen und Signalhörner,
      Sirenen
    conditions: >-
      Ein Luftstrom mit ausreichendem Druck und eine Kante, ein Blatt oder die Lippen zur
      Anregung.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Aerophone
    description: >-
      In aerophones a column of air, or the air itself, vibrates and produces the sound. It
      is excited by an air jet breaking over an edge, by vibrating reeds or by the player's
      lips, and the length and shape of the resonator set the pitch.
    example: >-
      Flutes, organ pipes, clarinets and saxophones, trumpets, whistles and signal horns,
      sirens
    conditions: >-
      An air stream with sufficient pressure and an edge, reed or the lips for excitation.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
