text:
  de:
    name: Echo
    description: >-
      Trifft eine Schall- oder andere Welle auf eine Grenzfläche mit anderem Wellenwiderstand,
      wird ein Teil zurückgeworfen und kommt mit einer Laufzeitverzögerung beim Sender an.
      Aus dieser Laufzeit und der bekannten Ausbreitungsgeschwindigkeit ergibt sich der Abstand
      der reflektierenden Fläche, und Stärke und Form des Echos verraten etwas über Größe
      und Art des Reflektors.
    example: >-
      Echolot und Sonar, Ultraschall-Abstandssensoren und Einparkhilfe, Ultraschall-Füllstandsmessung,
      Ultraschall-Wanddickenmessung und Fehlerprüfung, medizinische Sonografie, Echoortung
      der Fledermäuse
    conditions: >-
      Ein ausreichender Unterschied der Wellenwiderstände an der Grenzfläche und eine Fläche,
      die die Welle zum Empfänger zurücklenkt.
    limits: >-
      Weiche, schräge oder schallschluckende Flächen werfen kaum etwas zurück, und sehr nahe
      Objekte lassen sich oft nicht erfassen, weil der Sender noch nachschwingt (Totzone).
    sideEffects: >-
      Störende Echos und Nachhall in Räumen verschlechtern die Sprachverständlichkeit.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Echo
    description: >-
      When a sound wave or another wave hits an interface with a different wave impedance,
      part of it is reflected and returns to the transmitter after a time delay. From this
      transit time and the known propagation speed, the distance to the reflecting surface
      follows, and the strength and shape of the echo reveal something about the size and
      nature of the reflector.
    example: >-
      Echo sounders and sonar, ultrasonic distance sensors and parking aids, ultrasonic level
      measurement, ultrasonic wall-thickness gauging and flaw detection, medical sonography,
      bat echolocation
    conditions: >-
      A sufficient difference in wave impedance at the interface and a surface that directs
      the wave back to the receiver.
    limits: >-
      Soft, inclined or sound-absorbing surfaces return hardly anything, and very close objects
      often cannot be detected because the transmitter is still ringing (dead zone).
    sideEffects: >-
      Disturbing echoes and reverberation in rooms impair speech intelligibility.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
