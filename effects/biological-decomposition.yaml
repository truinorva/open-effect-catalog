text:
  de:
    name: Biologischer Abbau (Zersetzung)
    description: >-
      Bakterien, Pilze und Kleintiere zerlegen abgestorbenes organisches Material schrittweise
      in einfachere Stoffe. Mit Sauerstoff entstehen am Ende vor allem Kohlendioxid, Wasser,
      Mineralsalze und Humus, ohne Sauerstoff zusätzlich Methan und andere Gärprodukte. Die
      Geschwindigkeit hängt von Temperatur, Feuchte, Sauerstoffzufuhr und der Zusammensetzung
      des Materials ab.
    example: >-
      Kompostierung, biologische Abwasserreinigung, Biogasanlagen, biologisch abbaubare Kunststoffe,
      Bodensanierung, Laubzersetzung im Wald
    conditions: >-
      Lebende Zersetzerorganismen, ausreichend Feuchte, eine geeignete Temperatur und Nährstoffe.
    limits: >-
      Viele synthetische Stoffe, etwa die meisten Kunststoffe, werden kaum oder nur sehr langsam
      abgebaut, und Trockenheit, Kälte oder Gifte stoppen den Vorgang.
    sideEffects: >-
      Geruch, Wärmeentwicklung im Kompost, Freisetzung von Treibhausgasen wie Methan und Kohlendioxid
      sowie Fäulnis an Holz und Lebensmitteln.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Biological decomposition
    description: >-
      Bacteria, fungi and small animals break dead organic matter down step by step into simpler
      substances. With oxygen the end products are mainly carbon dioxide, water, mineral salts
      and humus; without oxygen, methane and other fermentation products form as well. The
      rate depends on temperature, moisture, oxygen supply and the composition of the material.
    example: >-
      Composting, biological wastewater treatment, biogas plants, biodegradable plastics,
      soil remediation, decomposition of forest litter
    conditions: >-
      Living decomposer organisms, sufficient moisture, a suitable temperature and nutrients.
    limits: >-
      Many synthetic substances, such as most plastics, are degraded hardly at all or only
      very slowly, and drought, cold or toxins halt the process.
    sideEffects: >-
      Odour, heat build-up in compost, release of greenhouse gases such as methane and carbon
      dioxide, and rotting of wood and food.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
