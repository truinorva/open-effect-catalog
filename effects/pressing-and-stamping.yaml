text:
  de:
    name: Pressen und Stanzen
    description: >-
      Beim Pressen und Stanzen drückt eine Presse ein Werkzeug aus Stempel und Matrize gegen
      ein meist blechförmiges Werkstück. Je nach Werkzeug wird das Blech dabei plastisch umgeformt,
      etwa gebogen, tiefgezogen oder geprägt, oder entlang einer Schneidkante abgeschert,
      etwa beim Ausschneiden und Lochen; Folgeverbundwerkzeuge führen mehrere solcher Schritte
      mit jedem Pressenhub nacheinander aus.
    example: >-
      Karosserieteile, Elektroblechpakete für Motoren, Steckverbinder und Kontaktfedern, Münzprägung,
      Unterlegscheiben, Gehäuse aus Blech
    conditions: >-
      Ein umformbarer Werkstoff, meist Blech, Werkzeuge aus gehärtetem Stahl und eine Presse
      mit ausreichender Presskraft.
    limits: >-
      Die Werkzeuge sind teuer, sodass sich das Verfahren vor allem bei großen Stückzahlen
      lohnt; das Umformvermögen des Blechs begrenzt die erreichbare Ziehtiefe und Komplexität.
    sideEffects: >-
      Schnittkanten haben Grat und Kanteneinzug, umgeformte Teile federn zurück, und der Betrieb
      erzeugt Lärm und Erschütterungen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Pressing and stamping
    description: >-
      In pressing and stamping, a press drives a tool consisting of punch and die against
      a workpiece, usually sheet metal. Depending on the tool, the sheet is formed plastically,
      for example bent, deep-drawn or embossed, or sheared along a cutting edge, as in blanking
      and piercing; progressive dies perform several of these steps in succession with each
      stroke of the press.
    example: >-
      Car body panels, electrical steel laminations for motors, connectors and contact springs,
      coin minting, washers, sheet-metal housings
    conditions: >-
      A formable material, usually sheet metal, tooling made of hardened steel and a press
      with sufficient force.
    limits: >-
      Tooling is expensive, so the process pays off mainly at high volumes; the formability
      of the sheet limits the achievable drawing depth and complexity.
    sideEffects: >-
      Cut edges show burrs and rollover, formed parts spring back, and operation causes noise
      and vibration.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
