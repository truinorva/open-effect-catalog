text:
  de:
    name: Bragg-Beugung (Bragg-Reflexion)
    description: >-
      An den regelmäßig angeordneten Netzebenen eines Kristalls wird Röntgen-, Elektronen-
      oder Neutronenstrahlung teilweise zurückgestreut. Die Teilwellen verstärken sich nur
      in den Richtungen, in denen der Gangunterschied zwischen benachbarten Ebenen ein ganzzahliges
      Vielfaches der Wellenlänge beträgt (Bragg-Gleichung n·λ = 2d·sin θ). Aus den Winkeln
      dieser Reflexe lassen sich die Netzebenenabstände und damit die Kristallstruktur bestimmen.
    example: >-
      Röntgendiffraktometrie zur Phasenanalyse, Eigenspannungsmessung, Kristallmonochromatoren,
      Faser-Bragg-Gitter, Bragg-Spiegel in Halbleiterlasern, Farbenspiel des Opals
    conditions: >-
      Eine periodische Struktur mit einem Abstand in der Größenordnung der Wellenlänge und
      ein passender Einfallswinkel.
    limits: >-
      Amorphe Stoffe liefern keine scharfen Reflexe; sehr kleine Kristallite verbreitern die
      Reflexe.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Bragg diffraction
    description: >-
      X-rays, electrons or neutrons are partly scattered back by the regularly spaced lattice
      planes of a crystal. The partial waves reinforce each other only in directions where
      the path difference between neighbouring planes is a whole number of wavelengths (Bragg's
      law n·λ = 2d·sin θ). The angles of these reflections reveal the lattice spacings and
      thus the crystal structure.
    example: >-
      X-ray diffraction for phase analysis, residual stress measurement, crystal monochromators,
      fibre Bragg gratings, Bragg mirrors in semiconductor lasers, play of colour in opal
    conditions: >-
      A periodic structure with a spacing of the order of the wavelength and a matching angle
      of incidence.
    limits: >-
      Amorphous materials give no sharp reflections; very small crystallites broaden the reflections.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
