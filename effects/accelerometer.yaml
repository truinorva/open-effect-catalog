text:
  de:
    name: Beschleunigungssensor
    description: >-
      Eine kleine, federnd aufgehängte Prüfmasse bleibt bei einer Beschleunigung des Gehäuses
      wegen ihrer Trägheit zurück, und ihre Auslenkung oder die dabei wirkende Kraft wird
      elektrisch erfasst, etwa kapazitiv, piezoelektrisch oder piezoresistiv. Weil auch die
      Schwerkraft an der Masse zieht, zeigt der Sensor in Ruhe die Neigung gegenüber der Senkrechten
      an.
    example: >-
      Airbag-Auslösung, Bildschirmdrehung im Smartphone, Schrittzähler, Schwingungsüberwachung
      von Maschinen, Trägheitsnavigation, Seismometer
    conditions: >-
      Der Sensor muss starr mit dem Körper verbunden sein, dessen Bewegung gemessen werden
      soll.
    limits: >-
      Piezoelektrische Sensoren erfassen keine gleichbleibenden Beschleunigungen, und in der
      Nähe der Eigenfrequenz der Prüfmasse wird das Signal verfälscht.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Accelerometer
    description: >-
      A small proof mass on a spring lags behind when the housing accelerates, because of
      its inertia, and its deflection or the force involved is picked up electrically, for
      example capacitively, piezoelectrically or piezoresistively. Since gravity also pulls
      on the mass, the sensor at rest indicates its tilt relative to the vertical.
    example: >-
      Airbag triggering, screen rotation in smartphones, step counters, machine vibration
      monitoring, inertial navigation, seismometers
    conditions: >-
      The sensor must be rigidly attached to the body whose motion is to be measured.
    limits: >-
      Piezoelectric sensors cannot register constant acceleration, and near the natural frequency
      of the proof mass the signal is distorted.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
