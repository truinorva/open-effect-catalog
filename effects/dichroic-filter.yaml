text:
  de:
    name: Dichroitischer Filter (Interferenzfilter)
    description: >-
      Ein dichroitischer Filter besteht aus vielen dünnen Schichten mit abwechselnd hoher
      und niedriger Brechzahl auf Glas. Die an den Grenzflächen reflektierten Teilwellen überlagern
      sich so, dass bestimmte Wellenlängenbereiche nahezu verlustfrei durchgelassen und die
      übrigen reflektiert werden. Anders als Farbglas absorbiert der Filter kaum Licht und
      erwärmt sich daher wenig.
    example: >-
      Farbfilter für Bühnenscheinwerfer, Kaltlichtspiegel in Halogenreflektoren, Strahlteiler
      in Projektoren und Kameras, Filtersätze in der Fluoreszenzmikroskopie
    conditions: >-
      Schichtdicken im Bereich einer Viertelwellenlänge, die präzise aufgedampft oder gesputtert
      werden.
    limits: >-
      Bei schrägem Lichteinfall verschiebt sich die Filterkante zu kürzeren Wellenlängen.
    sideEffects: >-
      Das reflektierte Licht muss gezielt abgeführt werden, sonst entsteht Streulicht.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Dichroic filter (interference filter)
    description: >-
      A dichroic filter consists of many thin layers of alternately high and low refractive
      index on glass. The partial waves reflected at the interfaces interfere in such a way
      that certain wavelength ranges are transmitted almost without loss and the rest are
      reflected. Unlike coloured glass, the filter absorbs hardly any light and therefore
      heats up little.
    example: >-
      Colour filters for stage lights, cold-light mirrors in halogen reflectors, beam splitters
      in projectors and cameras, filter sets in fluorescence microscopy
    conditions: >-
      Layer thicknesses of around a quarter wavelength, deposited precisely by evaporation
      or sputtering.
    limits: >-
      When light falls at an oblique angle, the filter edge shifts to shorter wavelengths.
    sideEffects: >-
      The reflected light has to be directed away deliberately, otherwise it causes stray
      light.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
