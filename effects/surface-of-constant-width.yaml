text:
  de:
    name: Körper konstanter Breite
    description: >-
      Ein Körper konstanter Breite hat in jeder Richtung denselben Abstand zwischen zwei parallelen
      Tangentialebenen, obwohl er keine Kugel ist; Beispiele sind die Meißner-Körper oder
      der Rotationskörper eines Reuleaux-Dreiecks. Zwischen zwei parallelen Platten lässt
      er sich in jede Lage drehen und berührt dabei stets beide. Eine Platte, die auf solchen
      Körpern rollt, bleibt deshalb immer in gleicher Höhe.
    example: Lehrmodelle und Rollkörper, Prüfbeispiele für Rundheitsmessungen
    conditions: ''
    limits: >-
      Ein Körper konstanter Breite rollt nicht so gleichmäßig wie eine Kugel: Sein Schwerpunkt
      hebt und senkt sich beim Rollen, so dass er als Lagerkugel ungeeignet ist.
    sideEffects: >-
      Eine Zweipunkt-Durchmessermessung kann einen solchen Körper nicht von einer Kugel unterscheiden;
      Formfehler mit ungerader Zahl von Erhebungen bleiben so unentdeckt.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Surface of constant width
    description: >-
      A body of constant width has the same distance between two parallel tangent planes in
      every direction, even though it is not a sphere; examples are the Meissner bodies and
      the solid obtained by rotating a Reuleaux triangle. Between two parallel plates it can
      be turned into any orientation while always touching both. A plate rolling on such bodies
      therefore always stays at the same height.
    example: >-
      Teaching models and rolling objects, test examples for roundness measurement
    conditions: ''
    limits: >-
      A body of constant width does not roll as smoothly as a sphere: its centre of mass rises
      and falls while rolling, so it is unsuitable as a bearing ball.
    sideEffects: >-
      A two-point diameter measurement cannot distinguish such a body from a sphere, so form
      errors with an odd number of lobes go undetected.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
