text:
  de:
    name: Verformungswärme
    description: >-
      Bei plastischer Verformung wird der größte Teil der aufgewendeten Arbeit, bei Metallen
      typischerweise rund 90 %, im Werkstoff in Wärme umgesetzt; nur ein kleiner Rest bleibt
      als Gitterfehler gespeichert. Läuft die Verformung schnell ab, kann die Wärme nicht
      rechtzeitig abfließen, und das Werkstück erwärmt sich merklich.
    example: >-
      Warmer Draht nach mehrmaligem Hin- und Herbiegen, Temperaturanstieg beim Strangpressen
      und Schmieden, adiabatische Scherbänder beim Zerspanen und bei Aufprallvorgängen
    conditions: >-
      Plastische Verformung, die schnell im Vergleich zur Wärmeableitung abläuft.
    limits: ''
    sideEffects: >-
      Örtliche Erwärmung entfestigt den Werkstoff und kann die Verformung in schmalen Scherbändern
      bündeln, die zum Bruch führen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Strain heating
    description: >-
      During plastic deformation most of the mechanical work, typically around 90 % in metals,
      is converted into heat inside the material; only a small fraction remains stored as
      lattice defects. If the deformation is fast, the heat cannot escape in time and the
      workpiece warms up noticeably.
    example: >-
      A wire getting warm after repeated bending, temperature rise in extrusion and forging,
      adiabatic shear bands in machining and impact
    conditions: Plastic deformation that is fast compared with heat dissipation.
    limits: ''
    sideEffects: >-
      Local heating softens the material and can concentrate deformation into narrow shear
      bands that lead to fracture.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
