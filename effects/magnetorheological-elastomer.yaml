text:
  de:
    name: Magnetorheologisches Elastomer
    description: >-
      Magnetorheologische Elastomere sind Gummi- oder Silikonwerkstoffe, in die mikrometergroße
      magnetisierbare Partikel, meist Carbonyleisen, eingebettet sind. Im Magnetfeld ziehen
      sich die Partikel gegenseitig an, so dass Steifigkeit und Dämpfung des Werkstoffs innerhalb
      von Millisekunden und umkehrbar zunehmen. Werden die Partikel beim Aushärten durch ein
      Feld zu Ketten ausgerichtet, ist der Effekt in dieser Richtung besonders stark.
    example: >-
      Adaptive Schwingungstilger und Motorlager, verstellbare Fahrwerkslager, weiche Aktoren
      und Greifer in der Robotik
    conditions: >-
      Ein Magnetfeld am Werkstoff, meist erzeugt durch Spulen oder bewegliche Permanentmagnete.
    limits: >-
      Die erreichbare Steifigkeitsänderung ist begrenzt, und die felderzeugenden Spulen bringen
      zusätzliches Gewicht und Energiebedarf mit sich.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Magnetorheological elastomer
    description: >-
      Magnetorheological elastomers are rubber or silicone materials in which micrometre-sized
      magnetisable particles, usually carbonyl iron, are embedded. In a magnetic field the
      particles attract one another, so the stiffness and damping of the material increase
      within milliseconds and reversibly. If the particles are aligned into chains by a field
      during curing, the effect is particularly strong in that direction.
    example: >-
      Adaptive vibration absorbers and engine mounts, adjustable suspension bushings, soft
      actuators and grippers in robotics
    conditions: >-
      A magnetic field at the material, usually generated by coils or movable permanent magnets.
    limits: >-
      The achievable change in stiffness is limited, and the coils that generate the field
      add weight and power demand.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
