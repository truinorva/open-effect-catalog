text:
  de:
    name: Plasmaspritzen
    description: >-
      Ein Lichtbogen zwischen Kathode und Anode ionisiert ein Gas wie Argon und erzeugt einen
      sehr heißen Plasmastrahl. Pulverförmiger Beschichtungswerkstoff wird in diesen Strahl
      eingeblasen, aufgeschmolzen und mit hoher Geschwindigkeit auf das Bauteil geschleudert,
      wo die Tröpfchen flach aufprallen, erstarren und Lage um Lage eine Schicht aufbauen.
      Beim Vakuum- oder Niederdruck-Plasmaspritzen läuft der Prozess in einer Kammer mit verringertem
      Druck, wodurch Oxidation vermieden wird und dichtere Schichten entstehen.
    example: >-
      Wärmedämmschichten auf Turbinenschaufeln, Verschleißschutzschichten auf Walzen, Korrosionsschutz,
      Hydroxylapatit-Beschichtung von Implantaten, MCrAlY-Haftschichten durch Vakuum-Plasmaspritzen
    conditions: >-
      Pulverförmiger, schmelzbarer Beschichtungswerkstoff und eine vorbereitete, meist gestrahlte
      Substratoberfläche.
    limits: >-
      Die Schichten sind lamellar aufgebaut und enthalten Poren und Mikrorisse; die Haftung
      ist überwiegend mechanisch, und enge innen liegende Bohrungen lassen sich kaum beschichten,
      weil der Strahl auf Sicht arbeitet.
    sideEffects: >-
      Starke UV-Strahlung, Lärm und Staub erfordern Kapselung und Absaugung; Eigenspannungen
      in der Schicht können zum Abplatzen führen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Plasma spraying
    description: >-
      An electric arc between cathode and anode ionises a gas such as argon and produces a
      very hot plasma jet. Coating material in powder form is fed into the jet, melted and
      propelled at high speed onto the workpiece, where the droplets flatten, solidify and
      build up a coating layer by layer. In vacuum or low-pressure plasma spraying the process
      runs in a chamber at reduced pressure, which avoids oxidation and gives denser coatings.
    example: >-
      Thermal barrier coatings on turbine blades, wear-resistant coatings on rolls, corrosion
      protection, hydroxyapatite coatings on implants, MCrAlY bond coats by vacuum plasma
      spraying
    conditions: >-
      Powdered, meltable coating material and a prepared, usually grit-blasted substrate surface.
    limits: >-
      Coatings are lamellar with pores and microcracks; adhesion is mainly mechanical, and
      narrow internal bores can hardly be coated because the process works in line of sight.
    sideEffects: >-
      Intense UV radiation, noise and dust require enclosures and extraction; residual stresses
      in the coating can cause spalling.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
