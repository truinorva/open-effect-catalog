text:
  de:
    name: Inverser Faraday-Effekt
    description: >-
      Zirkular polarisiertes Licht erzeugt in einem Material eine Magnetisierung, deren Richtung
      vom Drehsinn der Polarisation abhängt; der Effekt ist das Gegenstück zum Faraday-Effekt,
      bei dem ein Magnetfeld die Polarisationsebene von Licht dreht. Mit intensiven ultrakurzen
      Laserpulsen lassen sich so Magnetisierungen rein optisch anregen, und der Effekt wird
      als ein Mechanismus des rein optischen magnetischen Schaltens diskutiert.
    example: >-
      Forschung zum rein optischen magnetischen Schalten für schnelle Datenspeicher, Anregung
      von Spinwellen mit Laserpulsen
    conditions: >-
      Sehr intensives, zirkular polarisiertes Licht, meist Femtosekunden-Laserpulse.
    limits: >-
      Bei gewöhnlichen Lichtintensitäten ist die induzierte Magnetisierung verschwindend klein.
    sideEffects: Die Laserpulse erwärmen das Material stark.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Inverse Faraday effect
    description: >-
      Circularly polarised light induces a magnetisation in a material whose direction depends
      on the handedness of the polarisation; the effect is the counterpart of the Faraday
      effect, in which a magnetic field rotates the plane of polarisation of light. With intense
      ultrashort laser pulses, magnetisation can thus be excited purely optically, and the
      effect is discussed as one mechanism of all-optical magnetic switching.
    example: >-
      Research on all-optical magnetic switching for fast data storage, excitation of spin
      waves with laser pulses
    conditions: >-
      Very intense circularly polarised light, usually femtosecond laser pulses.
    limits: >-
      At ordinary light intensities the induced magnetisation is vanishingly small.
    sideEffects: The laser pulses strongly heat the material.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
