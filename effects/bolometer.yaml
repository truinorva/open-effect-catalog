text:
  de:
    name: Bolometer
    description: >-
      Ein Bolometer misst Strahlungsleistung über die Erwärmung eines dünnen Absorbers. Die
      aufgenommene Strahlung erhöht dessen Temperatur, und ein temperaturabhängiger elektrischer
      Widerstand, der thermisch mit dem Absorber verbunden ist, setzt diese Erwärmung in ein
      elektrisches Signal um. Weil es auf Wärme statt auf die Energie einzelner Photonen reagiert,
      ist es über einen sehr breiten Wellenlängenbereich empfindlich.
    example: >-
      Mikrobolometer in Wärmebildkameras, Radioastronomie und Messung der kosmischen Hintergrundstrahlung
      mit supraleitenden Bolometern, Strahlungsmessung im Ferninfrarot- und Terahertzbereich
    conditions: >-
      Gute thermische Isolation des Absorbers von der Umgebung; für höchste Empfindlichkeit
      Kühlung auf tiefe Temperaturen.
    limits: >-
      Die Ansprechzeit ist durch die Wärmekapazität des Absorbers begrenzt, die Empfindlichkeit
      durch thermisches Rauschen.
    sideEffects: >-
      Der Messstrom erwärmt das Element selbst und muss bei der Auswertung berücksichtigt
      werden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Bolometer
    description: >-
      A bolometer measures radiant power through the heating of a thin absorber. The absorbed
      radiation raises its temperature, and a temperature-dependent electrical resistance
      thermally connected to the absorber turns this heating into an electrical signal. Because
      it responds to heat rather than to the energy of individual photons, it is sensitive
      over a very wide wavelength range.
    example: >-
      Microbolometers in thermal imaging cameras, radio astronomy and cosmic microwave background
      measurements with superconducting bolometers, radiation measurement in the far infrared
      and terahertz range
    conditions: >-
      Good thermal isolation of the absorber from its surroundings; cooling to low temperatures
      for the highest sensitivity.
    limits: >-
      Response time is limited by the heat capacity of the absorber, sensitivity by thermal
      noise.
    sideEffects: >-
      The bias current heats the element itself and must be accounted for in the evaluation.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
