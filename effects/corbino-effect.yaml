text:
  de:
    name: Corbino-Effekt
    description: >-
      Fließt in einer leitenden Kreisscheibe ein Strom radial von der Mitte zum Rand und steht
      ein Magnetfeld senkrecht zur Scheibe, lenkt die Lorentzkraft die Ladungsträger seitlich
      auf Spiralbahnen ab. Weil die Scheibe keine Ränder hat, an denen sich eine Hall-Spannung
      aufbauen könnte, entsteht ein kreisförmiger Strom, und der radiale Widerstand steigt
      mit dem Magnetfeld deutlich an.
    example: >-
      Corbino-Scheibe zur Messung der Ladungsträgerbeweglichkeit, magnetoresistive Sensoren
      aus Halbleitern hoher Beweglichkeit, Untersuchungen zum Quanten-Hall-Effekt
    conditions: >-
      Ein Leiter mit hoher Ladungsträgerbeweglichkeit, etwa Indiumantimonid, und ein Magnetfeld
      senkrecht zur Stromrichtung.
    limits: >-
      In Metallen ist die Beweglichkeit gering und der Effekt kaum messbar, und bei kleinen
      Feldern wächst die Widerstandsänderung nur mit dem Quadrat der Flussdichte.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Corbino effect
    description: >-
      If a current flows radially from the centre to the rim of a conducting disc and a magnetic
      field is applied perpendicular to the disc, the Lorentz force deflects the charge carriers
      sideways onto spiral paths. Since the disc has no edges at which a Hall voltage could
      build up, a circular current develops and the radial resistance rises markedly with
      the magnetic field.
    example: >-
      Corbino disc for measuring charge-carrier mobility, magnetoresistive sensors made of
      high-mobility semiconductors, quantum Hall effect research
    conditions: >-
      A conductor with high charge-carrier mobility, such as indium antimonide, and a magnetic
      field perpendicular to the current.
    limits: >-
      In metals the mobility is low and the effect barely measurable, and at small fields
      the change in resistance grows only with the square of the flux density.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
