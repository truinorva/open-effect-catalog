text:
  de:
    name: Magnetische Sättigung
    description: >-
      Ein ferromagnetischer Werkstoff lässt sich nur bis zu einer Grenze magnetisieren: Sind
      praktisch alle magnetischen Momente in Feldrichtung ausgerichtet, steigt die Flussdichte
      bei weiter wachsendem Feld kaum noch an. Die wirksame Permeabilität und damit die Induktivität
      einer Spule mit diesem Kern brechen dabei stark ein. Dieses nichtlineare Verhalten lässt
      sich nutzen, um Spannungen zu stabilisieren, Ströme zu steuern oder schwache Magnetfelder
      zu messen.
    example: >-
      Förstersonden (Fluxgate-Magnetometer), Magnetverstärker und Sättigungsdrosseln, Konstantspannungstransformatoren,
      Fehlerstrombegrenzer
    conditions: >-
      Ein ferro- oder ferrimagnetischer Kern und ein Feld, das groß genug ist, um die Sättigungsflussdichte
      des Werkstoffs zu erreichen.
    limits: >-
      Die Sättigungsflussdichte ist eine Werkstoffgrenze, bei Eisen-Kobalt-Legierungen etwa
      2,4 Tesla, bei Ferriten meist unter 0,5 Tesla; sie sinkt mit steigender Temperatur.
    sideEffects: >-
      Gerät ein Transformator- oder Drosselkern ungewollt in Sättigung, steigen Strom, Oberschwingungen
      und Erwärmung stark an.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Magnetic saturation
    description: >-
      A ferromagnetic material can only be magnetised up to a limit: once practically all
      magnetic moments are aligned with the field, the flux density hardly increases even
      if the field keeps growing. The effective permeability, and with it the inductance of
      a coil with this core, drops sharply. This non-linear behaviour can be used to stabilise
      voltages, control currents or measure weak magnetic fields.
    example: >-
      Fluxgate magnetometers, magnetic amplifiers and saturable reactors, constant-voltage
      transformers, fault current limiters
    conditions: >-
      A ferromagnetic or ferrimagnetic core and a field large enough to reach the saturation
      flux density of the material.
    limits: >-
      Saturation flux density is a material limit, about 2.4 tesla for iron-cobalt alloys
      and usually below 0.5 tesla for ferrites; it falls with rising temperature.
    sideEffects: >-
      If a transformer or choke core is unintentionally driven into saturation, current, harmonics
      and heating rise sharply.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
