text:
  de:
    name: Akustische Schmierung
    description: >-
      Schall- oder Ultraschallschwingungen in einer Kontaktzone entlasten die aufeinanderliegenden
      Flächen periodisch oder heben sie kurz voneinander ab, sodass die mittlere Reibung deutlich
      sinkt. In körnigen Stoffen wie Sand oder Gesteinsschutt kann Schall die Kontaktkräfte
      zwischen den Körnern so weit verringern, dass die Schüttung zu fließen beginnt.
    example: >-
      Ultraschallunterstütztes Draht- und Rohrziehen, schwingungsunterstütztes Umformen, Erklärungsansatz
      für weit reichende Bergstürze und die Schwächung von Verwerfungen bei Erdbeben
    conditions: >-
      Schwingungsamplitude und Frequenz müssen groß genug sein, um die Kontaktkräfte merklich
      zu verringern.
    limits: ''
    sideEffects: Die Schwingungen erwärmen die Kontaktzone und verursachen Lärm.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Acoustic lubrication
    description: >-
      Sound or ultrasonic vibration in a contact zone periodically unloads the touching surfaces
      or briefly lifts them apart, so that the average friction drops markedly. In granular
      materials such as sand or rock debris, sound can reduce the contact forces between grains
      so far that the mass begins to flow.
    example: >-
      Ultrasonically assisted wire and tube drawing, vibration-assisted forming, proposed
      explanation for long-runout landslides and fault weakening during earthquakes
    conditions: >-
      Vibration amplitude and frequency must be large enough to reduce the contact forces
      noticeably.
    limits: ''
    sideEffects: The vibration heats the contact zone and generates noise.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
