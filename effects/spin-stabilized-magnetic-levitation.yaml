text:
  de:
    name: Spinstabilisierte Magnetschwebe
    description: >-
      Ein ringförmiger Dauermagnet als Kreisel schwebt über einem größeren Grundmagneten,
      dessen Feld ihn abstößt. Nach dem Earnshaw-Theorem kann eine Anordnung ruhender Dauermagnete
      nicht stabil schweben, denn der Kreisel würde sofort umkippen; die schnelle Drehung
      hält jedoch seine Achse gyroskopisch aufrecht, und in einem schmalen Höhenbereich entsteht
      ein stabiles Gleichgewicht.
    example: Schwebekreisel (Levitron), Demonstrationsversuche zum Magnetismus
    conditions: >-
      Drehzahl in einem bestimmten Fenster und genau abgestimmte Masse des Kreisels.
    limits: >-
      Luftreibung bremst den Kreisel, so dass er ohne Antrieb nach wenigen Minuten herunterfällt.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Spin-stabilized magnetic levitation
    description: >-
      A ring-shaped permanent magnet acting as a top hovers above a larger base magnet whose
      field repels it. By Earnshaw's theorem an arrangement of static permanent magnets cannot
      levitate stably, since the top would immediately flip over; its rapid spin, however,
      keeps its axis upright gyroscopically, and a stable equilibrium arises within a narrow
      height range.
    example: Levitating top (Levitron), demonstrations of magnetism
    conditions: Spin speed within a certain window and precisely tuned mass of the top.
    limits: Air drag slows the top, so without a drive it falls after a few minutes.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
