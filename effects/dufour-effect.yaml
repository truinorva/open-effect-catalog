text:
  de:
    name: Dufour-Effekt
    description: >-
      Diffundieren zwei Gase ineinander, entsteht allein durch das Konzentrationsgefälle ein
      Wärmestrom, so dass sich vorübergehend ein Temperaturunterschied ausbildet. Der Dufour-Effekt
      ist das Gegenstück zur Thermodiffusion (Soret-Effekt), bei der ein Temperaturgefälle
      eine Entmischung bewirkt.
    example: >-
      Temperaturunterschiede beim Vermischen von Gasen sehr unterschiedlicher Molmasse wie
      Wasserstoff und Stickstoff in Laborversuchen, Berücksichtigung in genauen Modellen von
      Flammen und Gasgemischen mit leichten Komponenten
    conditions: >-
      Ein Gasgemisch mit stark unterschiedlichen Molmassen und ein ausgeprägtes Konzentrationsgefälle.
    limits: >-
      Die Temperaturunterschiede betragen nur wenige Kelvin und verschwinden, sobald die Diffusion
      abgeschlossen ist, und in Flüssigkeiten ist der Effekt kaum messbar.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Dufour effect
    description: >-
      When two gases diffuse into each other, the concentration gradient alone produces a
      heat flow, so that a temporary temperature difference develops. The Dufour effect is
      the counterpart of thermodiffusion (Soret effect), in which a temperature gradient causes
      demixing.
    example: >-
      Temperature differences when mixing gases of very different molar mass, such as hydrogen
      and nitrogen, in laboratory experiments; inclusion in detailed models of flames and
      gas mixtures with light components
    conditions: >-
      A gas mixture with very different molar masses and a pronounced concentration gradient.
    limits: >-
      The temperature differences amount to only a few kelvin and disappear once diffusion
      is complete, and in liquids the effect is barely measurable.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
