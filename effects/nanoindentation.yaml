text:
  de:
    name: Nanoindentation
    description: >-
      Eine sehr feine Diamantspitze, meist in Berkovich-Form, wird mit kontrollierter Kraft
      im Bereich von Mikro- bis Millinewton in eine Oberfläche gedrückt und wieder entlastet,
      während Kraft und Eindringtiefe laufend aufgezeichnet werden. Aus der Kraft-Eindringkurve,
      vor allem aus ihrer Steigung beim Entlasten, ergeben sich Härte und Elastizitätsmodul.
      So lassen sich auch dünne Schichten und winzige Gefügebestandteile prüfen, ohne den
      Eindruck optisch vermessen zu müssen.
    example: >-
      Prüfung dünner Hartstoff- und Lackschichten, Eigenschaften einzelner Gefügephasen, Werkstoffe
      für MEMS, biologische Hartgewebe wie Knochen und Zahnschmelz
    conditions: >-
      Glatte, saubere Oberfläche, stabile Temperatur und schwingungsarme Umgebung, damit Drift
      die Messung nicht verfälscht.
    limits: >-
      Bei dünnen Schichten darf der Eindruck nur einen kleinen Teil der Schichtdicke erreichen,
      als Faustregel etwa 10 Prozent, sonst geht das Substrat in das Ergebnis ein.
    sideEffects: >-
      Aufwölben oder Einsinken des Materials am Eindruckrand verfälscht die berechnete Kontaktfläche.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Nanoindentation
    description: >-
      A very fine diamond tip, usually of Berkovich shape, is pressed into a surface with
      a controlled force in the micronewton to millinewton range and then unloaded, while
      force and penetration depth are recorded continuously. Hardness and elastic modulus
      follow from the load-displacement curve, especially from its slope during unloading.
      This allows thin films and tiny microstructural constituents to be tested without measuring
      the indent optically.
    example: >-
      Testing thin hard coatings and paint layers, properties of individual microstructural
      phases, materials for MEMS, biological hard tissues such as bone and tooth enamel
    conditions: >-
      A smooth, clean surface, stable temperature and a low-vibration environment so that
      drift does not distort the measurement.
    limits: >-
      On thin films the indent may reach only a small fraction of the film thickness, about
      10 percent as a rule of thumb, or the substrate affects the result.
    sideEffects: >-
      Pile-up or sink-in of material at the indent edge distorts the calculated contact area.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
