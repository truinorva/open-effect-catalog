text:
  de:
    name: Sphericon
    description: >-
      Ein Sphericon entsteht, wenn man einen Doppelkegel mit 90° Öffnungswinkel entlang einer
      Ebene durch seine Achse halbiert und die Hälften, um 90° gegeneinander verdreht, wieder
      zusammensetzt. Der Körper hat eine einzige zusammenhängende gekrümmte Fläche und rollt
      auf einer Ebene nicht geradeaus, sondern auf einer schlängelnden Bahn, bei der nach
      und nach jeder Punkt dieser Fläche den Boden berührt.
    example: Rollspielzeug, Lehrmodell in der Geometrie
    conditions: ''
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Sphericon
    description: >-
      A sphericon is formed by cutting a double cone with a 90° apex angle in half along a
      plane through its axis and rejoining the halves rotated by 90° against each other. The
      body has a single continuous curved surface and, on a flat surface, does not roll straight
      but along a meandering path in which every point of that surface eventually touches
      the ground.
    example: Rolling toy, teaching model in geometry
    conditions: ''
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
