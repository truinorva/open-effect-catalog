text:
  de:
    name: Laserschockverfestigen (Laser Peening)
    description: >-
      Beim Laserschockverfestigen wird die Bauteiloberfläche mit einer Opferschicht wie Lack
      oder Folie und einem durchsichtigen Wasserfilm bedeckt und mit sehr kurzen, energiereichen
      Laserpulsen beschossen. Die Opferschicht verdampft schlagartig zu einem Plasma, dessen
      Ausdehnung das Wasser einschließt, so dass eine Druckwelle von mehreren Gigapascal in
      das Bauteil läuft. Diese verformt die Randschicht plastisch und hinterlässt tiefreichende
      Druckeigenspannungen, die Rissbildung und Ermüdung hemmen.
    example: >-
      Fan- und Verdichterschaufeln von Flugtriebwerken, Schweißnähte in Kernkraftwerken gegen
      Spannungsrisskorrosion, Strukturbauteile von Flugzeugen
    conditions: >-
      Kurze Laserpulse im Nanosekundenbereich mit hoher Pulsenergie und eine einschließende
      Schicht, meist fließendes Wasser.
    limits: >-
      Das Verfahren ist aufwendiger und langsamer als konventionelles Kugelstrahlen und wird
      daher vor allem für hochwertige Bauteile eingesetzt.
    sideEffects: >-
      Die Opferschicht muss aufgebracht und wieder entfernt werden; ohne sie kann die Oberfläche
      anschmelzen und Zugeigenspannungen erhalten.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Laser peening
    description: >-
      In laser peening, the component surface is covered with a sacrificial layer such as
      paint or tape and a transparent film of water and struck with very short, high-energy
      laser pulses. The sacrificial layer instantly vaporises into a plasma whose expansion
      is confined by the water, sending a pressure wave of several gigapascals into the part.
      This plastically deforms the surface layer and leaves deep compressive residual stresses
      that inhibit cracking and fatigue.
    example: >-
      Fan and compressor blades of aircraft engines, welds in nuclear power plants against
      stress corrosion cracking, aircraft structural parts
    conditions: >-
      Short laser pulses in the nanosecond range with high pulse energy and a confining layer,
      usually flowing water.
    limits: >-
      The process is more costly and slower than conventional shot peening and is therefore
      used mainly for high-value parts.
    sideEffects: >-
      The sacrificial layer has to be applied and removed again; without it the surface can
      melt and acquire tensile residual stresses.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
