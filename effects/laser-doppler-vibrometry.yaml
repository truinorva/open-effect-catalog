text:
  de:
    name: Laser-Doppler-Vibrometrie
    description: >-
      Ein Laser-Doppler-Vibrometer richtet einen Laserstrahl auf eine schwingende Oberfläche
      und überlagert das zurückgestreute Licht in einem Interferometer mit einem Referenzstrahl.
      Die Bewegung der Oberfläche verschiebt die Frequenz des reflektierten Lichts nach dem
      Doppler-Effekt, und aus dem Interferenzsignal lassen sich Schwinggeschwindigkeit und
      Auslenkung berührungslos bestimmen. Scannende Geräte tasten ganze Flächen ab und machen
      Schwingungsformen sichtbar.
    example: >-
      Schwingungsanalyse von Karosserien und Turbinenschaufeln, Prüfung von Lautsprechermembranen
      und MEMS-Bauteilen, Messungen an heißen oder sehr leichten Bauteilen
    conditions: >-
      Sichtverbindung zur Messstelle und eine Oberfläche, die genügend Licht zurückstreut.
    limits: >-
      Gemessen wird nur die Bewegungskomponente in Strahlrichtung; sehr raue oder dunkle Oberflächen
      liefern schwache Signale.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Laser Doppler vibrometry
    description: >-
      A laser Doppler vibrometer aims a laser beam at a vibrating surface and superimposes
      the back-scattered light on a reference beam in an interferometer. The motion of the
      surface shifts the frequency of the reflected light by the Doppler effect, and the interference
      signal yields vibration velocity and displacement without contact. Scanning instruments
      sweep whole surfaces and make vibration modes visible.
    example: >-
      Vibration analysis of car bodies and turbine blades, testing loudspeaker diaphragms
      and MEMS devices, measurements on hot or very light components
    conditions: >-
      Line of sight to the measurement point and a surface that scatters back enough light.
    limits: >-
      Only the motion component along the beam is measured; very rough or dark surfaces give
      weak signals.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
