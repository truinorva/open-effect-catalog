text:
  de:
    name: Endgeschwindigkeit (Sinkgeschwindigkeit)
    description: >-
      Fällt ein Körper durch Luft oder eine Flüssigkeit, wächst mit seiner Geschwindigkeit
      der Strömungswiderstand. Sobald Widerstand und Auftrieb zusammen das Gewicht ausgleichen,
      wird der Körper nicht weiter beschleunigt und fällt mit konstanter Geschwindigkeit.
      Diese Endgeschwindigkeit hängt von Masse, Form und Größe des Körpers sowie von Dichte
      und Viskosität des Mediums ab.
    example: >-
      Fallschirm, Kugelfallviskosimeter, Klassieren von Partikeln nach ihrer Sinkgeschwindigkeit,
      Regentropfen, Fallschirmspringer im freien Fall
    conditions: Ausreichend lange Fallstrecke in einem ruhenden Medium.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Terminal velocity
    description: >-
      When a body falls through air or a liquid, its drag grows with its speed. Once drag
      and buoyancy together balance the weight, the body stops accelerating and falls at a
      constant speed. This terminal velocity depends on the body's mass, shape and size and
      on the density and viscosity of the medium.
    example: >-
      Parachute, falling-ball viscometer, classifying particles by settling velocity, raindrops,
      skydivers in free fall
    conditions: A sufficiently long fall through a still medium.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
