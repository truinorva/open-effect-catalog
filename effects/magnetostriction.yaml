text:
  de:
    name: Magnetostriktion
    description: >-
      Ein ferromagnetischer Werkstoff ändert im Magnetfeld seine Abmessungen. Die magnetischen
      Bereiche im Inneren drehen sich in Feldrichtung und verschieben dabei das Kristallgitter
      ein wenig; ein Wechselfeld lässt das Bauteil im Takt des Feldes schwingen.
    example: >-
      Brummen von Transformatoren, Ultraschallgeber, Sonar, Stellantriebe aus Terfenol-D
    conditions: Ferromagnetischer Werkstoff; starkes oder veränderliches Magnetfeld.
    limits: >-
      Die Längenänderung ist klein (meist millionstel bis wenige tausendstel der Länge). Oberhalb
      der Curie-Temperatur verschwindet der Effekt.
    sideEffects: Geräusche und Wärmeverluste im magnetischen Kern.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Magnetostriction
    description: >-
      A ferromagnetic material changes its dimensions in a magnetic field. The magnetic domains
      inside turn towards the field and slightly shift the crystal lattice; an alternating
      field makes the part vibrate at the field frequency.
    example: Transformer hum, ultrasonic transducers, sonar, Terfenol-D actuators
    conditions: Ferromagnetic material; strong or changing magnetic field.
    limits: >-
      The change in length is small (typically parts per million up to a few parts per thousand).
      Above the Curie temperature the effect disappears.
    sideEffects: Noise and heat losses in the magnetic core.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
