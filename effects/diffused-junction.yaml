text:
  de:
    name: Diffundierter pn-Übergang
    description: >-
      Ein Halbleiterkristall wird bei hoher Temperatur einem Dotierstoff ausgesetzt, etwa
      Phosphor oder Bor aus der Gasphase oder aus einer aufgebrachten Schicht. Die Fremdatome
      diffundieren einige Zehntel bis wenige Mikrometer tief ein und kehren dort den Leitungstyp
      um, so dass an der Grenze ein pn-Übergang entsteht, dessen Tiefe über Temperatur und
      Zeit eingestellt wird. In den 1950er Jahren ermöglichte das Verfahren deutlich schnellere
      Transistoren (Diffusionstransistor).
    example: >-
      Emitterdiffusion bei kristallinen Silizium-Solarzellen (POCl₃), historische Diffusionstransistoren,
      Dotierung von Wannen und Widerständen in integrierten Schaltungen
    conditions: >-
      Temperaturen von meist 800 bis 1200 °C und eine Maske, etwa aus Siliziumoxid, für örtlich
      begrenzte Dotierung.
    limits: >-
      Das Dotierprofil ist durch die Diffusion vorgegeben und läuft seitlich aus, weshalb
      für sehr flache, scharf begrenzte Gebiete heute meist Ionenimplantation verwendet wird.
    sideEffects: >-
      Bereits vorhandene Dotierungen diffundieren bei jedem weiteren Hochtemperaturschritt
      weiter.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Diffused junction
    description: >-
      A semiconductor crystal is exposed at high temperature to a dopant, such as phosphorus
      or boron from the gas phase or from a deposited layer. The foreign atoms diffuse a few
      tenths of a micrometre to a few micrometres deep and reverse the conductivity type there,
      so that a p-n junction forms at the boundary, its depth set by temperature and time.
      In the 1950s the process made much faster transistors possible (diffused junction transistor).
    example: >-
      Emitter diffusion in crystalline silicon solar cells (POCl₃), historical diffused junction
      transistors, doping of wells and resistors in integrated circuits
    conditions: >-
      Temperatures usually between 800 and 1200 °C and a mask, for example of silicon oxide,
      for locally confined doping.
    limits: >-
      The doping profile is dictated by diffusion and spreads sideways, which is why ion implantation
      is mostly used today for very shallow, sharply bounded regions.
    sideEffects: >-
      Existing dopants diffuse further with every subsequent high-temperature step.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
