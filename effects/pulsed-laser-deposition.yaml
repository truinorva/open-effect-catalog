text:
  de:
    name: Gepulste Laserdeposition (Laserstrahlverdampfen)
    description: >-
      Kurze, energiereiche Laserpulse treffen im Vakuum auf ein Target aus dem Beschichtungswerkstoff
      und tragen an dessen Oberfläche schlagartig Material ab. Es bildet sich eine leuchtende
      Plasmawolke, die sich zu einem gegenüberliegenden, meist beheizten Substrat ausbreitet
      und dort eine dünne Schicht wachsen lässt; weil das Material so schnell verdampft, bleibt
      die Zusammensetzung auch komplexer Verbindungen weitgehend erhalten.
    example: >-
      Dünnschichten aus Hochtemperatur-Supraleitern wie YBCO, ferroelektrische und multiferroische
      Oxidschichten, Hydroxylapatit auf Implantaten, Forschung an Oxid-Heterostrukturen
    conditions: >-
      Vakuum oder eine definierte Hintergrundgas-Atmosphäre, etwa Sauerstoff für Oxide, und
      ein gepulster Laser hoher Leistungsdichte, meist im UV-Bereich wie Excimer- oder frequenzvervielfachte
      Nd:YAG-Laser.
    limits: >-
      Die beschichtbare Fläche ist klein und die Schichtdicke über größere Flächen ungleichmäßig,
      was den industriellen Einsatz begrenzt.
    sideEffects: >-
      Aus dem Target geschleuderte Tröpfchen und Partikel (Splashing) können sich als Defekte
      in die Schicht einbauen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Pulsed laser deposition
    description: >-
      Short, high-energy laser pulses strike a target of the coating material in vacuum and
      abruptly ablate material from its surface. A luminous plasma plume forms, expands towards
      an opposite, usually heated substrate and grows a thin film there; because the material
      is vaporised so quickly, the composition of even complex compounds is largely preserved.
    example: >-
      Thin films of high-temperature superconductors such as YBCO, ferroelectric and multiferroic
      oxide films, hydroxyapatite on implants, research on oxide heterostructures
    conditions: >-
      Vacuum or a defined background gas, for example oxygen for oxides, and a pulsed laser
      of high power density, usually in the UV such as excimer or frequency-multiplied Nd:YAG
      lasers.
    limits: >-
      The coated area is small and film thickness is uneven over larger areas, which limits
      industrial use.
    sideEffects: >-
      Droplets and particles ejected from the target (splashing) can be incorporated as defects
      in the film.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
