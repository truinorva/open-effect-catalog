text:
  de:
    name: Wärmekraftmaschine
    description: >-
      Eine Wärmekraftmaschine führt ein Arbeitsmedium durch einen Kreisprozess: Es nimmt bei
      hoher Temperatur Wärme auf, dehnt sich aus und leistet dabei Arbeit, gibt bei niedriger
      Temperatur Restwärme ab und wird wieder verdichtet. Nur ein Teil der Wärme lässt sich
      in Arbeit umwandeln; die Obergrenze ist der Carnot-Wirkungsgrad, der von den beiden
      Temperaturen abhängt.
    example: >-
      Dampfturbine, Verbrennungsmotor, Gasturbine, Stirlingmotor, ORC-Anlagen zur Abwärmenutzung
    conditions: Eine Wärmequelle und eine kältere Wärmesenke.
    limits: >-
      Der Wirkungsgrad kann den Carnot-Wert 1 − T_kalt/T_warm nicht überschreiten.
    sideEffects: Ein großer Teil der zugeführten Wärme fällt als Abwärme an.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Heat engine
    description: >-
      A heat engine takes a working fluid through a cycle: it absorbs heat at high temperature,
      expands and does work, gives off the remaining heat at low temperature and is compressed
      again. Only part of the heat can be converted into work; the upper limit is the Carnot
      efficiency, which depends on the two temperatures.
    example: >-
      Steam turbine, internal combustion engine, gas turbine, Stirling engine, ORC plants
      for waste-heat recovery
    conditions: A heat source and a colder heat sink.
    limits: Efficiency cannot exceed the Carnot value 1 − T_cold/T_hot.
    sideEffects: A large part of the heat supplied ends up as waste heat.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
