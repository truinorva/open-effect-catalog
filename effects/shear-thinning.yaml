text:
  de:
    name: Strukturviskosität (Scherverdünnung)
    description: >-
      Bei strukturviskosen Flüssigkeiten sinkt die Viskosität, je stärker sie geschert werden,
      und steigt wieder, sobald die Scherung nachlässt. Lange Molekülketten richten sich in
      der Strömung aus und entknäueln sich, lockere Teilchenverbände brechen auf; dadurch
      gleiten die Schichten leichter aneinander vorbei. Anders als bei der Thixotropie hängt
      die Viskosität dabei unmittelbar von der Schergeschwindigkeit ab und nicht von der Dauer
      der Belastung.
    example: >-
      Wandfarbe, die beim Streichen fließt und an der Wand nicht abläuft, Ketchup, Nagellack,
      Kunststoffschmelzen beim Spritzgießen, Blut, mit Xanthan angedickte Lebensmittel
    conditions: >-
      Flüssigkeiten mit gelösten Polymeren, länglichen Teilchen oder lockeren Teilchenverbänden.
    limits: >-
      Bei sehr hohen Schergeschwindigkeiten nähert sich die Viskosität einem unteren Grenzwert
      und sinkt nicht weiter.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Shear thinning
    description: >-
      In shear-thinning (pseudoplastic) fluids the viscosity falls the more strongly they
      are sheared and rises again as soon as shearing eases. Long molecular chains align with
      the flow and disentangle, and loose particle clusters break up, so the layers slide
      past each other more easily. Unlike thixotropy, the viscosity depends directly on the
      shear rate rather than on how long the load has lasted.
    example: >-
      Wall paint that flows under the brush but does not run down the wall, ketchup, nail
      polish, polymer melts in injection moulding, blood, foods thickened with xanthan
    conditions: >-
      Liquids containing dissolved polymers, elongated particles or loose particle clusters.
    limits: >-
      At very high shear rates the viscosity approaches a lower limiting value and falls no
      further.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
