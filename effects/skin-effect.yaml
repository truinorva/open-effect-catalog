text:
  de:
    name: Skin-Effekt (Stromverdrängung)
    description: >-
      Fließt Wechselstrom durch einen Leiter, induziert das sich ändernde Magnetfeld im Inneren
      Wirbelströme, die dem Strom in der Leitermitte entgegenwirken. Der Strom drängt sich
      deshalb in einer dünnen Randschicht zusammen, deren Dicke, die Eindringtiefe, mit steigender
      Frequenz, Leitfähigkeit und Permeabilität abnimmt. Der wirksame Querschnitt wird kleiner,
      der Wechselstromwiderstand größer.
    example: >-
      Induktives Randschichthärten, Abschirmung durch dünne Metallgehäuse, Hochfrequenzlitze
      und rohrförmige Leiter als Gegenmaßnahme
    conditions: >-
      Wechselstrom oder wechselndes Magnetfeld in einem elektrisch leitenden Körper; je höher
      die Frequenz, desto stärker der Effekt.
    limits: ''
    sideEffects: >-
      Bei hohen Frequenzen steigen Widerstand und Verluste in Leitungen und Wicklungen; deshalb
      werden Litzen aus einzeln isolierten Drähten verwendet.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Skin effect
    description: >-
      When alternating current flows through a conductor, the changing magnetic field induces
      eddy currents inside that oppose the current in the centre of the conductor. The current
      therefore crowds into a thin surface layer whose thickness, the skin depth, decreases
      with rising frequency, conductivity and permeability. The effective cross-section shrinks
      and the AC resistance rises.
    example: >-
      Induction surface hardening, shielding by thin metal enclosures, Litz wire and tubular
      conductors as countermeasures
    conditions: >-
      Alternating current or a changing magnetic field in an electrically conducting body;
      the higher the frequency, the stronger the effect.
    limits: ''
    sideEffects: >-
      At high frequencies resistance and losses in lines and windings increase, which is why
      Litz wire made of individually insulated strands is used.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
