text:
  de:
    name: Schwimm-Sink-Trennung
    description: >-
      Ein Gemisch fester Teilchen wird in eine Flüssigkeit gegeben, deren Dichte zwischen
      den Dichten der zu trennenden Stoffe liegt. Leichtere Teilchen schwimmen auf, schwerere
      sinken ab, und beide Fraktionen werden getrennt abgezogen. Die Trenndichte stellt man
      mit Wasser, Salzlösungen oder Aufschlämmungen feiner Schwerstoffe wie Magnetit oder
      Ferrosilizium ein.
    example: >-
      Kohle- und Erzaufbereitung (Schwertrübe-Verfahren), Trennung von Kunststoffen im Recycling,
      Abtrennung von Aluminium von Schwermetallen im Schrott, Schwimm-Sink-Analyse von Mineralen
    conditions: >-
      Ein ausreichender Dichteunterschied zwischen den Komponenten, und die Teilchen müssen
      voneinander gelöst vorliegen.
    limits: >-
      Sehr feine Teilchen sinken zu langsam und folgen eher der Strömung, und Verbundteilchen
      landen je nach mittlerer Dichte in der falschen Fraktion.
    sideEffects: >-
      Verluste und Aufbereitung des Trennmediums, wobei manche Schwerflüssigkeiten giftig
      sind.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Sink-float separation
    description: >-
      A mixture of solid particles is placed in a liquid whose density lies between the densities
      of the materials to be separated. Lighter particles float, heavier ones sink, and both
      fractions are drawn off separately. The separation density is set with water, salt solutions
      or slurries of fine heavy media such as magnetite or ferrosilicon.
    example: >-
      Coal and ore processing (dense-medium separation), separation of plastics in recycling,
      separation of aluminium from heavy metals in scrap, sink-float analysis of minerals
    conditions: >-
      A sufficient density difference between the components, and particles that are liberated
      from one another.
    limits: >-
      Very fine particles settle too slowly and tend to follow the flow, and composite particles
      end up in the wrong fraction depending on their average density.
    sideEffects: >-
      Losses and recovery of the separating medium, and some heavy liquids are toxic.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
