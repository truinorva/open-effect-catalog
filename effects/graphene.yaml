text:
  de:
    name: Graphen
    description: >-
      Graphen ist eine einzelne, nur ein Atom dicke Lage aus Kohlenstoffatomen in einem Wabengitter.
      Ladungsträger bewegen sich darin außergewöhnlich schnell, Wärme wird sehr gut geleitet,
      die Zugfestigkeit ist extrem hoch, und die Lage ist für Gase praktisch undurchlässig,
      absorbiert aber nur etwa 2,3 % des sichtbaren Lichts.
    example: >-
      Leitfähige Zusätze in Batterieelektroden, Wärmeleitfolien in Smartphones, Verstärkung
      von Verbundwerkstoffen und Sportgeräten, Forschung zu Sensoren und transparenten Elektroden
    conditions: ''
    limits: >-
      Großflächiges, fehlerfreies Graphen ist teuer herzustellen; ohne Bandlücke eignet es
      sich nicht direkt als Schaltmaterial für Transistoren.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Graphene
    description: >-
      Graphene is a single layer of carbon atoms, just one atom thick, arranged in a honeycomb
      lattice. Charge carriers move through it exceptionally fast, it conducts heat very well,
      its tensile strength is extremely high and it is practically impermeable to gases, yet
      it absorbs only about 2.3 % of visible light.
    example: >-
      Conductive additives in battery electrodes, heat-spreading films in smartphones, reinforcement
      of composites and sports equipment, research on sensors and transparent electrodes
    conditions: ''
    limits: >-
      Large-area, defect-free graphene is expensive to make; lacking a band gap, it is not
      directly suitable as a switching material for transistors.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
