  en:
    name: Spiral
    description: >-
      A spiral is a plane curve that winds around a centre while moving steadily away from
      it. When a spiral groove or ridge is turned, an element guided in it moves evenly inwards
      or outwards, converting rotation into radial motion. Two interleaved spirals, one of
      them orbiting, enclose chambers that shrink towards the centre; in addition, the spiral
      shape packs a great length into a small area.
    example: >-
      Three-jaw chuck with scroll plate, scroll compressors in air conditioners, hairsprings
      and mainsprings in clocks, spiral heat exchangers, coiled hoses and tapes
    conditions: ''
    limits: ''
    sideEffects: ''
    kind: maschinell
