text:
  de:
    name: Spirale
    description: >-
      Eine Spirale ist eine ebene Kurve, die um einen Mittelpunkt läuft und sich dabei stetig
      von ihm entfernt. Dreht man eine spiralförmige Nut oder Leiste, wandert ein darin geführtes
      Element gleichmäßig nach innen oder außen, so dass eine Drehung in eine radiale Bewegung
      umgesetzt wird. Zwei ineinandergreifende Spiralen, von denen eine eine Kreisbahn beschreibt,
      schließen Kammern ein, die sich zur Mitte hin verkleinern; außerdem bringt die Spiralform
      eine große Länge auf kleiner Fläche unter.
    example: >-
      Dreibackenfutter mit Spiralscheibe, Scrollverdichter in Klimaanlagen, Spiralfedern in
      Uhren, Spiralwärmetauscher, aufgerollte Schläuche und Bänder
