text:
  de:
    name: Fullerene
    description: >-
      Fullerene sind geschlossene Käfigmoleküle aus reinem Kohlenstoff, am bekanntesten C60
      in Form eines Fußballs aus Fünf- und Sechsecken. Sie nehmen leicht Elektronen auf und
      fangen Radikale ab; mit Alkalimetallen dotiert werden manche dieser Verbindungen (Fulleride)
      bei tiefen Temperaturen supraleitend.
    example: >-
      Elektronenakzeptoren (PCBM) in organischen Solarzellen, Antioxidantien in Kosmetika,
      Forschung zu Supraleitern und Wirkstoffträgern
    conditions: >-
      Herstellung z. B. im Lichtbogen zwischen Graphitelektroden unter Helium und anschließende
      Reinigung durch Extraktion mit Lösemitteln.
    limits: >-
      Herstellung und Reinigung sind teuer; in organischen Solarzellen werden Fullerene zunehmend
      durch andere Akzeptoren ersetzt.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Fullerenes
    description: >-
      Fullerenes are closed cage molecules made of pure carbon, best known as C60, shaped
      like a football of pentagons and hexagons. They readily accept electrons and scavenge
      radicals; doped with alkali metals, some of these compounds (fullerides) become superconducting
      at low temperatures.
    example: >-
      Electron acceptors (PCBM) in organic solar cells, antioxidants in cosmetics, research
      on superconductors and drug carriers
    conditions: >-
      Produced, for example, in an arc between graphite electrodes under helium and then purified
      by solvent extraction.
    limits: >-
      Production and purification are expensive; in organic solar cells fullerenes are increasingly
      being replaced by other acceptors.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
