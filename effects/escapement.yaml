text:
  de:
    name: Hemmung (Uhr)
    description: >-
      Die Hemmung verbindet in einer mechanischen Uhr das angetriebene Räderwerk mit dem Schwingsystem,
      also Pendel oder Unruh. Sie sperrt das Räderwerk und gibt es im Takt der Schwingung
      jeweils um einen Zahn frei; bei jeder Freigabe erhält der Schwinger einen kleinen Kraftstoß,
      der seine Reibungsverluste ausgleicht. So bestimmt die Eigenfrequenz des Schwingers
      den Gang des ganzen Werks.
    example: >-
      Ankerhemmung in Pendel- und Armbanduhren, Spindelhemmung historischer Uhren, Metronom,
      mechanische Kurzzeitwecker
    conditions: >-
      Gleichmäßiges Antriebsmoment, z. B. durch ein Gewicht oder eine Zugfeder.
    limits: >-
      Reibung und alternde Schmierstoffe in der Hemmung beeinträchtigen die Ganggenauigkeit.
    sideEffects: Das typische Ticken entsteht durch die Stöße in der Hemmung.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Escapement
    description: >-
      In a mechanical clock, the escapement links the driven gear train with the oscillator,
      i.e. the pendulum or balance wheel. It locks the gear train and releases it by one tooth
      at a time in step with the oscillation; with each release, the oscillator receives a
      small impulse that makes up for its friction losses. The natural frequency of the oscillator
      thus determines the rate of the whole movement.
    example: >-
      Anchor escapement in pendulum clocks and wristwatches, verge escapement in historical
      clocks, metronome, mechanical kitchen timers
    conditions: Steady driving torque, e.g. from a weight or a mainspring.
    limits: >-
      Friction and ageing lubricants in the escapement impair timekeeping accuracy.
    sideEffects: The typical ticking comes from the impacts in the escapement.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
