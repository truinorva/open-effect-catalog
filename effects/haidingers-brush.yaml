text:
  de:
    name: Haidinger-Büschel
    description: >-
      Viele Menschen können die Polarisationsrichtung von Licht direkt sehen: Beim Blick auf
      eine gleichmäßig helle, polarisierte Fläche erscheint in der Mitte des Gesichtsfelds
      kurz ein schwaches, gelbliches, sanduhrförmiges Büschel, das sich mit der Polarisationsrichtung
      mitdreht. Ursache sind die gelben Makulapigmente (Lutein, Zeaxanthin) in der Netzhautmitte,
      deren Moleküle radial angeordnet sind und blaues Licht je nach Polarisation unterschiedlich
      stark absorbieren.
    example: >-
      Erkennen polarisierten Himmelslichts mit bloßem Auge, augenärztliche Prüfung und Training
      der zentralen Fixation, Beobachtung an LCD-Bildschirmen
    conditions: >-
      Polarisiertes, möglichst blauhaltiges Licht auf einer gleichmäßig hellen Fläche; Drehen
      der Polarisation oder des Kopfes.
    limits: >-
      Das Muster verblasst nach wenigen Sekunden, wenn sich die Polarisation nicht ändert,
      und nicht jeder nimmt es wahr.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Haidinger's brush
    description: >-
      Many people can see the polarisation direction of light directly: looking at an evenly
      bright, polarised surface, a faint, yellowish, hourglass-shaped brush briefly appears
      in the centre of the visual field and turns with the polarisation direction. It is caused
      by the yellow macular pigments (lutein, zeaxanthin) in the centre of the retina, whose
      molecules are arranged radially and absorb blue light more or less strongly depending
      on its polarisation.
    example: >-
      Spotting polarised skylight with the naked eye, ophthalmological testing and training
      of central fixation, observation on LCD screens
    conditions: >-
      Polarised light with a good blue component on an evenly bright surface; rotating the
      polarisation or the head.
    limits: >-
      The pattern fades after a few seconds unless the polarisation changes, and not everyone
      perceives it.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
