text:
  de:
    name: Cyanacrylat-Klebstoff (Sekundenkleber)
    description: >-
      Cyanacrylate sind flüssige Monomere, die bei Kontakt mit Spuren von Feuchtigkeit oder
      anderen schwachen Basen auf einer Oberfläche innerhalb von Sekunden anionisch polymerisieren.
      Dabei entsteht ein fester Kunststofffilm, der eng aneinanderliegende Teile verklebt.
      Cyanacrylat-Dämpfe polymerisieren auch an den Rückständen von Fingerabdrücken und machen
      deren Linien weiß sichtbar.
    example: >-
      Sekundenkleber für Haushalt und Elektronik, Gewebekleber zum Wundverschluss, Bedampfen
      latenter Fingerabdrücke in der Kriminaltechnik, Kleben von Dehnungsmessstreifen
    conditions: >-
      Eine dünne Klebefuge zwischen eng anliegenden Flächen und etwas Luft- oder Oberflächenfeuchte.
    limits: >-
      Die Klebung ist spröde mit geringer Schäl- und Schlagfestigkeit, wenig beständig gegen
      Wärme und Dauerfeuchte und füllt große Spalten schlecht.
    sideEffects: >-
      Haut und Augenlider verkleben sofort, die Dämpfe reizen Augen und Atemwege, und die
      Polymerisation setzt Wärme frei – auf Baumwolle so viel, dass Verbrennungen möglich
      sind.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Cyanoacrylate adhesive (superglue)
    description: >-
      Cyanoacrylates are liquid monomers that polymerise anionically within seconds on contact
      with traces of moisture or other weak bases on a surface. This creates a solid plastic
      film that bonds closely fitting parts. Cyanoacrylate vapour also polymerises on the
      residues of fingerprints and makes their ridges visible in white.
    example: >-
      Superglue for household and electronics, tissue adhesive for wound closure, fuming of
      latent fingerprints in forensics, bonding of strain gauges
    conditions: >-
      A thin bond line between closely fitting surfaces and some humidity in the air or on
      the surface.
    limits: >-
      The bond is brittle with low peel and impact strength, has limited resistance to heat
      and permanent moisture, and fills large gaps poorly.
    sideEffects: >-
      Skin and eyelids stick together instantly, the vapours irritate eyes and airways, and
      the polymerisation releases heat – on cotton enough to cause burns.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
