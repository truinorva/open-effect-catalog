text:
  de:
    name: Längenkontraktion (Lorentz-Kontraktion)
    description: >-
      Nach der speziellen Relativitätstheorie misst ein Beobachter einen Körper, der sich
      relativ zu ihm bewegt, in Bewegungsrichtung kürzer als im Ruhezustand. Der Verkürzungsfaktor
      ist der Kehrwert des Lorentz-Faktors und wird erst bei Geschwindigkeiten nahe der Lichtgeschwindigkeit
      merklich; quer zur Bewegung bleiben die Abmessungen unverändert. Es handelt sich um
      eine Eigenschaft von Raum und Zeit, nicht um eine mechanische Stauchung, so dass im
      Körper keine Spannungen entstehen.
    example: >-
      Myonen aus der Höhenstrahlung erreichen den Erdboden, Kollisionen scheibenförmig abgeplatteter
      schwerer Ionen in Teilchenbeschleunigern, kurze Wellenlänge der Undulatorstrahlung in
      Freie-Elektronen-Lasern
    conditions: >-
      Relativbewegung mit einem erheblichen Bruchteil der Lichtgeschwindigkeit.
    limits: >-
      Bei alltäglichen Geschwindigkeiten ist die Verkürzung unmessbar klein; bei 1 % der Lichtgeschwindigkeit
      beträgt sie nur 0,005 %.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Length contraction (Lorentz contraction)
    description: >-
      According to special relativity, an observer measures a body moving relative to them
      as shorter in the direction of motion than at rest. The contraction factor is the inverse
      of the Lorentz factor and only becomes noticeable at speeds close to the speed of light;
      dimensions across the motion remain unchanged. It is a property of space and time, not
      a mechanical compression, so no stresses arise in the body.
    example: >-
      Cosmic-ray muons reaching the ground, collisions of pancake-flattened heavy ions in
      particle accelerators, short wavelength of undulator radiation in free-electron lasers
    conditions: Relative motion at a considerable fraction of the speed of light.
    limits: >-
      At everyday speeds the contraction is immeasurably small; at 1 % of the speed of light
      it amounts to only 0.005 %.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
