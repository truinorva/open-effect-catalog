text:
  de:
    name: Magnetorheologische Flüssigkeit
    description: >-
      Eine magnetorheologische Flüssigkeit ist eine Suspension aus mikrometergroßen, weichmagnetischen
      Eisenpartikeln in einem Trägeröl. Im Magnetfeld werden die Partikel magnetisiert und
      reihen sich zu Ketten entlang der Feldlinien auf, wodurch die Flüssigkeit innerhalb
      von Millisekunden eine Fließgrenze erhält und fast fest wird. Über die Feldstärke lässt
      sich ihr Fließwiderstand stufenlos und umkehrbar einstellen.
    example: >-
      Adaptive Stoßdämpfer in Fahrzeugen, Kupplungen und Bremsen, Schwingungsdämpfer an Brücken
      und Gebäuden, Prothesenkniegelenke, Feinpolieren optischer Linsen (magnetorheologisches
      Finishing)
    conditions: >-
      Ein Magnetfeld quer zur Fließ- oder Scherrichtung, meist erzeugt durch eine Spule im
      Bauteil.
    limits: >-
      Die erreichbare Fließgrenze ist durch die Sättigungsmagnetisierung der Partikel auf
      etwa 50 bis 100 Kilopascal begrenzt; ohne Bewegung setzen sich die schweren Partikel
      allmählich ab.
    sideEffects: >-
      Die abrasiven Partikel verschleißen Dichtungen, und die Flüssigkeit kann mit der Zeit
      eindicken.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Magnetorheological fluid
    description: >-
      A magnetorheological fluid is a suspension of micrometre-sized soft magnetic iron particles
      in a carrier oil. In a magnetic field the particles become magnetised and line up in
      chains along the field lines, so the fluid acquires a yield stress within milliseconds
      and becomes almost solid. Its resistance to flow can be adjusted continuously and reversibly
      via the field strength.
    example: >-
      Adaptive shock absorbers in vehicles, clutches and brakes, vibration dampers on bridges
      and buildings, prosthetic knee joints, fine polishing of optical lenses (magnetorheological
      finishing)
    conditions: >-
      A magnetic field across the direction of flow or shear, usually generated by a coil
      in the device.
    limits: >-
      The achievable yield stress is limited by the saturation magnetisation of the particles
      to about 50 to 100 kilopascals; without agitation the heavy particles gradually settle.
    sideEffects: The abrasive particles wear seals, and the fluid can thicken over time.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
