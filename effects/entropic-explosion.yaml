text:
  de:
    name: Entropische Explosion
    description: >-
      Bei einer entropischen Explosion zerfällt ein fester Stoff schlagartig in viele kleine
      Gasmoleküle, ohne dass dabei viel Wärme frei wird. Die treibende Kraft ist vor allem
      der große Entropiegewinn beim Übergang vom geordneten Feststoff zu einer Vielzahl von
      Gasteilchen, die sofort einen hohen Druck aufbauen. Als Beispiel gilt Triacetontriperoxid
      (TATP), dessen Zerfall nach theoretischen Untersuchungen nur schwach exotherm ist.
    example: Zerfall von Triacetontriperoxid (TATP)
    conditions: Ein Stoff, der in sehr viele gasförmige Bruchstücke zerfallen kann.
    limits: ''
    sideEffects: >-
      Solche Stoffe sind oft extrem empfindlich gegen Schlag, Reibung und Wärme.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Entropic explosion
    description: >-
      In an entropic explosion, a solid suddenly decomposes into many small gas molecules
      without releasing much heat. The driving force is mainly the large gain in entropy in
      going from an ordered solid to a multitude of gas particles, which immediately build
      up a high pressure. A cited example is triacetone triperoxide (TATP), whose decomposition,
      according to theoretical studies, is only weakly exothermic.
    example: Decomposition of triacetone triperoxide (TATP)
    conditions: A substance that can break down into very many gaseous fragments.
    limits: ''
    sideEffects: >-
      Such substances are often extremely sensitive to impact, friction and heat.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
