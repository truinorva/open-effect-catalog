text:
  de:
    name: Aufkohlen
    description: >-
      Beim Aufkohlen wird Stahl mit niedrigem Kohlenstoffgehalt bei etwa 880 bis 950 °C in
      einer kohlenstoffabgebenden Umgebung geglüht – in Gas, Salzschmelze, Pulver oder Niederdruckatmosphäre.
      Kohlenstoff diffundiert dabei in die Randschicht und reichert sie auf etwa 0,6 bis 0,9
      Prozent an; die Eindringtiefe wächst mit Temperatur und Zeit. Beim anschließenden Härten
      wird die kohlenstoffreiche Randschicht hart, während der kohlenstoffarme Kern zäh bleibt.
    example: Getriebezahnräder, Kolbenbolzen, Wälzlagerringe aus Einsatzstahl
    conditions: >-
      Austenitisches Gefüge (hohe Temperatur) und eine Atmosphäre mit genau eingestelltem
      Kohlenstoffpegel.
    limits: >-
      Die Diffusion ist langsam: Einsatzhärtetiefen von mehr als etwa zwei Millimetern erfordern
      sehr lange Glühzeiten.
    sideEffects: >-
      Bei der Gasaufkohlung kann Randoxidation auftreten; lange Glühzeiten vergröbern das
      Korn, und das anschließende Härten verursacht Verzug.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Carburising
    description: >-
      In carburising, low-carbon steel is held at about 880 to 950 °C in a carbon-releasing
      environment – gas, salt bath, powder pack or low-pressure atmosphere. Carbon diffuses
      into the surface layer and enriches it to about 0.6 to 0.9 per cent; the penetration
      depth grows with temperature and time. On subsequent hardening, the carbon-rich case
      becomes hard while the low-carbon core remains tough.
    example: >-
      Transmission gears, piston pins, rolling bearing rings made of case-hardening steel
    conditions: >-
      An austenitic structure (high temperature) and an atmosphere with a precisely set carbon
      potential.
    limits: >-
      Diffusion is slow: case depths of more than about two millimetres require very long
      treatment times.
    sideEffects: >-
      Gas carburising can cause internal oxidation near the surface; long treatment times
      coarsen the grain, and the subsequent hardening causes distortion.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
