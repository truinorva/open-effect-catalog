text:
  de:
    name: Ampèresches Durchflutungsgesetz
    description: >-
      Jeder elektrische Strom ist von einem Magnetfeld umgeben, dessen Feldlinien den Leiter
      ringförmig umschließen. Das Gesetz besagt, dass die magnetische Feldstärke, aufsummiert
      entlang einer geschlossenen Linie, gleich dem gesamten Strom ist, der die umschlossene
      Fläche durchsetzt; viele Windungen einer Spule vervielfachen so das Feld, und umgekehrt
      lässt sich aus dem Feld um einen Leiter dessen Strom bestimmen.
    example: >-
      Elektromagnete und Spulen, Auslegung von Motoren und Transformatoren, Stromzangen, Rogowski-Spulen,
      Feldberechnung in Koaxialkabeln
    conditions: ''
    limits: >-
      In dieser einfachen Form gilt das Gesetz für zeitlich konstante Ströme; bei schnell
      veränderlichen Feldern muss der Verschiebungsstrom ergänzt werden.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Ampère's circuital law
    description: >-
      Every electric current is surrounded by a magnetic field whose field lines encircle
      the conductor. The law states that the magnetic field strength, summed along a closed
      loop, equals the total current passing through the enclosed surface; the many turns
      of a coil thus multiply the field, and conversely the current in a conductor can be
      determined from the field around it.
    example: >-
      Electromagnets and coils, design of motors and transformers, clamp meters, Rogowski
      coils, field calculation in coaxial cables
    conditions: ''
    limits: >-
      In this simple form the law holds for steady currents; for rapidly changing fields the
      displacement current must be added.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
