text:
  de:
    name: Flüssig-Flüssig-Extraktion
    description: >-
      Bei der Flüssig-Flüssig-Extraktion wird eine Lösung mit einem zweiten Lösungsmittel,
      das sich mit ihr nicht mischt, in innigen Kontakt gebracht. Gelöste Stoffe verteilen
      sich dabei nach ihrer unterschiedlichen Löslichkeit auf beide Phasen und reichern sich
      in derjenigen an, in der sie sich besser lösen. Anschließend trennen sich die Phasen
      wegen ihres Dichteunterschieds wieder, und mehrstufige Gegenstromanordnungen verstärken
      die Trennwirkung.
    example: >-
      Gewinnung und Trennung von Metallen wie Kupfer und Seltenen Erden, Aufarbeitung von
      Kernbrennstoff (PUREX-Verfahren), Entkoffeinierung, Gewinnung von Aromen und Wirkstoffen,
      Aromatenextraktion in Raffinerien
    conditions: >-
      Zwei nicht oder nur begrenzt mischbare Flüssigkeiten und ein Stoff, dessen Löslichkeit
      in beiden deutlich verschieden ist.
    limits: >-
      Bildet sich eine stabile Emulsion, trennen sich die Phasen nur langsam; das Lösungsmittel
      muss anschließend zurückgewonnen werden.
    sideEffects: >-
      Viele Extraktionsmittel sind brennbar oder giftig, und Lösungsmittelreste können im
      Produkt verbleiben.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Liquid-liquid extraction
    description: >-
      In liquid-liquid extraction, a solution is brought into intimate contact with a second
      solvent that does not mix with it. Dissolved substances distribute between the two phases
      according to their different solubilities and accumulate in the one in which they dissolve
      better. The phases then separate again because of their density difference, and multistage
      countercurrent arrangements increase the separation effect.
    example: >-
      Recovery and separation of metals such as copper and rare earths, reprocessing of nuclear
      fuel (PUREX process), decaffeination, extraction of flavours and active ingredients,
      aromatics extraction in refineries
    conditions: >-
      Two immiscible or only partially miscible liquids and a substance whose solubility in
      them differs markedly.
    limits: >-
      If a stable emulsion forms, the phases separate only slowly; the solvent subsequently
      has to be recovered.
    sideEffects: >-
      Many extraction solvents are flammable or toxic, and solvent residues can remain in
      the product.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
