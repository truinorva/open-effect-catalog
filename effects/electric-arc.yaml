text:
  de:
    name: Lichtbogen
    description: >-
      Ein Lichtbogen ist eine Gasentladung mit hoher Stromstärke und vergleichsweise geringer
      Brennspannung zwischen zwei Elektroden. Das Gas im Entladungskanal wird zu einem Plasma
      von mehreren tausend Kelvin, das hell leuchtet und den Strom leitet; die Elektrodenoberflächen
      werden dabei stark erhitzt und können schmelzen.
    example: >-
      Lichtbogenschweißen, Elektrolichtbogenofen, Plasmaschneiden, Bogenlampe, Xenon-Kurzbogenlampe
    conditions: >-
      Ausreichende Stromstärke und eine Zündung, z. B. durch kurzes Berühren der Elektroden
      oder einen Hochspannungsimpuls.
    limits: >-
      Wegen seiner fallenden Strom-Spannungs-Kennlinie braucht der Lichtbogen eine strombegrenzende
      Quelle oder ein Vorschaltgerät.
    sideEffects: >-
      Intensive UV-Strahlung, Elektrodenabbrand, Bildung von Ozon und Stickoxiden sowie Brand-
      und Verletzungsgefahr durch ungewollte Störlichtbögen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electric arc
    description: >-
      An electric arc is a gas discharge with high current and comparatively low burning voltage
      between two electrodes. The gas in the discharge channel becomes a plasma at several
      thousand kelvin that glows brightly and conducts the current; the electrode surfaces
      are heated strongly and may melt.
    example: >-
      Arc welding, electric arc furnace, plasma cutting, arc lamp, xenon short-arc lamp
    conditions: >-
      Sufficient current and ignition, e.g. by briefly touching the electrodes or by a high-voltage
      pulse.
    limits: >-
      Because of its falling current–voltage characteristic, the arc needs a current-limiting
      source or ballast.
    sideEffects: >-
      Intense UV radiation, electrode erosion, formation of ozone and nitrogen oxides, and
      fire and injury hazards from unintended fault arcs.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
