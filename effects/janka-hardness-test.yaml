text:
  de:
    name: Janka-Härteprüfung
    description: >-
      Bei der Janka-Härteprüfung wird eine Stahlkugel mit 11,28 mm Durchmesser bis zur halben
      Kugel in eine Holzprobe gedrückt, was einer Eindruckfläche von 100 mm² entspricht. Die
      dafür nötige Kraft ist der Härtewert; sie zeigt, wie gut das Holz Eindrücken und Abnutzung
      widersteht.
    example: >-
      Vergleich von Holzarten für Parkett und Dielen, Auswahl von Hölzern für Werkzeuggriffe
      und Möbel
    conditions: >-
      Holzproben mit genormter Feuchte; geprüft wird meist auf der Seitenfläche, gelegentlich
      auch auf der Stirnfläche.
    limits: >-
      Das Verfahren ist auf Holz und ähnlich weiche Werkstoffe zugeschnitten, und spröde Proben
      können beim Eindrücken reißen.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Janka hardness test
    description: >-
      The Janka hardness test presses a steel ball 11.28 mm in diameter into a wood sample
      until half the ball is embedded, which corresponds to a projected area of 100 mm². The
      force needed for this is the hardness value; it indicates how well the wood resists
      denting and wear.
    example: >-
      Comparing wood species for flooring and boards, selecting woods for tool handles and
      furniture
    conditions: >-
      Wood samples with standardised moisture content; usually tested on the side grain, sometimes
      on the end grain.
    limits: >-
      The method is tailored to wood and similarly soft materials, and brittle samples may
      split during indentation.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
