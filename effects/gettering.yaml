text:
  de:
    name: Gettern (Getterwirkung)
    description: >-
      Ein Getter ist ein Stoff oder Bereich, der unerwünschte Atome dauerhaft bindet und sie
      so von der Stelle fernhält, an der sie stören. In Vakuumröhren binden reaktive Metalle
      wie Barium, Titan oder Zirconium Restgase chemisch; in Siliziumscheiben fangen Kristallfehler,
      Sauerstoffausscheidungen oder eine gezielt geschädigte Rückseite, etwa durch Laserbestrahlung
      (Lasergettern), Metallverunreinigungen ab, bevor sie die aktive Bauteilzone erreichen.
    example: >-
      Bariumspiegel in Elektronenröhren, Getterpumpen und NEG-Beschichtungen in Ultrahochvakuum-Anlagen,
      Vakuumdämmpaneele, intrinsisches und extrinsisches Gettern von Siliziumwafern
    conditions: >-
      Vakuumgetter müssen aktiviert (erhitzt oder verdampft) werden; beim Gettern im Silizium
      müssen die Verunreinigungen bei erhöhter Temperatur diffundieren können.
    limits: >-
      Die Aufnahmefähigkeit ist begrenzt, und Edelgase werden von chemischen Gettern nicht
      gebunden.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Gettering
    description: >-
      A getter is a substance or region that permanently binds unwanted atoms and so keeps
      them away from where they cause harm. In vacuum tubes, reactive metals such as barium,
      titanium or zirconium chemically bind residual gases; in silicon wafers, crystal defects,
      oxygen precipitates or a deliberately damaged back side, for example by laser irradiation
      (laser gettering), trap metal impurities before they reach the active device zone.
    example: >-
      Barium mirrors in electron tubes, getter pumps and NEG coatings in ultra-high-vacuum
      systems, vacuum insulation panels, intrinsic and extrinsic gettering of silicon wafers
    conditions: >-
      Vacuum getters must be activated (heated or evaporated); gettering in silicon requires
      a temperature high enough for the impurities to diffuse.
    limits: Capacity is limited, and noble gases are not bound by chemical getters.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
