text:
  de:
    name: Dichtegradient (Dichteschichtung)
    description: >-
      Nimmt die Dichte eines Fluids von oben nach unten stetig zu, etwa durch Unterschiede
      im Salzgehalt, in der Zuckerkonzentration oder in der Temperatur, ist die Schichtung
      im Schwerefeld stabil und unterdrückt Konvektion. Ein eingebrachter Körper oder ein
      Teilchen sinkt oder steigt genau bis in die Höhe, in der die umgebende Dichte seiner
      eigenen entspricht, und schwebt dort. So lassen sich Stoffe nach ihrer Dichte trennen,
      Dichten messen und warme und kalte Schichten voneinander getrennt halten.
    example: >-
      Dichtegradientensäule zur Dichtebestimmung von Kunststoffen, Dichtegradientenzentrifugation
      von DNA, Viren und Zellen, geschichtete Warmwasserspeicher, Salzgradient-Solarteiche,
      Schichtcocktails
    conditions: >-
      Eine stabile Schichtung mit der höchsten Dichte unten und möglichst wenig Störung durch
      Strömung und Erschütterung.
    limits: >-
      Diffusion und Wärmeleitung gleichen den Gradienten mit der Zeit aus, und Rühren oder
      Einströmen zerstört ihn sofort.
    sideEffects: >-
      In Seen und Meeren verhindert eine stabile Schichtung den Sauerstoffaustausch mit dem
      Tiefenwasser.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Density gradient (density stratification)
    description: >-
      If the density of a fluid increases steadily from top to bottom, for example through
      differences in salt content, sugar concentration or temperature, the layering is stable
      in the gravitational field and suppresses convection. A body or particle placed in it
      sinks or rises exactly to the height at which the surrounding density matches its own
      and stays suspended there. This makes it possible to separate substances by density,
      measure densities and keep warm and cold layers apart.
    example: >-
      Density gradient columns for determining the density of plastics, density gradient centrifugation
      of DNA, viruses and cells, stratified hot-water storage tanks, salt-gradient solar ponds,
      layered cocktails
    conditions: >-
      Stable layering with the highest density at the bottom and as little disturbance from
      flow and vibration as possible.
    limits: >-
      Diffusion and heat conduction even out the gradient over time, and stirring or inflowing
      fluid destroys it immediately.
    sideEffects: >-
      In lakes and seas, stable stratification prevents oxygen exchange with the deep water.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
