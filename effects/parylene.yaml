text:
  de:
    name: Parylene-Beschichtung
    description: >-
      Parylene sind Polymere aus der Gruppe der Poly(p-xylylene), die im Vakuum aus der Gasphase
      abgeschieden werden. Ein festes Dimer wird verdampft, bei hoher Temperatur in reaktive
      Monomere gespalten, und diese polymerisieren bei Raumtemperatur auf allen Oberflächen
      in der Beschichtungskammer. So entsteht eine gleichmäßig dicke, porenfreie Schicht,
      die auch Kanten, Spalte und Unterseiten umhüllt und gegen Feuchte, Chemikalien und elektrischen
      Strom isoliert.
    example: >-
      Schutzbeschichtung von Leiterplatten, Herzschrittmacher und Implantate, Katheter und
      Stents, MEMS-Sensoren, Konservierung von Papier und Sammlungsobjekten
    conditions: >-
      Eine Vakuumanlage mit Verdampfer, Pyrolyseofen und Beschichtungskammer; Haftvermittler
      wie Silane verbessern die Haftung auf vielen Untergründen.
    limits: >-
      Die Schicht lässt sich kaum gezielt wieder entfernen, was Reparaturen an beschichteten
      Baugruppen erschwert.
    sideEffects: >-
      Stellen, die frei bleiben sollen, wie Stecker und Kontakte, müssen vor dem Beschichten
      aufwendig abgedeckt werden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Parylene coating
    description: >-
      Parylenes are polymers of the poly(p-xylylene) family deposited from the vapour phase
      in a vacuum. A solid dimer is vaporised and split at high temperature into reactive
      monomers, which polymerise at room temperature on all surfaces in the coating chamber.
      The result is a uniformly thick, pinhole-free layer that also covers edges, gaps and
      undersides and insulates against moisture, chemicals and electric current.
    example: >-
      Protective coating of circuit boards, pacemakers and implants, catheters and stents,
      MEMS sensors, conservation of paper and collection objects
    conditions: >-
      A vacuum system with vaporiser, pyrolysis furnace and deposition chamber; adhesion promoters
      such as silanes improve adhesion on many substrates.
    limits: >-
      The coating can hardly be removed selectively, which makes repairs to coated assemblies
      difficult.
    sideEffects: >-
      Areas that must stay uncoated, such as connectors and contacts, have to be masked laboriously
      before coating.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
