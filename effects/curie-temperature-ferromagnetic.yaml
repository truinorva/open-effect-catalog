text:
  de:
    name: Curie-Temperatur (ferromagnetisch)
    description: >-
      Oberhalb der Curie-Temperatur verliert ein ferromagnetischer Stoff seine spontane Magnetisierung
      und wird paramagnetisch, weil die Wärmebewegung die Ausrichtung der magnetischen Momente
      zerstört. Er wird dann von einem Magneten kaum noch angezogen; beim Abkühlen kehrt der
      Ferromagnetismus zurück. Der Übergang wirkt so wie ein eingebauter Temperaturschalter.
    example: >-
      Lötspitzen mit Curie-Punkt-Regelung, magnetischer Thermostat im Reiskocher, selbstbegrenzende
      Induktionserwärmung mit Curie-Punkt-Legierungen, wärmeunterstützte Magnetaufzeichnung
      (HAMR) und magnetooptische Platten
    conditions: >-
      Ein ferro- oder ferrimagnetischer Werkstoff, dessen Curie-Temperatur über die Zusammensetzung
      auf den gewünschten Wert eingestellt ist.
    limits: >-
      Der Schaltpunkt ist durch den Werkstoff festgelegt, und um ihn zu verschieben, braucht
      man eine andere Legierung.
    sideEffects: >-
      Dauermagnete, die über die Curie-Temperatur erwärmt werden, verlieren ihre Magnetisierung
      und müssen neu aufmagnetisiert werden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Curie temperature (ferromagnetic)
    description: >-
      Above the Curie temperature a ferromagnetic material loses its spontaneous magnetisation
      and becomes paramagnetic, because thermal agitation destroys the alignment of the magnetic
      moments. It is then hardly attracted by a magnet any more; on cooling, the ferromagnetism
      returns. The transition thus acts like a built-in temperature switch.
    example: >-
      Soldering tips with Curie-point temperature control, magnetic thermostat in rice cookers,
      self-limiting induction heating with Curie-point alloys, heat-assisted magnetic recording
      (HAMR) and magneto-optical discs
    conditions: >-
      A ferromagnetic or ferrimagnetic material whose Curie temperature is set to the desired
      value by its composition.
    limits: >-
      The switching point is fixed by the material, and changing it requires a different alloy.
    sideEffects: >-
      Permanent magnets heated above the Curie temperature lose their magnetisation and have
      to be remagnetised.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
