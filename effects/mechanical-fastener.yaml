text:
  de:
    name: Mechanisches Verbindungselement
    description: >-
      Mechanische Verbindungselemente wie Schrauben, Muttern, Niete, Stifte, Bolzen, Klammern
      und Clips fügen Bauteile durch Formschluss, Kraftschluss oder beides. Eine Schraubverbindung
      wird etwa durch Anziehen vorgespannt, so dass die Reibung zwischen den gepressten Flächen
      und im Gewinde die Teile hält, während ein Niet oder Stift die Teile durch seine Form
      gegeneinander sperrt. Viele dieser Verbindungen lassen sich ohne Zerstörung wieder lösen.
    example: >-
      Schraubverbindungen im Maschinen- und Stahlbau, Nietverbindungen im Flugzeugbau, Schnappverbindungen
      an Kunststoffgehäusen, Spannstifte, Sicherungsringe, Kabelbinder
    conditions: >-
      Passende Bohrungen, Gewinde oder Aufnahmen in den Fügeteilen und bei kraftschlüssigen
      Verbindungen eine ausreichende Vorspannkraft.
    limits: >-
      Schrauben können sich unter Vibration lösen, und Bohrungen schwächen die Bauteile örtlich.
    sideEffects: >-
      Wo sich unterschiedliche Metalle berühren, kann Kontaktkorrosion auftreten.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Mechanical fastener
    description: >-
      Mechanical fasteners such as screws, nuts, rivets, pins, bolts, clamps and clips join
      components by form fit, force fit or both. A bolted joint, for example, is preloaded
      by tightening, so that friction between the clamped surfaces and in the thread holds
      the parts, while a rivet or pin locks the parts against each other by its shape. Many
      of these joints can be undone without damage.
    example: >-
      Bolted joints in machine and steel construction, riveted joints in aircraft construction,
      snap fits on plastic housings, spring pins, retaining rings, cable ties
    conditions: >-
      Suitable holes, threads or seats in the parts and, for force-fit joints, sufficient
      preload.
    limits: >-
      Bolts can work loose under vibration, and holes weaken the parts locally.
    sideEffects: Galvanic corrosion can occur where different metals are in contact.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
