text:
  de:
    name: Photoplastischer Effekt
    description: >-
      Bei manchen Halbleiterkristallen, vor allem II-VI-Verbindungen wie Cadmiumsulfid, Zinksulfid
      oder Zinkselenid, verändert Belichtung den Widerstand gegen plastische Verformung. Meist
      steigt die Fließspannung unter Licht an (positiver Effekt), bei einigen Stoffen und
      Bedingungen sinkt sie. Die durch Licht erzeugten Ladungsträger verändern die elektrische
      Ladung von Versetzungen und Gitterhindernissen und damit, wie leicht sich die Versetzungen
      bewegen.
    example: >-
      Untersuchung von Versetzungen in Halbleitern, plastische Verformbarkeit von Zinksulfid-Kristallen
      im Dunkeln, Grundlagenforschung zu lichtgesteuerten mechanischen Eigenschaften
    conditions: >-
      Licht mit einer Photonenenergie im Bereich der Bandlücke und ein Kristall mit elektrisch
      geladenen Versetzungen.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Photoplastic effect
    description: >-
      In some semiconductor crystals, especially II–VI compounds such as cadmium sulphide,
      zinc sulphide or zinc selenide, illumination changes the resistance to plastic deformation.
      Usually the flow stress rises under light (positive effect); for some materials and
      conditions it falls. The charge carriers generated by the light change the electric
      charge of dislocations and lattice obstacles and thus how easily the dislocations move.
    example: >-
      Studying dislocations in semiconductors, plastic deformability of zinc sulphide crystals
      in darkness, basic research on light-controlled mechanical properties
    conditions: >-
      Light with a photon energy around the band gap and a crystal with electrically charged
      dislocations.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
