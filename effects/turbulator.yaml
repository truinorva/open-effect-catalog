text:
  de:
    name: Turbulator
    description: >-
      Ein Turbulator ist eine kleine Störkante, ein Zackenband oder ein Einbau, der eine Strömung
      gezielt turbulent macht. An Tragflügeln verhindert der früh erzwungene Umschlag die
      Ablöseblase einer laminaren Grenzschicht und senkt so den Widerstand; in Wärmetauscherrohren
      durchmischt die Turbulenz die wandnahe Schicht und verbessert den Wärmeübergang deutlich.
    example: >-
      Zackenband an Segelflugzeugflügeln, Drahtspiralen und verdrillte Bänder in Wärmetauscherrohren,
      Einsätze in Rauchrohren von Heizkesseln
    conditions: >-
      Strömung nahe dem Umschlag von laminar zu turbulent; passende Lage und Höhe des Turbulators.
    limits: ''
    sideEffects: In Rohren steigt der Druckverlust.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Turbulator
    description: >-
      A turbulator is a small trip edge, zigzag tape or insert that deliberately makes a flow
      turbulent. On wings, forcing transition early prevents the separation bubble of a laminar
      boundary layer and thus reduces drag; in heat exchanger tubes, turbulence mixes the
      layer near the wall and markedly improves heat transfer.
    example: >-
      Zigzag tape on glider wings, wire coils and twisted tapes in heat exchanger tubes, inserts
      in boiler fire tubes
    conditions: >-
      Flow close to the transition from laminar to turbulent; suitable position and height
      of the turbulator.
    limits: ''
    sideEffects: In tubes the pressure drop increases.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
