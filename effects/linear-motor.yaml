text:
  de:
    name: Linearmotor
    description: >-
      Ein Linearmotor ist ein elektrischer Antrieb, der statt einer Drehbewegung unmittelbar
      eine geradlinige Bewegung erzeugt; man kann ihn sich als aufgeschnittenen und flach
      abgewickelten Drehstrommotor vorstellen. Ein Wanderfeld im Primärteil zieht das Sekundärteil
      entlang der Bahn mit; dieses trägt Permanentmagnete oder Eisenzähne oder ist eine leitfähige
      Platte, in der Wirbelströme induziert werden. Da Getriebe, Spindeln und Riemen entfallen,
      sind hohe Beschleunigungen und genaue Positionierung ohne mechanisches Spiel möglich.
    example: >-
      Werkzeugmaschinen und Bestückungsautomaten, Magnetschwebebahnen, Katapultstarts von
      Achterbahnen, Schiebetürantriebe, Transportsysteme in der Fertigung
    conditions: >-
      Eine elektronische Ansteuerung, die das Wanderfeld erzeugt, und ein Primär- oder Sekundärteil,
      das über den ganzen Verfahrweg reicht.
    limits: >-
      Der Luftspalt muss klein und genau gehalten werden; lange Verfahrwege erfordern viel
      aktives Material und damit hohe Kosten.
    sideEffects: >-
      Starke Magnetkräfte ziehen Eisenspäne an und belasten die Führungen; Wärme entsteht
      direkt am Maschinentisch.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Linear motor
    description: >-
      A linear motor is an electric drive that produces straight-line motion directly instead
      of rotation; it can be pictured as a rotary motor that has been cut open and rolled
      out flat. A travelling field in the primary part pulls the secondary part along the
      track; the secondary carries permanent magnets or iron teeth, or is a conductive plate
      in which eddy currents are induced. Because gears, spindles and belts are eliminated,
      high accelerations and precise positioning without mechanical backlash are possible.
    example: >-
      Machine tools and pick-and-place machines, maglev trains, launch systems of roller coasters,
      sliding door drives, transport systems in manufacturing
    conditions: >-
      Electronic control that generates the travelling field and a primary or secondary part
      extending over the whole travel.
    limits: >-
      The air gap must be kept small and accurate; long travel requires a lot of active material
      and therefore high costs.
    sideEffects: >-
      Strong magnetic forces attract iron chips and load the guides; heat is generated directly
      at the machine table.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
