text:
  de:
    name: Fliehkraftregler
    description: >-
      Zwei Fliehgewichte drehen sich mit einer Welle, die von der Maschine angetrieben wird.
      Steigt die Drehzahl, schwenken sie durch die Fliehkraft nach außen und verschieben über
      ein Gestänge eine Muffe, die die Dampf- oder Kraftstoffzufuhr drosselt; sinkt die Drehzahl,
      öffnet die Zufuhr wieder. So hält der Regler die Drehzahl selbsttätig nahezu konstant.
    example: >-
      Watts Regler an Dampfmaschinen, Drehzahlregler älterer Dieselmotoren und Wasserturbinen,
      Fliehkraftschalter in Elektromotoren, Geschwindigkeitsbegrenzer von Aufzügen
    conditions: >-
      Eine rotierende Welle, deren Drehzahl mit der zu regelnden Größe gekoppelt ist.
    limits: >-
      Ein reiner Fliehkraftregler hält die Drehzahl nur mit einer lastabhängigen bleibenden
      Abweichung (Proportionalregler) und neigt ohne Dämpfung zum Pendeln.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Centrifugal governor
    description: >-
      Two flyweights rotate with a shaft driven by the machine. As speed rises, centrifugal
      force swings them outwards, and via a linkage they move a sleeve that throttles the
      steam or fuel supply; when speed drops, the supply opens again. The governor thus keeps
      the speed almost constant on its own.
    example: >-
      Watt's governor on steam engines, speed governors of older diesel engines and water
      turbines, centrifugal switches in electric motors, overspeed governors of lifts
    conditions: >-
      A rotating shaft whose speed is coupled to the quantity to be controlled.
    limits: >-
      A pure centrifugal governor holds speed only with a load-dependent steady-state offset
      (proportional control) and tends to hunt without damping.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
