text:
  de:
    name: Barnett-Effekt
    description: >-
      Ein ungeladener, zuvor unmagnetisierter Körper wird schwach magnetisch, wenn man ihn
      in schnelle Drehung versetzt. Die Elektronen tragen einen an ihren Spin gekoppelten
      Drehimpuls, und bei der Rotation richten sich die Spins bevorzugt nach der Drehachse
      aus, sodass eine Magnetisierung entsteht; der Effekt ist die Umkehrung des Einstein-de-Haas-Effekts.
    example: >-
      Bestimmung des gyromagnetischen Verhältnisses von Werkstoffen, Grundlagenforschung zur
      Kopplung von Rotation und Spin
    conditions: Sehr hohe Drehzahlen und eine empfindliche Magnetfeldmessung.
    limits: >-
      Die erzeugte Magnetisierung ist äußerst gering und technisch kaum nutzbar.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Barnett effect
    description: >-
      An uncharged, previously unmagnetised body becomes weakly magnetic when it is set spinning
      rapidly. Electrons carry angular momentum tied to their spin, and during rotation the
      spins preferentially align with the axis of rotation, producing a magnetisation; the
      effect is the inverse of the Einstein-de Haas effect.
    example: >-
      Determining the gyromagnetic ratio of materials, fundamental research on the coupling
      of rotation and spin
    conditions: Very high rotational speeds and sensitive magnetic field measurement.
    limits: >-
      The magnetisation produced is extremely small and of little technical use.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
