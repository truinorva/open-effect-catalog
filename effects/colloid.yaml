text:
  de:
    name: Kolloid
    description: >-
      Ein Kolloid ist ein Stoff, der in Form sehr kleiner Teilchen oder Tröpfchen von etwa
      einem Nanometer bis einem Mikrometer Größe in einem anderen Stoff verteilt ist. Die
      Teilchen sind so klein, dass die Brownsche Bewegung ihr Absetzen weitgehend verhindert,
      und ihre riesige Oberfläche bestimmt die Eigenschaften des Systems; abstoßende elektrische
      Ladungen oder adsorbierte Polymere verhindern, dass sie zusammenklumpen.
    example: >-
      Milch, Farben und Tinten, Nebel und Rauch, Gelatine, kolloidales Siliciumdioxid zum
      Polieren von Wafern, Wirkstoffträger aus Nanopartikeln
    conditions: >-
      Teilchengrößen im kolloidalen Bereich und eine Stabilisierung durch Oberflächenladung
      oder Schutzhüllen.
    limits: >-
      Salzzugabe, eine Änderung des pH-Werts, Einfrieren oder Erhitzen können die Stabilisierung
      aufheben, sodass die Teilchen ausflocken.
    sideEffects: >-
      Kolloidal verteilte Stoffe lassen sich nur schwer durch Filtration abtrennen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Colloid
    description: >-
      A colloid is a substance distributed as very small particles or droplets, roughly one
      nanometre to one micrometre in size, in another substance. The particles are so small
      that Brownian motion largely prevents them from settling, and their huge surface area
      determines the properties of the system; repulsive electric charges or adsorbed polymers
      keep them from clumping together.
    example: >-
      Milk, paints and inks, fog and smoke, gelatin, colloidal silica for polishing wafers,
      nanoparticle drug carriers
    conditions: >-
      Particle sizes in the colloidal range and stabilisation by surface charge or protective
      shells.
    limits: >-
      Adding salt, changing the pH, freezing or heating can break the stabilisation so that
      the particles flocculate.
    sideEffects: Colloidally dispersed substances are hard to separate by filtration.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
