text:
  de:
    name: Villari-Effekt (inverser magnetostriktiver Effekt)
    description: >-
      Mechanische Spannungen ändern die Magnetisierung und die Permeabilität ferromagnetischer
      Werkstoffe. Zug oder Druck verschiebt die Ausrichtung der magnetischen Bereiche, je
      nach Vorzeichen der Magnetostriktion in Lastrichtung oder quer dazu. Eine Spule oder
      ein Magnetfeldsensor erfasst diese Änderung, sodass sich Kräfte und Drehmomente berührungslos
      messen lassen.
    example: >-
      Magnetoelastische Drehmomentsensoren an Wellen, Kraftmessdosen nach dem Pressduktor-Prinzip,
      zerstörungsfreie Spannungsmessung in Stahl, Energiegewinnung aus Vibrationen
    conditions: >-
      Ferromagnetischer Werkstoff mit merklicher Magnetostriktion; Vormagnetisierung oder
      Erregerfeld.
    limits: Temperatur, Hysterese und Restmagnetisierung beeinflussen das Signal.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Villari effect (inverse magnetostrictive effect)
    description: >-
      Mechanical stress changes the magnetisation and permeability of ferromagnetic materials.
      Tension or compression shifts the alignment of the magnetic domains, towards or across
      the load direction depending on the sign of the magnetostriction. A coil or magnetic
      field sensor picks up this change, so forces and torques can be measured without contact.
    example: >-
      Magnetoelastic torque sensors on shafts, load cells based on the Pressductor principle,
      non-destructive stress measurement in steel, energy harvesting from vibrations
    conditions: >-
      Ferromagnetic material with appreciable magnetostriction; bias magnetisation or excitation
      field.
    limits: Temperature, hysteresis and remanent magnetisation affect the signal.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
