text:
  de:
    name: Reaktionsrad
    description: >-
      Ein Reaktionsrad ist ein elektrisch angetriebenes Schwungrad in einem Raumfahrzeug.
      Beschleunigt der Motor das Rad in einer Drehrichtung, dreht sich das Fahrzeug wegen
      der Drehimpulserhaltung in die Gegenrichtung; mit drei oder mehr Rädern in verschiedenen
      Achsen lässt sich die Lage ohne Treibstoff fein ausrichten und halten.
    example: >-
      Lageregelung von Satelliten und Weltraumteleskopen wie Hubble und Kepler, Kleinsatelliten
      (CubeSats), selbstbalancierende Würfel und Roboter
    conditions: >-
      Ein drehbar gelagertes Schwungrad mit regelbarem Motor und ein Fahrzeug, das sich frei
      drehen kann, etwa im Weltraum.
    limits: >-
      Äußere Störmomente lassen die Raddrehzahl allmählich bis zur Sättigung ansteigen; der
      überschüssige Drehimpuls muss dann mit Magnettorquern oder Triebwerken abgebaut werden.
    sideEffects: >-
      Lagerverschleiß und Mikrovibrationen können empfindliche Instrumente stören; Lagerausfälle
      haben bereits mehrere Missionen beeinträchtigt.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Reaction wheel
    description: >-
      A reaction wheel is an electrically driven flywheel inside a spacecraft. When the motor
      accelerates the wheel in one direction, the vehicle turns in the opposite direction
      because angular momentum is conserved; with three or more wheels on different axes,
      attitude can be finely adjusted and held without propellant.
    example: >-
      Attitude control of satellites and space telescopes such as Hubble and Kepler, small
      satellites (CubeSats), self-balancing cubes and robots
    conditions: >-
      A flywheel on bearings with a controllable motor, and a vehicle free to rotate, for
      example in space.
    limits: >-
      External disturbance torques gradually raise the wheel speed up to saturation; the excess
      momentum must then be dumped with magnetorquers or thrusters.
    sideEffects: >-
      Bearing wear and micro-vibrations can disturb sensitive instruments; bearing failures
      have already impaired several missions.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
