text:
  de:
    name: Radiolumineszenz (Röntgenlumineszenz)
    description: >-
      Ionisierende Strahlung wie Alpha-, Beta-, Gamma- oder Röntgenstrahlung regt in einem
      Leuchtstoff Elektronen an, die beim Zurückfallen in tiefere Energiezustände sichtbares
      Licht aussenden. Geht die Anregung von Röntgenstrahlung aus, spricht man von Röntgenlumineszenz;
      so lassen sich unsichtbare Strahlen in sichtbares Licht umwandeln oder Lichtquellen
      bauen, die ohne äußere Stromversorgung dauerhaft leuchten.
    example: >-
      Tritium-Leuchtröhrchen in Uhren, Notausgangsschildern und Zielvorrichtungen, historische
      Radium-Leuchtziffern, Verstärkerfolien und Leuchtschirme in der Röntgendiagnostik, Röntgenbildverstärker
    conditions: >-
      Ein Leuchtstoff wie Zinksulfid, Gadoliniumoxysulfid oder Cäsiumiodid und eine Strahlungsquelle.
    limits: >-
      Die Helligkeit ist gering und nimmt bei Isotopen-Lichtquellen mit der Halbwertszeit
      ab; der Leuchtstoff altert durch Strahlenschäden.
    sideEffects: >-
      Radioaktive Leuchtfarben wie Radium haben schwere Gesundheitsschäden verursacht; der
      Umgang erfordert Strahlenschutz.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Radioluminescence (X-ray luminescence)
    description: >-
      Ionising radiation such as alpha, beta, gamma or X-rays excites electrons in a phosphor,
      which emit visible light when they fall back to lower energy states. When the excitation
      comes from X-rays it is called X-ray luminescence; in this way invisible radiation can
      be converted into visible light, or light sources can be built that glow permanently
      without an external power supply.
    example: >-
      Tritium light sources in watches, exit signs and gun sights, historic radium dials,
      intensifying screens and fluorescent screens in X-ray diagnostics, X-ray image intensifiers
    conditions: >-
      A phosphor such as zinc sulphide, gadolinium oxysulphide or caesium iodide, and a radiation
      source.
    limits: >-
      Brightness is low and, in isotope light sources, decreases with the half-life; the phosphor
      ages through radiation damage.
    sideEffects: >-
      Radioactive luminous paints such as radium caused severe harm to health; handling requires
      radiation protection.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
