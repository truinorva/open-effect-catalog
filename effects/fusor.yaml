text:
  de:
    name: Farnsworth-Hirsch-Fusor
    description: >-
      In einer Vakuumkammer mit Deuterium unter niedrigem Druck liegt ein kugelförmiges Gitter
      als Kathode auf hoher negativer Spannung gegenüber der geerdeten Außenwand. Ionisiertes
      Deuterium wird zum Zentrum hin beschleunigt, durchfliegt das Gitter und stößt dort mit
      anderen Ionen oder Gasatomen zusammen; ein kleiner Teil verschmilzt dabei und setzt
      Neutronen frei. Die eingesetzte Energie übersteigt die gewonnene Fusionsenergie bei
      weitem, so dass der Fusor nur als Neutronenquelle oder Demonstrationsgerät dient.
    example: Kompakte Neutronenquellen, Lehr- und Amateurversuche zur Kernfusion
    conditions: >-
      Spannungen von einigen zehn Kilovolt und Deuterium unter niedrigem Druck.
    limits: >-
      Viele Ionen treffen das Gitter und erhitzen es; ein Energiegewinn ist nicht erreichbar.
    sideEffects: Neutronen- und Röntgenstrahlung erfordern eine Abschirmung.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Farnsworth–Hirsch fusor
    description: >-
      In a vacuum chamber containing deuterium at low pressure, a spherical grid acting as
      the cathode is held at a high negative voltage relative to the earthed outer wall. Ionised
      deuterium is accelerated towards the centre, passes through the grid and collides there
      with other ions or gas atoms; a small fraction fuses and releases neutrons. The energy
      input far exceeds the fusion energy obtained, so the fusor serves only as a neutron
      source or demonstration device.
    example: Compact neutron sources, teaching and amateur fusion experiments
    conditions: Voltages of several tens of kilovolts and deuterium at low pressure.
    limits: >-
      Many ions strike the grid and heat it; net energy gain cannot be achieved.
    sideEffects: Neutron and X-ray radiation require shielding.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
