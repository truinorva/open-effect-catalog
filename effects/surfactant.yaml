text:
  de:
    name: Tensid
    description: >-
      Tenside sind Moleküle mit einem wasserliebenden und einem wasserabweisenden Teil. Sie
      reichern sich an Grenzflächen zwischen Wasser und Luft, Öl oder Feststoff an und setzen
      dort die Grenzflächenspannung herab; oberhalb einer bestimmten Konzentration lagern
      sie sich zu Mizellen zusammen, die fettige Stoffe in ihrem Inneren einschließen. So
      benetzen wässrige Lösungen Oberflächen besser, lösen Schmutz ab, halten Öltröpfchen
      oder Teilchen in der Schwebe und bilden Schaum.
    example: >-
      Wasch- und Spülmittel, Emulgatoren in Lebensmitteln und Kosmetik, Netzmittel in Pflanzenschutzmitteln
      und Lacken, Sammler und Schäumer in der Flotation, Löschschaum
    conditions: >-
      Ausreichende Konzentration an der Grenzfläche; je nach Tensidtyp passende Wasserhärte
      und passender pH-Wert.
    limits: >-
      Wie gut ein Tensid wirkt, hängt von Temperatur, Salzgehalt und Wasserhärte ab; in hartem
      Wasser fallen manche Seifen als Kalkseife aus.
    sideEffects: >-
      Tenside können in Gewässern schäumen und Wasserorganismen schädigen; unerwünschter Schaum
      stört technische Prozesse.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Surfactant
    description: >-
      Surfactants are molecules with a water-loving and a water-repelling part. They accumulate
      at interfaces between water and air, oil or solids and lower the interfacial tension
      there; above a certain concentration they assemble into micelles that enclose greasy
      substances in their interior. Aqueous solutions thus wet surfaces better, lift off dirt,
      keep oil droplets or particles dispersed and form foam.
    example: >-
      Detergents and dishwashing liquids, emulsifiers in food and cosmetics, wetting agents
      in crop protection products and paints, collectors and frothers in flotation, firefighting
      foam
    conditions: >-
      Sufficient concentration at the interface; for some surfactant types, suitable water
      hardness and pH.
    limits: >-
      How well a surfactant works depends on temperature, salt content and water hardness;
      in hard water some soaps precipitate as lime soap.
    sideEffects: >-
      Surfactants can foam in waterways and harm aquatic organisms; unwanted foam disturbs
      technical processes.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
