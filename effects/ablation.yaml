text:
  de:
    name: Ablation
    description: >-
      Material wird von einer Oberfläche abgetragen, indem es durch sehr hohe Energiezufuhr
      verdampft, sich zersetzt oder in kleinen Partikeln abplatzt, etwa unter einem Laserpuls,
      einem heißen Gasstrom oder einem Lichtbogen. Weil Verdampfen und Zersetzen viel Energie
      verbrauchen und die entstehenden Gase die Oberfläche abschirmen, bleibt das darunterliegende
      Material vergleichsweise kühl.
    example: >-
      Laserablation zum Mikrostrukturieren und Reinigen, ablative Hitzeschilde von Raumkapseln,
      refraktive Laserchirurgie am Auge, Laserablation als Probenahme für die Massenspektrometrie
    conditions: >-
      Eine sehr hohe Energiedichte an der Oberfläche, die schneller zugeführt wird, als Wärme
      ins Innere abfließen kann.
    limits: >-
      Abtragsrate und -tiefe hängen stark davon ab, wie gut der Werkstoff die eingesetzte
      Strahlung oder Wärme aufnimmt.
    sideEffects: >-
      Das abgetragene Material schlägt sich als Dampf oder Partikel in der Umgebung nieder,
      und am Rand kann eine wärmebeeinflusste Zone entstehen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Ablation
    description: >-
      Material is removed from a surface by delivering so much energy that it vaporises, decomposes
      or spalls off in small particles, for example under a laser pulse, a hot gas stream
      or an electric arc. Because vaporisation and decomposition consume a lot of energy and
      the released gases shield the surface, the material underneath stays comparatively cool.
    example: >-
      Laser ablation for micro-structuring and cleaning, ablative heat shields on space capsules,
      refractive laser eye surgery, laser ablation sampling for mass spectrometry
    conditions: >-
      A very high energy density at the surface, delivered faster than heat can flow into
      the bulk.
    limits: >-
      Removal rate and depth depend strongly on how well the material takes up the radiation
      or heat used.
    sideEffects: >-
      The removed material settles as vapour or particles in the surroundings, and a heat-affected
      zone can form at the edge.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
