text:
  de:
    name: Prisma (Optik)
    description: >-
      Ein Prisma ist ein durchsichtiger Körper mit ebenen, gegeneinander geneigten Flächen.
      Weil die Brechzahl von der Wellenlänge abhängt, lenkt es kurzwelliges Licht stärker
      ab als langwelliges und fächert weißes Licht in ein Spektrum auf; andere Bauformen nutzen
      die Totalreflexion an inneren Flächen, um Strahlen umzulenken, Bilder umzukehren oder
      polarisierte Anteile zu trennen.
    example: >-
      Prismenspektrometer, Umkehrprismen in Ferngläsern (Porro- und Dachkantprisma), Pentaprisma
      in Spiegelreflexkameras, Abbe-Refraktometer, Glan-Thompson-Polarisator, Prismenkoppler
    conditions: >-
      Ein Werkstoff, der im genutzten Wellenlängenbereich durchsichtig ist, etwa Glas, Quarz
      oder Calciumfluorid.
    limits: >-
      Die Dispersion von Glas ist im Vergleich zu Beugungsgittern gering und nicht linear,
      was die spektrale Auflösung begrenzt.
    sideEffects: >-
      In Abbildungen entstehen Farbsäume (chromatische Aberration), und an den Flächen geht
      Licht durch Reflexion verloren.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Prism (optics)
    description: >-
      A prism is a transparent body with flat surfaces inclined to one another. Because the
      refractive index depends on wavelength, it deflects short-wavelength light more than
      long-wavelength light and spreads white light into a spectrum; other designs use total
      internal reflection at inner faces to redirect beams, invert images or separate polarised
      components.
    example: >-
      Prism spectrometers, erecting prisms in binoculars (Porro and roof prisms), pentaprism
      in SLR cameras, Abbe refractometer, Glan-Thompson polariser, prism couplers
    conditions: >-
      A material transparent in the wavelength range used, such as glass, quartz or calcium
      fluoride.
    limits: >-
      The dispersion of glass is small and non-linear compared with diffraction gratings,
      which limits spectral resolution.
    sideEffects: >-
      Colour fringes (chromatic aberration) appear in images, and light is lost by reflection
      at the faces.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
