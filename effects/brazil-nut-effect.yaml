text:
  de:
    name: Paranuss-Effekt
    description: >-
      Wird ein Gemenge unterschiedlich großer Körner gerüttelt, wandern die großen nach oben.
      Kleine Körner rutschen in die Lücken unter den großen, und Konvektionsströme im Schüttgut
      tragen die großen zusätzlich nach oben.
    example: >-
      Große Nüsse oben in der Müslipackung, Entmischung von Pulvern beim Transport, Trennung
      von Granulaten nach Korngröße
    conditions: Rüttelbewegung; deutliche Unterschiede in der Korngröße.
    limits: >-
      Dichte, Reibung und Behälterform können die Richtung umkehren (umgekehrter Paranuss-Effekt).
    sideEffects: >-
      Unerwünschte Entmischung von Pulvermischungen in Pharma und Lebensmitteltechnik.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Brazil nut effect
    description: >-
      When a mixture of grains of different sizes is shaken, the large ones move to the top.
      Small grains slip into the gaps beneath the large ones, and convection currents in the
      bulk carry the large ones upward as well.
    example: >-
      Large nuts at the top of a muesli pack, segregation of powders during transport, separating
      granules by size
    conditions: Shaking; clear differences in grain size.
    limits: >-
      Density, friction and container shape can reverse the direction (reverse Brazil nut
      effect).
    sideEffects: >-
      Unwanted segregation of powder blends in pharmaceutical and food processing.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
