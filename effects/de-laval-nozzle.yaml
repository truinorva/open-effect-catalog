text:
  de:
    name: Lavaldüse
    description: >-
      Eine Lavaldüse verengt sich zunächst und weitet sich dann wieder auf. Im engsten Querschnitt
      erreicht das Gas Schallgeschwindigkeit; im anschließenden divergenten Teil expandiert
      es weiter und wird auf Überschallgeschwindigkeit beschleunigt, während Druck und Temperatur
      stark sinken. So wird ein großer Teil der Druck- und Wärmeenergie des Gases in gerichtete
      Bewegungsenergie umgesetzt.
    example: >-
      Raketentriebwerke, Dampfturbinen, Überschallwindkanäle, Strahl- und Kaltgasspritzdüsen,
      Überschallabscheider für Erdgas
    conditions: >-
      Ein ausreichend hohes Druckverhältnis zwischen Einlass und Umgebung, damit im engsten
      Querschnitt Schallgeschwindigkeit erreicht wird.
    limits: >-
      Die Düse ist nur für ein Druckverhältnis optimal, bei anderen Gegendrücken treten Verdichtungsstöße
      oder Strömungsablösung auf.
    sideEffects: >-
      Die starke Abkühlung des Gases kann zu Kondensation oder Vereisung führen, außerdem
      entsteht ein hoher Schallpegel.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: De Laval nozzle
    description: >-
      A de Laval nozzle first narrows and then widens again. At the narrowest cross-section
      the gas reaches the speed of sound; in the following divergent section it keeps expanding
      and is accelerated to supersonic speed while its pressure and temperature drop sharply.
      In this way a large part of the pressure and thermal energy of the gas is converted
      into directed kinetic energy.
    example: >-
      Rocket engines, steam turbines, supersonic wind tunnels, blasting and cold-spray nozzles,
      supersonic separators for natural gas
    conditions: >-
      A sufficiently high pressure ratio between inlet and surroundings for the gas to reach
      the speed of sound at the throat.
    limits: >-
      The nozzle is optimal for only one pressure ratio, and at other back pressures shock
      waves or flow separation occur.
    sideEffects: >-
      The strong cooling of the gas can cause condensation or icing, and the noise level is
      high.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
