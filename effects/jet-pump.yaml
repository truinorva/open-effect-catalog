text:
  de:
    name: Strahlpumpe (Ejektor, Injektor)
    description: >-
      Ein Treibstrahl aus Dampf, Gas oder Flüssigkeit tritt mit hoher Geschwindigkeit aus
      einer Düse in eine Mischkammer. Der Unterdruck im Strahl und die Reibung an seinem Rand
      saugen ein zweites Fluid an und reißen es mit; in einem anschließenden Diffusor wird
      die Geschwindigkeit des Gemischs wieder in Druck umgewandelt. Strahlpumpen kommen ohne
      bewegte Teile aus.
    example: >-
      Wasserstrahlpumpe im Labor, Dampfstrahl-Vakuumpumpen, Speisewasserinjektor an Dampflokomotiven,
      Vakuumejektoren für Sauggreifer, Brunnenpumpen, Bunsenbrenner
    conditions: Ein Treibmedium mit ausreichendem Druck und Durchfluss.
    limits: >-
      Der Wirkungsgrad ist niedrig, weil beim Mischen viel Energie verloren geht, und der
      erreichbare Unterdruck einer Wasserstrahlpumpe ist durch den Dampfdruck des Wassers
      begrenzt.
    sideEffects: >-
      Treib- und Fördermedium vermischen sich zwangsläufig, außerdem entstehen Geräusche.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Jet pump (ejector, injector)
    description: >-
      A motive jet of steam, gas or liquid leaves a nozzle at high speed and enters a mixing
      chamber. The low pressure in the jet and friction at its edge draw in a second fluid
      and entrain it; in a downstream diffuser the speed of the mixture is converted back
      into pressure. Jet pumps have no moving parts.
    example: >-
      Laboratory water aspirator, steam jet vacuum pumps, feedwater injectors on steam locomotives,
      vacuum ejectors for suction grippers, well pumps, Bunsen burners
    conditions: A motive medium with sufficient pressure and flow rate.
    limits: >-
      Efficiency is low because much energy is lost in mixing, and the vacuum attainable with
      a water jet pump is limited by the vapour pressure of water.
    sideEffects: Motive and pumped media inevitably mix, and the pump is noisy.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
