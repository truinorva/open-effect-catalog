text:
  de:
    name: Ultraschall
    description: >-
      Ultraschall sind mechanische Wellen oberhalb von etwa 20 kHz, also jenseits der menschlichen
      Hörgrenze. Wegen der kurzen Wellenlänge lässt er sich bündeln und wird an Grenzflächen
      mit unterschiedlichem Schallwiderstand reflektiert, was Echos zum Messen und Abbilden
      liefert; bei hoher Intensität erzeugt er in Flüssigkeiten Kavitation und Strömungen,
      die reinigen, mischen und zerkleinern.
    example: >-
      Ultraschall-Werkstoffprüfung, medizinische Sonografie, Wanddickenmessung, Ultraschallreinigungsbad,
      Homogenisieren und Emulgieren, Ultraschallvernebler, Ultraschallschweißen
    conditions: >-
      Gute Ankopplung über Flüssigkeit oder Gel, da Ultraschall kaum von Festkörpern in Luft
      übergeht.
    limits: >-
      Die Dämpfung steigt mit der Frequenz, sodass hohe Auflösung mit geringer Eindringtiefe
      erkauft wird; in Luft reicht Ultraschall nur kurze Strecken.
    sideEffects: Erwärmung und Kavitationsschäden bei hoher Leistung.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Ultrasound
    description: >-
      Ultrasound consists of mechanical waves above about 20 kHz, beyond the limit of human
      hearing. Because of its short wavelength it can be focused, and it is reflected at interfaces
      with different acoustic impedance, giving echoes for measurement and imaging; at high
      intensity it creates cavitation and streaming in liquids that clean, mix and break things
      up.
    example: >-
      Ultrasonic non-destructive testing, medical sonography, wall thickness measurement,
      ultrasonic cleaning bath, homogenising and emulsifying, ultrasonic nebulisers, ultrasonic
      welding
    conditions: >-
      Good coupling via liquid or gel, since ultrasound hardly passes from solids into air.
    limits: >-
      Attenuation increases with frequency, so high resolution comes at the cost of low penetration
      depth; in air ultrasound travels only short distances.
    sideEffects: Heating and cavitation damage at high power.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
