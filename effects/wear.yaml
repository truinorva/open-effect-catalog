text:
  de:
    name: Verschleiß
    description: >-
      Gleiten, Rollen oder Aufprallen tragen nach und nach Material von Oberflächen ab. Harte
      Rauheitsspitzen und Partikel ritzen und spanen (Abrasion), Mikroverschweißungen reißen
      Teilchen heraus (Adhäsion), wiederholte Belastung lässt Oberflächen ausbrechen (Ermüdung),
      und chemische Reaktionen bilden Schichten, die abgerieben werden. Der Abtrag wächst
      etwa mit Last und Gleitweg und sinkt mit der Härte des Werkstoffs.
    example: >-
      Einlaufen von Lagern und Zahnrädern, Schleifen und Läppen, Bleistift und Radiergummi,
      selbstschärfende Nagetierzähne, Einlaufbeläge in Turbinen, Verschleißanzeiger an Bremsbelägen
    conditions: Relative Bewegung zwischen Oberflächen unter Last.
    limits: ''
    sideEffects: >-
      Abriebpartikel verunreinigen Schmierstoffe und Umwelt, etwa als Reifenabrieb; Passungen
      und Maßhaltigkeit gehen verloren.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Wear
    description: >-
      Sliding, rolling or impact gradually remove material from surfaces. Hard asperities
      and particles scratch and cut (abrasion), micro-welds tear out fragments (adhesion),
      repeated loading makes surfaces spall (fatigue), and chemical reactions form layers
      that are rubbed off. Material loss grows roughly with load and sliding distance and
      falls with the hardness of the material.
    example: >-
      Running-in of bearings and gears, grinding and lapping, pencil and eraser, self-sharpening
      rodent teeth, abradable seals in turbines, wear indicators on brake pads
    conditions: Relative motion between surfaces under load.
    limits: ''
    sideEffects: >-
      Wear particles contaminate lubricants and the environment, for example as tyre wear;
      fits and dimensional accuracy are lost.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
