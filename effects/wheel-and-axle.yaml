text:
  de:
    name: Wellrad
    description: >-
      Ein großes Rad oder eine Kurbel sitzt fest auf einer Welle mit kleinerem Durchmesser.
      Eine Kraft am großen Radius erzeugt dasselbe Drehmoment wie eine entsprechend größere
      Kraft am kleinen Radius; das Wellrad wirkt so wie ein ständig umlaufender Hebel. Umgekehrt
      angetrieben, setzt es eine kleine Bewegung an der Welle in eine schnelle Bewegung am
      Radumfang um.
    example: Seilwinde, Haspel am Brunnen, Lenkrad, Schraubendreher, Türknauf, Kurbel
    conditions: ''
    limits: >-
      Was an Kraft gewonnen wird, geht an Weg verloren; Lagerreibung mindert den Nutzen.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Wheel and axle
    description: >-
      A large wheel or crank is fixed to a shaft of smaller diameter. A force at the large
      radius produces the same torque as a correspondingly larger force at the small radius;
      the wheel and axle thus acts like a lever that keeps turning. Driven the other way round,
      it converts a small movement at the shaft into a fast movement at the rim.
    example: Winch, well windlass, steering wheel, screwdriver, door knob, crank
    conditions: ''
    limits: >-
      What is gained in force is lost in distance; bearing friction reduces the benefit.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
