text:
  de:
    name: Adsorption
    description: >-
      Moleküle aus einem Gas oder einer Flüssigkeit lagern sich an der Oberfläche eines Feststoffs
      an und werden dort festgehalten, physikalisch durch schwache Van-der-Waals-Kräfte oder
      chemisch durch echte Bindungen (Chemisorption). Weil die gebundene Menge mit der verfügbaren
      Oberfläche wächst, verwendet man hochporöse Adsorbentien; physikalisch gebundene Moleküle
      lassen sich durch Erwärmen oder Druckabsenkung wieder ablösen (Desorption).
    example: >-
      Aktivkohlefilter, Gastrocknung mit Zeolith oder Kieselgel, Druckwechseladsorption zur
      Sauerstoff- und Stickstoffgewinnung, Chromatographie, heterogene Katalyse
    conditions: >-
      Eine große, zugängliche Oberfläche des Adsorbens und eine Affinität zwischen dieser
      Oberfläche und dem zu bindenden Stoff.
    limits: >-
      Die Beladung steigt mit Druck bzw. Konzentration und sinkt mit der Temperatur; ist die
      Oberfläche belegt, muss das Adsorbens regeneriert werden.
    sideEffects: >-
      Bei der Anlagerung wird Wärme frei, die das Adsorbens erwärmt und die weitere Aufnahme
      bremst.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Adsorption
    description: >-
      Molecules from a gas or liquid attach to the surface of a solid and are held there,
      physically by weak van der Waals forces or chemically by genuine bonds (chemisorption).
      Because the amount bound grows with the available surface, highly porous adsorbents
      are used; physically bound molecules can be released again by heating or lowering the
      pressure (desorption).
    example: >-
      Activated carbon filters, gas drying with zeolite or silica gel, pressure swing adsorption
      for producing oxygen and nitrogen, chromatography, heterogeneous catalysis
    conditions: >-
      A large, accessible adsorbent surface and an affinity between that surface and the substance
      to be bound.
    limits: >-
      Loading rises with pressure or concentration and falls with temperature; once the surface
      is occupied, the adsorbent has to be regenerated.
    sideEffects: >-
      Heat is released on adsorption, warming the adsorbent and slowing further uptake.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
