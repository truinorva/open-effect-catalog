text:
  de:
    name: Resonanz
    description: >-
      Wird ein schwingungsfähiges System periodisch mit einer Frequenz nahe seiner Eigenfrequenz
      angeregt, nimmt es in jeder Periode Energie auf, und die Amplitude wächst stark an,
      bis die Dämpfung die Energiezufuhr ausgleicht. Je schwächer die Dämpfung, desto höher
      und schmaler ist die Resonanzspitze; so lassen sich kleine Anregungen verstärken oder
      einzelne Frequenzen gezielt herausfiltern.
    example: >-
      Musikinstrumente und Helmholtz-Resonatoren, Schwingquarze in Uhren, Schwingkreise in
      Radioempfängern, Quarzkristall-Mikrowaagen, Biegeschwinger-Dichtemessgeräte, Ultraschallreinigung,
      Kernspinresonanz
    conditions: >-
      Ein System mit Masse und Rückstellkraft oder einem elektrischen oder akustischen Gegenstück
      dazu und eine periodische Anregung nahe der Eigenfrequenz.
    limits: >-
      Die erreichbare Amplitude wird durch Dämpfung und Nichtlinearitäten begrenzt; bei sehr
      schwacher Dämpfung dauert das Einschwingen lange.
    sideEffects: >-
      Ungewollte Resonanz kann Bauteile und Bauwerke durch übergroße Schwingungen zerstören
      oder ermüden, etwa Brücken, Maschinenwellen oder Rotorblätter.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Resonance
    description: >-
      When an oscillating system is driven periodically at a frequency close to its natural
      frequency, it absorbs energy in every cycle and the amplitude grows strongly until damping
      balances the energy input. The weaker the damping, the higher and narrower the resonance
      peak; small excitations can thus be amplified, or individual frequencies selectively
      filtered out.
    example: >-
      Musical instruments and Helmholtz resonators, quartz crystals in clocks, tuned circuits
      in radio receivers, quartz crystal microbalances, oscillating U-tube density meters,
      ultrasonic cleaning, nuclear magnetic resonance
    conditions: >-
      A system with mass and restoring force, or an electrical or acoustic counterpart, and
      periodic excitation close to the natural frequency.
    limits: >-
      The achievable amplitude is limited by damping and non-linearities; with very low damping
      it takes a long time to build up.
    sideEffects: >-
      Unwanted resonance can destroy or fatigue components and structures through excessive
      vibration, for example bridges, machine shafts or rotor blades.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
