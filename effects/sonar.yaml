text:
  de:
    name: Sonar
    description: >-
      Ein Sonar ortet Gegenstände unter Wasser mit Schall. Das aktive Sonar sendet einen Schallimpuls
      aus und misst die Zeit bis zum Eintreffen des Echos; mit der bekannten Schallgeschwindigkeit
      im Wasser ergibt sich daraus die Entfernung, aus der Empfangsrichtung die Lage des Ziels.
      Das passive Sonar horcht nur auf Geräusche, die das Ziel selbst abgibt.
    example: >-
      Echolot zur Tiefenmessung, Fischfinder, Seitensichtsonar zur Kartierung des Meeresbodens,
      Ortung von U-Booten
    conditions: >-
      Wasser als Ausbreitungsmedium; ein Ziel mit anderer akustischer Impedanz als das Wasser.
    limits: >-
      Temperatur- und Salzgehaltsschichten krümmen die Schallausbreitung und erzeugen Schattenzonen;
      die Auflösung ist durch die Wellenlänge begrenzt.
    sideEffects: Starke Schallimpulse können Meeressäuger stören und schädigen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Sonar
    description: >-
      Sonar locates objects under water using sound. Active sonar emits a sound pulse and
      measures the time until the echo returns; with the known speed of sound in water this
      gives the distance, and the direction of reception gives the target's bearing. Passive
      sonar only listens for noises the target itself makes.
    example: >-
      Echo sounder for depth measurement, fish finder, side-scan sonar for seabed mapping,
      submarine detection
    conditions: >-
      Water as the propagation medium; a target with an acoustic impedance different from
      that of water.
    limits: >-
      Layers of differing temperature and salinity bend the sound paths and create shadow
      zones; resolution is limited by the wavelength.
    sideEffects: Powerful sound pulses can disturb and harm marine mammals.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
