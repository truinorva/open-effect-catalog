text:
  de:
    name: Zweiter Schall
    description: >-
      In suprafluidem Helium unterhalb von etwa 2,17 K breiten sich Temperaturschwankungen
      nicht durch Diffusion aus, sondern als Welle. Nach dem Zweiflüssigkeitsmodell schwingen
      dabei die suprafluide und die normalfluide Komponente gegeneinander, sodass die Dichte
      nahezu konstant bleibt, während sich Temperatur und Entropie periodisch ändern.
    example: >-
      Lokalisieren von Quench-Stellen an supraleitenden Hochfrequenz-Resonatoren mit Second-Sound-Sensoren,
      Untersuchung von Suprafluiden und ultrakalten Quantengasen
    conditions: >-
      Eine suprafluide Phase, etwa Helium-4 unterhalb des Lambda-Punkts bei 2,17 K.
    limits: >-
      Ausgeprägt tritt der Effekt nur in Suprafluiden bei tiefsten Temperaturen auf; in einigen
      sehr reinen Kristallen wurde er ebenfalls bei tiefen Temperaturen beobachtet.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Second sound
    description: >-
      In superfluid helium below about 2.17 K, temperature fluctuations do not spread by diffusion
      but as a wave. According to the two-fluid model, the superfluid and normal-fluid components
      oscillate against each other, so the density stays almost constant while temperature
      and entropy vary periodically.
    example: >-
      Locating quench spots on superconducting radio-frequency cavities with second-sound
      sensors, research on superfluids and ultracold quantum gases
    conditions: A superfluid phase, such as helium-4 below the lambda point at 2.17 K.
    limits: >-
      The effect is pronounced only in superfluids at extremely low temperatures; it has also
      been observed at low temperatures in some very pure crystals.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
