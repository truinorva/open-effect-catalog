text:
  de:
    name: Vakuumraffination (Vakuummetallurgie)
    description: >-
      Metallschmelzen werden unter Vakuum behandelt oder erschmolzen, damit gelöste Gase wie
      Wasserstoff und Stickstoff entweichen. Nach dem Sieverts-Gesetz sinkt ihre Löslichkeit
      mit dem Partialdruck über der Schmelze; zugleich verdampfen leicht flüchtige Verunreinigungen,
      und Reaktionen, die Gas bilden, etwa die Entkohlung zu Kohlenmonoxid, laufen weiter
      ab. So entstehen sehr reine, gasarme Werkstoffe.
    example: >-
      RH- und Pfannenentgasung von Stahl, Vakuum-Sauerstoff-Entkohlung von Edelstahl, Vakuuminduktionsschmelzen
      von Superlegierungen, Elektronenstrahlschmelzen von Titan und Tantal
    conditions: Flüssige Metallschmelze und niedriger Druck über ihrer Oberfläche.
    limits: Aufwendige und teure Anlagen.
    sideEffects: >-
      Legierungselemente mit hohem Dampfdruck wie Mangan verdampfen teilweise mit.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Vacuum refining (vacuum metallurgy)
    description: >-
      Molten metals are treated or melted under vacuum so that dissolved gases such as hydrogen
      and nitrogen escape. According to Sieverts' law their solubility falls with the partial
      pressure above the melt; at the same time volatile impurities evaporate, and gas-forming
      reactions such as decarburisation to carbon monoxide proceed further. The result is
      very pure materials with low gas content.
    example: >-
      RH and ladle degassing of steel, vacuum oxygen decarburisation of stainless steel, vacuum
      induction melting of superalloys, electron beam melting of titanium and tantalum
    conditions: Liquid molten metal and low pressure above its surface.
    limits: Complex and expensive equipment.
    sideEffects: >-
      Alloying elements with high vapour pressure, such as manganese, partly evaporate as
      well.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
