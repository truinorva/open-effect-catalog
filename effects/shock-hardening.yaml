text:
  de:
    name: Explosionshärten (Schockverfestigung)
    description: >-
      Eine starke Stoßwelle, meist von einer auf das Werkstück aufgelegten Sprengstoffschicht,
      läuft durch ein Metall und erzeugt in kürzester Zeit eine hohe Dichte an Versetzungen
      und anderen Gitterfehlern. Diese behindern die weitere plastische Verformung, so dass
      die Oberfläche härter und fester wird, ohne dass das Bauteil wesentlich umgeformt werden
      muss.
    example: Herzstücke von Eisenbahnweichen aus Manganhartstahl
    conditions: >-
      Metalle, die sich durch Verformung stark verfestigen, etwa austenitischer Manganhartstahl.
    limits: ''
    sideEffects: >-
      Arbeiten mit Sprengstoff erfordern besondere Genehmigungen und Sicherheitsmaßnahmen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Shock hardening (explosive hardening)
    description: >-
      A strong shock wave, usually from a layer of explosive placed on the workpiece, travels
      through a metal and creates a high density of dislocations and other lattice defects
      in a very short time. These impede further plastic deformation, so the surface becomes
      harder and stronger without the part having to be substantially reshaped.
    example: Frogs of railway switches made of austenitic manganese steel
    conditions: >-
      Metals that work-harden strongly, such as austenitic manganese (Hadfield) steel.
    limits: ''
    sideEffects: Working with explosives requires special permits and safety measures.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
