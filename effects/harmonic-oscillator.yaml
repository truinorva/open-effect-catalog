text:
  de:
    name: Harmonischer Oszillator (freie und erzwungene Schwingung)
    description: >-
      Wirkt auf einen ausgelenkten Körper eine Rückstellkraft proportional zur Auslenkung,
      etwa durch eine Feder, schwingt er sinusförmig mit einer Eigenfrequenz, die nur von
      Masse und Steifigkeit abhängt, nicht von der Amplitude. Wird er periodisch angeregt,
      folgt er der Anregungsfrequenz; liegt sie nahe der Eigenfrequenz, wächst die Amplitude
      stark an (Resonanz), und nur die Dämpfung begrenzt die Höhe der Spitze. Weit oberhalb
      der Eigenfrequenz bewegt sich die Masse dagegen kaum noch.
    example: >-
      Uhrpendel und Schwingquarz, Schwingungstilger, Schwingungsisolierung von Maschinen,
      Biegeschwinger zur Dichtemessung, Quarzmikrowaage, Seismometer
    conditions: Eine zur Auslenkung lineare Rückstellkraft und kleine Amplituden.
    limits: >-
      Bei großen Auslenkungen wird die Rückstellkraft nichtlinear, und die Frequenz hängt
      von der Amplitude ab.
    sideEffects: >-
      Unerwünschte Resonanzen können Bauteile durch große Amplituden zerstören.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Harmonic oscillator (free and driven oscillation)
    description: >-
      If a displaced body is acted on by a restoring force proportional to the displacement,
      for instance from a spring, it oscillates sinusoidally at a natural frequency that depends
      only on mass and stiffness, not on amplitude. When it is excited periodically, it follows
      the excitation frequency; close to the natural frequency the amplitude grows strongly
      (resonance), and only damping limits the height of the peak. Far above the natural frequency,
      on the other hand, the mass hardly moves at all.
    example: >-
      Clock pendulums and quartz crystals, vibration absorbers, vibration isolation of machines,
      oscillating U-tube density meters, quartz crystal microbalance, seismometers
    conditions: A restoring force linear in the displacement, and small amplitudes.
    limits: >-
      At large displacements the restoring force becomes non-linear and the frequency depends
      on the amplitude.
    sideEffects: Unwanted resonances can destroy components through large amplitudes.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
