text:
  de:
    name: Überlagerung (Heterodynprinzip)
    description: >-
      Werden zwei Schwingungen unterschiedlicher Frequenz in einem nichtlinearen Bauteil gemischt,
      entstehen neue Frequenzen, darunter Summe und Differenz der beiden. Über die Differenzfrequenz
      lässt sich ein hochfrequentes Signal auf eine niedrigere, gut verarbeitbare Zwischenfrequenz
      verschieben, ohne seine Modulation zu verlieren, oder eine kleine Frequenzverschiebung
      genau messen.
    example: >-
      Überlagerungsempfänger (Superhet) in Rundfunk und Funk, Laser-Doppler-Vibrometer, Heterodyn-Interferometer
      zur Positionsmessung, Theremin, Spektrumanalysatoren
    conditions: >-
      Ein nichtlineares Mischelement und ein Überlagerungsoszillator (Lokaloszillator).
    limits: >-
      Neben dem gewünschten Signal wird auch die Spiegelfrequenz auf dieselbe Zwischenfrequenz
      umgesetzt und muss vorher ausgefiltert werden.
    sideEffects: Unerwünschte Mischprodukte können Störsignale erzeugen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Heterodyne
    description: >-
      When two oscillations of different frequency are mixed in a non-linear component, new
      frequencies appear, among them the sum and difference of the two. The difference frequency
      allows a high-frequency signal to be shifted to a lower, easily processed intermediate
      frequency without losing its modulation, or a small frequency shift to be measured precisely.
    example: >-
      Superheterodyne receivers in broadcasting and radio communication, laser Doppler vibrometers,
      heterodyne interferometers for position measurement, theremin, spectrum analysers
    conditions: A non-linear mixing element and a local oscillator.
    limits: >-
      Besides the wanted signal, the image frequency is also converted to the same intermediate
      frequency and must be filtered out beforehand.
    sideEffects: Unwanted mixing products can create spurious signals.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
