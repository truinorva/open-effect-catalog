text:
  de:
    name: Strömungswiderstand
    description: >-
      Ein Körper, der sich relativ zu einem Gas oder einer Flüssigkeit bewegt, erfährt eine
      bremsende Kraft entgegen der Anströmung. Sie setzt sich aus der Reibung an der Oberfläche
      und dem Druckunterschied zwischen Vorder- und Rückseite zusammen, der durch Strömungsablösung
      und Wirbel im Nachlauf entsteht. Bei üblichen Geschwindigkeiten wächst der Widerstand
      etwa mit dem Quadrat der Geschwindigkeit, mit der Stirnfläche und mit der Dichte des
      Fluids.
    example: >-
      Fallschirm, Bremsklappen an Flugzeugen, Treibanker, Schalensternanemometer, Savonius-Rotor,
      Windsichter, Prallscheiben-Durchflussmesser
    conditions: Eine Relativbewegung zwischen Körper und Fluid.
    limits: >-
      Der Widerstand nimmt mit sinkender Geschwindigkeit stark ab, so dass er langsame Bewegungen
      kaum noch bremst.
    sideEffects: >-
      Höherer Kraftstoff- und Energieverbrauch von Fahrzeugen, Pumpen und Rohrleitungen sowie
      Erwärmung und Lärm.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Drag
    description: >-
      A body moving relative to a gas or liquid experiences a retarding force opposite to
      the oncoming flow. It consists of friction on the surface and the pressure difference
      between front and rear caused by flow separation and vortices in the wake. At ordinary
      speeds the drag grows roughly with the square of the speed, with the frontal area and
      with the density of the fluid.
    example: >-
      Parachutes, aircraft air brakes, sea anchors, cup anemometers, Savonius rotors, air
      classifiers, target flow meters
    conditions: Relative motion between body and fluid.
    limits: >-
      Drag decreases sharply as speed falls, so it hardly brakes slow movements any more.
    sideEffects: >-
      Higher fuel and energy consumption of vehicles, pumps and pipelines, and heating and
      noise.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
