text:
  de:
    name: Photonensieb
    description: >-
      Ein Photonensieb ist eine dünne, undurchsichtige Folie oder Platte mit sehr vielen kleinen
      Löchern, die auf den Ringen einer Fresnelschen Zonenplatte verteilt sind. Das an den
      Löchern gebeugte Licht überlagert sich im Brennpunkt phasengleich und wird so ohne Linse
      oder Spiegel gebündelt. Weil Größe und Dichte der Löcher frei wählbar sind, lassen sich
      störende Nebenmaxima stärker unterdrücken als mit einer Zonenplatte.
    example: >-
      Fokussierung weicher Röntgenstrahlung und extremer UV-Strahlung, leichte Membranoptiken
      für Weltraumteleskope, maskenlose Lithografie (Forschung)
    conditions: >-
      Licht einer bestimmten Wellenlänge, da Brennweite und Lochanordnung auf sie abgestimmt
      sind.
    limits: >-
      Nur ein kleiner Teil des Lichts gelangt in den Brennpunkt, und die Brennweite ändert
      sich stark mit der Wellenlänge.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Photon sieve
    description: >-
      A photon sieve is a thin, opaque foil or plate with a great many small holes distributed
      over the rings of a Fresnel zone plate. The light diffracted at the holes adds up in
      phase at the focal point and is thus focused without a lens or mirror. Because the size
      and density of the holes can be chosen freely, unwanted side lobes can be suppressed
      better than with a zone plate.
    example: >-
      Focusing soft X-rays and extreme UV radiation, lightweight membrane optics for space
      telescopes, maskless lithography (research)
    conditions: >-
      Light of a specific wavelength, because focal length and hole pattern are matched to
      it.
    limits: >-
      Only a small fraction of the light reaches the focus, and the focal length changes strongly
      with wavelength.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
