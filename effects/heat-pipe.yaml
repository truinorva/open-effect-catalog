text:
  de:
    name: Wärmerohr (Heatpipe)
    description: >-
      Ein Wärmerohr ist ein evakuiertes, verschlossenes Rohr mit wenig Arbeitsflüssigkeit
      und einer Kapillarstruktur an der Innenwand. Am warmen Ende verdampft die Flüssigkeit,
      der Dampf strömt zum kalten Ende und kondensiert dort unter Abgabe der Verdampfungswärme;
      die Kapillarstruktur saugt das Kondensat zurück, auch gegen die Schwerkraft.
    example: >-
      Prozessorkühlung in Notebooks, Thermalkontrolle von Satelliten, Vakuumröhrenkollektoren,
      LED-Kühlung
    conditions: >-
      Betriebstemperatur zwischen Gefrierpunkt und kritischem Punkt der Arbeitsflüssigkeit.
    limits: >-
      Die übertragbare Leistung ist durch Kapillar-, Siede- und Schallgrenze beschränkt; arbeitet
      das Rohr gegen die Schwerkraft, sinkt sie deutlich.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Heat pipe
    description: >-
      A heat pipe is an evacuated, sealed tube with a small amount of working fluid and a
      capillary wick on its inner wall. At the hot end the liquid evaporates, the vapour flows
      to the cold end and condenses there, giving off its heat of vaporisation; the wick draws
      the condensate back, even against gravity.
    example: >-
      Processor cooling in notebooks, satellite thermal control, evacuated-tube solar collectors,
      LED cooling
    conditions: >-
      Operating temperature between the freezing point and the critical point of the working
      fluid.
    limits: >-
      The transferable power is limited by capillary, boiling and sonic limits; working against
      gravity reduces it considerably.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
