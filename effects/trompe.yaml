text:
  de:
    name: Wassertrommel (Trompe)
    description: >-
      Wasser fällt durch ein senkrechtes Rohr und reißt durch seitliche Öffnungen am oberen
      Ende Luft in Form von Blasen mit. Unten mündet das Rohr in eine Kammer, in der sich
      Luft und Wasser trennen; die Luft sammelt sich dort unter dem Druck der Wassersäule,
      während das Wasser über ein Steigrohr abfließt, dessen Auslauf tiefer liegt als der
      Zulauf. So entsteht Druckluft ohne bewegte Teile.
    example: >-
      Gebläse für historische Schmiedefeuer (katalanische Schmieden), Druckluftversorgung
      von Bergwerken wie in Ragged Chutes (Kanada)
    conditions: Ausreichendes Gefälle und eine tief liegende Abscheidekammer.
    limits: >-
      Der erreichbare Druck ist durch die Höhe der Wassersäule über der Kammer begrenzt, etwa
      1 bar je 10 m.
    sideEffects: >-
      Ein Teil der Luft löst sich unter Druck im Wasser und geht mit ihm verloren.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Trompe
    description: >-
      Water falls down a vertical pipe and draws in air through side openings at the top in
      the form of bubbles. At the bottom the pipe opens into a chamber where air and water
      separate; the air collects there under the pressure of the water column, while the water
      leaves through a riser whose outlet lies lower than the inlet. This produces compressed
      air without moving parts.
    example: >-
      Blowers for historical forges (Catalan forges), compressed air supply for mines such
      as Ragged Chutes (Canada)
    conditions: Sufficient head of water and a separation chamber at depth.
    limits: >-
      The achievable pressure is limited by the height of the water column above the chamber,
      about 1 bar per 10 m.
    sideEffects: >-
      Part of the air dissolves in the water under pressure and is lost with it.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
