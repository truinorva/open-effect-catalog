text:
  de:
    name: Quadruplanar-Inversor
    description: >-
      Der Quadruplanar-Inversor von Sylvester und Kempe ist ein ebenes Gelenkgetriebe, das
      wie die Inversoren von Peaucellier oder Hart eine Kreisspiegelung (Inversion) mechanisch
      ausführt. Wird ein Gelenkpunkt mit einer Kurbel auf einem Kreis geführt, der durch den
      festen Drehpunkt geht, bewegt sich ein anderer Punkt auf einer exakten Geraden; so wird
      eine Drehbewegung ohne Gleitführung in eine geradlinige Bewegung umgesetzt.
    example: >-
      Geradführungen ohne Gleitbahn, Lehr- und Demonstrationsmodelle der Getriebelehre
    conditions: Genau gefertigte Gliedlängen und spielarme Gelenke.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Quadruplanar inversor
    description: >-
      The quadruplanar inversor of Sylvester and Kempe is a planar linkage which, like the
      inversors of Peaucellier or Hart, performs geometric inversion mechanically. If one
      joint is driven by a crank along a circle passing through the fixed pivot, another point
      moves along an exact straight line; rotary motion is thus converted into straight-line
      motion without a sliding guide.
    example: >-
      Straight-line guides without slideways, teaching and demonstration models in kinematics
    conditions: Precisely made link lengths and joints with little play.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
