text:
  de:
    name: Mikrobielle Brennstoffzelle
    description: >-
      In einer mikrobiellen Brennstoffzelle bauen Bakterien an der Anode organische Stoffe
      ab und geben die dabei frei werdenden Elektronen direkt oder über Botenmoleküle an die
      Elektrode ab. Die Elektronen fließen über einen äußeren Stromkreis zur Kathode, wo sie
      meist mit Sauerstoff und mit Protonen, die durch eine Membran oder den Elektrolyten
      gewandert sind, zu Wasser reagieren. So wird chemische Energie aus Abwasser oder Biomasse
      unmittelbar in elektrischen Strom umgewandelt.
    example: >-
      Stromerzeugung bei der Abwasserbehandlung, Biosensoren für den biochemischen Sauerstoffbedarf
      und für Giftstoffe im Wasser, Energieversorgung von Sensoren am Meeresgrund aus Sedimenten
    conditions: >-
      Elektroaktive Bakterien wie Geobacter oder Shewanella, eine sauerstofffreie Anodenkammer
      und abbaubare organische Stoffe.
    limits: >-
      Die Leistungsdichten sind gering, typischerweise Milliwatt bis wenige Watt pro Quadratmeter
      Elektrodenfläche, und die Zellspannung liegt unter einem Volt.
    sideEffects: >-
      Ablagerungen und unerwünschter Bewuchs verschmutzen Kathode und Membran mit der Zeit.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Microbial fuel cell
    description: >-
      In a microbial fuel cell, bacteria at the anode break down organic matter and pass the
      electrons released either directly or via mediator molecules to the electrode. The electrons
      flow through an external circuit to the cathode, where they usually react with oxygen
      and with protons that have migrated through a membrane or the electrolyte to form water.
      Chemical energy from waste water or biomass is thus converted directly into electric
      current.
    example: >-
      Power generation during waste water treatment, biosensors for biochemical oxygen demand
      and for toxins in water, powering seafloor sensors from sediments
    conditions: >-
      Electroactive bacteria such as Geobacter or Shewanella, an oxygen-free anode chamber
      and degradable organic matter.
    limits: >-
      Power densities are low, typically milliwatts to a few watts per square metre of electrode,
      and the cell voltage is below one volt.
    sideEffects: Deposits and unwanted growth gradually foul the cathode and membrane.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
