text:
  de:
    name: Materialermüdung
    description: >-
      Unter wiederholter, wechselnder Belastung versagt ein Bauteil bei Spannungen, die weit
      unter seiner statischen Festigkeit liegen. An Kerben oder Gefügefehlern bilden sich
      mikroskopische Risse, die mit jedem Lastwechsel ein Stück weiterwachsen, bis der verbliebene
      Querschnitt plötzlich bricht; die Bruchfläche zeigt typische Rastlinien.
    example: >-
      Abbrechen eines Drahts durch wiederholtes Hin- und Herbiegen, Ermüdungsbrüche an Achsen,
      Schweißnähten und Flugzeugrümpfen, Dauerschwingversuche
    conditions: >-
      Zyklische Belastung und Spannungsspitzen an Kerben; Korrosion verstärkt den Effekt.
    limits: >-
      Manche Stähle haben eine Dauerfestigkeit, unterhalb derer kein Ermüdungsbruch auftritt;
      Aluminiumlegierungen haben keine ausgeprägte.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Fatigue (material)
    description: >-
      Under repeated, fluctuating loads, a component fails at stresses far below its static
      strength. Microscopic cracks form at notches or microstructural defects and grow a little
      with each load cycle until the remaining cross-section suddenly breaks; the fracture
      surface shows characteristic beach marks.
    example: >-
      Breaking a wire by bending it back and forth, fatigue fractures in axles, welds and
      aircraft fuselages, fatigue testing
    conditions: >-
      Cyclic loading and stress concentrations at notches; corrosion amplifies the effect.
    limits: >-
      Some steels have an endurance limit below which no fatigue failure occurs; aluminium
      alloys have no distinct one.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
