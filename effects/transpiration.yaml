text:
  de:
    name: Transpiration
    description: >-
      Pflanzen verdunsten Wasser über die Spaltöffnungen ihrer Blätter. Die Verdunstung erzeugt
      in den Leitungsbahnen einen Sog, und weil Wassermoleküle stark zusammenhalten, wird
      die ganze Wassersäule ohne Pumpe von den Wurzeln bis in die Krone nachgezogen. Zugleich
      kühlt die Verdunstungswärme die Blätter, und die Pflanze regelt den Wasserverlust, indem
      sie die Spaltöffnungen öffnet und schließt.
    example: >-
      Wasserversorgung hoher Bäume, Kühlwirkung von Stadtbäumen und Fassadenbegrünung, verdunstungsgetriebene
      Mikropumpen nach dem Vorbild von Blättern
    conditions: >-
      Ungesättigte Luft, geöffnete Spaltöffnungen und Wassernachschub aus dem Boden.
    limits: >-
      Bei zu starkem Sog reißt die Wassersäule ab (Embolie); das ist einer der Faktoren, die
      die Höhe von Bäumen begrenzen.
    sideEffects: Hoher Wasserverbrauch; bei Trockenheit welkt die Pflanze.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Transpiration
    description: >-
      Plants evaporate water through the stomata in their leaves. The evaporation creates
      suction in the water-conducting vessels, and because water molecules cohere strongly,
      the whole water column is pulled up from the roots to the crown without a pump. At the
      same time the heat of evaporation cools the leaves, and the plant controls the water
      loss by opening and closing its stomata.
    example: >-
      Water supply of tall trees, cooling effect of urban trees and green facades, evaporation-driven
      micropumps modelled on leaves
    conditions: Unsaturated air, open stomata and water supply from the soil.
    limits: >-
      If the tension becomes too high, the water column breaks (embolism); this is one of
      the factors limiting the height of trees.
    sideEffects: High water consumption; in drought the plant wilts.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
