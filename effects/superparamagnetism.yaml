text:
  de:
    name: Superparamagnetismus
    description: >-
      Ferro- oder ferrimagnetische Teilchen, die nur wenige bis einige zehn Nanometer groß
      sind, bestehen aus einer einzigen magnetischen Domäne. Ihre Magnetisierung klappt durch
      die Wärmebewegung ständig um, so dass sie ohne äußeres Feld nach außen unmagnetisch
      erscheinen; in einem Feld richten sie sich dagegen stark aus. Die Teilchen lassen sich
      also mit Magneten bewegen, ohne nach dem Abschalten des Feldes aneinander haften zu
      bleiben.
    example: >-
      Magnetische Beads zur Trennung von Zellen und Biomolekülen, Ferrofluide, Kontrastmittel
      für die Magnetresonanztomographie, magnetische Hyperthermie
    conditions: >-
      Teilchengröße unterhalb einer werkstoffabhängigen Grenze und Temperatur oberhalb der
      Blockierungstemperatur.
    limits: >-
      Unterhalb der Blockierungstemperatur oder bei zu großen Teilchen bleibt eine Restmagnetisierung,
      und die Teilchen verhalten sich wieder ferromagnetisch.
    sideEffects: >-
      In magnetischen Datenspeichern begrenzt der Effekt die Verkleinerung der Bits, weil
      die gespeicherte Magnetisierung thermisch instabil wird.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Superparamagnetism
    description: >-
      Ferromagnetic or ferrimagnetic particles only a few to a few tens of nanometres in size
      consist of a single magnetic domain. Their magnetisation flips constantly due to thermal
      motion, so without an external field they appear non-magnetic; in a field, however,
      they align strongly. The particles can therefore be moved with magnets without sticking
      together once the field is switched off.
    example: >-
      Magnetic beads for separating cells and biomolecules, ferrofluids, contrast agents for
      magnetic resonance imaging, magnetic hyperthermia
    conditions: >-
      Particle size below a material-dependent limit and temperature above the blocking temperature.
    limits: >-
      Below the blocking temperature or with particles that are too large, remanent magnetisation
      remains and the particles behave ferromagnetically again.
    sideEffects: >-
      In magnetic data storage the effect limits how small bits can be made, because the stored
      magnetisation becomes thermally unstable.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
