text:
  de:
    name: Elektrische Schallamplitude (ESA)
    description: >-
      Legt man an eine kolloidale Suspension ein elektrisches Wechselfeld an, schwingen die
      geladenen Partikel im Takt des Feldes hin und her. Unterscheidet sich ihre Dichte von
      der der Flüssigkeit, senden sie dabei eine Schallwelle derselben Frequenz aus, deren
      Amplitude und Phase von Ladung und Größe der Partikel abhängen; daraus werden Zetapotential
      und Partikelgröße berechnet. Das Verfahren funktioniert auch in konzentrierten, undurchsichtigen
      Suspensionen.
    example: >-
      Zetapotentialmessung in Keramikschlickern, Farben und pharmazeutischen Suspensionen,
      Partikelgrößenbestimmung
    conditions: >-
      Dichteunterschied zwischen Partikeln und Flüssigkeit; Wechselfeld typischerweise im
      Megahertzbereich.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electric sonic amplitude (ESA)
    description: >-
      When an alternating electric field is applied to a colloidal suspension, the charged
      particles oscillate back and forth in step with the field. If their density differs
      from that of the liquid, they emit a sound wave of the same frequency whose amplitude
      and phase depend on the charge and size of the particles; zeta potential and particle
      size are calculated from this. The method also works in concentrated, opaque suspensions.
    example: >-
      Zeta potential measurement of ceramic slurries, paints and pharmaceutical suspensions,
      particle sizing
    conditions: >-
      Density difference between particles and liquid; alternating field typically in the
      megahertz range.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
