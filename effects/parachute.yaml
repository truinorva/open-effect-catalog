text:
  de:
    name: Fallschirm
    description: >-
      Ein Fallschirm entfaltet eine große, leichte Stofffläche, die beim Fallen oder bei schneller
      Fahrt die Luft staut. Der Luftwiderstand wächst mit der Fläche und mit dem Quadrat der
      Geschwindigkeit, bis er der Gewichtskraft das Gleichgewicht hält und sich eine niedrige,
      gleichbleibende Sinkgeschwindigkeit einstellt. Flügelförmige Gleitschirme erzeugen zusätzlich
      Auftrieb und lassen sich steuern.
    example: >-
      Rettungs- und Sprungfallschirme, Lastenabwurf, Landung von Raumkapseln, Bremsschirme
      für Flugzeuge und Dragster
    conditions: >-
      Ausreichende Höhe bzw. Geschwindigkeit, damit sich der Schirm vollständig öffnen kann.
    limits: >-
      Bei sehr hoher Geschwindigkeit treten große Öffnungsstöße auf, und in sehr dünner Luft
      bremst der Schirm kaum; dann werden mehrstufige Systeme eingesetzt.
    sideEffects: >-
      Wind treibt die Last seitlich ab, und der Öffnungsstoß belastet Last und Gurte stark.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Parachute
    description: >-
      A parachute deploys a large, light fabric canopy that dams up the air during a fall
      or at high speed. Drag grows with the area and with the square of the speed until it
      balances the weight and a low, steady rate of descent is reached. Wing-shaped parafoils
      also generate lift and can be steered.
    example: >-
      Emergency and sport parachutes, cargo drops, landing of space capsules, drag chutes
      for aircraft and dragsters
    conditions: Sufficient height or speed for the canopy to open fully.
    limits: >-
      At very high speeds large opening shocks occur, and in very thin air the canopy hardly
      brakes; multi-stage systems are used then.
    sideEffects: >-
      Wind drifts the load sideways, and the opening shock puts heavy loads on payload and
      harness.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
