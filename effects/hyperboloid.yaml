text:
  de:
    name: Hyperboloid
    description: >-
      Ein einschaliges Hyperboloid ist eine doppelt gekrümmte Fläche, die sich dennoch vollständig
      aus zwei Scharen gerader Linien zusammensetzen lässt. Deshalb kann man es aus geraden
      Stäben bauen, die zusammen eine leichte, sehr steife Schale bilden; zwei solche Flächen,
      die aufeinander abwälzen, übertragen Drehungen zwischen windschiefen Achsen.
    example: >-
      Schuchow-Türme, Kühltürme von Kraftwerken, Kobe Port Tower, Wälzkörper von Hypoid- und
      Schraubradgetrieben, Papierkörbe und Hocker aus geraden Stäben
    conditions: ''
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Hyperboloid
    description: >-
      A hyperboloid of one sheet is a doubly curved surface that can nevertheless be made
      up entirely of two families of straight lines. It can therefore be built from straight
      bars that together form a light, very stiff shell; two such surfaces rolling on each
      other transmit rotation between skew axes.
    example: >-
      Shukhov towers, power-station cooling towers, Kobe Port Tower, pitch surfaces of hypoid
      and crossed helical gears, wastepaper baskets and stools made of straight rods
    conditions: ''
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
