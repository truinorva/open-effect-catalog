text:
  de:
    name: Doppelbrechung
    description: >-
      In optisch anisotropen Stoffen hängt die Brechzahl von der Polarisations- und Ausbreitungsrichtung
      des Lichts ab. Ein Lichtstrahl wird deshalb in zwei senkrecht zueinander polarisierte
      Teilstrahlen aufgespalten, die unterschiedlich schnell laufen und verschieden stark
      gebrochen werden. Die Anisotropie stammt aus einer richtungsabhängigen Kristallstruktur
      oder wird durch mechanische Spannung, elektrische Felder oder Molekülorientierung hervorgerufen.
    example: >-
      Kalkspat, Polarisationsprismen, Verzögerungsplatten (Lambda/4, Lambda/2), Spannungsoptik
      zur Spannungsanalyse, Polarisationsmikroskopie von Mineralien, Flüssigkristallanzeigen
    conditions: >-
      Optisch anisotropes Material, z. B. nichtkubische Kristalle, gereckte Kunststoffe oder
      verspanntes Glas.
    limits: >-
      Der Gangunterschied hängt von der Wellenlänge ab, sodass Verzögerungsplatten nur in
      einem begrenzten Wellenlängenbereich exakt wirken.
    sideEffects: >-
      Ungewollte Doppelbrechung in verspanntem Glas oder spritzgegossenen Kunststofflinsen
      und -fenstern verschlechtert die Abbildung und erzeugt unter polarisiertem Licht farbige
      Streifenmuster.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Birefringence
    description: >-
      In optically anisotropic materials the refractive index depends on the polarisation
      and direction of propagation of the light. A beam is therefore split into two perpendicularly
      polarised beams that travel at different speeds and are refracted differently. The anisotropy
      comes from a direction-dependent crystal structure or is induced by mechanical stress,
      electric fields or molecular orientation.
    example: >-
      Calcite, polarising prisms, wave plates (quarter-wave, half-wave), photoelastic stress
      analysis, polarised-light microscopy of minerals, liquid crystal displays
    conditions: >-
      Optically anisotropic material, e.g. non-cubic crystals, stretched plastics or stressed
      glass.
    limits: >-
      The phase retardation depends on wavelength, so wave plates work exactly only over a
      limited wavelength range.
    sideEffects: >-
      Unwanted birefringence in stressed glass or injection-moulded plastic lenses and windows
      degrades imaging and produces coloured fringes under polarised light.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
