text:
  de:
    name: Bridgman-Effekt (innerer Peltier-Effekt)
    description: >-
      Fließt ein elektrischer Strom durch einen anisotropen Kristall und ist die Stromverteilung
      dabei ungleichmäßig, wird im Inneren des Kristalls Wärme frei oder aufgenommen. Grund
      ist, dass der Peltier-Koeffizient eines solchen Kristalls von der Stromrichtung relativ
      zu den Kristallachsen abhängt; wo der Strom im Kristall seine Richtung ändert, wirkt
      das wie ein Übergang zwischen zwei verschiedenen Leitern.
    example: >-
      Grundlagenuntersuchungen zur Thermoelektrizität in nichtkubischen Einkristallen
    conditions: >-
      Ein elektrisch leitender Kristall mit richtungsabhängigen thermoelektrischen Eigenschaften
      und eine ungleichmäßige Stromverteilung.
    limits: ''
    sideEffects: Dem Effekt überlagert sich die Joulesche Wärme des Stroms.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Bridgman effect (internal Peltier effect)
    description: >-
      When an electric current flows through an anisotropic crystal and the current distribution
      is non-uniform, heat is released or absorbed inside the crystal. The reason is that
      the Peltier coefficient of such a crystal depends on the direction of current relative
      to the crystal axes; where the current changes direction within the crystal, this acts
      like a junction between two different conductors.
    example: Fundamental studies of thermoelectricity in non-cubic single crystals
    conditions: >-
      An electrically conducting crystal with direction-dependent thermoelectric properties
      and a non-uniform current distribution.
    limits: ''
    sideEffects: Joule heating from the current is superimposed on the effect.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
