text:
  de:
    name: Ferromagnetisches Pulver (Eisenfeilspäne)
    description: >-
      Feine Teilchen aus Eisen oder anderen ferromagnetischen Stoffen werden in einem Magnetfeld
      magnetisiert, richten sich entlang der Feldlinien aus und sammeln sich dort, wo das
      Feld am stärksten ist. So machen sie Feldverläufe sichtbar, zeigen an Bauteiloberflächen
      die Streufelder über Rissen an oder bilden im Feld feste Brücken, die Kräfte übertragen.
    example: >-
      Sichtbarmachen von Feldlinien im Unterricht, Magnetpulverprüfung auf Oberflächenrisse,
      Magnetpulverkupplungen und -bremsen, magnetischer Toner
    conditions: >-
      Feine, weichmagnetische Teilchen; für die Rissprüfung ein magnetisierbares Bauteil.
    limits: >-
      Die Magnetpulverprüfung findet nur Fehler an oder dicht unter der Oberfläche ferromagnetischer
      Werkstoffe.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Ferromagnetic powder (iron filings)
    description: >-
      Fine particles of iron or other ferromagnetic materials become magnetised in a magnetic
      field, line up along the field lines and gather where the field is strongest. They thereby
      make field patterns visible, reveal the leakage fields above cracks on component surfaces,
      or form solid bridges in the field that transmit forces.
    example: >-
      Visualising field lines in teaching, magnetic particle inspection for surface cracks,
      magnetic powder clutches and brakes, magnetic toner
    conditions: >-
      Fine, soft magnetic particles; for crack testing, a magnetisable component.
    limits: >-
      Magnetic particle inspection only finds flaws at or just below the surface of ferromagnetic
      materials.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
