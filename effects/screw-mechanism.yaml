text:
  de:
    name: Schraubgetriebe (Gewindetrieb)
    description: >-
      Eine Schraube ist eine schiefe Ebene, die schraubenförmig um einen Zylinder gewickelt
      ist. Dreht man Spindel oder Mutter, verschiebt sich das Gegenstück je Umdrehung um die
      Gewindesteigung; eine kleine Umfangskraft erzeugt so eine große Längskraft, und bei
      kleiner Steigung hält die Reibung das Gewinde selbsthemmend fest.
    example: >-
      Schraubverbindungen, Schraubstock und Schraubzwinge, Wagenheber und Spindelpressen,
      Kugelgewindetriebe in Werkzeugmaschinen, Bügelmessschraube, Linearantriebe und Stellventile
    conditions: >-
      Eine passende Paarung aus Außen- und Innengewinde; für Selbsthemmung ein Steigungswinkel,
      der kleiner ist als der Reibungswinkel.
    limits: >-
      Selbsthemmende Gewinde haben einen Wirkungsgrad unter 50 %; reibungsarme Kugelgewindetriebe
      sind dagegen nicht selbsthemmend und brauchen eine Bremse.
    sideEffects: >-
      Reibung erzeugt Wärme und Verschleiß, Umkehrspiel begrenzt die Positioniergenauigkeit,
      und Schraubverbindungen können sich unter Vibration lösen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Screw mechanism (lead screw)
    description: >-
      A screw is an inclined plane wrapped helically around a cylinder. Turning the spindle
      or the nut moves the counterpart by the thread pitch per revolution; a small circumferential
      force thus produces a large axial force, and with a small pitch friction keeps the thread
      self-locking.
    example: >-
      Screwed joints, vices and clamps, car jacks and screw presses, ball screws in machine
      tools, micrometers, linear actuators and control valves
    conditions: >-
      A matching pair of external and internal thread; for self-locking, a lead angle smaller
      than the friction angle.
    limits: >-
      Self-locking threads have an efficiency below 50 %; low-friction ball screws, in contrast,
      are not self-locking and need a brake.
    sideEffects: >-
      Friction generates heat and wear, backlash limits positioning accuracy, and screwed
      joints can loosen under vibration.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
