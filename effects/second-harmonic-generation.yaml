text:
  de:
    name: Frequenzverdopplung (Erzeugung der zweiten Harmonischen)
    description: >-
      In nichtlinearen optischen Kristallen ohne Symmetriezentrum folgt die Polarisation bei
      sehr hohen Lichtintensitäten nicht mehr linear dem elektrischen Feld. Ein Anteil schwingt
      mit der doppelten Frequenz und strahlt Licht der halben Wellenlänge ab; damit sich die
      Beiträge entlang des Kristalls aufaddieren, müssen Grund- und Oberwelle durch passende
      Doppelbrechung oder periodische Polung phasenangepasst laufen.
    example: >-
      Grüne Laserpointer (1064 nm zu 532 nm), frequenzverdoppelte Nd:YAG-Laser für Materialbearbeitung
      und Medizin, SHG-Mikroskopie von Kollagen und Muskelgewebe, Messung ultrakurzer Pulse
      mit Autokorrelatoren
    conditions: >-
      Ein nichtzentrosymmetrischer Kristall wie KTP, BBO oder Lithiumniobat, hohe Intensität,
      meist durch gepulste oder fokussierte Laser, und Phasenanpassung.
    limits: >-
      Die Leistung der Oberwelle wächst mit dem Quadrat der Grundwellenleistung, sodass bei
      schwachem Licht kaum etwas umgewandelt wird; die Phasenanpassung gilt nur in einem engen
      Bereich von Wellenlänge, Winkel und Temperatur.
    sideEffects: >-
      Absorption und hohe Intensitäten können den Kristall erwärmen oder beschädigen, und
      nicht umgewandeltes Grundlicht muss herausgefiltert werden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Second-harmonic generation
    description: >-
      In non-linear optical crystals lacking a centre of symmetry, the polarisation no longer
      follows the electric field linearly at very high light intensities. One component oscillates
      at twice the frequency and radiates light at half the wavelength; for the contributions
      along the crystal to add up, the fundamental and harmonic waves must be phase-matched
      by suitable birefringence or periodic poling.
    example: >-
      Green laser pointers (1064 nm to 532 nm), frequency-doubled Nd:YAG lasers for materials
      processing and medicine, SHG microscopy of collagen and muscle tissue, measuring ultrashort
      pulses with autocorrelators
    conditions: >-
      A non-centrosymmetric crystal such as KTP, BBO or lithium niobate, high intensity, usually
      from pulsed or focused lasers, and phase matching.
    limits: >-
      The harmonic power grows with the square of the fundamental power, so hardly anything
      is converted with weak light; phase matching holds only within a narrow range of wavelength,
      angle and temperature.
    sideEffects: >-
      Absorption and high intensities can heat or damage the crystal, and unconverted fundamental
      light must be filtered out.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
