text:
  de:
    name: Thermoakustik (thermoakustischer Effekt)
    description: >-
      Wärme und Schall lassen sich ineinander umwandeln: Wird einem schwingenden Gas jeweils
      im Moment höchster Verdichtung Wärme zugeführt, wächst die Schwingung an, sodass ein
      starkes Temperaturgefälle in einer Röhre von selbst einen lauten Ton anfacht. Umgekehrt
      pumpt eine stehende Schallwelle in einem porösen Stapel Wärme von einem Ende zum anderen,
      weil die hin- und hergeschobenen Gaspakete beim Verdichten Wärme an die Wand abgeben
      und beim Entspannen wieder aufnehmen.
    example: >-
      Rijke-Rohr, Sondhauss-Rohr beim Glasblasen, thermoakustische Kühler, Brennkammerschwingungen
      in Gasturbinen und Raketentriebwerken
    conditions: >-
      Gas in einem Resonator; ausreichend großes Temperaturgefälle über einer Struktur mit
      passendem Porendurchmesser.
    limits: ''
    sideEffects: >-
      In Brennkammern kann die Rückkopplung zwischen Flamme und Schall heftige Druckschwingungen
      auslösen, die Bauteile beschädigen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Thermoacoustics (thermoacoustic effect)
    description: >-
      Heat and sound can be converted into one another: if heat is added to an oscillating
      gas at the moment of greatest compression, the oscillation grows, so a steep temperature
      gradient in a tube excites a loud tone by itself. Conversely, a standing sound wave
      in a porous stack pumps heat from one end to the other, because the gas parcels shuttling
      back and forth give off heat to the wall when compressed and take it up again when expanded.
    example: >-
      Rijke tube, Sondhauss tube in glassblowing, thermoacoustic refrigerators, combustion
      oscillations in gas turbines and rocket engines
    conditions: >-
      Gas in a resonator; sufficiently large temperature gradient across a structure with
      suitable pore size.
    limits: ''
    sideEffects: >-
      In combustion chambers the feedback between flame and sound can trigger violent pressure
      oscillations that damage components.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
