text:
  de:
    name: Lichtwellenleiter (Glasfaser)
    description: >-
      Ein Lichtwellenleiter besteht aus einem Kern mit etwas höherem Brechungsindex und einem
      umgebenden Mantel. Licht, das flach genug auf die Grenzfläche trifft, wird dort totalreflektiert
      und so über viele Kilometer im Kern geführt, auch um Biegungen herum. Ändern Dehnung
      oder Temperatur die Faser, verändert sich das geführte Licht messbar, wodurch Fasern
      auch als Sensoren dienen.
    example: >-
      Datenübertragung in Telekommunikationsnetzen, Endoskope, Faserlaser und Laserstrahlführung,
      Faser-Bragg-Gitter-Sensoren, Beleuchtung und Dekoration
    conditions: >-
      Sehr reines Glas oder transparenter Kunststoff und ein Kern mit höherem Brechungsindex
      als der Mantel.
    limits: >-
      Zu enge Biegeradien lassen Licht austreten, und über große Strecken braucht es trotz
      geringer Dämpfung Verstärker.
    sideEffects: >-
      Glasfasern sind bruchempfindlich, und Glassplitter beim Konfektionieren können in die
      Haut eindringen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Optical fibre
    description: >-
      An optical fibre consists of a core with a slightly higher refractive index and a surrounding
      cladding. Light striking the interface at a shallow enough angle is totally internally
      reflected and thus guided for many kilometres along the core, even around bends. When
      strain or temperature changes the fibre, the guided light changes measurably, so fibres
      also serve as sensors.
    example: >-
      Data transmission in telecommunication networks, endoscopes, fibre lasers and laser
      beam delivery, fibre Bragg grating sensors, lighting and decoration
    conditions: >-
      Very pure glass or transparent plastic and a core with a higher refractive index than
      the cladding.
    limits: >-
      Bending radii that are too tight let light escape, and over long distances amplifiers
      are needed despite the low attenuation.
    sideEffects: >-
      Glass fibres are fragile, and glass splinters produced during termination can penetrate
      the skin.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
