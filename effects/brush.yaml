text:
  de:
    name: Bürste
    description: >-
      Eine Bürste besteht aus vielen elastischen Borsten, die an einem Träger befestigt sind.
      Jede Borste passt sich einzeln der Oberfläche an, sodass Schmutz auch aus Vertiefungen
      gelöst und weggeschoben wird; zwischen den Borsten werden Flüssigkeiten wie Farbe festgehalten
      und gleichmäßig abgegeben. Dicht gepackte Borsten können außerdem einen Spalt abdichten,
      ohne starr anzuliegen.
    example: >-
      Zahnbürste, Besen, Malerpinsel, Drahtbürste zum Entrosten, Bürstwalzen in Kehrmaschinen,
      Bürstendichtungen in Gasturbinen
    conditions: >-
      Borsten, deren Steifigkeit und Härte zur Oberfläche und zum Schmutz passen.
    limits: >-
      Fest haftende oder sehr feine Beläge lassen sich mit Borsten allein oft nicht entfernen.
    sideEffects: >-
      Harte Borsten können empfindliche Oberflächen zerkratzen; Borsten nutzen sich ab und
      brechen aus.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Brush
    description: >-
      A brush consists of many elastic bristles fixed to a holder. Each bristle adapts individually
      to the surface, so dirt is loosened even from recesses and pushed away; liquids such
      as paint are held between the bristles and released evenly. Densely packed bristles
      can also seal a gap without rigid contact.
    example: >-
      Toothbrush, broom, paintbrush, wire brush for rust removal, brush rollers in street
      sweepers, brush seals in gas turbines
    conditions: Bristles whose stiffness and hardness suit the surface and the dirt.
    limits: >-
      Firmly adhering or very fine deposits often cannot be removed with bristles alone.
    sideEffects: >-
      Hard bristles can scratch sensitive surfaces; bristles wear and break off.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
