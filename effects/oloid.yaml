text:
  de:
    name: Oloid
    description: >-
      Das Oloid ist die konvexe Hülle zweier gleich großer Kreise, die senkrecht zueinander
      stehen und jeweils durch den Mittelpunkt des anderen verlaufen. Beim Abrollen auf einer
      Ebene kommt seine gesamte Oberfläche nacheinander mit der Ebene in Berührung, und es
      bewegt sich dabei in einer taumelnden, schlingernden Bahn. Wird ein Oloid in einer Flüssigkeit
      in dieser Bewegung geführt, erzeugt es eine großräumige, pulsierende Strömung, die schonend
      und mit wenig Energie mischt.
    example: >-
      Oloid-Rührwerke und Belüfter in Kläranlagen, Teichen und Aquakultur, Lehrmodelle und
      Spielzeug
    conditions: >-
      Ein Antrieb, der das Oloid genau in seiner taumelnden Abrollbewegung führt.
    limits: >-
      Die Mischwirkung beruht auf großvolumiger, langsamer Bewegung; für intensives Dispergieren
      mit hohen Scherkräften eignet es sich nicht.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Oloid
    description: >-
      The oloid is the convex hull of two equal circles set perpendicular to each other, each
      passing through the centre of the other. When it rolls on a plane, its entire surface
      comes into contact with the plane in turn, and it moves along a wobbling, meandering
      path. Driven through a liquid in this motion, an oloid creates a large-scale pulsating
      flow that mixes gently and with little energy.
    example: >-
      Oloid stirrers and aerators in sewage plants, ponds and aquaculture, teaching models
      and toys
    conditions: A drive that guides the oloid exactly in its wobbling rolling motion.
    limits: >-
      The mixing action relies on slow, large-volume motion; it is not suited to intensive
      dispersing with high shear.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
