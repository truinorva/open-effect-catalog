text:
  de:
    name: Gehen
    description: >-
      Beim Gehen hat immer mindestens ein Fuß Bodenkontakt, und der Körper schwingt wie ein
      umgekehrtes Pendel über das gestreckte Standbein. Dabei wandelt sich Bewegungsenergie
      in Lageenergie und zurück, sodass die Muskeln nur einen Teil der Arbeit leisten müssen.
      Beine finden Halt auf unebenem Gelände und überwinden Stufen und Hindernisse, an denen
      Räder scheitern.
    example: >-
      Laufroboter, Schreitbagger, Exoskelette, passive Laufmaschinen, Laufmechanismen nach
      Art des Strandbeests
    conditions: ''
    limits: >-
      Oberhalb einer bestimmten Geschwindigkeit funktioniert der Pendelmechanismus nicht mehr;
      Menschen und Tiere wechseln dann ins Rennen.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Walking
    description: >-
      In walking, at least one foot is always in contact with the ground, and the body vaults
      over the straight stance leg like an inverted pendulum. Kinetic energy is converted
      into potential energy and back, so the muscles need to supply only part of the work.
      Legs find footing on uneven terrain and climb steps and obstacles where wheels fail.
    example: >-
      Walking robots, walking excavators, exoskeletons, passive dynamic walkers, Strandbeest-type
      walking linkages
    conditions: ''
    limits: >-
      Above a certain speed the pendulum mechanism no longer works; humans and animals then
      switch to running.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
