text:
  de:
    name: Zyklonabscheider
    description: >-
      Ein partikelbeladener Gas- oder Flüssigkeitsstrom wird tangential in einen zylindrisch-konischen
      Behälter geleitet und in schnelle Drehung versetzt. Die Fliehkraft schleudert die schwereren
      Teilchen an die Wand, wo sie in einen Sammelbehälter abrutschen, während das gereinigte
      Fluid in einem inneren Wirbel nach oben durch das Tauchrohr austritt.
    example: >-
      Beutellose Staubsauger, Vorabscheider in Sägewerken und Zementwerken, Hydrozyklone in
      der Erzaufbereitung, Abscheidung von Katalysatorstaub in Raffinerien
    conditions: >-
      Teilchen, die deutlich dichter sind als das Fluid, und eine ausreichend hohe Eintrittsgeschwindigkeit.
    limits: >-
      Feinstaub im Bereich weniger Mikrometer und darunter wird nur unvollständig abgeschieden.
    sideEffects: Druckverlust, Wandverschleiß durch abrasive Teilchen und Geräusche.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Cyclone separator
    description: >-
      A particle-laden stream of gas or liquid enters a cylindrical-conical vessel tangentially
      and is set into rapid rotation. Centrifugal force flings the heavier particles to the
      wall, where they slide down into a collection hopper, while the cleaned fluid leaves
      upwards in an inner vortex through the vortex finder.
    example: >-
      Bagless vacuum cleaners, pre-separators in sawmills and cement plants, hydrocyclones
      in ore processing, separation of catalyst dust in refineries
    conditions: >-
      Particles considerably denser than the fluid and a sufficiently high inlet velocity.
    limits: >-
      Fine dust in the range of a few micrometres and below is separated only incompletely.
    sideEffects: Pressure loss, wall wear from abrasive particles, and noise.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
