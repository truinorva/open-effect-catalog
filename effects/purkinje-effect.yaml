text:
  de:
    name: Purkinje-Effekt
    description: >-
      Bei abnehmender Helligkeit verschiebt sich die größte Empfindlichkeit des Auges vom
      gelbgrünen Bereich um 555 nm zu blaugrünem Licht um 507 nm, weil das Sehen von den Zapfen
      auf die Stäbchen übergeht. Rote Gegenstände erscheinen in der Dämmerung deshalb dunkler,
      blaue und grüne dagegen verhältnismäßig heller als bei Tageslicht.
    example: >-
      Rote Beleuchtung in Cockpits, U-Booten und Sternwarten zum Erhalt der Dunkeladaptation,
      Gestaltung von Nachtbeleuchtung und Sicherheitsfarben, Bewertung von Lichtquellen für
      das mesopische Sehen
    conditions: >-
      Übergang vom Tagessehen zum Dämmerungs- oder Nachtsehen, also Leuchtdichten im mesopischen
      bis skotopischen Bereich.
    limits: >-
      Beim reinen Stäbchensehen gehen Farbunterscheidung und Sehschärfe weitgehend verloren.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Purkinje effect
    description: >-
      As light levels fall, the eye's peak sensitivity shifts from yellow-green around 555
      nm to blue-green around 507 nm, because vision passes from the cones to the rods. Red
      objects therefore look darker at dusk, while blue and green ones appear relatively brighter
      than in daylight.
    example: >-
      Red lighting in cockpits, submarines and observatories to preserve dark adaptation,
      design of night lighting and safety colours, rating light sources for mesopic vision
    conditions: >-
      Transition from daylight to twilight or night vision, i.e. luminances in the mesopic
      to scotopic range.
    limits: >-
      In pure rod vision, colour discrimination and visual acuity are largely lost.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
