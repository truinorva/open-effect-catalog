text:
  de:
    name: Thomson-Effekt
    description: >-
      Fließt elektrischer Strom durch einen Leiter, in dem ein Temperaturgefälle herrscht,
      wird zusätzlich zur Jouleschen Wärme Wärme abgegeben oder aufgenommen. Ob sich der Leiter
      erwärmt oder kühlt, hängt von der Stromrichtung relativ zum Gefälle und vom Werkstoff
      ab; die Wärmemenge ist proportional zu Strom und Temperaturgradient. Über die Kelvin-Beziehungen
      ist der Effekt mit dem Seebeck- und dem Peltier-Effekt verknüpft.
    example: >-
      Bestimmung absoluter Seebeck-Koeffizienten, Korrekturgröße bei der Auslegung thermoelektrischer
      Generatoren und Kühler
    conditions: Stromdurchflossener Leiter mit Temperaturgefälle.
    limits: >-
      Die Wärmemengen sind klein und werden meist von der Jouleschen Wärme überdeckt.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Thomson effect
    description: >-
      When an electric current flows through a conductor in which there is a temperature gradient,
      heat is released or absorbed in addition to Joule heat. Whether the conductor warms
      or cools depends on the direction of the current relative to the gradient and on the
      material; the amount of heat is proportional to the current and the temperature gradient.
      Through the Kelvin relations the effect is linked to the Seebeck and Peltier effects.
    example: >-
      Determining absolute Seebeck coefficients, correction term in the design of thermoelectric
      generators and coolers
    conditions: Current-carrying conductor with a temperature gradient.
    limits: The amounts of heat are small and usually masked by Joule heating.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
