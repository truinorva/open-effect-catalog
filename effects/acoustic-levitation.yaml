  en:
    name: Acoustic levitation
    description: >-
      A sample such as polystyrene beads or water droplets can be made to levitate by standing
      ultrasonic waves. The standing wave field is based on forces acting on the levitating
      body in the alternating pressure field of the ultrasonic waves.
    example: Ultrasonic air bearings
