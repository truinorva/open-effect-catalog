  de:
    name: Akustische Levitation
    description: >-
      Eine Probe wie Styroporkügelchen oder Wassertropfen können durch stehende Ultraschallwellen
      zum Schweben gebracht werden. Das Stehwellenfeld beruht auf Kräften, die im Wechseldruckfeld
      der Ultraschallwellen auf dem schwebenden Körper wirken.
    example: Ultraschallluftlager
