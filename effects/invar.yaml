text:
  de:
    name: Invar
    description: >-
      Invar ist eine Eisen-Nickel-Legierung mit rund 36 % Nickel, deren Wärmeausdehnung in
      der Nähe der Raumtemperatur nur etwa ein Zehntel der von gewöhnlichem Stahl beträgt.
      Grund ist ein magnetischer Volumeneffekt: Mit steigender Temperatur nimmt die Magnetisierung
      ab, und das Gitter zieht sich dadurch zusammen, was die normale Wärmeausdehnung weitgehend
      ausgleicht.
    example: >-
      Präzisionsmessgeräte und Messbänder, Pendel von Präzisionsuhren, Membrantanks für Flüssigerdgas,
      Lochmasken von Bildröhren, Formwerkzeuge für Faserverbundteile, passive Seite von Bimetallen
    conditions: >-
      Temperaturen unterhalb der Curie-Temperatur der Legierung von gut 200 °C.
    limits: >-
      Oberhalb davon dehnt sich Invar wie gewöhnlicher Stahl aus; die Festigkeit ist mäßig
      und der Werkstoff teuer.
    sideEffects: >-
      Ohne Stabilisierungsglühen ändern sich die Abmessungen über lange Zeit geringfügig.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Invar
    description: >-
      Invar is an iron-nickel alloy with about 36 % nickel whose thermal expansion near room
      temperature is only around a tenth of that of ordinary steel. The reason is a magnetic
      volume effect: as temperature rises, the magnetisation decreases and the lattice contracts
      as a result, largely cancelling normal thermal expansion.
    example: >-
      Precision instruments and survey tapes, pendulums of precision clocks, membrane tanks
      for liquefied natural gas, shadow masks of picture tubes, moulds for fibre composite
      parts, passive side of bimetals
    conditions: Temperatures below the alloy's Curie temperature of just over 200 °C.
    limits: >-
      Above that, Invar expands like ordinary steel; its strength is moderate and the material
      is expensive.
    sideEffects: >-
      Without stabilisation annealing, dimensions change slightly over long periods.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
