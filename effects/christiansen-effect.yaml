text:
  de:
    name: Christiansen-Effekt
    description: >-
      In einem Gemenge aus durchsichtigen Teilchen und einer umgebenden Flüssigkeit oder einem
      Bindemittel wird Licht an den Teilchen gestreut, solange sich die Brechzahlen unterscheiden.
      Weil die Brechzahlen beider Stoffe unterschiedlich stark von der Wellenlänge abhängen,
      stimmen sie oft nur bei einer Wellenlänge überein; dieses Licht geht ungestreut hindurch,
      alle anderen Farben werden zerstreut. Das Gemenge wirkt so als schmalbandiges Farbfilter.
    example: >-
      Christiansen-Filter, spektrale Störungen bei der Infrarotspektroskopie von Pulverproben
    conditions: >-
      Zwei durchsichtige Stoffe mit unterschiedlicher Dispersion, deren Brechzahlkurven sich
      bei einer Wellenlänge kreuzen.
    limits: >-
      Die durchgelassene Wellenlänge verschiebt sich mit der Temperatur, weil sich die Brechzahl
      von Flüssigkeiten stärker ändert als die von Feststoffen.
    sideEffects: >-
      In Infrarotspektren von Pulvern verzerrt der Effekt die Bandenformen und erzeugt scheinbare
      Durchlässigkeitsmaxima.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Christiansen effect
    description: >-
      In a mixture of transparent particles and a surrounding liquid or binder, light is scattered
      by the particles as long as their refractive indices differ. Because the refractive
      indices of the two materials depend differently on wavelength, they often match at only
      one wavelength; this light passes through unscattered while all other colours are scattered.
      The mixture thus acts as a narrow-band colour filter.
    example: >-
      Christiansen filters, spectral artefacts in infrared spectroscopy of powder samples
    conditions: >-
      Two transparent materials with different dispersion whose refractive index curves cross
      at one wavelength.
    limits: >-
      The transmitted wavelength shifts with temperature because the refractive index of liquids
      changes more than that of solids.
    sideEffects: >-
      In infrared spectra of powders the effect distorts band shapes and creates apparent
      transmission maxima.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
