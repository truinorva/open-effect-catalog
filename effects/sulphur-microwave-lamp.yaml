text:
  de:
    name: Schwefellampe (Mikrowellen-Schwefellampe)
    description: >-
      In einem kleinen Quarzglaskolben befinden sich etwas Schwefel und ein Edelgas; Mikrowellen
      aus einem Magnetron heizen den Inhalt auf, bis der Schwefel verdampft und ein leuchtendes
      Plasma bildet. Die Schwefelmoleküle senden ein kontinuierliches Spektrum aus, das im
      sichtbaren Bereich dem Sonnenlicht ähnelt und wenig Ultraviolett und Infrarot enthält.
      Da der Kolben keine Elektroden hat, entfällt deren Verschleiß.
    example: >-
      Beleuchtung großer Hallen, Flutlicht, Pflanzenbelichtung, Ausleuchtung großer Innenräume
      über Lichtleitrohre
    conditions: >-
      Hohe Mikrowellenleistung; der Kolben muss ständig gedreht und gekühlt werden, damit
      er sich gleichmäßig erwärmt und nicht schmilzt.
    limits: >-
      Die Lebensdauer wird durch das Magnetron begrenzt, das deutlich früher ausfällt als
      der Kolben.
    sideEffects: Das Mikrowellenfeld muss zuverlässig abgeschirmt werden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Sulphur lamp (microwave sulphur lamp)
    description: >-
      A small quartz bulb contains some sulphur and a noble gas; microwaves from a magnetron
      heat the contents until the sulphur vaporises and forms a glowing plasma. The sulphur
      molecules emit a continuous spectrum that resembles sunlight in the visible range and
      contains little ultraviolet and infrared. Since the bulb has no electrodes, there is
      no electrode wear.
    example: >-
      Lighting of large halls, floodlighting, horticultural lighting, illuminating large interiors
      via light pipes
    conditions: >-
      High microwave power; the bulb must be rotated and cooled continuously so that it heats
      evenly and does not melt.
    limits: >-
      Lamp life is limited by the magnetron, which fails much earlier than the bulb.
    sideEffects: The microwave field must be reliably shielded.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
