text:
  de:
    name: Kolloidvibrationsstrom
    description: >-
      Durchläuft eine Ultraschallwelle eine Suspension, bewegen sich die Teilchen wegen ihrer
      anderen Dichte etwas anders als die umgebende Flüssigkeit. Dabei werden die geladenen
      Teilchen gegenüber ihrer ausgleichenden Ionenwolke verschoben, und es entsteht ein elektrischer
      Wechselstrom mit der Frequenz des Schalls, der zwischen Elektroden gemessen werden kann.
      Aus seiner Stärke und Phasenlage lassen sich Zetapotential und Teilchengröße bestimmen.
    example: >-
      Elektroakustische Messung des Zetapotentials in konzentrierten Suspensionen und Emulsionen,
      z. B. keramischen Schlickern, Zementleimen und Farben
    conditions: >-
      Geladene Teilchen in einer Flüssigkeit, deren Dichte sich von der des Mediums unterscheidet.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Colloid vibration current
    description: >-
      When an ultrasonic wave passes through a suspension, the particles move slightly differently
      from the surrounding liquid because of their different density. The charged particles
      are displaced relative to their compensating ion cloud, producing an alternating electric
      current at the sound frequency that can be measured between electrodes. Zeta potential
      and particle size can be determined from its magnitude and phase.
    example: >-
      Electroacoustic measurement of zeta potential in concentrated suspensions and emulsions,
      e.g. ceramic slips, cement pastes and paints
    conditions: >-
      Charged particles in a liquid whose density differs from that of the medium.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
