text:
  de:
    name: Härteprüfung nach Meyer
    description: >-
      Bei der Härteprüfung nach Meyer wird wie beim Brinell-Verfahren eine harte Kugel mit
      definierter Kraft in die Probe gedrückt. Als Härte gilt jedoch die Prüfkraft geteilt
      durch die projizierte Fläche des Eindrucks, also durch die Kreisfläche seines Durchmessers,
      statt durch die gekrümmte Kalottenoberfläche. Aus Messungen mit mehreren Kräften ergibt
      sich zusätzlich das Meyer-Gesetz, dessen Exponent die Kaltverfestigung des Werkstoffs
      beschreibt.
    example: >-
      Werkstoffforschung zur Kaltverfestigung, Vergleich der Verformbarkeit von Metallen
    conditions: >-
      Eine glatte, ebene Probenoberfläche und eine Kugel, die sich unter der Prüfkraft nicht
      merklich verformt.
    limits: >-
      Das Verfahren ist in der industriellen Praxis wenig verbreitet; bei sehr harten Werkstoffen
      verformt sich die Kugel selbst.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Meyer hardness test
    description: >-
      In the Meyer hardness test, as in the Brinell method, a hard ball is pressed into the
      sample with a defined force. The hardness, however, is the test force divided by the
      projected area of the indentation, i.e. the circular area given by its diameter, rather
      than by the curved surface of the spherical cap. Measurements at several forces also
      yield Meyer's law, whose exponent describes the strain hardening of the material.
    example: >-
      Materials research on strain hardening, comparing the formability of metals
    conditions: >-
      A smooth, flat sample surface and a ball that does not deform noticeably under the test
      force.
    limits: >-
      The method is little used in industrial practice; with very hard materials the ball
      itself deforms.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
