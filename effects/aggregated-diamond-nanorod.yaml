text:
  de:
    name: Aggregierte Diamant-Nanostäbchen
    description: >-
      Aggregierte Diamant-Nanostäbchen sind eine sehr dichte, nanokristalline Form von Kohlenstoff,
      die entsteht, wenn Fulleren (C60) bei extrem hohem Druck und hoher Temperatur umgewandelt
      wird. Das Gefüge aus winzigen, miteinander verwachsenen Diamantstäbchen ist noch weniger
      kompressibel als einkristalliner Diamant und gilt als einer der härtesten bekannten
      Werkstoffe.
    example: >-
      Forschungsstadium: mögliche Schneid- und Schleifstoffe für sehr harte Werkstoffe, Hochdruckforschung
    conditions: >-
      Herstellung nur unter extremen Bedingungen von rund 20 Gigapascal und über 2000 °C.
    limits: Bisher nur in sehr kleinen Mengen im Labor herstellbar.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Aggregated diamond nanorods
    description: >-
      Aggregated diamond nanorods are a very dense, nanocrystalline form of carbon produced
      by transforming fullerene (C60) at extremely high pressure and high temperature. The
      structure of tiny, intergrown diamond rods is even less compressible than single-crystal
      diamond and is regarded as one of the hardest known materials.
    example: >-
      Research stage: potential cutting and grinding materials for very hard workpieces, high-pressure
      research
    conditions: >-
      Can only be produced under extreme conditions of around 20 gigapascals and over 2000
      °C.
    limits: So far it can only be made in very small quantities in the laboratory.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
