text:
  de:
    name: Schräger Verdichtungsstoß
    description: >-
      Wird eine Überschallströmung durch einen Keil, eine Rampe oder eine Kante um einen Winkel
      umgelenkt, bildet sich ein schräg zur Strömung stehender Verdichtungsstoß. Beim Durchgang
      steigen Druck, Dichte und Temperatur nahezu sprunghaft an, die Geschwindigkeit nimmt
      ab, und die Strömung folgt danach der neuen Wandrichtung. Weil ein schräger Stoß schwächer
      ist als ein senkrechter, verdichtet eine Folge mehrerer schräger Stöße das Gas mit geringeren
      Verlusten.
    example: >-
      Lufteinläufe von Überschallflugzeugen und Staustrahltriebwerken, Keil- und Spitzenformen
      von Überschallflugkörpern, Windkanalversuche
    conditions: >-
      Eine Überschallströmung und ein Umlenkwinkel unterhalb des für die jeweilige Machzahl
      größtmöglichen Werts.
    limits: >-
      Ist der Umlenkwinkel zu groß, löst sich der Stoß von der Kante ab und wird zu einem
      gekrümmten, abgelösten Kopfstoß.
    sideEffects: >-
      Jeder Stoß kostet Totaldruck, und wo er auf eine Grenzschicht trifft, kann die Strömung
      ablösen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Oblique shock wave
    description: >-
      When a supersonic flow is turned through an angle by a wedge, ramp or corner, a compression
      shock forms that stands at an oblique angle to the flow. Across it, pressure, density
      and temperature rise almost abruptly, the velocity drops, and the flow then follows
      the new wall direction. Because an oblique shock is weaker than a normal one, a sequence
      of several oblique shocks compresses the gas with smaller losses.
    example: >-
      Air intakes of supersonic aircraft and ramjets, wedge and cone noses of supersonic vehicles,
      wind tunnel testing
    conditions: >-
      A supersonic flow and a deflection angle below the maximum possible value for the given
      Mach number.
    limits: >-
      If the deflection angle is too large, the shock detaches from the corner and becomes
      a curved, detached bow shock.
    sideEffects: >-
      Every shock costs total pressure, and where it meets a boundary layer the flow can separate.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
