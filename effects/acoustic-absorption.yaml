text:
  de:
    name: Schallabsorption
    description: >-
      Trifft Schall auf ein poröses oder schwingfähiges Material, wird ein Teil seiner Energie
      nicht zurückgeworfen, sondern in Wärme umgewandelt. In porösen Absorbern reibt die hin-
      und herschwingende Luft an den Wänden feiner Poren und Fasern, während Platten- und
      Helmholtz-Resonatoren dem Schallfeld vor allem bei ihrer Resonanzfrequenz Energie entziehen.
    example: >-
      Akustikdecken und Wandpaneele, Mineralwolle in Lärmschutzwänden, Schalldämpfer in Lüftungskanälen,
      Teppiche und Vorhänge, Motorkapselungen
    conditions: >-
      Poröse Absorber brauchen offene, untereinander verbundene Poren und eine Dicke, die
      zur tiefsten zu dämpfenden Frequenz passt.
    limits: >-
      Tiefe Frequenzen lassen sich mit dünnen porösen Schichten kaum absorbieren, weil die
      Schicht dafür etwa ein Viertel der Wellenlänge von der Wand entfernt wirken müsste.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Acoustic absorption
    description: >-
      When sound meets a porous or vibration-capable material, part of its energy is not reflected
      but converted into heat. In porous absorbers the oscillating air rubs against the walls
      of fine pores and fibres, while panel absorbers and Helmholtz resonators draw energy
      from the sound field mainly around their resonant frequency.
    example: >-
      Acoustic ceilings and wall panels, mineral wool in noise barriers, silencers in ventilation
      ducts, carpets and curtains, engine encapsulations
    conditions: >-
      Porous absorbers need open, interconnected pores and a thickness that suits the lowest
      frequency to be damped.
    limits: >-
      Low frequencies are hardly absorbed by thin porous layers, because the layer would have
      to act about a quarter wavelength away from the wall.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
