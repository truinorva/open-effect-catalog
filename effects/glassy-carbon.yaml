text:
  de:
    name: Glaskohlenstoff
    description: >-
      Glaskohlenstoff entsteht, wenn bestimmte Kunstharze unter Luftabschluss bei hohen Temperaturen
      verkohlt werden; dabei bildet sich ein ungeordnetes Gefüge aus verknäuelten graphitartigen
      Schichten, das sich nicht in Graphit umwandeln lässt. Das Material bricht muschelig
      wie Glas, ist gasdicht, hart, elektrisch leitend und gegenüber den meisten Säuren und
      Laugen äußerst beständig.
    example: >-
      Elektroden in Elektrochemie und Analytik, Tiegel und Schiffchen für Aufschlüsse und
      Schmelzen, Bauteile in der Halbleiterfertigung
    conditions: Bei hohen Temperaturen nur unter Vakuum oder Schutzgas einsetzbar.
    limits: >-
      Das Material ist spröde und schwer zu bearbeiten; an Luft oxidiert es oberhalb von etwa
      500 °C.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Glassy carbon
    description: >-
      Glassy carbon is made by carbonising certain synthetic resins at high temperatures in
      the absence of air; this forms a disordered structure of tangled graphite-like layers
      that cannot be converted into graphite. The material fractures conchoidally like glass,
      is gas-tight, hard, electrically conductive and extremely resistant to most acids and
      alkalis.
    example: >-
      Electrodes in electrochemistry and analysis, crucibles and boats for digestions and
      melts, components in semiconductor manufacturing
    conditions: At high temperatures, usable only under vacuum or inert gas.
    limits: >-
      The material is brittle and difficult to machine; in air it oxidises above roughly 500
      °C.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
