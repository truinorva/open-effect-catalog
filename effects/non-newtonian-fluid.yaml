text:
  de:
    name: Nichtnewtonsches Fluid
    description: >-
      Bei einem nichtnewtonschen Fluid hängt die Viskosität von der Scherbeanspruchung ab,
      anders als bei Wasser oder dünnem Öl. Scherverdünnende Stoffe wie Wandfarbe oder Ketchup
      werden beim Rühren, Streichen oder Pumpen dünnflüssiger; scherverdickende wie konzentrierte
      Stärkesuspensionen versteifen bei schlagartiger Belastung fast wie ein Festkörper. Andere
      Stoffe fließen erst oberhalb einer Fließgrenze oder ändern ihre Zähigkeit mit der Dauer
      der Belastung.
    example: >-
      Tropffreie Wandfarben, Zahnpasta, Bohrspülungen, Aufprallschutz mit scherverdickenden
      Materialien, Stärke-Wasser-Gemisch
    conditions: >-
      Gelöste lange Moleküle, dichte Partikelsuspensionen oder innere Netzwerkstrukturen,
      die sich unter Scherung umordnen.
    limits: >-
      Das jeweilige Verhalten gilt meist nur in bestimmten Bereichen von Scherrate, Temperatur
      und Feststoffgehalt.
    sideEffects: >-
      Pumpen, Rührwerke und Rohrleitungen lassen sich nicht mit den einfachen Formeln für
      newtonsche Fluide auslegen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Non-Newtonian fluid
    description: >-
      In a non-Newtonian fluid the viscosity depends on the shear load, unlike in water or
      thin oil. Shear-thinning substances such as wall paint or ketchup become runnier when
      stirred, brushed or pumped; shear-thickening ones such as concentrated starch suspensions
      stiffen almost like a solid under sudden load. Other substances only flow above a yield
      stress or change their viscosity with the duration of loading.
    example: >-
      Non-drip wall paints, toothpaste, drilling muds, impact protection with shear-thickening
      materials, cornstarch and water
    conditions: >-
      Dissolved long-chain molecules, dense particle suspensions or internal network structures
      that rearrange under shear.
    limits: >-
      The particular behaviour usually holds only within certain ranges of shear rate, temperature
      and solids content.
    sideEffects: >-
      Pumps, stirrers and pipelines cannot be designed with the simple formulas for Newtonian
      fluids.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
