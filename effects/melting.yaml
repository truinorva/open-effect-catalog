text:
  de:
    name: Schmelzen
    description: >-
      Beim Schmelzen geht ein Feststoff in den flüssigen Zustand über, sobald er seine Schmelztemperatur
      erreicht und weitere Wärme aufnimmt. Die zugeführte Schmelzwärme löst die feste Ordnung
      des Kristallgitters auf, ohne dass die Temperatur eines reinen Stoffes dabei weiter
      steigt; amorphe Stoffe wie Glas und viele Kunststoffe erweichen dagegen allmählich über
      einen Temperaturbereich. Die Schmelze lässt sich fließen lassen, formen und mischen
      und wird nach dem Erstarren dauerhaft in ihrer neuen Form festgehalten.
    example: >-
      Gießen von Metallen und Glas, Löten und Schmelzschweißen, Schmelzsicherung, Schmelzklebstoff,
      Kühlen von Getränken mit Eis, Recycling von Metallen und Kunststoffen, Zonenschmelzen
      zur Reinigung von Silizium
    conditions: >-
      Wärmezufuhr bis zur Schmelztemperatur und darüber hinaus die Schmelzwärme.
    limits: >-
      Manche Stoffe zersetzen sich oder verbrennen, bevor sie schmelzen, etwa Holz und viele
      Duroplaste; der Schmelzpunkt verschiebt sich mit dem Druck.
    sideEffects: >-
      Bei den meisten Stoffen ändert sich beim Schmelzen das Volumen, was beim Wiedererstarren
      Spannungen und Lunker verursacht; heiße Schmelzen oxidieren leicht.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Melting
    description: >-
      In melting, a solid changes to the liquid state as soon as it reaches its melting temperature
      and takes up further heat. The heat of fusion supplied breaks up the solid order of
      the crystal lattice without the temperature of a pure substance rising further; amorphous
      materials such as glass and many plastics, in contrast, soften gradually over a range
      of temperatures. The melt can be made to flow, shaped and mixed, and after solidification
      it is fixed permanently in its new form.
    example: >-
      Casting of metals and glass, soldering and fusion welding, fuses, hot-melt adhesive,
      cooling drinks with ice, recycling of metals and plastics, zone melting to purify silicon
    conditions: Heat supplied up to the melting temperature, plus the heat of fusion.
    limits: >-
      Some materials decompose or burn before they melt, such as wood and many thermosets;
      the melting point shifts with pressure.
    sideEffects: >-
      Most materials change volume on melting, which causes stresses and shrinkage cavities
      on resolidification; hot melts oxidise easily.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
