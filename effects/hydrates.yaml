text:
  de:
    name: Hydrate (Kristallwasser)
    description: >-
      Viele Salze und andere Stoffe lagern Wassermoleküle in festem Mengenverhältnis in ihr
      Kristallgitter ein und bilden Hydrate. Das Kristallwasser wird beim Erwärmen wieder
      abgegeben und bei Kontakt mit Feuchtigkeit erneut aufgenommen; dabei ändern sich oft
      Farbe, Volumen und Wärmeinhalt.
    example: >-
      Trockenmittel wie Calciumchlorid und Magnesiumsulfat, wasserfreies Kupfersulfat und
      Cobaltchlorid als Feuchteindikatoren, Abbinden von Gips, Salzhydrate als Latentwärmespeicher,
      Methanhydrat
    conditions: >-
      Temperatur und Luftfeuchte müssen im Stabilitätsbereich des jeweiligen Hydrats liegen.
    limits: >-
      Die Wasseraufnahme ist durch die feste Stöchiometrie begrenzt; manche Salze nehmen darüber
      hinaus Wasser auf, bis sie zerfließen.
    sideEffects: >-
      In Gasleitungen bilden sich Gashydrate, die als eisartige Pfropfen die Leitung verstopfen
      können.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Hydrates
    description: >-
      Many salts and other substances incorporate water molecules into their crystal lattice
      in a fixed ratio, forming hydrates. The water of crystallisation is released on heating
      and taken up again on contact with moisture; colour, volume and heat content often change
      in the process.
    example: >-
      Desiccants such as calcium chloride and magnesium sulfate, anhydrous copper sulfate
      and cobalt chloride as moisture indicators, setting of gypsum plaster, salt hydrates
      for latent heat storage, methane hydrate
    conditions: >-
      Temperature and humidity must lie within the stability range of the hydrate concerned.
    limits: >-
      Water uptake is limited by the fixed stoichiometry; some salts take up even more water
      until they deliquesce.
    sideEffects: Gas hydrates form in gas pipelines and can block them as ice-like plugs.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
