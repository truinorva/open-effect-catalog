text:
  de:
    name: Johnsen-Rahbek-Effekt
    description: >-
      Liegt eine Metallfläche auf einem schwach leitenden Werkstoff wie einer halbleitenden
      Keramik oder einem Gestein und wird zwischen beiden eine Gleichspannung angelegt, ziehen
      sie sich ungewöhnlich stark an. Der Strom fließt nur über wenige Berührungspunkte, so
      dass fast die ganze Spannung über den winzigen Luftspalten dazwischen abfällt. Die dort
      entstehenden sehr hohen Feldstärken erzeugen eine elektrostatische Anpresskraft, die
      weit größer ist als bei einem gewöhnlichen Kondensator gleicher Spannung.
    example: >-
      Elektrostatische Spannvorrichtungen für Siliziumwafer in der Halbleiterfertigung, elektrostatisch
      geschaltete Kupplungen und Bremsen
    conditions: >-
      Gleichspannung zwischen einem Leiter und einer Schicht mit mäßig hohem spezifischem
      Widerstand, die sich nur an Rauheitsspitzen berühren.
    limits: >-
      Weil Ladung erst durch den Werkstoff wandern muss, baut sich die Haltekraft verzögert
      auf und ab und hängt stark vom temperaturabhängigen Widerstand des Werkstoffs ab.
    sideEffects: >-
      Nach dem Abschalten kann Restladung das Werkstück noch eine Zeit lang festhalten.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Johnsen-Rahbek effect
    description: >-
      If a metal surface rests on a weakly conducting material such as a semiconducting ceramic
      or stone and a DC voltage is applied between them, they attract each other unusually
      strongly. Current flows only through a few contact points, so almost the whole voltage
      drops across the tiny air gaps in between. The very high field strengths there produce
      an electrostatic clamping force far greater than in an ordinary capacitor at the same
      voltage.
    example: >-
      Electrostatic chucks for silicon wafers in semiconductor manufacturing, electrostatically
      switched clutches and brakes
    conditions: >-
      DC voltage between a conductor and a layer of moderately high resistivity that touch
      only at surface asperities.
    limits: >-
      Because charge has to migrate through the material, the clamping force builds up and
      decays with a delay and depends strongly on the material's temperature-dependent resistivity.
    sideEffects: >-
      After switching off, residual charge can keep holding the workpiece for some time.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
