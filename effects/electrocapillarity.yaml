text:
  de:
    name: Elektrokapillarität
    description: >-
      Die Grenzflächenspannung zwischen einer Elektrode – klassisch Quecksilber – und einem
      Elektrolyten hängt vom angelegten elektrischen Potential ab. Die gleichnamigen Ladungen
      in der elektrischen Doppelschicht an der Grenzfläche stoßen einander ab und senken die
      Grenzflächenspannung; sie ist am größten beim Nullladungspotential und fällt zu beiden
      Seiten etwa parabelförmig ab (Elektrokapillarkurve). Dadurch verschiebt sich zum Beispiel
      ein Quecksilbermeniskus in einer Kapillare mit der Spannung.
    example: >-
      Lippmann-Kapillarelektrometer, Untersuchung der Doppelschicht an der Quecksilbertropfelektrode,
      Grundlage der Elektrobenetzung
    conditions: >-
      Polarisierbare Grenzfläche zwischen leitfähiger Flüssigkeit und Elektrolyt, an der im
      genutzten Potentialbereich kein nennenswerter Strom fließt.
    limits: >-
      Bei zu hoher Spannung setzen elektrochemische Reaktionen (Elektrolyse) ein.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electrocapillarity
    description: >-
      The interfacial tension between an electrode – classically mercury – and an electrolyte
      depends on the applied electric potential. Like charges in the electrical double layer
      at the interface repel each other and lower the interfacial tension; it is greatest
      at the potential of zero charge and falls off roughly parabolically on both sides (electrocapillary
      curve). As a result, a mercury meniscus in a capillary, for example, shifts with the
      voltage.
    example: >-
      Lippmann capillary electrometer, double-layer studies at the dropping mercury electrode,
      basis of electrowetting
    conditions: >-
      Polarisable interface between a conductive liquid and an electrolyte, with no significant
      current flowing in the potential range used.
    limits: At excessive voltage, electrochemical reactions (electrolysis) set in.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
