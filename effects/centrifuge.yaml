text:
  de:
    name: Zentrifuge (Zentrifugaltrennung)
    description: >-
      Eine Zentrifuge versetzt ein Gemisch in schnelle Drehung, sodass auf seine Bestandteile
      ein Vielfaches der Erdbeschleunigung wirkt. Dichtere Bestandteile wandern dadurch nach
      außen, leichtere bleiben innen; Trennungen, die unter Schwerkraft Stunden dauern oder
      gar nicht gelingen, laufen so in Minuten ab. Je nach Bauart werden Feststoffe abgeschieden,
      Flüssigkeiten unterschiedlicher Dichte getrennt oder Flüssigkeit aus einem Feststoff
      geschleudert.
    example: >-
      Milchseparator, Dekanter in Kläranlagen, Laborzentrifuge für Blutproben, Ultrazentrifuge,
      Gaszentrifugen zur Urananreicherung, Wäscheschleuder
    conditions: Ein Dichteunterschied zwischen den zu trennenden Bestandteilen.
    limits: >-
      Die Drehzahl ist durch die Festigkeit des Rotors begrenzt; sehr kleine Teilchen mit
      geringem Dichteunterschied lassen sich nur in Ultrazentrifugen abtrennen.
    sideEffects: >-
      Unwucht verursacht Schwingungen und Lagerbelastungen; ein Rotorbruch kann sehr gefährlich
      sein.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Centrifuge (centrifugal separation)
    description: >-
      A centrifuge spins a mixture rapidly, so that its components experience many times the
      acceleration due to gravity. Denser components move outwards while lighter ones stay
      inside; separations that would take hours under gravity, or not happen at all, are done
      in minutes. Depending on the design, solids are separated out, liquids of different
      density are split or liquid is spun out of a solid.
    example: >-
      Milk separator, decanter centrifuges in sewage plants, laboratory centrifuge for blood
      samples, ultracentrifuge, gas centrifuges for uranium enrichment, spin dryer
    conditions: A density difference between the components to be separated.
    limits: >-
      Rotational speed is limited by rotor strength; very small particles with a small density
      difference can only be separated in ultracentrifuges.
    sideEffects: >-
      Imbalance causes vibration and bearing loads; rotor failure can be very dangerous.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
