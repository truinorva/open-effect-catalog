text:
  de:
    name: Plasmaunterstützte chemische Gasphasenabscheidung (PECVD)
    description: >-
      Bei der PECVD werden gasförmige Ausgangsstoffe wie Silan, Ammoniak oder Kohlenwasserstoffe
      in ein Plasma geleitet, wo Elektronenstöße sie in reaktive Bruchstücke zerlegen. Diese
      reagieren auf der Substratoberfläche und bilden eine dünne, feste Schicht. Weil das
      Plasma die Energie für die Zerlegung liefert, genügen Substrattemperaturen von etwa
      200 bis 400 °C statt der viel höheren Temperaturen der thermischen CVD.
    example: >-
      Siliziumnitrid-Entspiegelung und Passivierung auf Solarzellen, Isolier- und Schutzschichten
      in der Mikroelektronik, amorphes Silizium für Dünnschichttransistoren, diamantähnliche
      Kohlenstoffschichten, Barriereschichten auf Kunststoffflaschen und Folien
    conditions: >-
      Ein Niederdruckreaktor oder Atmosphärendruckplasma mit geeigneten Precursor-Gasen und
      geregelter Zufuhr elektrischer Leistung.
    limits: >-
      Die Schichten enthalten oft Wasserstoff und sind weniger dicht und rein als thermisch
      abgeschiedene.
    sideEffects: >-
      Precursor-Gase wie Silan sind giftig oder selbstentzündlich, und Ionenbeschuss kann
      empfindliche Oberflächen schädigen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Plasma-enhanced chemical vapour deposition (PECVD)
    description: >-
      In PECVD, gaseous precursors such as silane, ammonia or hydrocarbons are fed into a
      plasma, where electron impacts break them into reactive fragments. These react on the
      substrate surface and form a thin solid layer. Because the plasma supplies the energy
      for decomposition, substrate temperatures of about 200 to 400 °C suffice instead of
      the much higher temperatures of thermal CVD.
    example: >-
      Silicon nitride anti-reflection and passivation layers on solar cells, insulating and
      protective layers in microelectronics, amorphous silicon for thin-film transistors,
      diamond-like carbon coatings, barrier layers on plastic bottles and films
    conditions: >-
      A low-pressure reactor or atmospheric-pressure plasma with suitable precursor gases
      and controlled electrical power input.
    limits: >-
      The layers often contain hydrogen and are less dense and pure than thermally deposited
      ones.
    sideEffects: >-
      Precursor gases such as silane are toxic or pyrophoric, and ion bombardment can damage
      sensitive surfaces.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
