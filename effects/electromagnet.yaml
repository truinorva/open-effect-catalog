text:
  de:
    name: Elektromagnet
    description: >-
      Ein stromdurchflossener Leiter erzeugt ein Magnetfeld; wickelt man ihn zu einer Spule,
      addieren sich die Felder der Windungen, und ein Kern aus weichmagnetischem Eisen verstärkt
      das Feld um ein Vielfaches. Anders als bei einem Dauermagneten lässt sich die Feldstärke
      über den Strom einstellen und ganz abschalten.
    example: >-
      Relais, Lasthebemagnet am Schrottkran, Magnetventil, Magnetabscheider, Türöffner, Magnet
      im MRT
    conditions: Stromquelle; für hohe Felder ein weichmagnetischer Kern.
    limits: >-
      Mit Eisenkern begrenzt die magnetische Sättigung die Feldstärke auf etwa 2 Tesla.
    sideEffects: >-
      Der Wicklungswiderstand erzeugt Wärme; beim Abschalten induziert die Spule eine hohe
      Spannungsspitze.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electromagnet
    description: >-
      A current-carrying conductor produces a magnetic field; winding it into a coil adds
      up the fields of the turns, and a core of soft magnetic iron multiplies the field. Unlike
      a permanent magnet, the field strength can be set by the current and switched off completely.
    example: >-
      Relay, lifting magnet on a scrap crane, solenoid valve, magnetic separator, door opener,
      MRI magnet
    conditions: Power supply; a soft magnetic core for high fields.
    limits: >-
      With an iron core, magnetic saturation limits the field to about 2 tesla.
    sideEffects: >-
      Winding resistance produces heat; on switch-off, the coil induces a high voltage spike.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
