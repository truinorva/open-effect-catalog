text:
  de:
    name: Zahnrad (Zahnradgetriebe)
    description: >-
      Zahnräder greifen mit ihren Zähnen formschlüssig ineinander und übertragen so Drehbewegung
      und Drehmoment schlupffrei von einer Welle auf eine andere. Das Verhältnis der Zähnezahlen
      legt fest, wie Drehzahl und Drehmoment umgesetzt werden: Ein kleines Rad, das ein großes
      antreibt, senkt die Drehzahl und erhöht das Moment.
    example: >-
      Fahrzeuggetriebe, Uhrwerke, Planetengetriebe, Zahnstangenlenkung, Getriebe von Windenergieanlagen,
      Differenzial
    conditions: ''
    limits: >-
      Zahnflanken verschleißen und können bei Überlast brechen; das Übersetzungsverhältnis
      eines Radpaars ist fest.
    sideEffects: >-
      Der Zahneingriff erzeugt Geräusche und Schwingungen, und Getriebe brauchen Schmierung.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Gear
    description: >-
      Gears mesh tooth by tooth and so transmit rotation and torque from one shaft to another
      without slip. The ratio of the numbers of teeth determines how speed and torque are
      converted: a small gear driving a large one lowers the speed and raises the torque.
    example: >-
      Vehicle gearboxes, clockworks, planetary gears, rack-and-pinion steering, wind turbine
      gearboxes, differentials
    conditions: ''
    limits: >-
      Tooth flanks wear and can break under overload; the ratio of a gear pair is fixed.
    sideEffects: Tooth meshing generates noise and vibration, and gears need lubrication.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
