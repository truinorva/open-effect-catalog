text:
  de:
    name: Hydrolyse
    description: >-
      Bei der Hydrolyse spaltet Wasser eine chemische Bindung: Ein Molekül zerfällt in zwei
      Teile, von denen einer das H und der andere das OH des Wassers aufnimmt. Säuren, Basen
      oder Enzyme beschleunigen die Reaktion; auf diese Weise werden Ester, Amide, Polysaccharide,
      Proteine und viele Kunststoffe abgebaut.
    example: >-
      Verseifung von Fetten zu Seife, Herstellung von Glucosesirup aus Stärke, Verdauung,
      resorbierbares chirurgisches Nahtmaterial, chemisches Recycling von PET
    conditions: >-
      Wasser sowie meist ein Katalysator (Säure, Base oder Enzym) und erhöhte Temperatur.
    limits: ''
    sideEffects: >-
      Polyester und Polyamide altern in feuchter Wärme durch Hydrolyse und verlieren an Festigkeit.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Hydrolysis
    description: >-
      In hydrolysis, water splits a chemical bond: a molecule breaks into two parts, one of
      which takes up the H and the other the OH of the water. Acids, bases or enzymes speed
      up the reaction; this is how esters, amides, polysaccharides, proteins and many plastics
      are broken down.
    example: >-
      Saponification of fats into soap, production of glucose syrup from starch, digestion,
      absorbable surgical sutures, chemical recycling of PET
    conditions: >-
      Water and usually a catalyst (acid, base or enzyme) and elevated temperature.
    limits: ''
    sideEffects: >-
      Polyesters and polyamides age by hydrolysis in humid heat and lose strength.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
