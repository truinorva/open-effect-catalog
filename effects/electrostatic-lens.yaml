text:
  de:
    name: Elektrostatische Linse
    description: >-
      Eine Anordnung von Elektroden, meist Rohre, Blenden oder Ringe auf unterschiedlichen
      Potentialen, erzeugt ein rotationssymmetrisches elektrisches Feld, das geladene Teilchen
      ähnlich ablenkt wie eine Glaslinse das Licht. Elektronen oder Ionen, die achsfern eintreten,
      werden stärker zur Achse hin gelenkt als achsnahe, so dass sich der Strahl fokussieren
      und abbilden lässt; die Brennweite wird über die Spannungen eingestellt.
    example: >-
      Elektronenkanone in Kathodenstrahlröhren, Ionenoptik in Massenspektrometern und Ionenimplantern,
      Elektronenmikroskope
    conditions: Geladene Teilchen im Vakuum.
    limits: >-
      Linsenfehler, vor allem sphärische und chromatische Aberration, begrenzen die Auflösung.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electrostatic lens
    description: >-
      An arrangement of electrodes, usually tubes, apertures or rings at different potentials,
      produces a rotationally symmetric electric field that deflects charged particles much
      as a glass lens bends light. Electrons or ions entering far from the axis are deflected
      more strongly towards it than those near the axis, so the beam can be focused and imaged;
      the focal length is set by the voltages.
    example: >-
      Electron gun in cathode-ray tubes, ion optics in mass spectrometers and ion implanters,
      electron microscopes
    conditions: Charged particles in a vacuum.
    limits: >-
      Lens aberrations, especially spherical and chromatic aberration, limit the resolution.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
