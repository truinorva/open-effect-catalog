text:
  de:
    name: Sperrklinke (Ratsche)
    description: >-
      Eine Ratsche besteht aus einem Zahnrad oder einer Zahnstange mit asymmetrischen Zähnen
      und einer federbelasteten Klinke. In der einen Richtung gleitet die Klinke über die
      flachen Zahnrücken, in der anderen verhakt sie sich an der steilen Zahnflanke und sperrt;
      so lässt der Mechanismus Bewegung nur in eine Richtung zu oder wandelt eine Hin-und-her-Bewegung
      in schrittweises Weiterdrehen um.
    example: >-
      Ratschenschlüssel, Kabelbinder, Seilwinden und Hebezeuge, Freilauf am Fahrrad, Aufzug
      mechanischer Uhren, Spanngurte
    conditions: Federkraft oder Schwerkraft, die die Klinke in die Verzahnung drückt.
    limits: >-
      Die Sperrstellungen sind durch die Zahnteilung vorgegeben, sodass zwischen zwei Zähnen
      etwas Rücklauf möglich ist; zum Lösen muss die Klinke ausgehoben werden.
    sideEffects: Klickgeräusche und Verschleiß an Klinke und Zähnen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Ratchet
    description: >-
      A ratchet consists of a gear wheel or rack with asymmetric teeth and a spring-loaded
      pawl. In one direction the pawl slides over the gently sloping backs of the teeth, in
      the other it catches on the steep flank and locks; the mechanism thus permits motion
      in one direction only, or converts a back-and-forth motion into step-by-step rotation.
    example: >-
      Ratchet spanners, cable ties, winches and hoists, bicycle freewheels, winding mechanisms
      of mechanical clocks, ratchet straps
    conditions: Spring force or gravity pressing the pawl into the teeth.
    limits: >-
      The locking positions are set by the tooth pitch, so some backlash is possible between
      two teeth; to release, the pawl must be lifted.
    sideEffects: Clicking noise and wear on pawl and teeth.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
