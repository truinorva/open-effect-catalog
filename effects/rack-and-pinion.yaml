text:
  de:
    name: Zahnstangengetriebe
    description: >-
      Ein Zahnrad (Ritzel) greift in eine gerade Zahnstange, sodass eine Drehbewegung in eine
      geradlinige Bewegung umgesetzt wird oder umgekehrt. Je Umdrehung verschiebt sich die
      Zahnstange um den Umfang des Teilkreises, und die Verzahnung überträgt große Kräfte
      formschlüssig und ohne Schlupf.
    example: >-
      Zahnstangenlenkung im Auto, Zahnradbahnen, Linearachsen von Werkzeugmaschinen und Portalrobotern,
      Messuhren, Torantriebe, Treppenlifte
    conditions: Genau gefertigte Verzahnung und ausreichende Schmierung.
    limits: >-
      Das Zahnflankenspiel begrenzt die Positioniergenauigkeit bei Richtungswechsel, und für
      lange Wege müssen mehrere Zahnstangen exakt aneinandergesetzt werden.
    sideEffects: Verschleiß, Geräusche und zunehmendes Spiel an den Zahnflanken.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Rack and pinion
    description: >-
      A gear (pinion) meshes with a straight toothed bar (rack), so that rotary motion is
      converted into linear motion or vice versa. Per revolution the rack moves by the circumference
      of the pitch circle, and the teeth transmit large forces positively and without slip.
    example: >-
      Rack-and-pinion steering in cars, rack railways, linear axes of machine tools and gantry
      robots, dial indicators, gate drives, stairlifts
    conditions: Precisely cut teeth and adequate lubrication.
    limits: >-
      Backlash between the teeth limits positioning accuracy on reversal, and for long travel
      several racks must be joined exactly.
    sideEffects: Wear, noise and increasing backlash at the tooth flanks.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
