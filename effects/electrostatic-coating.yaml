text:
  de:
    name: Elektrostatische Beschichtung (Pulver- und Nasslackieren)
    description: >-
      Pulverteilchen oder Lacktröpfchen werden beim Versprühen elektrisch aufgeladen, meist
      durch eine Koronaelektrode an der Sprühpistole, während das Werkstück geerdet ist. Die
      Teilchen folgen den Feldlinien zum Werkstück, erreichen teilweise auch seine Rückseite
      und haften dort elektrostatisch, bis die Schicht eingebrannt oder getrocknet wird; dadurch
      geht deutlich weniger Material am Werkstück vorbei als beim herkömmlichen Spritzen.
    example: >-
      Pulverbeschichten von Metallteilen, elektrostatisches Lackieren von Karosserien mit
      Hochrotationsglocken, Beschichten von Heizkörpern und Fensterprofilen
    conditions: Elektrisch leitfähiges, geerdetes Werkstück.
    limits: >-
      In tiefen Ecken und Hohlräumen wird das Feld abgeschirmt (Faraday-Käfig-Effekt), so
      dass dort weniger Beschichtung ankommt.
    sideEffects: Funkenentladungen können Lösemitteldämpfe oder Pulverstaub entzünden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electrostatic coating
    description: >-
      Powder particles or paint droplets are electrically charged as they are sprayed, usually
      by a corona electrode at the spray gun, while the workpiece is earthed. The particles
      follow the field lines to the workpiece, partly reaching its back as well, and adhere
      electrostatically until the coating is baked or dried; far less material misses the
      workpiece than with conventional spraying.
    example: >-
      Powder coating of metal parts, electrostatic painting of car bodies with high-speed
      rotary bells, coating radiators and window profiles
    conditions: Electrically conductive, earthed workpiece.
    limits: >-
      In deep corners and cavities the field is shielded (Faraday cage effect), so less coating
      reaches them.
    sideEffects: Spark discharges can ignite solvent vapours or powder dust.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
