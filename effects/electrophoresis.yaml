text:
  de:
    name: Elektrophorese
    description: >-
      Bei der Elektrophorese versetzt ein elektrisches Feld geladene Teilchen oder Moleküle
      in eine gerichtete Bewegung relativ zum umgebenden Medium. Wie schnell sie wandern,
      hängt unter anderem von ihrer Ladung, ihrer Größe und den Eigenschaften des Trägermaterials
      ab. Diese Unterschiede ermöglichen es, beispielsweise DNA-Fragmente oder Proteine in
      einem Gel voneinander zu trennen und anschließend zu untersuchen.
    example: Analytik in Biologie und Medizin, präparative Proteinreinigung
