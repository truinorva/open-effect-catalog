    limits: ''
    sideEffects: ''
    kind: original
    author: Tabitha Adunka
    model: ''
    updated: '2026-09-25'
  en:
    name: Electrophoresis
    description: >-
      In electrophoresis, an electric field causes charged particles or molecules to move
      in a directed motion relative to the surrounding medium. How fast they migrate depends,
      among other things, on their charge, their size, and the properties of the carrier material.
      These differences make it possible, for example, to separate DNA fragments or proteins
      from one another in a gel and subsequently analyze them.
    example: Analysis in biology and medicine, preparative protein purification
    conditions: ''
    limits: ''
    sideEffects: ''
