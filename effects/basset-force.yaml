text:
  de:
    name: Basset-Kraft
    description: >-
      Wird ein Teilchen in einem zähen Fluid beschleunigt, baut sich die Grenzschicht um das
      Teilchen nicht sofort, sondern mit zeitlicher Verzögerung auf. Daraus entsteht eine
      zusätzliche Widerstandskraft, die von der gesamten bisherigen Beschleunigungsgeschichte
      des Teilchens abhängt und deshalb auch Geschichtskraft genannt wird.
    example: >-
      Berechnung der Bewegung von Partikeln, Tropfen und Blasen in instationären Strömungen,
      Partikelbewegung in schwingenden Strömungen, Bewertung, wie gut Tracer-Partikel einer
      Strömung folgen
    conditions: >-
      Eine instationäre Relativbewegung zwischen Teilchen und Fluid bei kleinen Reynolds-Zahlen.
    limits: >-
      Bei stationärer Bewegung verschwindet die Kraft, und wenn die Dichte des Teilchens die
      des Fluids weit übersteigt, ist sie meist vernachlässigbar.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Basset force (history force)
    description: >-
      When a particle accelerates in a viscous fluid, the boundary layer around it does not
      build up at once but with a time lag. This produces an additional resistance force that
      depends on the particle's entire past acceleration and is therefore also called the
      history force.
    example: >-
      Calculating the motion of particles, droplets and bubbles in unsteady flows, particle
      motion in oscillating flows, assessing how well tracer particles follow a flow
    conditions: >-
      Unsteady relative motion between particle and fluid at low Reynolds numbers.
    limits: >-
      In steady motion the force vanishes, and when the particle density far exceeds that
      of the fluid it is usually negligible.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
