text:
  de:
    name: Totalreflexion
    description: >-
      Trifft Licht aus einem optisch dichteren Medium unter einem Winkel zum Lot, der größer
      als der Grenzwinkel ist, auf die Grenzfläche zu einem dünneren Medium, wird es vollständig
      zurückgeworfen, ohne die Verluste eines Metallspiegels. Der Grenzwinkel folgt aus dem
      Verhältnis der Brechzahlen und liegt für Glas gegen Luft bei etwa 42°. Ein schwaches
      Feld dringt dabei einen Bruchteil der Wellenlänge in das dünnere Medium ein; berührt
      dort etwas die Fläche, wird die Reflexion gestört.
    example: >-
      Lichtwellenleiter, Umlenkprismen in Ferngläsern, Refraktometer, Regensensoren an Windschutzscheiben,
      optische Füllstandssensoren, Fingerabdruckscanner, ATR-Infrarotspektroskopie
    conditions: >-
      Übergang vom optisch dichteren ins dünnere Medium bei einem Einfallswinkel über dem
      Grenzwinkel.
    limits: >-
      Verschmutzungen, Kratzer oder Berührungen an der Grenzfläche koppeln Licht aus.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Total internal reflection
    description: >-
      When light travelling in an optically denser medium strikes the boundary with a less
      dense medium at an angle to the normal larger than the critical angle, it is reflected
      completely, without the losses of a metal mirror. The critical angle follows from the
      ratio of the refractive indices; for glass to air it is about 42°. A weak field penetrates
      a fraction of a wavelength into the less dense medium; if something touches the surface
      there, the reflection is disturbed.
    example: >-
      Optical fibres, deflecting prisms in binoculars, refractometers, rain sensors on windscreens,
      optical level sensors, fingerprint scanners, ATR infrared spectroscopy
    conditions: >-
      Transition from the optically denser to the less dense medium at an angle of incidence
      above the critical angle.
    limits: Dirt, scratches or contact at the boundary couple light out.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
