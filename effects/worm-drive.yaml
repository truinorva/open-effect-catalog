text:
  de:
    name: Schneckengetriebe
    description: >-
      Eine Schnecke, eine Art Schraube, greift rechtwinklig in ein Schneckenrad. Bei jeder
      Umdrehung der Schnecke rückt das Rad nur um einen oder wenige Zähne weiter, sodass in
      einer einzigen Stufe sehr große Untersetzungen und hohe Drehmomente entstehen. Weil
      die Flanken aufeinander gleiten, kann die Reibung das Getriebe bei kleinem Steigungswinkel
      selbsthemmend machen: Das Rad kann die Schnecke dann nicht zurückdrehen.
    example: >-
      Seilwinden und Hebezeuge, Torantriebe, Stimmmechaniken von Gitarren, Förderbandantriebe,
      Drehtische
    conditions: >-
      Gute Schmierung; meist ein Schneckenrad aus Bronze gegen eine Schnecke aus Stahl.
    limits: >-
      Wegen der Gleitreibung ist der Wirkungsgrad niedrig, bei selbsthemmenden Getrieben unter
      50 %.
    sideEffects: Erwärmung und Verschleiß an den Zahnflanken.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Worm drive
    description: >-
      A worm, a kind of screw, meshes at right angles with a worm wheel. With each turn of
      the worm, the wheel advances by only one or a few teeth, so very high reduction ratios
      and high torques arise in a single stage. Because the flanks slide on each other, friction
      can make the drive self-locking at a small lead angle: the wheel then cannot turn the
      worm back.
    example: >-
      Winches and hoists, gate operators, guitar tuning machines, conveyor drives, rotary
      tables
    conditions: Good lubrication; usually a bronze worm wheel against a steel worm.
    limits: >-
      Because of sliding friction, efficiency is low, below 50 % for self-locking drives.
    sideEffects: Heating and wear on the tooth flanks.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
