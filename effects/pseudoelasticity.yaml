text:
  de:
    name: Pseudoelastizität (Superelastizität)
    description: >-
      Formgedächtnislegierungen wie Nickel-Titan können oberhalb ihrer Umwandlungstemperatur
      Dehnungen von mehreren Prozent vollständig zurückbilden. Die Last wandelt das austenitische
      Gefüge in spannungsinduzierten Martensit um, der sich bei Entlastung von selbst zurückverwandelt;
      die Spannung bleibt dabei über einen weiten Dehnungsbereich nahezu konstant, und Be-
      und Entlastungskurve bilden eine Hystereseschleife.
    example: >-
      Selbstexpandierende Stents, Zahnspangendrähte mit gleichbleibender Kraft, flexible Brillengestelle,
      Führungsdrähte für Katheter, Wurzelkanalfeilen, Dämpfungselemente im Erdbebenschutz
    conditions: >-
      Eine Formgedächtnislegierung bei einer Temperatur etwas oberhalb ihrer Austenit-Endtemperatur.
    limits: >-
      Der Effekt wirkt nur in einem begrenzten Temperaturfenster; zu große Dehnung oder zu
      hohe Temperatur führen zu bleibender plastischer Verformung.
    sideEffects: >-
      Die Hysterese wandelt bei jedem Zyklus Energie in Wärme um, und zyklische Belastung
      führt zu funktioneller Ermüdung des Werkstoffs.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Pseudoelasticity (superelasticity)
    description: >-
      Shape memory alloys such as nickel-titanium can fully recover strains of several percent
      above their transformation temperature. The load transforms the austenite structure
      into stress-induced martensite, which reverts spontaneously when the load is removed;
      the stress stays almost constant over a wide strain range, and the loading and unloading
      curves form a hysteresis loop.
    example: >-
      Self-expanding stents, orthodontic wires with constant force, flexible eyeglass frames,
      catheter guidewires, endodontic files, damping elements for earthquake protection
    conditions: >-
      A shape memory alloy at a temperature slightly above its austenite finish temperature.
    limits: >-
      The effect works only within a limited temperature window; excessive strain or temperature
      leads to permanent plastic deformation.
    sideEffects: >-
      The hysteresis converts energy into heat in every cycle, and cyclic loading causes functional
      fatigue of the material.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
