text:
  de:
    name: Laufzeitmessung (Time of Flight)
    description: >-
      Aus der Zeit, die ein Signal oder Teilchen für eine Strecke braucht, ergibt sich bei
      bekannter Ausbreitungsgeschwindigkeit die Entfernung oder bei bekannter Strecke die
      Geschwindigkeit. Licht-, Radar- und Ultraschallpulse werden von einem Objekt zurückgeworfen,
      und die Verzögerung des Echos wird ausgewertet; im Flugzeit-Massenspektrometer fliegen
      mit gleicher Spannung beschleunigte Ionen je nach Masse-Ladungs-Verhältnis unterschiedlich
      schnell.
    example: >-
      Lidar und ToF-Kameras, Radar, Ultraschall-Abstandssensoren, Ultraschall-Wanddickenmessung,
      Laufzeit-Durchflussmesser, Flugzeit-Massenspektrometer
    conditions: Bekannte Ausbreitungsgeschwindigkeit im Medium und präzise Zeitmessung.
    limits: >-
      Die Auflösung hängt von der Zeitauflösung ab: Bei Licht entspricht eine Nanosekunde
      Laufzeit hin und zurück 15 Zentimetern Abstand.
    sideEffects: >-
      Mehrfachreflexionen und der Einfluss der Temperatur auf die Schallgeschwindigkeit verfälschen
      die Messung.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Time of flight
    description: >-
      From the time a signal or particle takes to cover a distance, the distance follows if
      the propagation speed is known, or the speed if the distance is known. Light, radar
      and ultrasonic pulses are reflected by an object and the echo delay is evaluated; in
      a time-of-flight mass spectrometer, ions accelerated by the same voltage fly at different
      speeds depending on their mass-to-charge ratio.
    example: >-
      Lidar and ToF cameras, radar, ultrasonic distance sensors, ultrasonic wall thickness
      gauging, transit-time flow meters, time-of-flight mass spectrometers
    conditions: Known propagation speed in the medium and precise timing.
    limits: >-
      Resolution depends on timing resolution: for light, one nanosecond of round-trip time
      corresponds to 15 centimetres of distance.
    sideEffects: >-
      Multiple reflections and the influence of temperature on the speed of sound falsify
      the measurement.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
