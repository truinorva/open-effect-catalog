text:
  de:
    name: Hopkinson-Effekt
    description: >-
      Die Anfangspermeabilität bzw. Anfangssuszeptibilität eines Ferromagneten steigt mit
      der Temperatur kurz unterhalb der Curie-Temperatur steil an und bricht beim Erreichen
      des Curie-Punkts ein. Ursache ist, dass die Anisotropie, die die Magnetisierung festhält,
      schneller abnimmt als die Sättigungsmagnetisierung, sodass ein schwaches Feld die Magnetisierung
      leichter ausrichten kann.
    example: >-
      Bestimmung von Curie-Temperaturen, Untersuchung magnetischer Minerale im Gesteinsmagnetismus
    conditions: >-
      Ferro- oder ferrimagnetischer Stoff, schwaches Messfeld, Temperatur knapp unter dem
      Curie-Punkt.
    limits: Der Anstieg tritt nur in einem schmalen Temperaturbereich auf.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Hopkinson effect
    description: >-
      The initial permeability or susceptibility of a ferromagnet rises steeply with temperature
      just below the Curie temperature and collapses on reaching the Curie point. The reason
      is that the anisotropy pinning the magnetisation decreases faster than the saturation
      magnetisation, so a weak field can align the magnetisation more easily.
    example: >-
      Determining Curie temperatures, studying magnetic minerals in rock magnetism
    conditions: >-
      Ferromagnetic or ferrimagnetic material, weak measuring field, temperature just below
      the Curie point.
    limits: The rise occurs only in a narrow temperature range.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
