text:
  de:
    name: Freeze-Casting (Gefrierguss)
    description: >-
      Eine Suspension aus Keramik- oder Metallpulver wird gerichtet eingefroren; die wachsenden
      Eiskristalle schieben die Partikel beiseite und drängen sie in die Zwischenräume. Anschließend
      wird das Eis durch Gefriertrocknung entfernt und der Körper gesintert, sodass ein poröses
      Bauteil entsteht, dessen Poren die Form der Eiskristalle abbilden.
    example: >-
      Poröse Gerüste für Knochenersatz, perlmuttartige Verbundwerkstoffe, Elektroden mit ausgerichteten
      Poren, Katalysatorträger
    conditions: >-
      Eine stabile Suspension sowie kontrollierte Gefrierrichtung und Gefriergeschwindigkeit.
    limits: >-
      Bauteilgröße und Gleichmäßigkeit sind begrenzt, weil sich die Gefrierfront über große
      Strecken schwer gleichmäßig führen lässt.
    sideEffects: Beim Sintern schrumpft der Körper.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Freeze casting
    description: >-
      A suspension of ceramic or metal powder is frozen directionally; the growing ice crystals
      push the particles aside and pack them into the spaces between. The ice is then removed
      by freeze drying and the body is sintered, giving a porous part whose pores replicate
      the shape of the ice crystals.
    example: >-
      Porous bone scaffolds, nacre-like composites, electrodes with aligned pores, catalyst
      supports
    conditions: A stable suspension and a controlled freezing direction and rate.
    limits: >-
      Part size and uniformity are limited, because the freezing front is hard to keep uniform
      over long distances.
    sideEffects: The body shrinks during sintering.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
