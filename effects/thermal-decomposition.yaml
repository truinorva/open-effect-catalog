text:
  de:
    name: Thermolyse (thermische Zersetzung)
    description: >-
      Beim Erhitzen über eine stoffspezifische Temperatur zerfallen chemische Verbindungen
      in kleinere Moleküle oder Elemente, weil die zugeführte Energie Bindungen aufbricht.
      Meist entstehen dabei ein Gas und ein fester oder flüssiger Rückstand, etwa Kohlendioxid
      und Branntkalk aus Kalkstein. Die Reaktion ist in der Regel endotherm und läuft nur,
      solange Wärme zugeführt wird.
    example: >-
      Kalkbrennen, Backpulver als Triebmittel, Holzkohleherstellung, Pyrolyse von Kunststoffabfällen,
      Steamcracken von Kohlenwasserstoffen
    conditions: >-
      Temperatur oberhalb der Zersetzungstemperatur; oft unter Luftabschluss, damit der Stoff
      nicht verbrennt.
    limits: >-
      Erfordert ständige Wärmezufuhr; viele Stoffe zerfallen in mehrere, schwer steuerbare
      Produkte.
    sideEffects: Es können giftige oder brennbare Gase entstehen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Thermal decomposition (thermolysis)
    description: >-
      When heated above a temperature specific to the substance, chemical compounds break
      down into smaller molecules or elements because the supplied energy breaks bonds. Usually
      a gas and a solid or liquid residue form, for example carbon dioxide and quicklime from
      limestone. The reaction is generally endothermic and continues only while heat is supplied.
    example: >-
      Lime burning, baking powder as a raising agent, charcoal making, pyrolysis of plastic
      waste, steam cracking of hydrocarbons
    conditions: >-
      Temperature above the decomposition temperature; often in the absence of air so that
      the substance does not burn.
    limits: >-
      Requires a continuous heat supply; many substances break down into several products
      that are hard to control.
    sideEffects: Toxic or flammable gases may be released.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
