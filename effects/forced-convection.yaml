text:
  de:
    name: Erzwungene Konvektion
    description: >-
      Bei der erzwungenen Konvektion wird ein Fluid durch eine äußere Ursache, etwa einen
      Ventilator, eine Pumpe oder die Fahrtbewegung, an einer Oberfläche vorbeigeführt und
      transportiert dabei Wärme. Die höhere Strömungsgeschwindigkeit verdünnt die wärmedämmende
      Grenzschicht an der Wand, so dass der Wärmeübergang ein Vielfaches der freien Konvektion
      erreichen kann.
    example: >-
      Lüfterkühlung von Prozessoren, Autokühler, Umluftbackofen, Heizlüfter, Wärmeübertrager
      mit Pumpenumlauf
    conditions: Antrieb der Strömung durch Pumpe, Gebläse oder Relativbewegung.
    limits: >-
      Eine höhere Strömungsgeschwindigkeit verbessert den Wärmeübergang nur unterproportional,
      kostet aber zunehmend Antriebsleistung.
    sideEffects: Geräusche und Energiebedarf von Pumpe oder Lüfter.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Forced convection
    description: >-
      In forced convection, a fluid is driven past a surface by an external cause such as
      a fan, a pump or the motion of a vehicle, carrying heat with it. The higher flow velocity
      thins the insulating boundary layer at the wall, so heat transfer can be many times
      greater than with natural convection.
    example: >-
      Fan cooling of processors, car radiators, fan ovens, fan heaters, pumped-circulation
      heat exchangers
    conditions: Flow driven by a pump, fan or relative motion.
    limits: >-
      Higher flow velocity improves heat transfer less than proportionally but costs increasing
      drive power.
    sideEffects: Noise and energy consumption of the pump or fan.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
