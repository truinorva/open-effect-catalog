text:
  de:
    name: Elektroosmotische Pumpe
    description: >-
      In einem porösen Körper oder in feinen Kanälen trägt die Wand eine Oberflächenladung,
      an der sich in der Flüssigkeit eine dünne Schicht entgegengesetzt geladener Ionen bildet.
      Ein längs angelegtes elektrisches Feld zieht diese Ionen mit, und durch innere Reibung
      folgt die gesamte Flüssigkeit; so entstehen ein pulsationsfreier Volumenstrom und Druck
      ohne bewegliche Teile.
    example: >-
      Mikrofluidik und Lab-on-a-Chip, Flüssigkeitskühlung von Elektronik, Fördern kleinster
      Mengen in der Analytik
    conditions: >-
      Geladene Kanalwände, z. B. aus Glas oder Kieselgel, und eine Flüssigkeit mit geringer
      Ionenstärke.
    limits: >-
      Die Förderrate hängt stark vom pH-Wert und von der Ionenstärke der Flüssigkeit ab.
    sideEffects: An den Elektroden entstehen durch Elektrolyse Gasblasen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electroosmotic pump
    description: >-
      In a porous body or in fine channels, the wall carries a surface charge, and a thin
      layer of oppositely charged ions forms next to it in the liquid. An electric field applied
      along the channel pulls these ions along, and viscous drag makes the whole liquid follow;
      this produces a pulsation-free flow and pressure with no moving parts.
    example: >-
      Microfluidics and lab-on-a-chip, liquid cooling of electronics, delivering tiny volumes
      in analytical chemistry
    conditions: >-
      Charged channel walls, e.g. of glass or silica, and a liquid of low ionic strength.
    limits: Flow rate depends strongly on the pH and ionic strength of the liquid.
    sideEffects: Electrolysis at the electrodes produces gas bubbles.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
