text:
  de:
    name: Infrarotstrahlung
    description: >-
      Infrarotstrahlung ist elektromagnetische Strahlung mit Wellenlängen zwischen dem sichtbaren
      Rot (etwa 780 nm) und dem Mikrowellenbereich (etwa 1 mm). Warme Körper senden sie aus,
      und viele Moleküle absorbieren sie bei für sie typischen Wellenlängen, weil sie deren
      Schwingungen anregt; dadurch eignet sie sich zum Erwärmen, zum berührungslosen Erkennen
      warmer Objekte und zum Nachweis von Gasen und Stoffen.
    example: >-
      Infrarotspektroskopie, NDIR-Gassensoren für CO2, Bewegungsmelder, Wärmebildkameras,
      Fernbedienungen und Datenübertragung, Nachtsichtgeräte
    conditions: ''
    limits: >-
      Wasserdampf und CO2 in der Luft absorbieren Teile des Spektrums; gewöhnliches Glas lässt
      langwelliges Infrarot kaum durch.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Infrared radiation
    description: >-
      Infrared radiation is electromagnetic radiation with wavelengths between visible red
      (about 780 nm) and the microwave range (about 1 mm). Warm bodies emit it, and many molecules
      absorb it at wavelengths characteristic of them because it excites their vibrations;
      this makes it suitable for heating, for contactless detection of warm objects and for
      identifying gases and substances.
    example: >-
      Infrared spectroscopy, NDIR gas sensors for CO2, motion detectors, thermal imaging cameras,
      remote controls and data links, night-vision devices
    conditions: ''
    limits: >-
      Water vapour and CO2 in the air absorb parts of the spectrum; ordinary glass hardly
      transmits long-wave infrared.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
