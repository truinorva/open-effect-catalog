text:
  de:
    name: Thermomechanischer Effekt (Springbrunneneffekt)
    description: >-
      Verbindet man zwei Behälter mit suprafluidem Helium über ein Superleck, etwa einen Pfropfen
      aus fein gepresstem Pulver, und erwärmt einen davon, strömt Helium in den wärmeren Behälter,
      und dort steigt der Druck. Durch die feinen Poren kann nur der reibungsfreie suprafluide
      Anteil fließen, und er strömt zur wärmeren Seite, um das Ungleichgewicht zwischen suprafluidem
      und normalem Anteil auszugleichen. Ist der warme Behälter oben offen, spritzt das Helium
      als Fontäne heraus.
    example: >-
      Fontänenpumpen zum Fördern und Umfüllen von suprafluidem Helium, Demonstrationsversuch
      Heliumfontäne
    conditions: >-
      Suprafluides Helium-4 unterhalb von etwa 2,17 K; eine poröse Verbindung, die nur die
      suprafluide Komponente durchlässt.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Thermomechanical effect (fountain effect)
    description: >-
      If two vessels of superfluid helium are connected through a superleak, such as a plug
      of finely packed powder, and one of them is heated, helium flows into the warmer vessel
      and the pressure there rises. Only the frictionless superfluid component can pass through
      the fine pores, and it flows towards the warmer side to even out the imbalance between
      superfluid and normal components. If the warm vessel is open at the top, helium spurts
      out as a fountain.
    example: >-
      Fountain-effect pumps for transferring superfluid helium, the helium fountain demonstration
    conditions: >-
      Superfluid helium-4 below about 2.17 K; a porous connection that lets only the superfluid
      component through.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
