text:
  de:
    name: Compton-Streuung (und inverse Compton-Streuung)
    description: >-
      Trifft ein Röntgen- oder Gammaquant auf ein nahezu freies Elektron, überträgt es einen
      Teil seiner Energie und seines Impulses auf das Elektron und fliegt mit größerer Wellenlänge
      in eine andere Richtung weiter; die Wellenlängenänderung hängt nur vom Streuwinkel ab.
      Bei der inversen Compton-Streuung ist es umgekehrt: Sehr schnelle Elektronen übertragen
      Energie auf energiearme Photonen, etwa Laserlicht, und heben sie bis in den Röntgen-
      oder Gammabereich an.
    example: >-
      Rückstreu-Röntgenscanner in der Sicherheitskontrolle, Dichtemessung in Bohrlöchern mit
      Gammastrahlung, Compton-Kameras, laserbasierte Röntgen- und Gammaquellen, Strahlenschutz
      und Dosimetrie
    conditions: >-
      Photonen mit Energien deutlich über der Bindungsenergie der Elektronen (Röntgen- und
      Gammastrahlung).
    limits: ''
    sideEffects: >-
      In Radiografie und Strahlentherapie verursacht gestreute Strahlung Bildunschärfe und
      eine Dosis außerhalb des Zielgebiets.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Compton scattering (and inverse Compton scattering)
    description: >-
      When an X-ray or gamma photon hits a nearly free electron, it transfers part of its
      energy and momentum to the electron and continues in a different direction with a longer
      wavelength; the wavelength change depends only on the scattering angle. Inverse Compton
      scattering works the other way round: very fast electrons transfer energy to low-energy
      photons, such as laser light, raising them to the X-ray or gamma range.
    example: >-
      Backscatter X-ray scanners in security screening, density logging in boreholes with
      gamma rays, Compton cameras, laser-driven X-ray and gamma sources, radiation protection
      and dosimetry
    conditions: >-
      Photons with energies well above the binding energy of the electrons (X-rays and gamma
      rays).
    limits: ''
    sideEffects: >-
      In radiography and radiotherapy, scattered radiation causes image blur and dose outside
      the target region.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
