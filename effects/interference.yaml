text:
  de:
    name: Interferenz
    description: >-
      Treffen zwei oder mehr kohärente Wellen zusammen, addieren sich ihre Auslenkungen: Wo
      Wellenberg auf Wellenberg trifft, verstärken sie sich, wo Berg auf Tal trifft, löschen
      sie sich aus. Weil schon ein Gangunterschied von einer halben Wellenlänge zwischen Verstärkung
      und Auslöschung entscheidet, lassen sich damit kleinste Längenänderungen messen und
      Reflexion, Farbe oder Schall gezielt beeinflussen.
    example: >-
      Interferometer für Längen- und Ebenheitsmessung, Entspiegelungsschichten, dielektrische
      Spiegel und Farbfilter, aktive Geräuschunterdrückung in Kopfhörern, Schillerfarben von
      Seifenblasen und Schmetterlingsflügeln, Holografie, Gravitationswellendetektoren
    conditions: Kohärente Wellen mit fester Phasenbeziehung, z. B. aus derselben Quelle.
    limits: >-
      Die Kohärenzlänge der Quelle begrenzt den nutzbaren Gangunterschied; Erschütterungen
      und Temperaturschwankungen stören Interferometer.
    sideEffects: >-
      Ungewollte Interferenzen erzeugen störende Muster wie Newtonsche Ringe oder Speckle.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Interference
    description: >-
      When two or more coherent waves meet, their displacements add up: where crest meets
      crest they reinforce each other, where crest meets trough they cancel out. Because a
      path difference of just half a wavelength decides between reinforcement and cancellation,
      this allows tiny changes in length to be measured and reflection, colour or sound to
      be controlled.
    example: >-
      Interferometers for length and flatness measurement, anti-reflection coatings, dielectric
      mirrors and colour filters, active noise cancellation in headphones, iridescent colours
      of soap bubbles and butterfly wings, holography, gravitational-wave detectors
    conditions: >-
      Coherent waves with a fixed phase relationship, for example from the same source.
    limits: >-
      The coherence length of the source limits the usable path difference; vibration and
      temperature fluctuations disturb interferometers.
    sideEffects: >-
      Unwanted interference produces disturbing patterns such as Newton's rings or speckle.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
