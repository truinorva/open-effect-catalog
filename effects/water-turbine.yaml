text:
  de:
    name: Wasserturbine
    description: >-
      Wasserturbinen wandeln die Lage- und Bewegungsenergie von Wasser in Drehbewegung um.
      Bei der Pelton-Turbine treffen Freistrahlen auf becherförmige Schaufeln; bei Francis-
      und Kaplan-Turbinen durchströmt das Wasser unter Druck das ganze Laufrad und gibt beim
      Umlenken und Entspannen Energie ab. Die Bauart richtet sich nach Fallhöhe und Wassermenge;
      große Anlagen erreichen Wirkungsgrade über 90 %.
    example: >-
      Laufwasser- und Speicherkraftwerke, Pumpspeicherkraftwerke mit Pumpturbinen, Kleinwasserkraftanlagen
    conditions: Nutzbares Gefälle und ausreichender, möglichst gleichmäßiger Durchfluss.
    limits: >-
      Fällt der Druck am Laufrad unter den Dampfdruck, entsteht Kavitation, die Leistung und
      Lebensdauer mindert.
    sideEffects: Fische können verletzt werden; Kavitation erodiert die Schaufeln.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Water turbine
    description: >-
      Water turbines convert the potential and kinetic energy of water into rotation. In a
      Pelton turbine free jets strike bucket-shaped blades; in Francis and Kaplan turbines
      the water flows under pressure through the entire runner and gives up energy as it is
      deflected and its pressure falls. The design depends on head and flow rate; large units
      reach efficiencies above 90 %.
    example: >-
      Run-of-river and storage hydropower plants, pumped storage plants with pump-turbines,
      small hydropower plants
    conditions: Usable head and sufficient, preferably steady flow.
    limits: >-
      If the pressure at the runner falls below the vapour pressure, cavitation occurs, reducing
      output and service life.
    sideEffects: Fish can be injured; cavitation erodes the blades.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
