text:
  de:
    name: Magnetic River (Linearmotor nach Laithwaite)
    description: >-
      Der Magnetic River ist eine von Eric Laithwaite entwickelte Bauform des Linearinduktionsmotors,
      bei der ein besonders geformtes Wanderfeld unter einer leitfähigen Platte zugleich Vortrieb,
      Auftrieb und Seitenführung erzeugt. Die in der Platte induzierten Wirbelströme werden
      vom Feld nicht nur mitgezogen, sondern auch abgestoßen, so dass die Platte schwebt und
      auf der Spur zentriert bleibt. Ein einziges Magnetsystem sollte so die getrennten Systeme
      für Antrieb, Schweben und Führen einer Magnetbahn ersetzen.
    example: >-
      Versuchsanlagen für schwebende Magnetbahnen in den 1970er-Jahren, Demonstrationsmodelle
      zur elektromagnetischen Levitation
    conditions: >-
      Eine gut leitende, nichtmagnetische Platte, etwa aus Aluminium, über einem mit Wechselstrom
      gespeisten Wanderfeld.
    limits: >-
      Die Wirbelströme in der Platte verursachen Verluste und Erwärmung, was den Wirkungsgrad
      mindert.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Magnetic river
    description: >-
      The magnetic river is a form of linear induction motor developed by Eric Laithwaite
      in which a specially shaped travelling field beneath a conductive plate produces thrust,
      lift and lateral guidance at the same time. The eddy currents induced in the plate are
      not only dragged along by the field but also repelled by it, so the plate floats and
      stays centred on the track. A single magnet system was thus intended to replace the
      separate propulsion, levitation and guidance systems of a maglev track.
    example: >-
      Experimental maglev test systems of the 1970s, demonstration models of electromagnetic
      levitation
    conditions: >-
      A highly conductive, non-magnetic plate, such as aluminium, above a travelling field
      fed with alternating current.
    limits: >-
      The eddy currents in the plate cause losses and heating, which reduces efficiency.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
