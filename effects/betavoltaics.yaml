text:
  de:
    name: Betavoltaik
    description: >-
      Eine Betavoltaikzelle wandelt die Energie von Betateilchen, also schnellen Elektronen
      aus dem radioaktiven Zerfall, direkt in Strom um. Die Elektronen erzeugen beim Abbremsen
      in einem Halbleiter Elektron-Loch-Paare, die ein p-n-Übergang wie in einer Solarzelle
      trennt; als Quelle dienen schwache Betastrahler wie Tritium oder Nickel-63.
    example: >-
      Langzeitstromversorgung für Sensoren und Implantate, Pufferversorgung von Uhren und
      Speicherbausteinen, Geräte an unzugänglichen Orten
    conditions: >-
      Ein Betastrahler mit passender Energie in engem Kontakt mit einem strahlungsbeständigen
      Halbleiter.
    limits: >-
      Die Leistung liegt typischerweise im Nano- bis Mikrowattbereich, und die Zellen altern
      durch Strahlenschäden im Halbleiter.
    sideEffects: >-
      Die radioaktiven Stoffe erfordern Genehmigungen und eine sichere Entsorgung.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Betavoltaics
    description: >-
      A betavoltaic cell converts the energy of beta particles, that is fast electrons from
      radioactive decay, directly into electricity. As the electrons slow down in a semiconductor
      they create electron-hole pairs, which a p-n junction separates as in a solar cell;
      weak beta emitters such as tritium or nickel-63 serve as the source.
    example: >-
      Long-term power for sensors and implants, backup power for clocks and memory chips,
      devices in inaccessible locations
    conditions: >-
      A beta emitter of suitable energy in close contact with a radiation-tolerant semiconductor.
    limits: >-
      Output is typically in the nanowatt to microwatt range, and the cells age through radiation
      damage in the semiconductor.
    sideEffects: The radioactive material requires licensing and safe disposal.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
