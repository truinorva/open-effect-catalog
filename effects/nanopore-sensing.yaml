text:
  de:
    name: Nanoporen-Sensorik
    description: >-
      Eine Nanopore ist ein Loch von wenigen Nanometern Durchmesser in einer dünnen Membran,
      gebildet von einem Protein in einer Lipid- oder Polymermembran oder in eine Festkörpermembran
      geätzt. Liegt eine Spannung an, fließt ein Ionenstrom durch die Pore, und das elektrische
      Feld zieht geladene Moleküle wie DNA hindurch. Jedes Molekül oder jeder Abschnitt in
      der Pore blockiert den Strom auf charakteristische Weise, sodass sich Moleküle zählen,
      nach Größe unterscheiden und DNA- oder RNA-Basenfolgen auslesen lassen.
    example: >-
      Tragbare DNA- und RNA-Sequenzierer, Erregernachweis vor Ort, Zählen und Größenbestimmung
      von Nanopartikeln, Proteinanalytik in der Forschung
    conditions: >-
      Elektrolytlösung auf beiden Seiten der Membran und eine angelegte Spannung; für die
      Sequenzierung muss der Durchtritt, etwa durch ein Motorprotein, stark verlangsamt werden.
    limits: >-
      Das Einzelsignal ist verrauscht, weshalb die Fehlerrate je gelesener Base höher sein
      kann als bei optischen Sequenzierverfahren.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Nanopore sensing
    description: >-
      A nanopore is a hole a few nanometres across in a thin membrane, formed by a protein
      in a lipid or polymer membrane or etched into a solid-state membrane. With a voltage
      applied, an ionic current flows through the pore, and the electric field pulls charged
      molecules such as DNA through it. Each molecule or segment in the pore blocks the current
      in a characteristic way, so molecules can be counted, distinguished by size, and DNA
      or RNA base sequences read out.
    example: >-
      Portable DNA and RNA sequencers, on-site pathogen detection, counting and sizing of
      nanoparticles, protein analysis in research
    conditions: >-
      Electrolyte on both sides of the membrane and an applied voltage; for sequencing, translocation
      must be slowed down strongly, for example by a motor protein.
    limits: >-
      The single-molecule signal is noisy, so the error rate per base read can be higher than
      with optical sequencing methods.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
