text:
  de:
    name: Phosphoreszenz
    description: >-
      Ein phosphoreszierender Stoff nimmt Licht oder andere Strahlung auf und gibt einen Teil
      der Energie noch lange nach dem Ende der Anregung als Licht wieder ab. In Molekülen
      liegt das an einem quantenmechanisch verbotenen und daher langsamen Übergang aus einem
      Triplettzustand, in Nachleuchtpigmenten wie dotiertem Strontiumaluminat am allmählichen
      Freiwerden von Ladungsträgern aus Fallen im Kristall. Das Nachleuchten kann von Millisekunden
      bis zu Stunden dauern.
    example: >-
      Nachleuchtende Fluchtwegschilder, Leuchtziffern von Uhren, phosphoreszierende Emitter
      in OLED-Displays, Leuchtfarben und Spielzeug, Phosphorthermometrie
    conditions: >-
      Vorherige Anregung mit Licht ausreichender Energie, meist UV- oder blaues Licht.
    limits: >-
      Die Helligkeit nimmt nach der Anregung stetig ab, und Sauerstoff oder Wärme können die
      Phosphoreszenz vieler Moleküle löschen.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Phosphorescence
    description: >-
      A phosphorescent substance absorbs light or other radiation and re-emits part of the
      energy as light long after the excitation has ended. In molecules this is due to a quantum-mechanically
      forbidden, and therefore slow, transition from a triplet state; in afterglow pigments
      such as doped strontium aluminate it is due to the gradual release of charge carriers
      from traps in the crystal. The afterglow can last from milliseconds to hours.
    example: >-
      Glow-in-the-dark escape route signs, luminous watch dials, phosphorescent emitters in
      OLED displays, luminous paints and toys, phosphor thermometry
    conditions: >-
      Prior excitation with light of sufficient energy, usually UV or blue light.
    limits: >-
      Brightness decreases steadily after excitation, and oxygen or heat can quench the phosphorescence
      of many molecules.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
