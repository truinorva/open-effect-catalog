text:
  de:
    name: Pulserpumpe
    description: >-
      Die Pulserpumpe fördert Wasser ohne bewegte Teile allein mit der Energie eines Gefälles.
      Wasser stürzt durch ein Fallrohr und reißt dabei Luft mit, die sich in einer tiefer
      liegenden Kammer abscheidet und dort vom Wasserdruck verdichtet wird; die gesammelte
      Druckluft drückt anschließend stoßweise Wasser durch ein Steigrohr nach oben, ähnlich
      wie bei einer Mammutpumpe.
    example: >-
      Wasserversorgung und Bewässerung an Bächen mit geringem Gefälle, an Standorten ohne
      Strom- oder Kraftstoffversorgung
    conditions: >-
      Ein stetiger Wasserzulauf mit Gefälle und eine ausreichend tief liegende Abscheidekammer,
      deren Tiefe den erreichbaren Luftdruck bestimmt.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Pulser pump
    description: >-
      The pulser pump lifts water without moving parts, using only the energy of a head of
      water. Water plunges down a drop pipe and entrains air, which separates in a chamber
      at a lower level and is compressed there by the water pressure; the collected compressed
      air then pushes water up a riser pipe in surges, similar to an airlift pump.
    example: >-
      Water supply and irrigation at streams with a small fall, at sites without electricity
      or fuel
    conditions: >-
      A steady inflow of water with a fall and a separation chamber at sufficient depth, which
      determines the attainable air pressure.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
