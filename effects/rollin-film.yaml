text:
  de:
    name: Rollin-Film (Onnes-Effekt)
    description: >-
      Unterhalb von etwa 2,17 K wird flüssiges Helium-4 suprafluid und verliert seine innere
      Reibung. Es benetzt dann alle Wände mit einem nur rund 30 nm dicken Film, der an der
      Gefäßwand hinaufkriecht und über den Rand fließt. Ein offenes Gefäß leert sich so von
      selbst, und zwei Gefäße gleichen ihre Füllstände über den Film aus.
    example: Helium-Kryostaten und Verdampfungskühler, Experimente zur Suprafluidität
    conditions: Helium-4 unterhalb des Lambdapunkts von 2,17 K.
    limits: >-
      Der Film ist extrem dünn, sodass der mögliche Volumenstrom sehr klein ist.
    sideEffects: >-
      In Kryostaten kriecht der Film in wärmere Bereiche, verdampft dort und erhöht Wärmelast
      und Heliumverbrauch.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Rollin film (Onnes effect)
    description: >-
      Below about 2.17 K, liquid helium-4 becomes superfluid and loses its internal friction.
      It then wets all walls with a film only about 30 nm thick that creeps up the container
      wall and flows over the rim. An open vessel thus empties itself, and two vessels equalise
      their levels through the film.
    example: Helium cryostats and evaporation coolers, superfluidity experiments
    conditions: Helium-4 below the lambda point of 2.17 K.
    limits: The film is extremely thin, so the possible flow rate is very small.
    sideEffects: >-
      In cryostats the film creeps into warmer regions, evaporates there and increases heat
      load and helium consumption.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
