text:
  de:
    name: Peltier-Effekt
    description: >-
      Fließt Strom durch die Kontaktstelle zweier unterschiedlicher Leiter, wird dort Wärme
      aufgenommen oder abgegeben – je nach Stromrichtung. Ein Peltier-Element pumpt so Wärme
      von einer Seite auf die andere, ganz ohne bewegte Teile.
    example: >-
      Kühlboxen, Temperierung von Laserdioden und Sensoren, Kühlung von Proben im Labor
    conditions: >-
      Gleichstrom durch Halbleiterpaare; die warme Seite muss ihre Wärme abgeben können.
    limits: >-
      Wirkungsgrad deutlich unter dem eines Kompressorkühlers; der erreichbare Temperaturunterschied
      ist begrenzt.
    sideEffects: >-
      Viel Abwärme auf der warmen Seite; auf der kalten Seite kann sich Kondenswasser bilden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Peltier effect
    description: >-
      When current flows through the junction of two different conductors, heat is absorbed
      or released there, depending on the direction of the current. A Peltier element thus
      pumps heat from one side to the other without any moving parts.
    example: >-
      Cool boxes, temperature control of laser diodes and sensors, cooling of laboratory samples
    conditions: >-
      Direct current through semiconductor pairs; the hot side must be able to shed its heat.
    limits: >-
      Efficiency well below that of a compressor cooler; the achievable temperature difference
      is limited.
    sideEffects: >-
      A lot of waste heat on the hot side; condensation can form on the cold side.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
