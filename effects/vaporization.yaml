text:
  de:
    name: Verdampfung
    description: >-
      Beim Verdampfen geht ein Stoff vom flüssigen in den gasförmigen Zustand über – entweder
      langsam an der Oberfläche unterhalb des Siedepunkts (Verdunstung) oder im ganzen Volumen
      beim Sieden. Dafür muss die Verdampfungsenthalpie aufgebracht werden, die der Flüssigkeit
      oder ihrer Umgebung entzogen wird; deshalb kühlt Verdampfen. Beim Kondensieren wird
      dieselbe Wärmemenge wieder frei.
    example: >-
      Eindampfen von Lösungen, Trocknen, Kältemittelkreislauf, Dampfkraftwerk, Schwitzen,
      Verdunstungskühler
    conditions: >-
      Wärmezufuhr und ein Dampfdruck der Flüssigkeit, der über dem Partialdruck ihres Dampfes
      in der Umgebung liegt.
    limits: >-
      Wasser hat eine hohe Verdampfungswärme; das Eindampfen großer Mengen erfordert daher
      viel Energie.
    sideEffects: >-
      Gelöste Stoffe bleiben zurück und können sich als Belag auf Heizflächen ablagern.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Vaporisation
    description: >-
      In vaporisation a substance passes from the liquid to the gaseous state – either slowly
      at the surface below the boiling point (evaporation) or throughout the volume during
      boiling. This requires the enthalpy of vaporisation, which is taken from the liquid
      or its surroundings; that is why vaporisation cools. The same amount of heat is released
      again on condensation.
    example: >-
      Concentrating solutions by evaporation, drying, refrigeration cycles, steam power plants,
      sweating, evaporative coolers
    conditions: >-
      Heat input and a vapour pressure of the liquid above the partial pressure of its vapour
      in the surroundings.
    limits: >-
      Water has a high heat of vaporisation, so evaporating large quantities takes a lot of
      energy.
    sideEffects: >-
      Dissolved substances stay behind and can form deposits on heating surfaces.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
