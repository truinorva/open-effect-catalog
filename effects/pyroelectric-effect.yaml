text:
  de:
    name: Pyroelektrischer Effekt (Pyroelektrizität)
    description: >-
      Bestimmte polare Kristalle besitzen eine spontane elektrische Polarisation, die von
      der Temperatur abhängt. Ändert sich die Temperatur, ändert sich auch die Polarisation,
      und auf zwei gegenüberliegenden Oberflächen entstehen Ladungen, die sich als Spannung
      oder Strom messen lassen; bei konstanter Temperatur gleichen Leckströme die Ladung allmählich
      aus, daher spricht der Effekt nur auf Temperaturänderungen an.
    example: >-
      Passiv-Infrarot-Bewegungsmelder, Flammenmelder, NDIR-Gassensoren, FTIR-Spektrometer
      mit DTGS-Detektor, Wärmebildkameras mit pyroelektrischen Sensoren, Laserleistungsmessköpfe
    conditions: >-
      Ein pyroelektrischer Kristall oder eine Keramik wie Lithiumtantalat, Triglycinsulfat
      oder PZT und eine sich zeitlich ändernde Temperatur; Strahlungssensoren arbeiten daher
      mit Zerhacker oder bewegten Objekten.
    limits: >-
      Bei ferroelektrischen Sensorwerkstoffen verschwindet die spontane Polarisation und damit
      der Effekt oberhalb der Curie-Temperatur.
    sideEffects: >-
      Pyroelektrische Stoffe sind immer auch piezoelektrisch, sodass Erschütterungen Störsignale
      erzeugen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Pyroelectric effect
    description: >-
      Certain polar crystals have a spontaneous electric polarisation that depends on temperature.
      When the temperature changes, the polarisation changes too, and charges appear on two
      opposite surfaces that can be measured as a voltage or current; at constant temperature
      leakage currents gradually neutralise the charge, so the effect responds only to temperature
      changes.
    example: >-
      Passive infrared motion detectors, flame detectors, NDIR gas sensors, FTIR spectrometers
      with DTGS detector, thermal imaging with pyroelectric sensors, laser power meters
    conditions: >-
      A pyroelectric crystal or ceramic such as lithium tantalate, triglycine sulphate or
      PZT, and a temperature that changes over time; radiation sensors therefore use choppers
      or moving targets.
    limits: >-
      In ferroelectric sensor materials the spontaneous polarisation, and thus the effect,
      disappears above the Curie temperature.
    sideEffects: >-
      Pyroelectric materials are always piezoelectric too, so vibrations create spurious signals.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
