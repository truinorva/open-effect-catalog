text:
  de:
    name: Pantograf (Storchschnabel)
    description: >-
      Ein Pantograf besteht aus gelenkig verbundenen Stäben, die ein Parallelogramm bilden,
      mit einem fest gelagerten Drehpunkt. Führt man einen Taststift an einem Gelenkpunkt
      entlang einer Kontur, zeichnet ein Stift an einem anderen Punkt, der mit Drehpunkt und
      Taststift auf einer Geraden liegt, dieselbe Kontur nach, vergrößert oder verkleinert
      im festen Verhältnis der Hebellängen. So lassen sich Formen und Bewegungen maßstäblich
      übertragen; das Gelenkprinzip findet sich auch in scherenartigen Stromabnehmern und
      Wandarmen.
    example: >-
      Kopier- und Graviermaschinen, Vergrößern und Verkleinern von Zeichnungen, Stromabnehmer
      elektrischer Bahnen, Scherenarme für Spiegel und Lampen
    conditions: >-
      Spielarme Gelenke und steife Stäbe, damit die Übertragung maßhaltig bleibt.
    limits: >-
      Gelenkspiel und Durchbiegung der Stäbe werden mit dem Maßstab übertragen und begrenzen
      die Genauigkeit.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Pantograph
    description: >-
      A pantograph consists of jointed bars forming a parallelogram, with one fixed pivot.
      When a tracing stylus at one joint follows a contour, a pen at another point, lying
      on a straight line with the pivot and the stylus, reproduces the same contour, enlarged
      or reduced in the fixed ratio of the lever lengths. Shapes and motions can thus be transferred
      to scale; the linkage principle also appears in scissor-type current collectors and
      wall-mounted arms.
    example: >-
      Copying and engraving machines, enlarging and reducing drawings, current collectors
      of electric trains, scissor arms for mirrors and lamps
    conditions: >-
      Low-play joints and stiff bars so that the transfer stays dimensionally accurate.
    limits: >-
      Joint play and bending of the bars are transferred along with the scale and limit accuracy.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
