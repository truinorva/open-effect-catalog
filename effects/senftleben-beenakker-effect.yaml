text:
  de:
    name: Senftleben-Beenakker-Effekt
    description: >-
      Ein Magnetfeld verändert die Wärmeleitfähigkeit und die Viskosität mehratomiger Gase
      geringfügig. Die Moleküle tragen ein mit ihrer Rotation verknüpftes magnetisches Moment,
      das im Feld präzediert; dadurch werden Ausrichtungen des Drehimpulses, die bei Stößen
      nichtkugelförmiger Moleküle in einem strömenden oder Wärme leitenden Gas entstehen,
      ausgemittelt, und die Transporteigenschaften werden richtungsabhängig.
    example: >-
      Grundlagenforschung zu nichtkugelförmigen zwischenmolekularen Kräften und Stoßquerschnitten,
      Messungen an Sauerstoff, Stickstoffmonoxid, Stickstoff und Kohlenmonoxid
    conditions: >-
      Ein mehratomiges Gas mit rotierenden Molekülen; die Wirkung hängt vom Verhältnis aus
      Feldstärke und Gasdruck ab und sättigt bei hohen Werten.
    limits: >-
      Die Änderungen sind klein, in der Größenordnung von einem Prozent oder darunter; diamagnetische
      Gase brauchen viel stärkere Felder, und einatomige Edelgase zeigen den Effekt nicht.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Senftleben–Beenakker effect
    description: >-
      A magnetic field slightly changes the thermal conductivity and viscosity of polyatomic
      gases. The molecules carry a magnetic moment linked to their rotation, which precesses
      in the field; this averages out alignments of the angular momentum that arise from collisions
      of non-spherical molecules in a flowing or heat-conducting gas, and the transport properties
      become direction-dependent.
    example: >-
      Fundamental research on non-spherical intermolecular forces and collision cross-sections,
      measurements on oxygen, nitric oxide, nitrogen and carbon monoxide
    conditions: >-
      A polyatomic gas with rotating molecules; the effect depends on the ratio of field strength
      to gas pressure and saturates at high values.
    limits: >-
      The changes are small, of the order of one percent or less; diamagnetic gases need much
      stronger fields, and monatomic noble gases show no effect.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
