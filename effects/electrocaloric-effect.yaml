text:
  de:
    name: Elektrokalorischer Effekt
    description: >-
      Legt man an ein polares Dielektrikum adiabatisch ein elektrisches Feld an, richten sich
      die Dipole aus, die Entropie des Dipolsystems sinkt und das Material erwärmt sich; beim
      Abschalten des Feldes kühlt es sich entsprechend ab. Durch zyklisches Ein- und Ausschalten
      des Feldes, verbunden mit Wärmeabgabe an eine warme und Wärmeaufnahme von einer kalten
      Seite, lässt sich eine Kältemaschine ohne Kältemittel bauen.
    example: >-
      Elektrokalorische Kühler im Forschungsstadium auf Basis ferroelektrischer Polymere oder
      Keramiken
    conditions: >-
      Ferroelektrische oder relaxorferroelektrische Materialien, möglichst nahe ihrer Phasenumwandlungstemperatur;
      hohe Feldstärken.
    limits: >-
      Die Temperaturänderung je Zyklus beträgt meist nur wenige Kelvin; hohe Felder erfordern
      dünne Schichten mit hoher Durchschlagfestigkeit.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electrocaloric effect
    description: >-
      When an electric field is applied adiabatically to a polar dielectric, its dipoles align,
      the entropy of the dipole system falls and the material warms up; when the field is
      removed, it cools down accordingly. Cycling the field on and off while rejecting heat
      to a hot side and absorbing it from a cold side makes it possible to build a refrigerator
      without refrigerant.
    example: >-
      Research-stage electrocaloric coolers based on ferroelectric polymers or ceramics
    conditions: >-
      Ferroelectric or relaxor ferroelectric materials, ideally close to their phase transition
      temperature; high field strengths.
    limits: >-
      The temperature change per cycle is usually only a few kelvin; high fields require thin
      layers with high dielectric strength.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
