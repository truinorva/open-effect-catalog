text:
  de:
    name: Hydrospeicher (Hydraulikspeicher)
    description: >-
      Ein Hydrospeicher nimmt Hydraulikflüssigkeit unter Druck auf, indem er ein Gaspolster,
      meist Stickstoff hinter einer Blase, einer Membran oder einem Kolben, zusammendrückt.
      Fällt der Systemdruck, drückt das Gas die Flüssigkeit wieder heraus; so speichert der
      Speicher Energie, gleicht Druckspitzen und Pulsationen aus und deckt kurzzeitig hohen
      Volumenbedarf.
    example: >-
      Notbetätigung von Bremsen und Fahrwerken, Pulsationsdämpfer hinter Kolbenpumpen, Federung
      in hydropneumatischen Fahrwerken, Energiespeicher in Pressen und Spritzgießmaschinen
    conditions: Ein Gasvorfülldruck, der zum Betriebsdruckbereich passt.
    limits: >-
      Der Druck sinkt bei der Entnahme ab, und das nutzbare Volumen ist durch das Gasvolumen
      begrenzt.
    sideEffects: >-
      Gas diffundiert langsam durch die Blase, sodass der Vorfülldruck regelmäßig geprüft
      werden muss.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Hydraulic accumulator
    description: >-
      A hydraulic accumulator takes up hydraulic fluid under pressure by compressing a gas
      cushion, usually nitrogen behind a bladder, diaphragm or piston. When system pressure
      falls, the gas pushes the fluid back out; the accumulator thus stores energy, smooths
      pressure peaks and pulsations and covers brief peaks in flow demand.
    example: >-
      Emergency actuation of brakes and landing gear, pulsation dampers downstream of piston
      pumps, suspension in hydropneumatic chassis, energy storage in presses and injection
      moulding machines
    conditions: A gas pre-charge pressure matched to the operating pressure range.
    limits: >-
      Pressure drops as fluid is withdrawn, and the usable volume is limited by the gas volume.
    sideEffects: >-
      Gas slowly diffuses through the bladder, so the pre-charge pressure must be checked
      regularly.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
