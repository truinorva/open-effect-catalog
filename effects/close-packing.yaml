text:
  de:
    name: Dichteste Kugelpackung
    description: >-
      Gleich große Kugeln füllen den Raum am dichtesten, wenn jede Lage ein Dreiecksmuster
      bildet und die nächste Lage in die Mulden der vorigen gelegt wird; jede Kugel berührt
      dann zwölf Nachbarn. Je nach Stapelfolge entsteht eine kubisch-flächenzentrierte oder
      eine hexagonale Anordnung, beide mit einem Raumfüllungsgrad von etwa 74 Prozent. Zufällig
      geschüttete Kugeln erreichen dagegen nur rund 64 Prozent.
    example: >-
      Kristallstrukturen vieler Metalle (Kupfer, Aluminium, Magnesium), Stapeln von Obst und
      Kanonenkugeln, Schüttungen in Festbettreaktoren, kolloidale Kristalle und Opale
    conditions: >-
      Gleich große, kugelförmige Teilchen und eine geordnete Anlagerung, z. B. durch Rütteln
      oder Selbstanordnung.
    limits: >-
      Höhere Packungsdichten lassen sich nur mit unterschiedlich großen Teilchen erreichen,
      bei denen kleine Teilchen die Lücken füllen.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Close packing of spheres
    description: >-
      Equal spheres fill space most densely when each layer forms a triangular pattern and
      the next layer sits in the hollows of the previous one; each sphere then touches twelve
      neighbours. Depending on the stacking sequence, a face-centred cubic or a hexagonal
      arrangement results, both with a packing fraction of about 74 per cent. Randomly poured
      spheres, by contrast, reach only about 64 per cent.
    example: >-
      Crystal structures of many metals (copper, aluminium, magnesium), stacking of fruit
      and cannonballs, packed beds in fixed-bed reactors, colloidal crystals and opals
    conditions: >-
      Equal-sized spherical particles and an ordered arrangement, e.g. by vibration or self-assembly.
    limits: >-
      Higher packing densities can only be reached with particles of different sizes, where
      small ones fill the gaps.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
