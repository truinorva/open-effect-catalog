text:
  de:
    name: Wärmedämmung
    description: >-
      Wärmedämmung verringert den Wärmestrom zwischen warmen und kalten Bereichen. Die meisten
      Dämmstoffe schließen ruhende Luft oder andere Gase in feinen Poren oder zwischen Fasern
      ein, die selbst schlecht leiten und keine Konvektion zulassen; Vakuumdämmungen unterbinden
      zusätzlich die Leitung durch das Gas, und reflektierende Schichten mindern die Wärmestrahlung.
      So bleiben Räume, Leitungen oder Behälter länger auf ihrer Temperatur, und es wird weniger
      Energie zum Heizen oder Kühlen gebraucht.
    example: >-
      Gebäudedämmung mit Mineralwolle und Schaumstoffen, Thermoskanne, Rohrisolierung, Kühlboxen,
      Mehrlagenisolation an Raumfahrzeugen
    conditions: Durchgehende Dämmschicht ohne Wärmebrücken; trockenes Dämmmaterial.
    limits: Feuchtigkeit im Dämmstoff verschlechtert die Dämmwirkung erheblich.
    sideEffects: >-
      An Wärmebrücken und kalten Oberflächen kann sich Tauwasser bilden; manche Dämmstoffe
      sind brennbar.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Thermal insulation
    description: >-
      Thermal insulation reduces the flow of heat between warm and cold regions. Most insulating
      materials trap still air or other gases in fine pores or between fibres, which conduct
      poorly and suppress convection; vacuum insulation also eliminates conduction through
      the gas, and reflective layers reduce thermal radiation. Rooms, pipes or containers
      thus stay at their temperature longer, and less energy is needed for heating or cooling.
    example: >-
      Building insulation with mineral wool and foams, vacuum flask, pipe lagging, cool boxes,
      multi-layer insulation on spacecraft
    conditions: >-
      A continuous insulating layer without thermal bridges; dry insulation material.
    limits: Moisture in the insulation markedly reduces its effectiveness.
    sideEffects: >-
      Condensation can form at thermal bridges and cold surfaces; some insulation materials
      are combustible.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
