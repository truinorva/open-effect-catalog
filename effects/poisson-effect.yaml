text:
  de:
    name: Querkontraktion (Poisson-Effekt)
    description: >-
      Wird ein Körper in einer Richtung gedehnt, wird er quer dazu dünner; wird er gestaucht,
      wird er dicker. Das Verhältnis von Quer- zu Längsdehnung heißt Poissonzahl; sie liegt
      bei Metallen um 0,3 und bei Gummi nahe 0,5, der dadurch sein Volumen fast beibehält,
      während Kork nahezu null erreicht und auxetische Strukturen sogar negative Werte haben.
    example: >-
      Gummi-Rohrstopfen und Spreizdichtungen, die sich beim axialen Verpressen radial ausdehnen,
      Korken in Weinflaschen mit kaum Querdehnung, auxetische Schaumstoffe und Stents, Querempfindlichkeit
      von Dehnungsmessstreifen
    conditions: >-
      Elastische oder plastische Verformung eines Festkörpers unter einachsiger Last.
    limits: >-
      Bei isotropen, elastischen Werkstoffen liegt die Poissonzahl zwischen -1 und 0,5; bei
      0,5 ist der Werkstoff inkompressibel.
    sideEffects: >-
      Wird die Querdehnung behindert, etwa in eingespannten Bauteilen oder Klebefugen, entstehen
      zusätzliche Spannungen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Poisson effect
    description: >-
      When a body is stretched in one direction it becomes thinner across that direction;
      when it is compressed it becomes thicker. The ratio of transverse to axial strain is
      called Poisson's ratio; it is about 0.3 for metals and close to 0.5 for rubber, which
      therefore keeps its volume almost constant, while cork is close to zero and auxetic
      structures even have negative values.
    example: >-
      Rubber pipe plugs and expansion seals that bulge radially when compressed axially, corks
      in wine bottles with almost no lateral expansion, auxetic foams and stents, transverse
      sensitivity of strain gauges
    conditions: Elastic or plastic deformation of a solid under uniaxial load.
    limits: >-
      For isotropic elastic materials Poisson's ratio lies between -1 and 0.5; at 0.5 the
      material is incompressible.
    sideEffects: >-
      Where lateral deformation is constrained, for example in clamped parts or bonded joints,
      additional stresses arise.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
