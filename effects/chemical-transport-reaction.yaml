text:
  de:
    name: Chemischer Transport
    description: >-
      Ein Feststoff reagiert mit einem gasförmigen Transportmittel wie Iod zu einer flüchtigen
      Verbindung, die in einem Temperaturgefälle an eine andere Stelle wandert. Dort verschiebt
      sich das Gleichgewicht zurück, die Verbindung zerfällt, und der Feststoff scheidet sich
      ab, während das Transportmittel zurückdiffundiert und erneut zur Verfügung steht. So
      lassen sich Stoffe, die selbst kaum flüchtig sind, über die Gasphase umlagern, reinigen
      und als Kristalle züchten.
    example: >-
      Van-Arkel-de-Boer-Verfahren zur Reinigung von Titan und Zirconium, Mond-Verfahren für
      Nickel, Halogenglühlampe, Züchtung von Einkristallen im Labor
    conditions: >-
      Eine umkehrbare Reaktion mit gasförmigem Produkt, deren Gleichgewicht deutlich von der
      Temperatur abhängt, und ein Temperaturgefälle.
    limits: >-
      Die Transportraten sind meist gering, sodass Abscheidung und Kristallwachstum Stunden
      bis Wochen dauern.
    sideEffects: >-
      Transportmittel wie Halogene oder Kohlenmonoxid sind korrosiv bzw. giftig.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Chemical transport reaction
    description: >-
      A solid reacts with a gaseous transport agent such as iodine to form a volatile compound
      that migrates to another location along a temperature gradient. There the equilibrium
      shifts back, the compound decomposes and the solid is deposited, while the transport
      agent diffuses back and is available again. In this way substances that are themselves
      hardly volatile can be moved via the gas phase, purified and grown as crystals.
    example: >-
      Van Arkel-de Boer process for purifying titanium and zirconium, Mond process for nickel,
      tungsten-halogen lamp, growth of single crystals in the laboratory
    conditions: >-
      A reversible reaction with a gaseous product whose equilibrium depends markedly on temperature,
      and a temperature gradient.
    limits: >-
      Transport rates are usually low, so deposition and crystal growth take hours to weeks.
    sideEffects: >-
      Transport agents such as halogens or carbon monoxide are corrosive or toxic.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
