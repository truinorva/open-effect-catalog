text:
  de:
    name: Ausscheidungshärtung
    description: >-
      Eine Legierung wird lösungsgeglüht, sodass die Legierungselemente im Mischkristall gelöst
      sind, und dann abgeschreckt, wodurch ein übersättigter Mischkristall entsteht. Beim
      anschließenden Auslagern bei Raumtemperatur oder mäßig erhöhter Temperatur scheiden
      sich feinste Teilchen aus, die das Wandern von Versetzungen behindern und so Festigkeit
      und Härte deutlich erhöhen.
    example: >-
      Aluminiumlegierungen wie Duralumin, 6061 und 7075 im Flugzeug- und Fahrzeugbau, martensitaushärtende
      Stähle, ausscheidungshärtende nichtrostende Stähle wie 17-4 PH, Nickelbasis-Superlegierungen,
      Federn aus Kupfer-Beryllium
    conditions: >-
      Eine Legierung, deren Löslichkeit für das Legierungselement mit sinkender Temperatur
      abnimmt, und eine abgestimmte Folge aus Lösungsglühen, Abschrecken und Auslagern.
    limits: >-
      Bei zu langem oder zu heißem Auslagern vergröbern die Teilchen (Überalterung) und die
      Festigkeit sinkt wieder; Einsatztemperaturen oberhalb der Auslagerungstemperatur heben
      die Wirkung allmählich auf.
    sideEffects: >-
      Die Duktilität nimmt ab, und manche ausgehärteten Legierungen werden anfälliger für
      Spannungsrisskorrosion.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Precipitation hardening
    description: >-
      An alloy is solution-annealed so that the alloying elements dissolve in the solid solution,
      then quenched to produce a supersaturated solid solution. During subsequent ageing at
      room temperature or moderately elevated temperature, extremely fine particles precipitate,
      which obstruct the movement of dislocations and thus markedly increase strength and
      hardness.
    example: >-
      Aluminium alloys such as duralumin, 6061 and 7075 in aircraft and vehicles, maraging
      steels, precipitation-hardening stainless steels such as 17-4 PH, nickel-based superalloys,
      copper-beryllium springs
    conditions: >-
      An alloy whose solubility for the alloying element falls with decreasing temperature,
      and a tuned sequence of solution treatment, quenching and ageing.
    limits: >-
      Ageing too long or too hot coarsens the particles (overageing) and strength falls again;
      service temperatures above the ageing temperature gradually cancel the effect.
    sideEffects: >-
      Ductility decreases, and some aged alloys become more susceptible to stress corrosion
      cracking.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
