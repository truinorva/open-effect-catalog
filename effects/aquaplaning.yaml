text:
  de:
    name: Aquaplaning
    description: >-
      Rollt ein Reifen schnell über eine nasse Fahrbahn, kann das Wasser nicht mehr rasch
      genug durch die Profilrillen zur Seite verdrängt werden. Vor der Aufstandsfläche baut
      sich ein hydrodynamischer Druck auf, der einen Wasserkeil unter den Reifen schiebt und
      ihn von der Fahrbahn abhebt, sodass Lenk- und Bremskräfte kaum noch übertragen werden.
    example: >-
      Schleudergefahr auf nassen Straßen und Landebahnen, Auslegung von Reifenprofilen und
      Fahrbahnentwässerung; derselbe Auftrieb trägt Gleitboote und Wasserskier
    conditions: >-
      Hohe Geschwindigkeit, ein ausreichend tiefer Wasserfilm und abgefahrene oder sehr breite
      Reifen.
    limits: ''
    sideEffects: >-
      Das Fahrzeug wird unlenkbar, und wenn der Reifen wieder greift, kann es abrupt ausbrechen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Aquaplaning (hydroplaning)
    description: >-
      When a tyre rolls fast over a wet road, the water can no longer be pushed aside quickly
      enough through the tread grooves. A hydrodynamic pressure builds up ahead of the contact
      patch, drives a wedge of water under the tyre and lifts it off the road, so that steering
      and braking forces can hardly be transmitted.
    example: >-
      Skidding risk on wet roads and runways, design of tyre treads and road drainage; the
      same lift carries planing boats and water skis
    conditions: High speed, a sufficiently deep water film and worn or very wide tyres.
    limits: ''
    sideEffects: >-
      The vehicle cannot be steered, and when the tyre grips again it may swerve abruptly.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
