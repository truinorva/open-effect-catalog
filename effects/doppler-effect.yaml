text:
  de:
    name: Doppler-Effekt
    description: >-
      Bewegen sich Quelle und Beobachter einer Welle aufeinander zu, kommen die Wellenberge
      in kürzeren Abständen an, und die wahrgenommene Frequenz steigt; entfernen sie sich
      voneinander, sinkt sie. Bei einer Welle, die an einem bewegten Objekt reflektiert wird,
      ist die Frequenzverschiebung proportional zu dessen Geschwindigkeitskomponente in Blickrichtung,
      so dass sich die Geschwindigkeit berührungslos messen lässt.
    example: >-
      Radar-Geschwindigkeitsmessung, Doppler-Ultraschall für den Blutfluss, Laser-Doppler-Anemometrie,
      Ultraschall-Doppler-Durchflussmesser, Bewegungsmelder, Wetterradar, Radialgeschwindigkeit
      von Sternen
    conditions: >-
      Eine Relativbewegung zwischen Quelle, Reflektor und Empfänger mit einer Komponente in
      Ausbreitungsrichtung.
    limits: >-
      Bewegungen quer zur Blickrichtung ergeben, abgesehen von winzigen relativistischen Effekten,
      keine Frequenzverschiebung.
    sideEffects: >-
      Frequenzverschiebungen stören Funkverbindungen zu schnell bewegten Empfängern wie Satelliten.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Doppler effect
    description: >-
      If the source and the observer of a wave move towards each other, the wave crests arrive
      at shorter intervals and the perceived frequency rises; if they move apart, it falls.
      For a wave reflected from a moving object, the frequency shift is proportional to the
      object's velocity component along the line of sight, so its speed can be measured without
      contact.
    example: >-
      Radar speed measurement, Doppler ultrasound for blood flow, laser Doppler anemometry,
      ultrasonic Doppler flow meters, motion detectors, weather radar, radial velocity of
      stars
    conditions: >-
      Relative motion between source, reflector and receiver with a component in the direction
      of propagation.
    limits: >-
      Movements perpendicular to the line of sight produce no frequency shift, apart from
      tiny relativistic effects.
    sideEffects: >-
      Frequency shifts disturb radio links to fast-moving receivers such as satellites.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
