text:
  de:
    name: Pulsstrahltriebwerk
    description: >-
      Ein Pulsstrahltriebwerk verbrennt Kraftstoff in einzelnen, rasch aufeinanderfolgenden
      Verpuffungen in einer Brennkammer mit anschließendem Schubrohr. Der Druckstoß jeder
      Verbrennung treibt die Abgase aus dem Rohr, der folgende Unterdruck saugt über Klappenventile
      oder einen ventillosen Einlass frische Luft nach, und heiße Restgase zünden die nächste
      Ladung; die Taktfrequenz ergibt sich aus der akustischen Resonanz des Rohrs.
    example: >-
      Flugbombe V1 im Zweiten Weltkrieg, Modellflugzeuge, Pulsationsbrenner in Heizkesseln
      und Trocknern, Nebelgeräte zur Schädlingsbekämpfung
    conditions: >-
      Brennkammer und Schubrohr mit passender Resonanzlänge; zum Start ist meist Druckluft
      oder ein Gebläse nötig.
    limits: >-
      Geringer Wirkungsgrad und hoher Kraftstoffverbrauch; das Prinzip eignet sich nur für
      Unterschallgeschwindigkeiten.
    sideEffects: >-
      Extrem lautes, pulsierendes Geräusch und starke Vibrationen, die die Struktur belasten.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Pulsejet
    description: >-
      A pulsejet burns fuel in individual, rapidly repeated combustion pulses in a combustion
      chamber followed by a tailpipe. The pressure surge of each combustion drives the exhaust
      out of the pipe, the ensuing suction draws in fresh air through flap valves or a valveless
      intake, and hot residual gas ignites the next charge; the firing frequency is set by
      the acoustic resonance of the pipe.
    example: >-
      V-1 flying bomb in World War II, model aircraft, pulse combustion burners in boilers
      and dryers, thermal foggers for pest control
    conditions: >-
      A combustion chamber and tailpipe of suitable resonant length; starting usually requires
      compressed air or a blower.
    limits: >-
      Low efficiency and high fuel consumption; the principle is suitable only for subsonic
      speeds.
    sideEffects: >-
      Extremely loud, pulsating noise and strong vibrations that stress the structure.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
