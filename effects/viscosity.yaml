  de:
    name: Viskosität
    description: >-
      Die Viskosität ist die Zähflüssigkeit von Flüssigkeiten und Gasen. Je höher die Viskosität,
      umso zäher/dickflüssiger ist die Substanz. Sie bemisst den Widerstand, der der irreversiblen
      Verformung entgegensetzt wird.
    example: >-
      Stoßdämpfer, hydraulische Bremse, Wandfarbe, Lack, Abfüllanlage für Ketchup, Honig und
      Joghurt
