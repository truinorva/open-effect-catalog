  en:
    name: Viscosity
    description: >-
      Viscosity is the flow resistance of liquids and gases. The higher the viscosity, the
      thicker/more viscous the substance. It measures the resistance to irreversible deformation.
    example: >-
      Shock absorber, hydraulic brake, wall paint, varnish, filling line for ketchup, honey
      and yogurt
    conditions: ''
    limits: ''
    sideEffects: ''
