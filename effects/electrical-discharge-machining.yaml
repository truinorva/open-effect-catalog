text:
  de:
    name: Funkenerosion (Funkenerodieren, EDM)
    description: >-
      Zwischen einer Werkzeugelektrode und dem leitfähigen Werkstück, die beide in eine nichtleitende
      Flüssigkeit tauchen, werden in rascher Folge kurze Funkenentladungen gezündet. Jeder
      Funke schmilzt und verdampft an seinem Fußpunkt ein winziges Werkstoffvolumen, das die
      Flüssigkeit fortspült; so wird das Werkstück ohne mechanische Kraft abgetragen, unabhängig
      von seiner Härte.
    example: >-
      Senkerodieren von Spritzgießformen, Drahterodieren von Schneidstempeln, Bohren feiner
      Kühlluftbohrungen in Turbinenschaufeln
    conditions: >-
      Elektrisch leitfähiges Werkstück; dielektrische Flüssigkeit wie Öl oder deionisiertes
      Wasser.
    limits: >-
      Vergleichsweise geringe Abtragsrate; die Werkzeugelektrode verschleißt mit.
    sideEffects: >-
      Am Werkstück bleibt eine dünne, wiedererstarrte und oft rissanfällige Randschicht zurück.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electrical discharge machining (EDM)
    description: >-
      Short spark discharges are triggered in rapid succession between a tool electrode and
      the conductive workpiece, both immersed in a non-conducting liquid. Each spark melts
      and vaporises a tiny volume of material at its root, which the liquid flushes away;
      the workpiece is thus eroded without mechanical force, regardless of its hardness.
    example: >-
      Die-sinking of injection moulds, wire EDM of punches, drilling fine cooling holes in
      turbine blades
    conditions: >-
      Electrically conductive workpiece; dielectric fluid such as oil or deionised water.
    limits: Comparatively low removal rate; the tool electrode wears as well.
    sideEffects: >-
      A thin, resolidified surface layer that is often prone to cracking remains on the workpiece.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
