text:
  de:
    name: Gravitationslinseneffekt
    description: >-
      Große Massen wie Galaxien oder Galaxienhaufen krümmen die Raumzeit und lenken dadurch
      Licht ab, das nahe an ihnen vorbeiläuft. Licht eines dahinterliegenden Objekts erreicht
      den Beobachter dann auf mehreren Wegen, sodass Mehrfachbilder, Bögen oder Ringe entstehen
      und die Quelle heller erscheint.
    example: >-
      Bestimmung der Masse und der Dunklen Materie in Galaxienhaufen, Entdeckung von Exoplaneten
      durch Mikrolinsen, Beobachtung sehr ferner Galaxien wie durch ein natürliches Teleskop,
      Einstein-Ringe
    conditions: >-
      Sehr große Massen und eine nahezu fluchtende Anordnung von Quelle, Linse und Beobachter.
    limits: >-
      Der Effekt ist nur bei astronomischen Massen messbar und auf der Erde technisch nicht
      nutzbar.
    sideEffects: >-
      Er verzerrt die Bilder ferner Objekte und muss bei Himmelsdurchmusterungen herausgerechnet
      werden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Gravitational lensing
    description: >-
      Large masses such as galaxies or galaxy clusters curve spacetime and thereby deflect
      light passing close to them. Light from an object behind them then reaches the observer
      along several paths, producing multiple images, arcs or rings and making the source
      appear brighter.
    example: >-
      Determining the mass and dark matter of galaxy clusters, discovering exoplanets by microlensing,
      observing very distant galaxies as through a natural telescope, Einstein rings
    conditions: >-
      Very large masses and a nearly aligned arrangement of source, lens and observer.
    limits: >-
      The effect is measurable only with astronomical masses and cannot be used for technology
      on Earth.
    sideEffects: >-
      It distorts the images of distant objects and has to be corrected for in sky surveys.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
