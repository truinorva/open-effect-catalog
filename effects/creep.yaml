text:
  de:
    name: Kriechen
    description: >-
      Unter einer konstanten Last verformt sich ein Werkstoff langsam immer weiter, obwohl
      die Spannung unter seiner Fließgrenze liegt. Bei Metallen wird das meist erst oberhalb
      von etwa 30 bis 40 % der absoluten Schmelztemperatur merklich, wenn Versetzungen klettern
      und Atome diffundieren können; Kunststoffe und Blei kriechen schon bei Raumtemperatur,
      Gletschereis unter seinem Eigengewicht. Am Ende kann es zum Kriechbruch kommen.
    example: >-
      Turbinenschaufeln und Kesselrohre (Auslegung auf Kriechfestigkeit), Kriechumformen von
      Flugzeug-Schalenbauteilen, durchhängende Kunststoffregale, Gletscherfließen, Setzen
      von Schraubenverbindungen
    conditions: >-
      Eine dauerhafte Last und eine im Verhältnis zur Schmelztemperatur des Werkstoffs ausreichend
      hohe Temperatur.
    limits: >-
      Bei niedriger Temperatur und Spannung ist die Kriechgeschwindigkeit so gering, dass
      sie für eine Formgebung zu langsam ist.
    sideEffects: >-
      Verlust der Schraubenvorspannung (Relaxation), bleibende Verformung und schließlich
      Kriechbruch.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Creep
    description: >-
      Under a constant load a material slowly keeps deforming, even though the stress is below
      its yield strength. In metals this usually becomes noticeable only above about 30 to
      40 % of the absolute melting temperature, when dislocations can climb and atoms can
      diffuse; plastics and lead creep even at room temperature, and glacier ice under its
      own weight. Eventually creep rupture can occur.
    example: >-
      Turbine blades and boiler tubes (designed for creep strength), creep age forming of
      aircraft skin panels, sagging plastic shelves, glacier flow, settling of bolted joints
    conditions: >-
      A sustained load and a temperature that is high enough relative to the melting point
      of the material.
    limits: >-
      At low temperature and stress the creep rate is so low that it is too slow for shaping.
    sideEffects: >-
      Loss of bolt preload (relaxation), permanent deformation and eventually creep rupture.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
