text:
  de:
    name: Konzentrationsgetriebene Konvektion
    description: >-
      Dichteunterschiede entstehen nicht nur durch Temperatur, sondern auch durch die Zusammensetzung:
      Eine Lösung mit mehr gelöstem Salz oder Zucker ist schwerer als das reine Lösungsmittel.
      Im Schwerefeld sinkt der dichtere Teil ab und der leichtere steigt auf, so dass ganz
      ohne Heizung eine Strömung entsteht, die den gelösten Stoff verteilt.
    example: >-
      Absinkende Schlieren beim Auflösen eines Zuckerwürfels, Erstarrung von Legierungen und
      Meereis (Salzlauge sinkt ab), Aufsteigen feuchter Luft über trockener, Lösen von Salz
      aus einem oben eingehängten Korb
    conditions: >-
      Schwerefeld und ein Konzentrationsgefälle, bei dem dichteres Fluid über leichterem liegt.
    limits: >-
      Bei stabiler Schichtung mit dem leichten Fluid oben entsteht keine Strömung, und in
      Schwerelosigkeit fehlt der Antrieb.
    sideEffects: >-
      Bei der Erstarrung von Gussteilen und Kristallen verursacht sie Entmischung und Fehler
      wie Seigerungskanäle.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Compositional convection
    description: >-
      Density differences arise not only from temperature but also from composition: a solution
      containing more dissolved salt or sugar is heavier than the pure solvent. In a gravitational
      field the denser part sinks and the lighter part rises, producing a flow without any
      heating that spreads the dissolved substance.
    example: >-
      Sinking streaks when a sugar cube dissolves, solidification of alloys and sea ice (brine
      sinks), moist air rising above dry air, dissolving salt from a basket hung near the
      surface
    conditions: >-
      Gravity and a concentration gradient with denser fluid lying above lighter fluid.
    limits: >-
      With stable layering, light fluid on top, no flow develops, and in weightlessness the
      drive is missing.
    sideEffects: >-
      During solidification of castings and crystals it causes segregation and defects such
      as freckle channels.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
