text:
  de:
    name: Schmierung
    description: >-
      Bei der Schmierung wird ein Schmierstoff, etwa Öl, Fett, ein Gas oder ein Festschmierstoff
      wie Graphit, zwischen zwei gegeneinander bewegte Oberflächen gebracht. Im günstigsten
      Fall baut die Relativbewegung in einem sich verengenden Spalt einen tragenden Druck
      auf, so dass ein dünner Film die Flächen vollständig trennt und nur noch innere Flüssigkeitsreibung
      auftritt. Reicht der Film dafür nicht aus, schützen an der Oberfläche haftende Additivschichten
      vor direktem Metallkontakt.
    example: >-
      Gleit- und Wälzlager, Motoren und Getriebe, Ketten, Umformwerkzeuge, Kühlschmierstoffe
      beim Zerspanen, Gelenkflüssigkeit in Körpergelenken
    conditions: >-
      Ein Schmierstoff passender Viskosität, der an den Kontaktflächen gehalten oder ständig
      nachgeliefert wird.
    limits: >-
      Bei sehr niedriger Gleitgeschwindigkeit, hoher Last oder Stillstand reißt der Schmierfilm
      ab, und es kommt zu Mischreibung und Verschleiß; Schmierstoffe altern durch Hitze und
      Oxidation.
    sideEffects: >-
      Schmierstoffe können Produkte und Umwelt verunreinigen und müssen gewechselt und entsorgt
      werden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Lubrication
    description: >-
      In lubrication, a lubricant such as oil, grease, a gas or a solid lubricant like graphite
      is placed between two surfaces moving against each other. Ideally, the relative motion
      in a converging gap builds up a load-carrying pressure, so that a thin film separates
      the surfaces completely and only internal fluid friction remains. Where the film is
      insufficient, additive layers adhering to the surface protect against direct metal contact.
    example: >-
      Plain and rolling bearings, engines and gearboxes, chains, forming tools, cutting fluids
      in machining, synovial fluid in body joints
    conditions: >-
      A lubricant of suitable viscosity that is retained at the contact surfaces or continuously
      supplied.
    limits: >-
      At very low sliding speed, high load or standstill the lubricating film breaks down,
      leading to mixed friction and wear; lubricants age through heat and oxidation.
    sideEffects: >-
      Lubricants can contaminate products and the environment and have to be changed and disposed
      of.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
