text:
  de:
    name: Kamm
    description: >-
      Ein Kamm hat eine Reihe von Zinken, durch deren Zwischenräume Haare oder Fasern gezogen
      werden. Dabei werden verhedderte Fasern entwirrt und parallel ausgerichtet, während
      kurze Fasern, Knoten und Fremdkörper hängen bleiben und so abgetrennt werden. Der Abstand
      der Zinken bestimmt, wie fein ausgerichtet und gereinigt wird.
    example: >-
      Haarkamm, Kämmmaschine in der Spinnerei (Kammgarn), Läusekamm, Flachshechel, Rechen
      in Kläranlagen
    conditions: ''
    limits: ''
    sideEffects: Zu starkes Ziehen kann Fasern brechen und Haare ausreißen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Comb
    description: >-
      A comb has a row of teeth through whose gaps hair or fibres are drawn. Tangled fibres
      are disentangled and aligned in parallel, while short fibres, knots and foreign matter
      are caught and thus removed. The spacing of the teeth determines how finely the fibres
      are aligned and cleaned.
    example: >-
      Hair comb, combing machine in spinning (worsted yarn), nit comb, flax hackle, bar screens
      in sewage plants
    conditions: ''
    limits: ''
    sideEffects: Pulling too hard can break fibres and tear out hair.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
