text:
  de:
    name: Heißisostatisches Pressen (HIP)
    description: >-
      Bauteile oder in Kapseln eingeschlossenes Pulver werden in einem Druckbehälter gleichzeitig
      hoher Temperatur und einem allseitigen Gasdruck, meist Argon, ausgesetzt. Durch Kriechen
      und Diffusion schließen sich innere Poren und Hohlräume, und der Werkstoff wird nahezu
      vollständig dicht; weil der Druck von allen Seiten gleich wirkt, schrumpft das Teil
      gleichmäßig und behält seine Form.
    example: >-
      Nachverdichten von Turbinenschaufeln und Feingussteilen, pulvermetallurgische Werkzeugstähle
      und Superlegierungen, Nachbehandlung metallischer 3D-Druckteile, Diffusionsschweißen
      und Plattieren
    conditions: >-
      Hohe Temperatur unterhalb des Schmelzpunkts und hoher allseitiger Gasdruck.
    limits: >-
      Nur geschlossene innere Poren schließen sich, zur Oberfläche offene Poren nur bei gekapselten
      Teilen; zudem sind die Anlagen teuer und arbeiten chargenweise.
    sideEffects: Die lange Haltezeit bei hoher Temperatur kann Kornwachstum verursachen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Hot isostatic pressing (HIP)
    description: >-
      Components or powder sealed in capsules are exposed in a pressure vessel to high temperature
      and an all-round gas pressure, usually argon, at the same time. Creep and diffusion
      close internal pores and cavities and the material becomes almost fully dense; because
      the pressure acts equally from all sides, the part shrinks uniformly and keeps its shape.
    example: >-
      Densifying turbine blades and investment castings, powder-metallurgy tool steels and
      superalloys, post-treatment of metal 3D-printed parts, diffusion bonding and cladding
    conditions: >-
      High temperature below the melting point and high all-round gas pressure.
    limits: >-
      Only closed internal pores are eliminated, and surface-connected pores only in encapsulated
      parts; moreover, the equipment is expensive and works in batches.
    sideEffects: The long hold at high temperature can cause grain growth.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
