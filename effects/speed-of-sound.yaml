text:
  de:
    name: Schallgeschwindigkeit
    description: >-
      Schall breitet sich in jedem Stoff mit einer bestimmten Geschwindigkeit aus, die von
      dessen Steifigkeit und Dichte abhängt; in Gasen hängt sie zudem von Temperatur und Molmasse
      ab. Kennt man diese Geschwindigkeit, liefert die gemessene Laufzeit eines Schallsignals
      eine Entfernung; misst man umgekehrt die Geschwindigkeit über eine bekannte Strecke,
      kann man auf Temperatur, Zusammensetzung oder elastische Eigenschaften des Mediums schließen.
    example: >-
      Echolot und Ultraschall-Abstandssensoren, Ultraschall-Wanddickenmessung, Ultraschall-Durchflussmesser,
      akustische Gasanalyse und Temperaturmessung, Bestimmung des E-Moduls aus der Schalllaufzeit
    conditions: >-
      Ein elastisches Medium; bekannte Messstrecke oder bekannte Schallgeschwindigkeit.
    limits: >-
      Temperatur- und Zusammensetzungsänderungen entlang des Schallwegs verfälschen Abstands-
      und Laufzeitmessungen, wenn sie nicht ausgeglichen werden.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Speed of sound
    description: >-
      Sound propagates in every substance at a particular speed that depends on its stiffness
      and density; in gases it also depends on temperature and molar mass. If this speed is
      known, the measured travel time of a sound signal gives a distance; conversely, measuring
      the speed over a known path reveals the temperature, composition or elastic properties
      of the medium.
    example: >-
      Echo sounders and ultrasonic distance sensors, ultrasonic wall-thickness gauging, ultrasonic
      flow meters, acoustic gas analysis and temperature measurement, determining Young's
      modulus from sound travel time
    conditions: An elastic medium; known path length or known speed of sound.
    limits: >-
      Changes in temperature and composition along the sound path distort distance and travel-time
      measurements unless compensated.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
