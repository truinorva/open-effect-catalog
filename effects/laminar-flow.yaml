text:
  de:
    name: Laminare Strömung
    description: >-
      Bei laminarer Strömung bewegt sich ein Fluid in geordneten, parallelen Schichten, die
      aneinander vorbeigleiten, ohne sich quer zur Strömungsrichtung zu vermischen. Sie stellt
      sich ein, wenn die Zähigkeit gegenüber der Trägheit überwiegt, also bei kleiner Reynolds-Zahl.
      Reibungsverlust und Druckabfall wachsen dabei proportional zur Geschwindigkeit, was
      laminare Strömung gut berechenbar macht.
    example: >-
      Laminar-Durchflussmesser, Reinraumwerkbänke mit turbulenzarmer Verdrängungsströmung,
      Mikrofluidik und Lab-on-a-Chip, Schmierfilme in Gleitlagern, Laminarprofile an Segelflugzeugflügeln
    conditions: >-
      Kleine Reynolds-Zahl, in Rohren etwa unter 2300, also kleine Abmessungen, geringe Geschwindigkeit
      oder hohe Viskosität.
    limits: >-
      Oberhalb der kritischen Reynolds-Zahl oder bei Störungen wie Rauheit und Vibration schlägt
      die Strömung in Turbulenz um.
    sideEffects: >-
      Wärmeübergang und Durchmischung sind deutlich schwächer als bei turbulenter Strömung.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Laminar flow
    description: >-
      In laminar flow, a fluid moves in orderly, parallel layers that slide past one another
      without mixing across the flow direction. It occurs when viscosity dominates over inertia,
      that is, at low Reynolds numbers. Friction losses and pressure drop then grow in proportion
      to the velocity, which makes laminar flow easy to calculate.
    example: >-
      Laminar flow meters, clean benches with low-turbulence displacement flow, microfluidics
      and lab-on-a-chip, lubricating films in plain bearings, laminar-flow aerofoils on gliders
    conditions: >-
      Low Reynolds number, below about 2300 in pipes, i.e. small dimensions, low velocity
      or high viscosity.
    limits: >-
      Above the critical Reynolds number, or with disturbances such as roughness and vibration,
      the flow turns turbulent.
    sideEffects: Heat transfer and mixing are much weaker than in turbulent flow.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
