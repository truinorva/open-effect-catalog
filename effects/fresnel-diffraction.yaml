text:
  de:
    name: Fresnel-Beugung
    description: >-
      Fresnel-Beugung beschreibt das Beugungsbild im Nahfeld einer Öffnung oder Kante, wenn
      der Beobachtungsabstand nicht groß ist gegenüber dem Quadrat der Öffnungsgröße geteilt
      durch die Wellenlänge. Dann überlagern sich Wellen aus verschiedenen Zonen der Öffnung
      mit unterschiedlichen Gangunterschieden, und es entstehen Streifen, die sich mit dem
      Abstand ändern. Eine Zonenplatte nutzt das, indem sie abwechselnd Zonen sperrt und so
      Licht oder Röntgenstrahlung bündelt.
    example: >-
      Fresnel-Zonenplatten in der Röntgenmikroskopie, Poisson-Fleck (Arago-Fleck) hinter einer
      Kreisscheibe, Beugungssäume an Schattenkanten, Nahfeldeffekte bei der Proximity-Belichtung
      in der Lithografie
    conditions: >-
      Kohärente oder weitgehend monochromatische Wellen; Abstand im Nahfeld (Fresnel-Zahl
      etwa 1 oder größer).
    limits: >-
      Zonenplatten bündeln nur eine Wellenlänge scharf und lenken viel Licht in andere Beugungsordnungen.
    sideEffects: >-
      Beugungssäume begrenzen die Auflösung bei Schattenwurf und Proximity-Belichtung.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Fresnel diffraction
    description: >-
      Fresnel diffraction describes the diffraction pattern in the near field of an aperture
      or edge, when the observation distance is not large compared with the square of the
      aperture size divided by the wavelength. Waves from different zones of the aperture
      then overlap with different path differences, producing fringes that change with distance.
      A zone plate exploits this by blocking alternate zones and thereby focusing light or
      X-rays.
    example: >-
      Fresnel zone plates in X-ray microscopy, Poisson (Arago) spot behind a circular disc,
      fringes at shadow edges, near-field effects in proximity printing in lithography
    conditions: >-
      Coherent or largely monochromatic waves; distance in the near field (Fresnel number
      around 1 or larger).
    limits: >-
      Zone plates focus only one wavelength sharply and send much of the light into other
      diffraction orders.
    sideEffects: >-
      Diffraction fringes limit the resolution of shadow casting and proximity printing.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
