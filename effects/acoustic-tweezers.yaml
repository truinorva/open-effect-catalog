text:
  de:
    name: Akustische Pinzette
    description: >-
      Gezielt überlagerte Ultraschallwellen, meist Oberflächenwellen auf einem piezoelektrischen
      Chip, bilden ein Muster aus Druckknoten, in dem einzelne Zellen, Partikel oder Tröpfchen
      gefangen werden. Verschiebt man Phase oder Frequenz der Wellen, wandern die Knoten und
      mit ihnen die gefangenen Objekte, berührungslos und ohne Markierung.
    example: >-
      Sortieren und Anordnen von Zellen in der Mikrofluidik, Abtrennen von Tumorzellen oder
      Exosomen aus Blut, Aufbau von Zellverbänden im Tissue Engineering
    conditions: >-
      Die Objekte müssen sich in Dichte oder Kompressibilität vom umgebenden Medium unterscheiden.
    limits: >-
      Die Positioniergenauigkeit ist durch die Wellenlänge begrenzt, und sehr kleine Objekte
      im Nanometerbereich lassen sich nur schwer festhalten.
    sideEffects: >-
      Bei zu hoher Leistung erwärmt sich die Probe, was empfindliche Zellen schädigen kann.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Acoustic tweezers
    description: >-
      Deliberately superimposed ultrasound waves, usually surface acoustic waves on a piezoelectric
      chip, form a pattern of pressure nodes in which individual cells, particles or droplets
      are trapped. Shifting the phase or frequency of the waves moves the nodes and with them
      the trapped objects, without contact and without labelling.
    example: >-
      Sorting and arranging cells in microfluidics, isolating tumour cells or exosomes from
      blood, assembling cell clusters for tissue engineering
    conditions: >-
      The objects must differ in density or compressibility from the surrounding medium.
    limits: >-
      Positioning precision is limited by the wavelength, and very small objects in the nanometre
      range are hard to hold.
    sideEffects: Too much power heats the sample, which can damage sensitive cells.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
