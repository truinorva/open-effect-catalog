text:
  de:
    name: Laser-Doppler-Anemometrie
    description: >-
      Bei der Laser-Doppler-Anemometrie werden zwei Teilstrahlen eines Lasers in einem kleinen
      Messvolumen gekreuzt, wo sie ein Muster aus hellen und dunklen Interferenzstreifen bilden.
      Kleine Tracerpartikel, die mit der Strömung durch dieses Volumen fliegen, streuen Licht
      mit einer Frequenz, die proportional zu ihrer Geschwindigkeit ist; man kann dies auch
      als Dopplerverschiebung des Streulichts deuten. Aus der Frequenz ergibt sich berührungslos
      die örtliche Strömungsgeschwindigkeit.
    example: >-
      Strömungsuntersuchungen in Wind- und Wasserkanälen, Verbrennungs- und Motorforschung,
      Untersuchung von Pumpen und Turbinen, Kalibrierung von Durchflussmessern
    conditions: >-
      Optischer Zugang zur Strömung und streuende Partikel, die der Strömung schlupffrei folgen.
    limits: >-
      Gemessen wird nur in einem einzigen kleinen Punkt; ohne geeignete Partikel gibt es kein
      Signal.
    sideEffects: Zugegebene Tracerpartikel können Fenster und Anlagen verschmutzen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Laser Doppler velocimetry
    description: >-
      In laser Doppler velocimetry, two beams split from one laser cross in a small measurement
      volume, where they form a pattern of bright and dark interference fringes. Small tracer
      particles that travel through this volume with the flow scatter light at a frequency
      proportional to their velocity; this can also be viewed as a Doppler shift of the scattered
      light. The frequency gives the local flow velocity without any contact.
    example: >-
      Flow studies in wind and water tunnels, combustion and engine research, investigation
      of pumps and turbines, calibration of flow meters
    conditions: >-
      Optical access to the flow and scattering particles that follow the flow without slip.
    limits: >-
      Measurement takes place at a single small point only; without suitable particles there
      is no signal.
    sideEffects: Added tracer particles can contaminate windows and equipment.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
