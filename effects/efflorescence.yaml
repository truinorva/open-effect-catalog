text:
  de:
    name: Ausblühung
    description: >-
      Wasser, das in poröse Baustoffe wie Ziegel, Mörtel oder Beton eindringt, löst darin
      enthaltene Salze und wandert durch Kapillarkräfte zur Oberfläche. Dort verdunstet es,
      und die zurückbleibenden Salze kristallisieren als weißer, oft pulvriger Belag aus.
      Verdunstet das Wasser schon knapp unter der Oberfläche, können die wachsenden Kristalle
      das Gefüge absprengen.
    example: >-
      Weiße Beläge an Ziegelmauern und Beton, Kalkausblühungen auf Pflaster, Salzkrusten an
      Kellerwänden, Entsalzung von Mauerwerk mit Opferputz oder Kompressen
    conditions: >-
      Lösliche Salze im Material, Feuchtezufuhr und Verdunstung an der Oberfläche.
    limits: ''
    sideEffects: >-
      Optische Beeinträchtigung sowie Absprengungen und Zerfall von Putz und Stein durch Kristallisationsdruck.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Efflorescence
    description: >-
      Water that penetrates porous building materials such as brick, mortar or concrete dissolves
      the salts they contain and migrates to the surface by capillary action. There it evaporates,
      and the salts left behind crystallise as a white, often powdery deposit. If the water
      evaporates just below the surface, the growing crystals can spall off the material.
    example: >-
      White deposits on brick walls and concrete, lime efflorescence on paving, salt crusts
      on cellar walls, desalination of masonry with sacrificial render or poultices
    conditions: >-
      Soluble salts in the material, a supply of moisture and evaporation at the surface.
    limits: ''
    sideEffects: >-
      Visual impairment, and spalling and decay of render and stone due to crystallisation
      pressure.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
