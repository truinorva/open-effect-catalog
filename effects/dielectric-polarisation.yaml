text:
  de:
    name: Dielektrische Polarisation
    description: >-
      In einem elektrischen Isolator (Dielektrikum) können sich die Ladungen nicht frei bewegen,
      werden im elektrischen Feld aber gegeneinander verschoben, oder vorhandene Dipole richten
      sich aus. Diese Polarisation schwächt das Feld im Inneren ab und erhöht die Kapazität
      eines Kondensators um die Permittivitätszahl des Stoffes. Weil Wasser eine viel höhere
      Permittivität hat als die meisten anderen Stoffe, verrät die Kapazität einer Anordnung
      ihren Wassergehalt oder Füllstand.
    example: >-
      Kondensatoren, kapazitive Füllstands- und Feuchtemessung (Holz, Getreide, Boden), kapazitive
      Näherungsschalter und Touchscreens, Kabelisolierung
    conditions: Ein elektrisch isolierender Stoff in einem elektrischen Feld.
    limits: >-
      Oberhalb der Durchschlagfeldstärke wird das Dielektrikum leitend und zerstört, und die
      Permittivität hängt von Frequenz und Temperatur ab.
    sideEffects: Dielektrische Verluste erwärmen das Material in Wechselfeldern.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Dielectric polarisation
    description: >-
      In an electrical insulator (dielectric) the charges cannot move freely, but in an electric
      field they are displaced relative to one another or existing dipoles align. This polarisation
      weakens the field inside and increases the capacitance of a capacitor by the relative
      permittivity of the material. Because water has a much higher permittivity than most
      other substances, the capacitance of an arrangement reveals its water content or fill
      level.
    example: >-
      Capacitors, capacitive level and moisture measurement (wood, grain, soil), capacitive
      proximity switches and touchscreens, cable insulation
    conditions: An electrically insulating material in an electric field.
    limits: >-
      Above the breakdown field strength the dielectric becomes conductive and is destroyed,
      and the permittivity depends on frequency and temperature.
    sideEffects: Dielectric losses heat the material in alternating fields.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
