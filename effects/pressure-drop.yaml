text:
  de:
    name: Druckverlust
    description: >-
      Strömt ein Fluid durch Rohre, Armaturen, Filter oder Schüttungen, nimmt sein Druck in
      Strömungsrichtung ab, weil Wandreibung, Umlenkungen und Wirbel Strömungsenergie in Wärme
      umwandeln. Bei laminarer Strömung wächst der Druckverlust etwa proportional zum Durchfluss,
      bei turbulenter Strömung etwa mit dessen Quadrat.
    example: >-
      Drosseln und Kapillarrohre in Kältekreisläufen, Laminar-Flow-Elemente zur Durchflussmessung,
      Überwachung der Filterverschmutzung über den Differenzdruck, Lochbleche zur gleichmäßigen
      Strömungsverteilung
    conditions: >-
      Strömendes Gas oder strömende Flüssigkeit in einem Kanal, einer Armatur oder einem durchströmten
      porösen Körper.
    limits: ''
    sideEffects: >-
      Der Druckverlust muss durch Pumpen- oder Gebläseleistung ausgeglichen werden und kostet
      Energie; in Flüssigkeiten kann ein starker örtlicher Druckabfall Kavitation auslösen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Pressure drop
    description: >-
      When a fluid flows through pipes, fittings, filters or packed beds, its pressure decreases
      along the flow because wall friction, changes of direction and eddies convert flow energy
      into heat. In laminar flow the pressure drop grows roughly in proportion to the flow
      rate, in turbulent flow roughly with its square.
    example: >-
      Throttles and capillary tubes in refrigeration circuits, laminar flow elements for flow
      measurement, monitoring filter clogging by differential pressure, perforated plates
      for even flow distribution
    conditions: Gas or liquid flowing through a channel, a fitting or a porous body.
    limits: ''
    sideEffects: >-
      The pressure drop must be made up by pump or fan power and costs energy; in liquids
      a strong local pressure drop can trigger cavitation.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
