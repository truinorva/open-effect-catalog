text:
  de:
    name: Wirbelring
    description: >-
      Stößt man einen Fluidschwall kurz durch eine Öffnung, rollt sich die Scherschicht am
      Rand zu einem ringförmigen Wirbel auf. Der Ring bewegt sich durch seine eigene Wirbelbewegung
      fort und trägt das eingeschlossene Fluid mit wenig Vermischung über Strecken, die ein
      Vielfaches seines Durchmessers betragen. Mit der Zeit wächst er, wird langsamer und
      zerfällt durch Reibung und Turbulenz.
    example: >-
      Rauchringe, Luftwirbelkanonen, Blasenringe von Delfinen, Rückstoßantrieb von Quallen
      und Tintenfischen, Pilzwolke großer Explosionen
    conditions: Kurzer, impulsartiger Ausstoß durch eine scharfkantige Öffnung.
    limits: ''
    sideEffects: >-
      Hubschrauber, die zu steil in ihren eigenen Abwind sinken, geraten in den Wirbelringzustand
      und verlieren Auftrieb.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Vortex ring
    description: >-
      If a slug of fluid is pushed briefly through an opening, the shear layer at the edge
      rolls up into a ring-shaped vortex. The ring propels itself by its own swirling motion
      and carries the enclosed fluid, with little mixing, over distances many times its diameter.
      Over time it grows, slows down and decays through friction and turbulence.
    example: >-
      Smoke rings, vortex cannons, bubble rings made by dolphins, jet propulsion of jellyfish
      and squid, mushroom cloud of large explosions
    conditions: Short, impulsive ejection through a sharp-edged opening.
    limits: ''
    sideEffects: >-
      Helicopters descending too steeply into their own downwash enter the vortex ring state
      and lose lift.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
