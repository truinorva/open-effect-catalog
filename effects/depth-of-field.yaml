text:
  de:
    name: Schärfentiefe
    description: >-
      Ein Objektiv bildet nur eine Ebene exakt scharf ab; Punkte davor und dahinter erscheinen
      als kleine Unschärfekreise. Solange diese kleiner bleiben als das Auflösungsvermögen
      von Sensor oder Auge, wirken sie noch scharf – dieser Entfernungsbereich ist die Schärfentiefe.
      Sie wächst mit kleinerer Blendenöffnung und größerem Objektabstand und schrumpft bei
      starker Vergrößerung.
    example: >-
      Abblenden in der Fotografie, Fixfokus-Kameras und Barcodeleser mit großer Schärfentiefe,
      Fokusvariations-Mikroskope zur 3D-Oberflächenmessung, Autofokus
    conditions: Ein abbildendes optisches System mit begrenzter Apertur.
    limits: >-
      Starkes Abblenden vergrößert die Schärfentiefe, verringert aber durch Beugung die Auflösung
      und erfordert mehr Licht.
    sideEffects: >-
      Bei geringer Schärfentiefe erscheinen Teile eines räumlichen Objekts unscharf.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Depth of field
    description: >-
      A lens images only one plane perfectly sharply; points in front of and behind it appear
      as small blur circles. As long as these remain smaller than the resolution of the sensor
      or eye, they still look sharp – this range of distances is the depth of field. It increases
      with a smaller aperture and a larger object distance and shrinks at high magnification.
    example: >-
      Stopping down in photography, fixed-focus cameras and barcode readers with large depth
      of field, focus-variation microscopes for 3D surface measurement, autofocus
    conditions: An imaging optical system with a finite aperture.
    limits: >-
      Stopping down strongly increases the depth of field but reduces resolution through diffraction
      and requires more light.
    sideEffects: >-
      With shallow depth of field, parts of a three-dimensional object appear blurred.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
