text:
  de:
    name: Nernst-Effekt (Nernst-Ettingshausen-Effekt)
    description: >-
      Fließt Wärme durch einen Leiter oder Halbleiter, der in einem quer dazu stehenden Magnetfeld
      liegt, entsteht eine elektrische Spannung senkrecht zu Wärmestrom und Magnetfeld. Die
      vom Temperaturgefälle angetriebenen Ladungsträger werden im Magnetfeld seitlich abgelenkt,
      und weil schnelle und langsame Ladungsträger unterschiedlich stark abgelenkt werden,
      bleibt eine Querspannung bestehen, obwohl kein Strom fließt. Die Umkehrung, bei der
      ein Strom im Magnetfeld ein Temperaturgefälle quer dazu erzeugt, heißt Ettingshausen-Effekt.
    example: >-
      Untersuchung von Ladungsträgern in Halbleitern und Supraleitern, Forschung zu thermomagnetischen
      Generatoren und Wärmestromsensoren
    conditions: >-
      Ein Temperaturgefälle und gleichzeitig ein Magnetfeld senkrecht dazu; große Effekte
      zeigen Halbmetalle wie Bismut und Halbleiter mit hoher Ladungsträgerbeweglichkeit.
    limits: >-
      In gewöhnlichen Metallen ist die erzeugte Spannung sehr klein, sodass technische Nutzungen
      bislang auf Spezialfälle beschränkt sind.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Nernst effect (Nernst–Ettingshausen effect)
    description: >-
      When heat flows through a conductor or semiconductor placed in a magnetic field perpendicular
      to the heat flow, an electric voltage appears perpendicular to both heat flow and field.
      The charge carriers driven by the temperature gradient are deflected sideways by the
      field, and because fast and slow carriers are deflected differently, a transverse voltage
      remains even though no current flows. The reverse effect, in which a current in a magnetic
      field produces a transverse temperature gradient, is called the Ettingshausen effect.
    example: >-
      Studying charge carriers in semiconductors and superconductors, research on thermomagnetic
      generators and heat-flux sensors
    conditions: >-
      A temperature gradient together with a magnetic field perpendicular to it; large effects
      occur in semimetals such as bismuth and in semiconductors with high carrier mobility.
    limits: >-
      In ordinary metals the voltage produced is very small, so technical uses have so far
      been limited to special cases.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
