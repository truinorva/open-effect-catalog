text:
  de:
    name: Wiegand-Effekt
    description: >-
      Ein speziell kaltverformter und verdrillter Draht aus einer Kobalt-Eisen-Vanadium-Legierung
      hat einen magnetisch weichen Kern und einen harten Mantel. Überschreitet ein äußeres
      Feld einen Schwellwert, klappt die Magnetisierung des Kerns schlagartig um und induziert
      in einer Spule einen kurzen, kräftigen Spannungspuls, dessen Höhe nicht davon abhängt,
      wie schnell sich das Feld ändert. Der Puls reicht aus, um ohne Batterie eine Zählelektronik
      zu versorgen.
    example: >-
      Batterielose Umdrehungszähler in Multiturn-Drehgebern, Drehzahlsensoren für sehr langsame
      Drehungen, Wiegand-Zugangskarten
    conditions: >-
      Wechselndes Magnetfeld, das den Schwellwert abwechselnd in beiden Richtungen überschreitet.
    limits: >-
      Liefert nur einzelne Pulse, also Zählwerte, aber keine stetige Positionsinformation.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Wiegand effect
    description: >-
      A specially cold-worked and twisted wire made of a cobalt-iron-vanadium alloy has a
      magnetically soft core and a hard shell. When an external field exceeds a threshold,
      the magnetisation of the core flips abruptly and induces a short, strong voltage pulse
      in a coil whose amplitude does not depend on how fast the field changes. The pulse is
      sufficient to power counting electronics without a battery.
    example: >-
      Battery-free revolution counters in multiturn rotary encoders, speed sensors for very
      slow rotation, Wiegand access cards
    conditions: >-
      Alternating magnetic field that exceeds the threshold in both directions in turn.
    limits: >-
      Provides only individual pulses, i.e. counts, but no continuous position information.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
