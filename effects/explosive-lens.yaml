text:
  de:
    name: Sprengstofflinse
    description: >-
      Eine Sprengstofflinse kombiniert Sprengstoffe mit unterschiedlicher Detonationsgeschwindigkeit
      in einer geformten Anordnung. Weil die Detonationsfront im schnellen Sprengstoff weiter
      vorläuft als im langsamen, wird eine von einem Punkt ausgehende, kugelförmig gewölbte
      Front – ähnlich wie Licht an einer Linse gebrochen wird – in eine ebene oder nach innen
      gewölbte Front umgeformt.
    example: >-
      Ebene-Welle-Generatoren für Stoßwellenexperimente, Implosionsanordnungen zum Verdichten
      von Material
    conditions: >-
      Präzise geformte Sprengstoffkörper gleichmäßiger Dichte und genau zeitgleiche Zündung.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Explosive lens
    description: >-
      An explosive lens combines explosives with different detonation velocities in a shaped
      arrangement. Because the detonation front advances further in the fast explosive than
      in the slow one, a spherically diverging front starting from a point is reshaped – much
      as light is refracted by a lens – into a plane or converging front.
    example: >-
      Plane-wave generators for shock-wave experiments, implosion assemblies for compressing
      material
    conditions: >-
      Precisely shaped explosive charges of uniform density and exactly simultaneous initiation.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
