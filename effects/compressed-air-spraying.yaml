text:
  de:
    name: Druckluftspritzen (pneumatische Zerstäubung)
    description: >-
      Beim Druckluftspritzen trifft ein schneller Druckluftstrahl an der Düse der Spritzpistole
      auf den austretenden Lack und reißt ihn in feine Tröpfchen auf. Der Luftstrom trägt
      den Sprühnebel zum Werkstück, wo die Tropfen auftreffen, verlaufen und zu einem geschlossenen
      Film zusammenfließen; bei Saugbechern zieht der Unterdruck an der Düse den Lack zugleich
      aus dem Behälter an.
    example: >-
      Autoreparaturlackierung, Möbellackierung, Airbrush, Lackierung von Einzelteilen und
      Kleinserien
    conditions: >-
      Ein Lack mit passender Viskosität und saubere, öl- und wasserfreie Druckluft.
    limits: >-
      Ein großer Teil des Lacks verfehlt das Werkstück als Overspray, sodass der Auftragswirkungsgrad
      gering ist.
    sideEffects: >-
      Der Sprühnebel belastet die Luft mit Lösemitteln und Lackpartikeln und erfordert Absaugung
      und Atemschutz.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Compressed-air spraying (pneumatic atomisation)
    description: >-
      In compressed-air spraying a fast jet of air at the nozzle of the spray gun hits the
      emerging paint and tears it into fine droplets. The air stream carries the spray to
      the workpiece, where the droplets land, level out and merge into a continuous film;
      with suction-feed cups, the low pressure at the nozzle also draws the paint out of the
      container.
    example: >-
      Automotive refinishing, furniture finishing, airbrush, painting of single parts and
      small batches
    conditions: Paint of suitable viscosity and clean, oil-free and dry compressed air.
    limits: >-
      A large share of the paint misses the workpiece as overspray, so transfer efficiency
      is low.
    sideEffects: >-
      The spray mist loads the air with solvents and paint particles and requires extraction
      and respiratory protection.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
