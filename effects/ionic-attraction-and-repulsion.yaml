text:
  de:
    name: Anziehung und Abstoßung von Ionen
    description: >-
      Ionen tragen eine elektrische Nettoladung und üben deshalb Coulomb-Kräfte aufeinander
      aus: Gleichnamig geladene Ionen stoßen sich ab, ungleichnamige ziehen sich an. Die Kraft
      nimmt mit dem Quadrat des Abstands ab und wird in Lösungsmitteln mit hoher Dielektrizitätszahl
      wie Wasser stark abgeschwächt. Auf dieser Wechselwirkung beruhen der Zusammenhalt von
      Ionenkristallen, die Bindung von Ionen an geladene Oberflächen und die gegenseitige
      Abstoßung geladener Kolloidteilchen.
    example: >-
      Ionenaustauscher zur Wasserenthärtung, elektrostatische Stabilisierung von Dispersionen
      und Latexfarben, Flockung mit mehrwertigen Salzen in der Wasseraufbereitung, Ionenchromatographie
    conditions: >-
      Geladene Teilchen in geringem Abstand; in Lösungen reicht die Wirkung umso weiter, je
      geringer die Salzkonzentration ist.
    limits: >-
      Gelöste Gegenionen schirmen die Ladungen ab, so dass die Kraft in salzreichen Lösungen
      schon nach wenigen Nanometern abklingt.
    sideEffects: >-
      Eine Erhöhung der Salzkonzentration kann elektrostatisch stabilisierte Dispersionen
      ungewollt ausflocken lassen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Ionic attraction and repulsion
    description: >-
      Ions carry a net electric charge and therefore exert Coulomb forces on one another:
      ions of like charge repel, ions of opposite charge attract. The force falls off with
      the square of the distance and is strongly weakened in solvents with a high permittivity
      such as water. This interaction holds ionic crystals together, binds ions to charged
      surfaces and keeps charged colloidal particles apart.
    example: >-
      Ion exchangers for water softening, electrostatic stabilisation of dispersions and latex
      paints, flocculation with multivalent salts in water treatment, ion chromatography
    conditions: >-
      Charged species at short distance; in solutions the interaction reaches further the
      lower the salt concentration.
    limits: >-
      Dissolved counter-ions screen the charges, so in salty solutions the force dies away
      within a few nanometres.
    sideEffects: >-
      Raising the salt concentration can unintentionally flocculate electrostatically stabilised
      dispersions.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
