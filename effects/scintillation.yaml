text:
  de:
    name: Szintillation
    description: >-
      Durchquert ein ionisierendes Teilchen oder ein Gammaquant einen Szintillator, gibt es
      Energie an dessen Atome oder Moleküle ab, die sie als kurzen Lichtblitz wieder aussenden.
      Die Lichtmenge ist annähernd proportional zur abgegebenen Energie; ein Photomultiplier
      oder eine Photodiode wandelt jeden Blitz in einen elektrischen Puls, sodass sich Strahlung
      zählen und ihre Energie bestimmen lässt.
    example: >-
      Szintillationszähler und Gammaspektrometer mit Natriumiodid-Kristallen, PET- und SPECT-Kameras,
      Flüssigszintillationszählung von Tritium und Kohlenstoff-14, Detektoren in der Teilchenphysik
      und in Sicherheitsscannern
    conditions: >-
      Ein Szintillationsmaterial wie thalliumdotiertes Natriumiodid, Cäsiumiodid, BGO, LYSO,
      organische Kristalle, Kunststoffe oder Flüssigkeiten und ein Lichtdetektor.
    limits: >-
      Die Energieauflösung ist schlechter als bei Halbleiterdetektoren; manche Kristalle wie
      Natriumiodid sind hygroskopisch und müssen dicht gekapselt werden.
    sideEffects: >-
      Strahlenschäden und Nachleuchten können die Lichtausbeute mit der Zeit verringern.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Scintillation
    description: >-
      When an ionising particle or a gamma photon passes through a scintillator, it deposits
      energy in its atoms or molecules, which re-emit it as a short flash of light. The amount
      of light is roughly proportional to the deposited energy; a photomultiplier or photodiode
      converts each flash into an electrical pulse, so radiation can be counted and its energy
      determined.
    example: >-
      Scintillation counters and gamma spectrometers with sodium iodide crystals, PET and
      SPECT cameras, liquid scintillation counting of tritium and carbon-14, detectors in
      particle physics and security scanners
    conditions: >-
      A scintillation material such as thallium-doped sodium iodide, caesium iodide, BGO,
      LYSO, organic crystals, plastics or liquids, and a light detector.
    limits: >-
      Energy resolution is poorer than with semiconductor detectors; some crystals such as
      sodium iodide are hygroscopic and must be hermetically sealed.
    sideEffects: Radiation damage and afterglow can reduce the light yield over time.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
