text:
  de:
    name: Kaffeerand-Effekt
    description: >-
      Trocknet ein Tropfen, in dem Teilchen schweben, und bleibt sein Rand dabei am Untergrund
      haften, verdunstet am Rand mehr Flüssigkeit, als dort vorhanden ist. Eine nach außen
      gerichtete Strömung im Tropfen liefert ständig Flüssigkeit nach und trägt dabei die
      Teilchen mit, die sich am Rand als Ring ablagern. Zurück bleibt ein ringförmiger statt
      eines gleichmäßigen Rückstands.
    example: >-
      Kaffeeflecken, ungleichmäßige Schichten beim Tintenstrahldruck gedruckter Elektronik,
      papier- und tropfenbasierte Diagnostik, Größentrennung von Teilchen am Tropfenrand
    conditions: >-
      Ein haftender Tropfenrand (gepinnte Kontaktlinie) und Teilchen, die mit der Strömung
      mitwandern.
    limits: >-
      Marangoni-Strömungen oder länglich geformte Teilchen können den Effekt unterdrücken.
    sideEffects: >-
      Bei Beschichtungen und gedruckten Schichten führt er zu ungleichmäßiger Schichtdicke.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Coffee ring effect
    description: >-
      When a drop containing suspended particles dries while its edge stays pinned to the
      substrate, more liquid evaporates at the edge than is present there. An outward flow
      inside the drop continuously replenishes this liquid and carries the particles with
      it, which are deposited at the edge as a ring. What remains is a ring-shaped rather
      than a uniform residue.
    example: >-
      Coffee stains, uneven layers in inkjet-printed electronics, paper-based and drop-based
      diagnostics, size separation of particles at the drop edge
    conditions: A pinned drop edge (contact line) and particles that move with the flow.
    limits: Marangoni flows or elongated particles can suppress the effect.
    sideEffects: In coatings and printed layers it causes uneven layer thickness.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
