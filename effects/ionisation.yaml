text:
  de:
    name: Ionisation
    description: >-
      Bei der Ionisation wird einem Atom oder Molekül ein Elektron entrissen oder angelagert,
      so dass ein geladenes Ion entsteht. Die nötige Energie kann aus energiereicher Strahlung,
      Stößen schneller Teilchen, hoher Temperatur oder starken elektrischen Feldern stammen.
      Ein ionisiertes Gas enthält freie Ladungsträger und leitet dadurch elektrischen Strom,
      was sich zum Nachweis von Strahlung und zur Analyse von Stoffen nutzen lässt.
    example: >-
      Ionisationskammer und Geiger-Müller-Zählrohr, Ionisationsrauchmelder, Flammenionisationsdetektor,
      Massenspektrometer, Gasentladungslampen
    conditions: >-
      Die zugeführte Energie muss mindestens die Ionisierungsenergie des Teilchens erreichen,
      bei den meisten Atomen und Molekülen einige bis rund 25 Elektronenvolt.
    limits: >-
      In Gasen bei Atmosphärendruck rekombinieren Ionen und Elektronen rasch wieder, sobald
      die Energiezufuhr endet.
    sideEffects: >-
      Ionisierende Strahlung schädigt lebendes Gewebe; bei elektrischen Entladungen in Luft
      entstehen zudem Ozon und Stickoxide.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Ionisation
    description: >-
      Ionisation removes an electron from an atom or molecule, or attaches one to it, turning
      it into a charged ion. The energy required can come from high-energy radiation, collisions
      with fast particles, high temperature or strong electric fields. An ionised gas contains
      free charge carriers and conducts electric current, which is exploited to detect radiation
      and to analyse substances.
    example: >-
      Ionisation chamber and Geiger-Müller counter, ionisation smoke detector, flame ionisation
      detector, mass spectrometer, gas discharge lamps
    conditions: >-
      The energy supplied must reach at least the ionisation energy of the particle, a few
      up to about 25 electronvolts for most atoms and molecules.
    limits: >-
      In gases at atmospheric pressure, ions and electrons recombine quickly once the energy
      supply stops.
    sideEffects: >-
      Ionising radiation damages living tissue; electrical discharges in air also produce
      ozone and nitrogen oxides.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
