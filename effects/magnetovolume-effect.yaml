text:
  de:
    name: Magnetovolumeneffekt (Volumenmagnetostriktion)
    description: >-
      Wird ein ferromagnetischer Werkstoff magnetisiert, ändert sich nicht nur seine Form,
      sondern auch sein Volumen, weil die Austauschwechselwirkung zwischen den Atomen von
      deren Abstand abhängt. Umgekehrt verändert ein allseitiger Druck, der das Volumen ändert,
      die Magnetisierung (Nagaoka-Honda-Effekt). Die spontane Volumenmagnetostriktion kann
      die normale Wärmeausdehnung nahezu aufheben.
    example: >-
      Invar-Legierung (Eisen mit 36 % Nickel) mit nahezu verschwindender Wärmeausdehnung für
      Präzisionsinstrumente, Uhrpendel und Flüssigerdgas-Tanks
    conditions: >-
      Ein ferromagnetischer Werkstoff unterhalb seiner Curie-Temperatur sowie starke Felder
      oder hoher Druck für die erzwungene Volumenänderung.
    limits: >-
      Die feldinduzierte Volumenänderung ist sehr klein, und die Kompensation der Wärmeausdehnung
      gelingt nur in einem begrenzten Temperaturbereich unterhalb der Curie-Temperatur.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Magnetovolume effect (volume magnetostriction)
    description: >-
      When a ferromagnetic material is magnetised, not only its shape but also its volume
      changes, because the exchange interaction between the atoms depends on their spacing.
      Conversely, hydrostatic pressure that changes the volume alters the magnetisation (Nagaoka-Honda
      effect). The spontaneous volume magnetostriction can almost cancel normal thermal expansion.
    example: >-
      Invar alloy (iron with 36 % nickel) with almost zero thermal expansion for precision
      instruments, clock pendulums and liquefied natural gas tanks
    conditions: >-
      A ferromagnetic material below its Curie temperature, and strong fields or high pressure
      for the forced volume change.
    limits: >-
      The field-induced volume change is very small, and the compensation of thermal expansion
      only works in a limited temperature range below the Curie temperature.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
