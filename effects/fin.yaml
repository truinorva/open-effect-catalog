text:
  de:
    name: Finne (Flosse, Rippe)
    description: >-
      Eine Finne ist ein dünnes, flächiges Bauteil, das aus einem Körper herausragt. In einer
      Strömung erzeugt sie Querkräfte, die einen Körper auf Kurs halten, ihn lenken oder –
      als bewegte Flosse – antreiben, wie bei Fischen, Pfeilen, Raketen oder Surfbrettern.
      Als Kühlrippe vergrößert sie die Oberfläche eines Körpers und damit den Wärmeübergang
      an das umgebende Fluid.
    example: >-
      Leitwerk von Raketen und Pfeilen, Surfbrett- und Kielfinnen, Schwimmflossen, Kühlrippen
      an Motoren und Kühlkörpern
    conditions: >-
      Strömung relativ zur Finne; bei Kühlrippen ein gut wärmeleitender Werkstoff.
    limits: >-
      Lange, dünne Kühlrippen werden zur Spitze hin kälter und tragen dort kaum noch zur Wärmeabgabe
      bei.
    sideEffects: Finnen erhöhen den Strömungswiderstand.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Fin
    description: >-
      A fin is a thin, flat element that projects from a body. In a flow it generates lateral
      forces that keep a body on course, steer it or – as a moving fin – propel it, as in
      fish, arrows, rockets or surfboards. As a cooling fin, it enlarges the surface of a
      body and thus the heat transfer to the surrounding fluid.
    example: >-
      Tail fins of rockets and arrows, surfboard and keel fins, swim fins, cooling fins on
      engines and heat sinks
    conditions: >-
      Flow relative to the fin; for cooling fins, a material of good thermal conductivity.
    limits: >-
      Long, thin cooling fins become cooler towards the tip and contribute little to heat
      transfer there.
    sideEffects: Fins increase drag.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
