text:
  de:
    name: Laser-Oberflächengeschwindigkeitsmesser (LSV)
    description: >-
      Ein Laser-Oberflächengeschwindigkeitsmesser beleuchtet eine bewegte Oberfläche nach
      dem Laser-Doppler-Prinzip mit zwei sich kreuzenden Laserstrahlen und wertet das von
      ihr gestreute Licht aus. Läuft die Mikrostruktur der Oberfläche durch das Streifenmuster,
      moduliert sie das Streulicht mit einer Frequenz, die proportional zur Geschwindigkeit
      ist. Durch Aufsummieren der Geschwindigkeit über die Zeit ergibt sich zugleich die durchgelaufene
      Länge, ohne Messrad und ohne Schlupf.
    example: >-
      Längen- und Geschwindigkeitsmessung an Walzband, Draht, Kabeln, Papier- und Folienbahnen,
      Schnittlängensteuerung beim Ablängen, Regelung von Walzprozessen
    conditions: >-
      Sichtverbindung zu einer lichtstreuenden Oberfläche und ein weitgehend konstanter Arbeitsabstand.
    limits: >-
      Stark spiegelnde oder sehr dunkle Oberflächen sowie Dampf und Wasser im Strahlweg verschlechtern
      das Signal.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Laser surface velocimeter
    description: >-
      A laser surface velocimeter illuminates a moving surface with two crossing laser beams
      following the laser Doppler principle and evaluates the light it scatters. As the surface
      microstructure passes through the fringe pattern, it modulates the scattered light at
      a frequency proportional to the speed. Integrating the speed over time also yields the
      length that has passed, without a measuring wheel and without slip.
    example: >-
      Length and speed measurement on rolled strip, wire, cables, paper and film webs, cut-to-length
      control, control of rolling processes
    conditions: >-
      Line of sight to a light-scattering surface and a largely constant working distance.
    limits: >-
      Highly reflective or very dark surfaces and steam or water in the beam path degrade
      the signal.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
