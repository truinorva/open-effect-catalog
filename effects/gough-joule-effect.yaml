text:
  de:
    name: Gough-Joule-Effekt (Entropieelastizität von Gummi)
    description: >-
      Die Rückstellkraft von Gummi beruht vor allem auf Entropie: Beim Dehnen werden die verknäuelten
      Polymerketten gestreckt und geordnet, und ihre Entropie sinkt. Schnell gedehnter Gummi
      erwärmt sich deshalb, schnell entspannter kühlt ab, und ein gespanntes Gummiband zieht
      sich beim Erwärmen zusammen, statt sich auszudehnen.
    example: >-
      Spürbare Erwärmung eines gedehnten Gummibands an den Lippen, Gummiband-Wärmekraftmaschinen
      in Demonstrationsversuchen, Forschung zur elastokalorischen Kühlung mit Naturkautschuk
    conditions: >-
      Ein vernetztes Elastomer oberhalb seiner Glasübergangstemperatur; für die thermischen
      Effekte schnelles, nahezu adiabatisches Dehnen oder Entspannen.
    limits: >-
      Die Temperaturänderungen betragen nur wenige Kelvin; bei sehr großen Dehnungen kann
      Dehnungskristallisation zusätzlich Wärme freisetzen.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Gough–Joule effect (rubber elasticity)
    description: >-
      The restoring force of rubber is mainly entropic: stretching straightens and orders
      the coiled polymer chains, and their entropy decreases. Rubber therefore warms up when
      stretched quickly and cools when released quickly, and a stretched rubber band contracts
      rather than expands when heated.
    example: >-
      Noticeable warming of a stretched rubber band held to the lips, rubber-band heat engines
      in demonstrations, research on elastocaloric cooling with natural rubber
    conditions: >-
      A crosslinked elastomer above its glass transition temperature; for the thermal effects,
      fast, nearly adiabatic stretching or release.
    limits: >-
      Temperature changes amount to only a few kelvin; at very large strains, strain-induced
      crystallisation can release additional heat.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
