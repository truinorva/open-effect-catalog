text:
  de:
    name: Ouzo-Effekt (Louche-Effekt)
    description: >-
      Ein öliger Stoff wie Anethol, der in einem mit Wasser mischbaren Lösungsmittel wie Ethanol
      gelöst ist, wird bei Zugabe von Wasser schlagartig unlöslich. Er scheidet sich dabei
      von selbst in sehr kleinen, gleichmäßigen Tröpfchen von etwa einem Mikrometer ab, und
      die Flüssigkeit wird milchig trüb. Die entstandene Emulsion bleibt ohne Tensid und ohne
      Rühren erstaunlich lange stabil.
    example: >-
      Trübung von Ouzo, Pastis und Absinth mit Wasser, Herstellung von Polymer-Nanopartikeln
      durch Lösungsmittelverdrängung, Wirkstoffträger, Pseudolatices
    conditions: >-
      Ein hydrophober Stoff, gelöst in einem wassermischbaren Lösungsmittel, und eine Zusammensetzung,
      in der das Gemisch übersättigt, aber noch nicht grob entmischt ist.
    limits: >-
      Nur bei geringem Anteil des öligen Stoffs entsteht die feine, stabile Emulsion; bei
      höheren Anteilen bilden sich größere Tropfen, die aufrahmen.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Ouzo effect (louche effect)
    description: >-
      An oily substance such as anethole, dissolved in a water-miscible solvent such as ethanol,
      suddenly becomes insoluble when water is added. It separates spontaneously into very
      small, uniform droplets of about one micrometre, and the liquid turns milky. The resulting
      emulsion stays remarkably stable for a long time without surfactant or stirring.
    example: >-
      Clouding of ouzo, pastis and absinthe with water, production of polymer nanoparticles
      by solvent shifting, drug carriers, pseudolatexes
    conditions: >-
      A hydrophobic substance dissolved in a water-miscible solvent and a composition in which
      the mixture is supersaturated but not yet coarsely separated.
    limits: >-
      The fine, stable emulsion forms only at low fractions of the oily substance; at higher
      fractions larger drops form and cream.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
