text:
  de:
    name: Faraday-Wellen
    description: >-
      Wird ein Gefäß mit Flüssigkeit senkrecht in Schwingung versetzt, bilden sich oberhalb
      einer kritischen Beschleunigung auf der Oberfläche stehende Wellen, die mit der halben
      Anregungsfrequenz schwingen. Ursache ist eine parametrische Resonanz: Die periodisch
      veränderte effektive Schwerkraft facht Oberflächenwellen passender Wellenlänge an, die
      sich zu regelmäßigen Mustern wie Streifen, Quadraten oder Sechsecken ordnen. Bei sehr
      starker Anregung reißen von den Wellenkämmen Tropfen ab.
    example: >-
      Ultraschallvernebler, Anordnen von Mikropartikeln und Zellen in Mustern, Untersuchung
      nichtlinearer Musterbildung
    conditions: >-
      Senkrechte Schwingung mit einer Beschleunigung oberhalb eines Schwellwerts, der von
      Frequenz, Viskosität und Oberflächenspannung abhängt.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Faraday waves
    description: >-
      When a container of liquid is vibrated vertically, standing waves form on the surface
      above a critical acceleration, oscillating at half the driving frequency. The cause
      is parametric resonance: the periodically modulated effective gravity amplifies surface
      waves of suitable wavelength, which arrange themselves into regular patterns such as
      stripes, squares or hexagons. Under very strong excitation, droplets break off from
      the wave crests.
    example: >-
      Ultrasonic nebulisers, arranging microparticles and cells in patterns, studies of nonlinear
      pattern formation
    conditions: >-
      Vertical vibration with an acceleration above a threshold that depends on frequency,
      viscosity and surface tension.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
