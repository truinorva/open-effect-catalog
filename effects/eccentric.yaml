text:
  de:
    name: Exzenter
    description: >-
      Ein Exzenter ist eine Scheibe oder ein Zapfen, dessen Mittelpunkt gegenüber der Drehachse
      versetzt ist. Dreht sich die Welle, beschreibt er eine Kreisbahn, die eine Stange oder
      ein Ring in eine hin- und hergehende Bewegung mit dem doppelten Versatz als Hub umsetzt,
      und eine unwuchtige Exzentermasse erzeugt Vibrationen. Gegen einen Anschlag gedreht,
      wirkt ein Exzenter als selbsthemmende Klemme.
    example: >-
      Ventilsteuerung von Dampfmaschinen, Exzenterpressen, Exzenterschleifer, Vibrationsmotoren
      in Mobiltelefonen und Rüttlern, Exzenterspanner, Schnellspanner am Fahrrad
    conditions: >-
      Eine gelagerte, angetriebene Welle und für Klemmungen ein im Verhältnis zur Reibung
      kleiner Versatz.
    limits: >-
      Der Hub ist durch den Versatz fest vorgegeben, und bei hohen Drehzahlen entstehen große
      Unwuchtkräfte.
    sideEffects: Vibrationen und Lagerbelastung durch Unwucht.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Eccentric
    description: >-
      An eccentric is a disc or pin whose centre is offset from the axis of rotation. When
      the shaft turns, it describes a circular path that a rod or strap converts into a reciprocating
      motion with a stroke of twice the offset, and an unbalanced eccentric mass generates
      vibrations. Turned against a stop, an eccentric acts as a self-locking clamp.
    example: >-
      Valve gear of steam engines, eccentric presses, random orbital sanders, vibration motors
      in mobile phones and compactors, eccentric clamps, bicycle quick-release levers
    conditions: >-
      A driven shaft running in bearings and, for clamps, an offset that is small relative
      to friction.
    limits: >-
      The stroke is fixed by the offset, and large unbalance forces arise at high speeds.
    sideEffects: Vibrations and bearing loads due to unbalance.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
