text:
  de:
    name: Thermosäule
    description: >-
      Eine Thermosäule schaltet viele Thermoelemente in Reihe, deren warme Kontaktstellen
      gemeinsam auf einer Seite und deren kalte auf der anderen liegen. Die Einzelspannungen
      addieren sich, sodass schon kleine Temperaturunterschiede eine gut messbare Spannung
      liefern. Auf einer geschwärzten Membran misst sie so die Leistung auftreffender Wärmestrahlung;
      in größerer Bauform liefert sie Strom aus Wärme.
    example: >-
      Infrarot-Thermometer, NDIR-Gassensoren für CO2, Pyranometer zur Messung der Sonneneinstrahlung,
      Wärmestromsensoren, ohne Netzstrom arbeitende Gasventile in Heizgeräten
    conditions: Temperaturunterschied zwischen den beiden Kontaktseiten.
    limits: >-
      Die Ausgangsspannung bleibt klein, und der Wirkungsgrad als Generator ist gering.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Thermopile
    description: >-
      A thermopile connects many thermocouples in series, with all hot junctions on one side
      and all cold junctions on the other. Their voltages add up, so even small temperature
      differences give a readily measurable voltage. On a blackened membrane it thus measures
      the power of incident thermal radiation; in larger designs it supplies electricity from
      heat.
    example: >-
      Infrared thermometers, NDIR gas sensors for CO2, pyranometers for measuring solar irradiance,
      heat flux sensors, gas valves in heaters that work without mains power
    conditions: Temperature difference between the two junction sides.
    limits: >-
      The output voltage remains small, and the efficiency as a generator is low.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
