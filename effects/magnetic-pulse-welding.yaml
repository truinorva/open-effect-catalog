text:
  de:
    name: Magnetpulsschweißen
    description: >-
      Beim Magnetpulsschweißen entlädt sich ein Kondensatorspeicher innerhalb von Mikrosekunden
      über eine Spule, die ein Werkstück wie ein Rohr umschließt. Das schnell ansteigende
      Magnetfeld induziert im Werkstück starke Wirbelströme, deren Lorentzkraft es mit mehreren
      hundert Metern pro Sekunde gegen ein zweites Teil schleudert. Beim Aufprall verbinden
      sich die Oberflächen ähnlich wie beim Sprengschweißen metallurgisch, ohne dass die Teile
      aufschmelzen.
    example: >-
      Verbinden von Aluminium- mit Stahl- oder Kupferrohren, Klima- und Kraftstoffleitungen
      in Fahrzeugen, Crimpen von Kabelschuhen, Antriebswellen
    conditions: >-
      Mindestens ein elektrisch gut leitendes Fügeteil, etwa aus Aluminium oder Kupfer, und
      ein definierter Abstand zwischen den Teilen, damit sie ausreichend beschleunigt werden.
    limits: >-
      Die Geometrie ist weitgehend auf rohr- oder blechförmige Teile beschränkt, und die Spulen
      unterliegen hoher mechanischer Belastung und Verschleiß.
    sideEffects: >-
      Der Aufprall erzeugt einen lauten Knall und hohe Kräfte auf Spule und Werkzeug.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Magnetic pulse welding
    description: >-
      In magnetic pulse welding, a capacitor bank discharges within microseconds through a
      coil surrounding a workpiece such as a tube. The rapidly rising magnetic field induces
      strong eddy currents in the workpiece, whose Lorentz force hurls it at several hundred
      metres per second against a second part. On impact the surfaces bond metallurgically,
      much as in explosive welding, without the parts melting.
    example: >-
      Joining aluminium to steel or copper tubes, air-conditioning and fuel lines in vehicles,
      crimping cable lugs, drive shafts
    conditions: >-
      At least one joining partner with good electrical conductivity, such as aluminium or
      copper, and a defined gap between the parts so that they are accelerated sufficiently.
    limits: >-
      The geometry is largely limited to tubular or sheet parts, and the coils are subject
      to high mechanical stress and wear.
    sideEffects: The impact produces a loud bang and high forces on coil and tooling.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
