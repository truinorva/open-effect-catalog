text:
  de:
    name: Maser
    description: >-
      Ein Maser arbeitet nach demselben Prinzip wie ein Laser, verstärkt aber Mikrowellen
      statt Licht: In einem Medium mit Besetzungsinversion, etwa Ammoniakmolekülen, Wasserstoffatomen
      oder einem gekühlten Rubinkristall, löst einfallende Strahlung stimulierte Emission
      gleicher Frequenz aus. Ein Hohlraumresonator koppelt die Strahlung immer wieder zurück,
      so dass eine äußerst frequenzstabile, kohärente Schwingung oder eine sehr rauscharme
      Verstärkung entsteht.
    example: >-
      Wasserstoffmaser als Frequenznormal in Atomuhren und Radioteleskop-Netzwerken, rauscharme
      Empfangsverstärker für Radioastronomie und Weltraumkommunikation, natürliche Maser in
      interstellaren Gaswolken
    conditions: >-
      Besetzungsinversion zwischen zwei Energieniveaus mit passendem Abstand und ein Resonator
      für die Mikrowellenfrequenz; Festkörpermaser benötigen tiefe Temperaturen.
    limits: >-
      Die abgegebene Leistung ist sehr klein und die Geräte sind aufwendig, so dass sie heute
      vor allem in Spezialanwendungen eingesetzt werden.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Maser
    description: >-
      A maser works on the same principle as a laser but amplifies microwaves instead of light:
      in a medium with population inversion, such as ammonia molecules, hydrogen atoms or
      a cooled ruby crystal, incoming radiation triggers stimulated emission at the same frequency.
      A cavity resonator feeds the radiation back again and again, producing an extremely
      frequency-stable coherent oscillation or very low-noise amplification.
    example: >-
      Hydrogen masers as frequency standards in atomic clocks and radio-telescope networks,
      low-noise receiver amplifiers for radio astronomy and deep-space communication, natural
      masers in interstellar gas clouds
    conditions: >-
      Population inversion between two energy levels with suitable spacing and a resonator
      for the microwave frequency; solid-state masers need low temperatures.
    limits: >-
      The output power is very small and the devices are complex, so today they are used mainly
      in specialised applications.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
