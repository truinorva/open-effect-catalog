text:
  de:
    name: Siedeverzug (Überhitzung)
    description: >-
      Eine Flüssigkeit lässt sich über ihren Siedepunkt erhitzen, ohne zu sieden, wenn keine
      Keime vorhanden sind, an denen sich Dampfblasen bilden können, etwa Gasbläschen, Kratzer
      oder Partikel. Eine neu entstehende Blase muss sehr klein beginnen und gegen die Oberflächenspannung
      anwachsen, wofür eine Überhitzung nötig ist. Wird der metastabile Zustand gestört, verdampft
      schlagartig ein großer Teil der Flüssigkeit.
    example: >-
      Blasenkammer zum Sichtbarmachen von Teilchenspuren, Blasendetektoren für die Neutronendosimetrie;
      als Gefahr beim Erhitzen von Wasser in der Mikrowelle
    conditions: >-
      Saubere, glatte Gefäße ohne Keime, entgaste Flüssigkeit und ruhiges, gleichmäßiges Erhitzen.
    limits: >-
      Wie weit sich eine Flüssigkeit überhitzen lässt, ist durch spontane Blasenbildung in
      ihrem Inneren begrenzt.
    sideEffects: >-
      Schlagartiges Aufsieden kann heiße Flüssigkeit herausschleudern; Siedesteine oder Rühren
      verhindern das.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Superheating
    description: >-
      A liquid can be heated above its boiling point without boiling if there are no nuclei
      on which vapour bubbles can form, such as gas pockets, scratches or particles. A newly
      forming bubble must start very small and grow against surface tension, which requires
      superheating. If the metastable state is disturbed, a large part of the liquid flashes
      to vapour abruptly.
    example: >-
      Bubble chambers for visualising particle tracks, bubble detectors for neutron dosimetry;
      as a hazard when heating water in a microwave oven
    conditions: >-
      Clean, smooth vessels without nuclei, degassed liquid and calm, even heating.
    limits: >-
      How far a liquid can be superheated is limited by spontaneous bubble formation within
      it.
    sideEffects: >-
      Sudden eruptive boiling can eject hot liquid; boiling chips or stirring prevent it.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
