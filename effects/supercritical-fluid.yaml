text:
  de:
    name: Überkritisches Fluid
    description: >-
      Oberhalb seiner kritischen Temperatur und seines kritischen Drucks verschwindet bei
      einem Stoff der Unterschied zwischen Flüssigkeit und Gas. Das überkritische Fluid ist
      ähnlich dicht wie eine Flüssigkeit und kann daher viele Stoffe lösen, hat aber die geringe
      Zähigkeit und hohe Diffusionsfähigkeit eines Gases und keine Oberflächenspannung. Schon
      kleine Änderungen von Druck oder Temperatur verändern seine Dichte und damit sein Lösevermögen
      stark, so dass gelöste Stoffe gezielt aufgenommen und wieder abgegeben werden können.
    example: >-
      Entkoffeinierung mit überkritischem CO2, wasserfreies Färben und Reinigen von Textilien,
      überkritische Nassoxidation von Abwasser, überkritische Chromatographie, Partikelerzeugung
      durch schnelle Entspannung
    conditions: >-
      Druck und Temperatur oberhalb des kritischen Punkts, bei CO2 etwa 31 °C und 74 bar,
      bei Wasser etwa 374 °C und 221 bar.
    limits: >-
      Überkritisches CO2 löst vor allem unpolare Stoffe; für polare Stoffe werden Zusatzlösungsmittel
      benötigt.
    sideEffects: >-
      Hochdruckanlagen sind teuer, und überkritisches Wasser ist sehr korrosiv.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Supercritical fluid
    description: >-
      Above its critical temperature and critical pressure, the distinction between liquid
      and gas disappears for a substance. The supercritical fluid has a liquid-like density
      and can therefore dissolve many substances, yet it has the low viscosity and high diffusivity
      of a gas and no surface tension. Even small changes in pressure or temperature strongly
      alter its density and hence its solvent power, so dissolved substances can be taken
      up and released in a controlled way.
    example: >-
      Decaffeination with supercritical CO2, waterless textile dyeing and cleaning, supercritical
      water oxidation of wastewater, supercritical fluid chromatography, particle formation
      by rapid expansion
    conditions: >-
      Pressure and temperature above the critical point: about 31 °C and 74 bar for CO2, about
      374 °C and 221 bar for water.
    limits: >-
      Supercritical CO2 dissolves mainly non-polar substances; polar substances require co-solvents.
    sideEffects: >-
      High-pressure plants are expensive, and supercritical water is highly corrosive.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
