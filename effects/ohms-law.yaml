text:
  de:
    name: Ohmsches Gesetz
    description: >-
      In vielen Leitern ist der elektrische Strom proportional zur angelegten Spannung; das
      Verhältnis beider ist der elektrische Widerstand, der von Werkstoff, Länge, Querschnitt
      und Temperatur abhängt. Mit einem bekannten Widerstand lässt sich deshalb aus einer
      gemessenen Spannung der Strom bestimmen und umgekehrt. Vorwiderstände, Spannungsteiler
      und Messwiderstände nutzen diesen Zusammenhang, um Ströme zu begrenzen, Spannungen aufzuteilen
      oder Ströme zu messen.
    example: >-
      Strommessung über Shunt-Widerstände, Vorwiderstand für Leuchtdioden, Spannungsteiler,
      Widerstandsmessung, Heizwiderstände
    conditions: >-
      Gleichbleibende Temperatur und ein Leiter mit linearer Kennlinie, etwa ein Metall.
    limits: >-
      Für Dioden, Gasentladungen, Elektrolyte oder Halbleiter gilt der lineare Zusammenhang
      nicht oder nur abschnittsweise.
    sideEffects: >-
      Der Strom erzeugt im Widerstand Joulesche Wärme, die den Widerstandswert selbst verändern
      kann.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Ohm's law
    description: >-
      In many conductors the electric current is proportional to the applied voltage; their
      ratio is the electrical resistance, which depends on material, length, cross-section
      and temperature. With a known resistance, the current can therefore be found from a
      measured voltage and vice versa. Series resistors, voltage dividers and shunts use this
      relationship to limit currents, divide voltages or measure currents.
    example: >-
      Current measurement with shunt resistors, series resistor for LEDs, voltage dividers,
      resistance measurement, heating resistors
    conditions: >-
      Constant temperature and a conductor with a linear characteristic, such as a metal.
    limits: >-
      For diodes, gas discharges, electrolytes or semiconductors the linear relationship does
      not hold, or only in sections.
    sideEffects: >-
      The current produces Joule heat in the resistor, which can itself change the resistance.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
