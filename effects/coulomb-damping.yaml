text:
  de:
    name: Coulomb-Dämpfung (Reibungsdämpfung)
    description: >-
      Bei der Coulomb-Dämpfung entzieht trockene Gleitreibung einem schwingenden System Energie.
      Die Reibkraft ist nahezu unabhängig von der Geschwindigkeit und wirkt stets gegen die
      Bewegungsrichtung, deshalb nimmt die Amplitude mit jeder Schwingung um den gleichen
      Betrag ab – linear statt exponentiell wie bei viskoser Dämpfung. Die Schwingung endet
      nach endlich vielen Perioden, sobald die Rückstellkraft die Haftreibung nicht mehr überwindet.
    example: >-
      Reibungsdämpfer in Waschmaschinen, Blattfedern von Lastwagen, Reibungsdämpfer in Gebäuden
      gegen Erdbeben, Unterplattformdämpfer an Turbinenschaufeln
    conditions: Zwei Flächen, die unter einer Normalkraft aufeinander gleiten.
    limits: >-
      Kleine Schwingungen unterhalb der Haftreibungsgrenze werden nicht gedämpft, und der
      Körper bleibt oft außerhalb seiner Ruhelage stehen.
    sideEffects: Verschleiß und Erwärmung der Reibflächen sowie Stick-Slip-Geräusche.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Coulomb damping
    description: >-
      In Coulomb damping, dry sliding friction removes energy from an oscillating system.
      The friction force is almost independent of speed and always opposes the direction of
      motion, so the amplitude decreases by the same amount with every cycle – linearly rather
      than exponentially as with viscous damping. The oscillation ends after a finite number
      of cycles as soon as the restoring force can no longer overcome static friction.
    example: >-
      Friction dampers in washing machines, leaf springs on trucks, friction dampers in buildings
      against earthquakes, under-platform dampers on turbine blades
    conditions: Two surfaces sliding against each other under a normal force.
    limits: >-
      Small vibrations below the static friction threshold are not damped, and the body often
      comes to rest away from its equilibrium position.
    sideEffects: Wear and heating of the friction surfaces, and stick-slip noise.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
