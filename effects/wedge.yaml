text:
  de:
    name: Keil
    description: >-
      Ein Keil setzt eine Kraft entlang seiner Längsrichtung in viel größere Kräfte senkrecht
      zu seinen Flanken um. Je schlanker der Keil, desto größer die Kraftverstärkung, desto
      länger aber auch der Weg, um den er eingetrieben werden muss. Bei kleinem Keilwinkel
      hält ihn die Reibung an den Flanken von selbst fest (Selbsthemmung).
    example: >-
      Axt, Meißel und Messer, Spaltkeil, Türkeil, Unterlegkeile, Keil- und Kegelverbindungen,
      Keilriemen
    conditions: ''
    limits: >-
      Ein großer Teil der Eintreibkraft geht durch Reibung an den Flanken verloren.
    sideEffects: Die hohen Querkräfte können Bauteile ungewollt spalten oder aufweiten.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Wedge
    description: >-
      A wedge converts a force along its length into much larger forces perpendicular to its
      faces. The slimmer the wedge, the greater the force amplification, but also the longer
      the distance over which it must be driven in. With a small wedge angle, friction on
      the faces holds it in place by itself (self-locking).
    example: >-
      Axe, chisel and knife, splitting wedge, door wedge, shims, cotter and taper joints,
      V-belts
    conditions: ''
    limits: A large part of the driving force is lost to friction on the faces.
    sideEffects: >-
      The high transverse forces can unintentionally split or spread components.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
