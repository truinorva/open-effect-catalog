text:
  de:
    name: Glimmentladung
    description: >-
      Bei niedrigem Gasdruck und einer Spannung von einigen hundert Volt zündet zwischen zwei
      Elektroden eine selbständige Entladung mit geringer Stromdichte. Ionen, die auf die
      Kathode prallen, schlagen Sekundärelektronen heraus, die wiederum Gasatome ionisieren
      und anregen; die angeregten Atome leuchten in einer für das Gas typischen Farbe, und
      die auftreffenden Ionen tragen Kathodenmaterial ab.
    example: >-
      Glimmlampe, Neonröhre, Kathodenzerstäubung (Sputtern), Glimmentladungsspektroskopie,
      Plasmanitrieren
    conditions: Verdünntes Gas (Unterdruck) und ein strombegrenzender Vorwiderstand.
    limits: >-
      Steigt der Strom zu stark, geht die Glimmentladung in eine Bogenentladung über.
    sideEffects: >-
      Die Kathode wird durch Zerstäubung abgetragen, und das abgestäubte Material schlägt
      sich auf den Wänden nieder.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Glow discharge
    description: >-
      At low gas pressure and a voltage of a few hundred volts, a self-sustaining discharge
      with low current density ignites between two electrodes. Ions striking the cathode knock
      out secondary electrons, which in turn ionise and excite gas atoms; the excited atoms
      glow in a colour characteristic of the gas, and the impinging ions erode cathode material.
    example: >-
      Glow lamp, neon tube, sputter deposition, glow discharge spectroscopy, plasma nitriding
    conditions: Rarefied gas (low pressure) and a current-limiting series resistor.
    limits: >-
      If the current rises too far, the glow discharge turns into an arc discharge.
    sideEffects: >-
      The cathode is eroded by sputtering, and the sputtered material deposits on the walls.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
