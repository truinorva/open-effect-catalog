text:
  de:
    name: Kondensator
    description: >-
      Ein Kondensator besteht aus zwei leitenden Elektroden, die durch ein Dielektrikum getrennt
      sind, und speichert elektrische Energie im Feld zwischen ihnen. Er lädt sich auf, wenn
      Spannung anliegt, und kann die Ladung bei Bedarf sehr schnell wieder abgeben. Da er
      Gleichstrom sperrt, Wechselstrom aber umso besser durchlässt, je höher die Frequenz
      ist, dient er auch zum Glätten und Filtern von Spannungen.
    example: >-
      Glättung in Netzteilen, Fotoblitz und Defibrillator (Pulsentladung), Frequenzfilter
      und Schwingkreise, Kopplung von Signalen, Superkondensatoren als Kurzzeitspeicher, Motoranlauf
    conditions: >-
      Ein isolierendes Dielektrikum zwischen den Elektroden; Betrieb unterhalb der Durchschlagspannung.
    limits: >-
      Die Energiedichte ist deutlich kleiner als bei Batterien; zu hohe Spannung führt zum
      Durchschlag.
    sideEffects: >-
      Geladene Kondensatoren können noch lange nach dem Abschalten gefährliche Spannungen
      halten; Elektrolytkondensatoren altern und trocknen aus.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Capacitor
    description: >-
      A capacitor consists of two conducting electrodes separated by a dielectric and stores
      electrical energy in the field between them. It charges when a voltage is applied and
      can release the charge again very quickly when needed. Because it blocks direct current
      but passes alternating current all the better the higher the frequency, it is also used
      to smooth and filter voltages.
    example: >-
      Smoothing in power supplies, camera flash and defibrillator (pulse discharge), frequency
      filters and resonant circuits, signal coupling, supercapacitors as short-term storage,
      motor starting
    conditions: >-
      An insulating dielectric between the electrodes; operation below the breakdown voltage.
    limits: >-
      Energy density is much lower than that of batteries; excessive voltage causes breakdown.
    sideEffects: >-
      Charged capacitors can hold dangerous voltages long after switch-off; electrolytic capacitors
      age and dry out.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
