text:
  de:
    name: Phononischer Kristall
    description: >-
      Ein phononischer Kristall ist ein Werkstoff oder Bauteil, dessen Dichte und Steifigkeit
      sich periodisch ändern, etwa durch Einschlüsse oder Löcher in regelmäßigem Raster. Schall-
      und Schwingungswellen, deren Wellenlänge zum Gitterabstand passt, werden an der Struktur
      so oft gestreut, dass sie sich gegenseitig auslöschen; in diesem Frequenzband, der Bandlücke,
      können sie sich nicht ausbreiten. Gezielte Fehlstellen im Gitter können Wellen dagegen
      einfangen und entlang einer Bahn leiten.
    example: >-
      Schwingungsisolierende Strukturen, akustische Filter und Wellenleiter in Hochfrequenzbauteilen,
      Lärmschutz aus regelmäßig angeordneten Zylindern (Versuchsstadium)
    conditions: >-
      Ein Gitterabstand in der Größenordnung der Wellenlänge und ein hoher Kontrast der akustischen
      Eigenschaften zwischen den Bestandteilen.
    limits: >-
      Die Sperrwirkung ist auf bestimmte Frequenzbänder begrenzt, und für tiefe Frequenzen
      werden die Strukturen sehr groß.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Phononic crystal
    description: >-
      A phononic crystal is a material or component whose density and stiffness vary periodically,
      for example through inclusions or holes in a regular grid. Sound and vibration waves
      whose wavelength matches the lattice spacing are scattered so often that they cancel
      each other; in this frequency band, the band gap, they cannot propagate. Deliberate
      defects in the lattice, on the other hand, can trap waves and guide them along a path.
    example: >-
      Vibration-isolating structures, acoustic filters and waveguides in radio-frequency components,
      noise barriers made of regularly spaced cylinders (experimental)
    conditions: >-
      A lattice spacing of the order of the wavelength and a strong contrast in acoustic properties
      between the constituents.
    limits: >-
      The blocking effect is confined to certain frequency bands, and for low frequencies
      the structures become very large.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
