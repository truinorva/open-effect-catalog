text:
  de:
    name: Differentialwinde (Chinesische Winde)
    description: >-
      Bei der Differentialwinde sitzen auf einer gemeinsamen, mit einer Kurbel gedrehten Welle
      zwei Trommeln mit leicht unterschiedlichem Durchmesser. Das Seil wickelt sich auf die
      eine Trommel auf und von der anderen ab, dazwischen hängt die Last an einer losen Rolle.
      Je Kurbelumdrehung hebt sich die Last nur um die halbe Differenz der beiden Trommelumfänge,
      was eine sehr große Kraftübersetzung ergibt.
    example: >-
      Historische Hebezeuge, Differential-Kettenzüge nach demselben Prinzip, Demonstrationsmodelle
      im Physikunterricht
    conditions: >-
      Zwei fest verbundene Trommeln mit geringem Durchmesserunterschied und eine lose Rolle.
    limits: >-
      Eine große Übersetzung bedeutet viel Seil und viele Kurbelumdrehungen für geringe Hubhöhen.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Differential windlass
    description: >-
      In a differential windlass two drums of slightly different diameter sit on a common
      shaft turned by a crank. The rope winds onto one drum and off the other, with the load
      hanging from a movable pulley in between. Each turn of the crank lifts the load by only
      half the difference between the two drum circumferences, which gives a very large mechanical
      advantage.
    example: >-
      Historical hoists, differential chain hoists working on the same principle, demonstration
      models in physics teaching
    conditions: >-
      Two rigidly connected drums with a small difference in diameter and a movable pulley.
    limits: >-
      A large mechanical advantage means a lot of rope and many turns of the crank for small
      lifting heights.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
