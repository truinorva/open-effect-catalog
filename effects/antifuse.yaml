text:
  de:
    name: Antifuse
    description: >-
      Eine Antifuse ist eine Verbindungsstelle, die im Ausgangszustand nicht leitet, weil
      zwei Leiter durch eine sehr dünne Isolierschicht getrennt sind. Legt man eine Programmierspannung
      an, bricht die Schicht durch, und es bildet sich ein dauerhafter, niederohmiger Leitungspfad,
      also das Gegenteil einer Schmelzsicherung, die eine Verbindung trennt.
    example: >-
      Einmal programmierbare Logikbausteine (FPGAs) und Festwertspeicher, Ablegen von Kalibrierwerten
      und Seriennummern in Chips, strahlungsfeste Logik für die Raumfahrt
    conditions: >-
      Eine definierte Programmierspannung oberhalb der Durchbruchspannung der Isolierschicht.
    limits: >-
      Die Programmierung ist nicht umkehrbar, ein Fehler lässt sich also nicht korrigieren.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Antifuse
    description: >-
      An antifuse is a link that does not conduct in its initial state because two conductors
      are separated by a very thin insulating layer. Applying a programming voltage breaks
      down the layer and forms a permanent, low-resistance conductive path, the opposite of
      a fuse, which breaks a connection.
    example: >-
      One-time programmable logic devices (FPGAs) and read-only memories, storing calibration
      values and serial numbers in chips, radiation-hardened logic for space
    conditions: >-
      A defined programming voltage above the breakdown voltage of the insulating layer.
    limits: Programming cannot be reversed, so a mistake cannot be corrected.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
