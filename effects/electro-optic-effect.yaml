text:
  de:
    name: Elektrooptischer Effekt (Pockels- und Kerr-Effekt)
    description: >-
      Ein elektrisches Feld verändert den Brechungsindex eines Materials, und zwar je nach
      Polarisationsrichtung des Lichts unterschiedlich, so dass es doppelbrechend wird. Beim
      Pockels-Effekt in Kristallen ohne Inversionszentrum ist die Änderung proportional zur
      Feldstärke, beim Kerr-Effekt, der in allen Stoffen auftritt, proportional zu ihrem Quadrat.
      Zwischen Polarisatoren lässt sich so Licht sehr schnell elektrisch schalten oder in
      Phase und Amplitude modulieren.
    example: >-
      Pockelszelle zur Güteschaltung von Lasern, elektrooptischer Modulator in der Glasfaser-Nachrichtentechnik,
      Kerrzelle, optische Spannungs- und Feldsensoren
    conditions: >-
      Hohe Feldstärken; für den Pockels-Effekt Kristalle ohne Inversionszentrum wie Lithiumniobat
      oder KDP.
    limits: >-
      Die Brechzahländerungen sind klein, so dass hohe Spannungen oder lange Wechselwirkungsstrecken
      nötig sind.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electro-optic effect (Pockels and Kerr effects)
    description: >-
      An electric field changes the refractive index of a material differently for different
      polarisation directions of light, making it birefringent. In the Pockels effect, found
      in crystals without a centre of inversion, the change is proportional to the field strength;
      in the Kerr effect, which occurs in all materials, it is proportional to its square.
      Placed between polarisers, such a material can switch light electrically at very high
      speed or modulate its phase and amplitude.
    example: >-
      Pockels cell for Q-switching lasers, electro-optic modulator in fibre-optic communication,
      Kerr cell, optical voltage and field sensors
    conditions: >-
      High field strengths; for the Pockels effect, crystals without a centre of inversion
      such as lithium niobate or KDP.
    limits: >-
      The index changes are small, so high voltages or long interaction lengths are needed.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
