text:
  de:
    name: Aktivkohle
    description: >-
      Aktivkohle ist Kohlenstoff mit einem dichten Netz feinster Poren, hergestellt aus Holz,
      Kokosschalen oder Kohle durch Verkohlen und anschließendes Aktivieren mit Wasserdampf
      oder Chemikalien. Ihre innere Oberfläche von oft über 1000 Quadratmetern pro Gramm bindet
      vor allem organische Moleküle über Van-der-Waals-Kräfte und holt sie so aus Wasser und
      Luft heraus.
    example: >-
      Trinkwasseraufbereitung, Dunstabzugs- und Atemschutzfilter, Lösemittelrückgewinnung,
      Entfärben von Zuckersaft, Kohletabletten bei Vergiftungen, Goldgewinnung
    conditions: >-
      Am besten werden unpolare, größere organische Moleküle gebunden, und der zu reinigende
      Strom braucht ausreichend Kontaktzeit mit der Kohle.
    limits: >-
      Kleine polare Moleküle und die meisten Salze werden kaum zurückgehalten, und gesättigte
      Kohle muss ersetzt oder thermisch reaktiviert werden.
    sideEffects: >-
      In feuchter Aktivkohle können Bakterien wachsen, und gesättigte Kohle kann gebundene
      Stoffe bei veränderten Bedingungen wieder abgeben.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Activated carbon
    description: >-
      Activated carbon is carbon permeated by a dense network of very fine pores, made from
      wood, coconut shells or coal by carbonisation followed by activation with steam or chemicals.
      Its internal surface area, often above 1000 square metres per gram, binds mainly organic
      molecules through van der Waals forces and so pulls them out of water and air.
    example: >-
      Drinking water treatment, cooker hood and respirator filters, solvent recovery, decolourising
      sugar juice, charcoal tablets for poisoning, gold extraction
    conditions: >-
      Non-polar, larger organic molecules are bound best, and the stream to be cleaned needs
      sufficient contact time with the carbon.
    limits: >-
      Small polar molecules and most salts are hardly retained, and saturated carbon has to
      be replaced or thermally reactivated.
    sideEffects: >-
      Bacteria can grow in moist activated carbon, and saturated carbon can release bound
      substances again when conditions change.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
