text:
  de:
    name: Suprafluidität
    description: >-
      Flüssiges Helium-4 geht unterhalb von etwa 2,17 K in einen Quantenzustand über, in dem
      ein Teil der Flüssigkeit völlig ohne innere Reibung strömt. Es fließt dann durch feinste
      Kapillaren und Poren, die für gewöhnliche Flüssigkeiten dicht sind, kriecht als dünner
      Film an Gefäßwänden hoch und leitet Wärme so gut, dass sich keine Temperaturunterschiede
      halten und es nicht mehr unter Blasenbildung siedet. Auch Helium-3 wird suprafluid,
      allerdings erst bei viel tieferen Temperaturen.
    example: >-
      Kühlung supraleitender Beschleunigermagnete mit suprafluidem Helium bei 1,9 K, Kühlung
      von Infrarot-Weltraumteleskopen, Kryostaten für Tieftemperaturexperimente
    conditions: Helium-4 unterhalb des Lambda-Punkts von etwa 2,17 K.
    limits: >-
      Oberhalb einer kritischen Strömungsgeschwindigkeit bilden sich Wirbel, und die reibungsfreie
      Strömung bricht zusammen.
    sideEffects: >-
      Der kriechende Film und das Durchdringen feinster Lecks erschweren das Abdichten von
      Behältern.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Superfluidity
    description: >-
      Below about 2.17 K liquid helium-4 enters a quantum state in which part of the liquid
      flows with no internal friction at all. It then passes through the finest capillaries
      and pores that are tight to ordinary liquids, creeps up container walls as a thin film,
      and conducts heat so well that no temperature differences persist and it stops boiling
      with bubbles. Helium-3 also becomes superfluid, but only at much lower temperatures.
    example: >-
      Cooling superconducting accelerator magnets with superfluid helium at 1.9 K, cooling
      infrared space telescopes, cryostats for low-temperature experiments
    conditions: Helium-4 below the lambda point of about 2.17 K.
    limits: >-
      Above a critical flow velocity, vortices form and frictionless flow breaks down.
    sideEffects: >-
      The creeping film and passage through the finest leaks make sealing vessels difficult.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
