text:
  de:
    name: Organische Leuchtdiode (OLED)
    description: >-
      Eine OLED besteht aus sehr dünnen Schichten organischer Halbleiter zwischen zwei Elektroden,
      von denen mindestens eine durchsichtig ist. Unter Spannung treffen Elektronen und Löcher
      in der Emissionsschicht aufeinander, bilden angeregte Zustände und geben deren Energie
      als Licht ab, dessen Farbe vom organischen Molekül abhängt. Jeder Bildpunkt leuchtet
      selbst, sodass Displays ohne Hintergrundbeleuchtung auskommen, echtes Schwarz zeigen
      und sich auch auf biegsamen Trägern fertigen lassen.
    example: >-
      Bildschirme von Smartphones und Fernsehern, Smartwatches, faltbare Displays, flächige
      Leuchten, Fahrzeugrückleuchten
    conditions: >-
      Eine dichte Verkapselung gegen Sauerstoff und Feuchtigkeit, die die organischen Schichten
      sonst rasch zerstören.
    limits: >-
      Blaue Emitter altern schneller als rote und grüne, und die Leuchtdichte nimmt mit der
      Betriebsdauer ab.
    sideEffects: Lange gezeigte, unbewegte Bildinhalte können sich einbrennen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Organic light-emitting diode (OLED)
    description: >-
      An OLED consists of very thin layers of organic semiconductors between two electrodes,
      at least one of which is transparent. Under voltage, electrons and holes meet in the
      emissive layer, form excited states and release their energy as light whose colour depends
      on the organic molecule. Each pixel emits its own light, so displays need no backlight,
      show true black and can even be made on flexible substrates.
    example: >-
      Smartphone and television screens, smartwatches, foldable displays, flat luminaires,
      vehicle tail lights
    conditions: >-
      Tight encapsulation against oxygen and moisture, which would otherwise quickly destroy
      the organic layers.
    limits: >-
      Blue emitters age faster than red and green ones, and luminance decreases with operating
      time.
    sideEffects: Static image content shown for long periods can burn in.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
