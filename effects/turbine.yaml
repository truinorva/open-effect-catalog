text:
  de:
    name: Turbine
    description: >-
      In einer Turbine strömt Dampf, Gas, Wasser oder Wind durch Kränze gekrümmter Schaufeln
      auf einem Läufer. Die Schaufeln lenken die Strömung um oder beschleunigen sie, und die
      dabei übertragene Impulsänderung erzeugt ein Drehmoment an der Welle. Bei Gasen sinken
      mit der Entspannung Druck und Temperatur, was Expansionsturbinen zum Kühlen nutzen.
    example: >-
      Dampfturbinen in Kraftwerken, Gasturbinen und Strahltriebwerke, Abgasturbolader, Wasserturbinen,
      Windkraftanlagen, Expansionsturbinen in der Luftzerlegung, Turbinen-Bohrantriebe beim
      Zahnarzt
    conditions: Stetige Strömung mit nutzbarem Druck- oder Geschwindigkeitsgefälle.
    limits: >-
      Abseits des Auslegungspunkts sinkt der Wirkungsgrad; bei Gasturbinen begrenzt die Hitzebeständigkeit
      der Schaufeln die Eintrittstemperatur.
    sideEffects: >-
      Lärm, Schwingungen und Schaufelerosion durch Tropfen, Partikel oder Kavitation.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Turbine
    description: >-
      In a turbine, steam, gas, water or wind flows through rows of curved blades on a rotor.
      The blades deflect or accelerate the flow, and the change in momentum transferred produces
      a torque on the shaft. In gases, pressure and temperature fall as the gas expands, which
      expansion turbines exploit for cooling.
    example: >-
      Steam turbines in power plants, gas turbines and jet engines, exhaust turbochargers,
      water turbines, wind turbines, expansion turbines in air separation, dental turbine
      drills
    conditions: Continuous flow with a usable drop in pressure or velocity.
    limits: >-
      Away from the design point, efficiency falls; in gas turbines the heat resistance of
      the blades limits the inlet temperature.
    sideEffects: >-
      Noise, vibration and blade erosion caused by droplets, particles or cavitation.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
