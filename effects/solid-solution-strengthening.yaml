text:
  de:
    name: Mischkristallverfestigung
    description: >-
      Fremdatome, die im Kristallgitter eines Metalls gelöst sind, verzerren das Gitter, weil
      sie größer oder kleiner als die Wirtsatome sind oder sich elektronisch von ihnen unterscheiden.
      Die entstehenden Spannungsfelder behindern die Wanderung von Versetzungen, so dass für
      plastische Verformung eine höhere Spannung nötig ist; Festigkeit und Härte steigen.
      Die Fremdatome können reguläre Gitterplätze besetzen (Substitution) oder in den Lücken
      dazwischen sitzen (Einlagerung).
    example: >-
      Messing (Zink in Kupfer), Aluminium-Magnesium-Knetlegierungen, Kupfer-Nickel-Legierungen,
      stickstofflegierte nichtrostende Stähle
    conditions: >-
      Ein Legierungselement, das sich im Grundmetall löst, ohne eigene Phasen auszuscheiden.
    limits: >-
      Die Verfestigung ist durch die Löslichkeit des Legierungselements begrenzt.
    sideEffects: >-
      Gelöste Fremdatome streuen auch die Leitungselektronen und senken so die elektrische
      und die Wärmeleitfähigkeit.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Solid solution strengthening
    description: >-
      Foreign atoms dissolved in the crystal lattice of a metal distort the lattice because
      they are larger or smaller than the host atoms or differ from them electronically. The
      resulting stress fields hinder the movement of dislocations, so a higher stress is needed
      for plastic deformation; strength and hardness rise. The foreign atoms can occupy regular
      lattice sites (substitutional) or sit in the gaps between them (interstitial).
    example: >-
      Brass (zinc in copper), wrought aluminium–magnesium alloys, copper–nickel alloys, nitrogen-alloyed
      stainless steels
    conditions: >-
      An alloying element that dissolves in the base metal without precipitating separate
      phases.
    limits: The strengthening is limited by the solubility of the alloying element.
    sideEffects: >-
      Dissolved foreign atoms also scatter conduction electrons and so lower electrical and
      thermal conductivity.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
