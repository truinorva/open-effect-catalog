text:
  de:
    name: Brechung (Refraktion)
    description: >-
      Tritt eine Welle schräg von einem Medium in ein anderes über, in dem sie sich mit anderer
      Geschwindigkeit ausbreitet, ändert sie an der Grenzfläche ihre Richtung. Nach dem Snelliusschen
      Brechungsgesetz wird Licht beim Übergang ins optisch dichtere Medium zum Lot hin und
      beim Übergang ins dünnere vom Lot weg gebrochen; weil die Brechzahl von der Wellenlänge
      abhängt, werden die Farben dabei unterschiedlich stark abgelenkt.
    example: >-
      Linsen in Brillen, Kameras und Mikroskopen, Refraktometer zur Bestimmung des Zuckergehalts,
      Prismen, Lichtleitung in Glasfasern zusammen mit Totalreflexion, Luftspiegelungen, Regenbogen
    conditions: >-
      Schräger Einfall auf eine Grenzfläche zwischen Medien mit unterschiedlicher Ausbreitungsgeschwindigkeit.
    limits: >-
      Beim Übergang ins optisch dünnere Medium tritt oberhalb des Grenzwinkels keine Brechung
      mehr auf, sondern Totalreflexion.
    sideEffects: >-
      Die Wellenlängenabhängigkeit verursacht Farbfehler (chromatische Aberration) in Linsen,
      und an jeder Grenzfläche geht ein Teil des Lichts durch Reflexion verloren.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Refraction
    description: >-
      When a wave passes obliquely from one medium into another in which it travels at a different
      speed, it changes direction at the interface. According to Snell's law, light entering
      an optically denser medium is bent towards the normal, and away from it when entering
      a less dense one; because the refractive index depends on wavelength, the colours are
      deflected to different degrees.
    example: >-
      Lenses in spectacles, cameras and microscopes, refractometers for sugar content, prisms,
      light guiding in optical fibres together with total internal reflection, mirages, rainbows
    conditions: >-
      Oblique incidence on an interface between media with different propagation speeds.
    limits: >-
      When passing into an optically less dense medium, beyond the critical angle there is
      no refraction but total internal reflection.
    sideEffects: >-
      The wavelength dependence causes colour errors (chromatic aberration) in lenses, and
      at every interface part of the light is lost by reflection.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
