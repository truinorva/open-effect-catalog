text:
  de:
    name: Übersättigung
    description: >-
      Eine Lösung oder ein Dampf ist übersättigt, wenn mehr Stoff gelöst oder verdampft ist,
      als im Gleichgewicht möglich wäre. Ein solcher Zustand entsteht etwa durch Abkühlen,
      Eindampfen oder Druckabsenkung und bleibt bestehen, solange Keime fehlen, an denen der
      Überschuss auskristallisieren, kondensieren oder ausgasen kann. Die Übersättigung ist
      die treibende Kraft von Kristallisation und Fällung; ihre Höhe bestimmt, ob wenige große
      oder viele kleine Kristalle entstehen.
    example: >-
      Kristallisation von Zucker und Salz, Kandiszucker, Nebelkammer zum Nachweis ionisierender
      Strahlung, Kohlensäure in Getränken, übersättigte Mischkristalle beim Ausscheidungshärten
    conditions: >-
      Langsame Zustandsänderung ohne Erschütterung und ohne Keime oder Fremdpartikel.
    limits: >-
      Ab einer bestimmten Übersättigung bilden sich spontan Keime, und der Überschuss fällt
      aus.
    sideEffects: >-
      Übersättigte Lösungen führen in Rohren, Wärmetauschern und Verdampfern zu Kalk- und
      Salzablagerungen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Supersaturation
    description: >-
      A solution or vapour is supersaturated when it contains more dissolved or vaporised
      substance than equilibrium would allow. Such a state arises, for example, through cooling,
      evaporation or pressure release and persists as long as there are no nuclei on which
      the excess can crystallise, condense or come out as gas. Supersaturation is the driving
      force for crystallisation and precipitation; its level determines whether a few large
      or many small crystals form.
    example: >-
      Crystallisation of sugar and salt, rock candy, cloud chambers for detecting ionising
      radiation, carbon dioxide in drinks, supersaturated solid solutions in precipitation
      hardening
    conditions: >-
      Slow change of state without vibration and without nuclei or foreign particles.
    limits: >-
      Above a certain supersaturation, nuclei form spontaneously and the excess precipitates.
    sideEffects: >-
      Supersaturated solutions cause scale and salt deposits in pipes, heat exchangers and
      evaporators.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
