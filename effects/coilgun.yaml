text:
  de:
    name: Gaußgewehr (Spulenkanone)
    description: >-
      Ein Geschoss aus ferromagnetischem oder leitfähigem Material wird durch ein Rohr geführt,
      das von mehreren Spulen umgeben ist. Die Spulen werden nacheinander kurz bestromt, meist
      durch Entladen von Kondensatoren, sodass ihr Magnetfeld das Geschoss anzieht oder über
      induzierte Wirbelströme abstößt und schrittweise beschleunigt. Bei der verbreiteten
      Reluktanzbauweise muss jede Spule abgeschaltet werden, bevor das Geschoss ihre Mitte
      passiert, sonst bremst sie es wieder ab.
    example: >-
      Demonstrationsaufbauten im Physikunterricht und Hobbyprojekte, Forschung zu elektromagnetischen
      Startvorrichtungen und Massebeschleunigern
    conditions: >-
      Schnelle Leistungsschalter, hohe Pulsströme aus Kondensatorbänken und eine genaue, auf
      die Geschossposition abgestimmte Zeitsteuerung.
    limits: Der Wirkungsgrad einfacher Aufbauten liegt oft nur bei wenigen Prozent.
    sideEffects: Starke Erwärmung der Spulen und hohe Spannungen in der Schaltung.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Coilgun
    description: >-
      A projectile made of ferromagnetic or conductive material is guided through a barrel
      surrounded by several coils. The coils are energised briefly one after another, usually
      by discharging capacitors, so that their magnetic field pulls the projectile in or repels
      it through induced eddy currents and accelerates it step by step. In the common reluctance
      design, each coil must be switched off before the projectile passes its centre, otherwise
      it would brake it again.
    example: >-
      Demonstration setups in physics teaching and hobby projects, research on electromagnetic
      launchers and mass drivers
    conditions: >-
      Fast power switches, high pulse currents from capacitor banks and precise timing matched
      to the projectile position.
    limits: The efficiency of simple setups is often only a few per cent.
    sideEffects: Strong heating of the coils and high voltages in the circuit.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
