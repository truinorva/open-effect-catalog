text:
  de:
    name: Fraktionierung
    description: >-
      Bei der Fraktionierung wird ein Gemisch schrittweise in Anteile (Fraktionen) zerlegt,
      die sich in einer Eigenschaft wie Siedepunkt, Löslichkeit, Dichte oder Korngröße unterscheiden.
      Am bekanntesten ist die fraktionierte Destillation: Dampf steigt in einer Kolonne auf
      und kühlt sich dabei ab, und auf jeder Höhe kondensieren bevorzugt die Bestandteile
      mit passendem Siedepunkt.
    example: >-
      Erdölraffination, Luftzerlegung, Spirituosenherstellung, fraktionierte Kristallisation,
      Fällung von Proteinen mit Ammoniumsulfat
    conditions: >-
      Die Bestandteile müssen sich in der genutzten Eigenschaft ausreichend unterscheiden.
    limits: >-
      Azeotrope Gemische lassen sich durch Destillation allein nicht vollständig trennen.
    sideEffects: Destillative Verfahren brauchen viel Energie zum Verdampfen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Fractionation
    description: >-
      Fractionation splits a mixture step by step into portions (fractions) that differ in
      one property, such as boiling point, solubility, density or particle size. The best-known
      form is fractional distillation: vapour rises through a column and cools on the way
      up, and at each height mainly the components with a matching boiling point condense.
    example: >-
      Crude oil refining, air separation, spirit distilling, fractional crystallisation, protein
      precipitation with ammonium sulfate
    conditions: The components must differ sufficiently in the property being used.
    limits: Azeotropic mixtures cannot be fully separated by distillation alone.
    sideEffects: Distillation-based processes consume a lot of energy for evaporation.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
