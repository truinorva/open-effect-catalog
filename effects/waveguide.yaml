text:
  de:
    name: Wellenleiter
    description: >-
      Ein Wellenleiter führt elektromagnetische oder akustische Wellen mit geringen Verlusten
      entlang einer vorgegebenen Bahn, indem er sie seitlich einschließt. Hohlleiter aus Metall
      reflektieren Mikrowellen an ihren leitenden Wänden; dielektrische Wellenleiter wie Glasfasern
      halten Licht durch Totalreflexion in einem Kern mit höherer Brechzahl. In Hohlleitern
      breiten sich nur Wellen oberhalb einer Grenzfrequenz aus, die von den Querabmessungen
      abhängt.
    example: >-
      Radar-Zuleitungen, Hohlleiter im Mikrowellenherd, Glasfasern in der Telekommunikation,
      integrierte Optik auf Photonik-Chips, Sprachrohre auf Schiffen
    conditions: >-
      Querabmessungen passend zur Wellenlänge; glatte, saubere Wände bzw. Grenzflächen.
    limits: >-
      Unterhalb der Grenzfrequenz breitet sich in Hohlleitern nichts aus; enge Biegungen und
      Fehlstellen verursachen Verluste.
    sideEffects: Dispersion verbreitert kurze Pulse auf langen Strecken.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Waveguide
    description: >-
      A waveguide carries electromagnetic or acoustic waves along a set path with low losses
      by confining them laterally. Metal hollow waveguides reflect microwaves at their conducting
      walls; dielectric waveguides such as optical fibres keep light in a core of higher refractive
      index by total internal reflection. In hollow waveguides only waves above a cutoff frequency,
      which depends on the cross-section, propagate.
    example: >-
      Radar feed lines, waveguide in microwave ovens, optical fibres in telecommunications,
      integrated optics on photonic chips, speaking tubes on ships
    conditions: >-
      Cross-sectional dimensions matched to the wavelength; smooth, clean walls or interfaces.
    limits: >-
      Below the cutoff frequency nothing propagates in hollow waveguides; tight bends and
      defects cause losses.
    sideEffects: Dispersion broadens short pulses over long distances.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
