text:
  de:
    name: Festelektrolyt (schneller Ionenleiter)
    description: >-
      In manchen Festkörpern können sich Ionen fast so leicht bewegen wie in einer Flüssigkeit,
      weil das Kristallgitter viele freie Plätze oder offene Kanäle bietet, in denen eine
      Ionensorte von Platz zu Platz springt, während die Elektronenleitung gering bleibt.
      Ein solcher Festelektrolyt trennt zwei Elektroden gasdicht und leitet dennoch Strom
      über Ionen, etwa Sauerstoffionen in yttriumstabilisiertem Zirkonoxid oder Lithiumionen
      in keramischen und polymeren Elektrolyten.
    example: >-
      Lambdasonde im Abgas, Festoxid-Brennstoffzelle, Festkörperbatterie, Natrium-Schwefel-Batterie
      mit Beta-Aluminiumoxid, elektrochemische Sauerstoffpumpen
    conditions: Oft erhöhte Temperatur, bei Zirkonoxid mehrere hundert Grad Celsius.
    limits: >-
      Bei Raumtemperatur ist die Leitfähigkeit vieler Festelektrolyte zu gering; die Grenzflächen
      zu den Elektroden erhöhen den Widerstand.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Fast ion conductor (solid electrolyte)
    description: >-
      In some solids, ions can move almost as easily as in a liquid because the crystal lattice
      offers many vacant sites or open channels in which one type of ion hops from site to
      site, while electronic conduction remains low. Such a solid electrolyte separates two
      electrodes gas-tight yet conducts current via ions, for example oxygen ions in yttria-stabilised
      zirconia or lithium ions in ceramic and polymer electrolytes.
    example: >-
      Lambda sensor in exhaust gas, solid oxide fuel cell, solid-state battery, sodium–sulphur
      battery with beta-alumina, electrochemical oxygen pumps
    conditions: >-
      Often elevated temperature; several hundred degrees Celsius for zirconia.
    limits: >-
      At room temperature, the conductivity of many solid electrolytes is too low; the interfaces
      with the electrodes add resistance.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
