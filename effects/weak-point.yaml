text:
  de:
    name: Sollbruchstelle (Scherstift)
    description: >-
      Eine Sollbruchstelle ist ein absichtlich geschwächter Querschnitt, der bei Überlast
      als Erstes und an einer vorhersehbaren Stelle versagt. Ein Scherstift in einem Antrieb
      schert ab, sobald das Drehmoment einen Grenzwert überschreitet, und unterbricht so den
      Kraftfluss, bevor teurere Teile Schaden nehmen; Perforationen und Kerben lassen Verpackungen
      oder Bauteile gezielt entlang einer Linie reißen.
    example: >-
      Scherstifte in Schneefräsen und Bootsantrieben, Abreißschrauben, Sollbruchstellen an
      Verkehrsschildmasten, Aufreißstreifen an Verpackungen, Berstscheiben
    conditions: Werkstoff und Querschnitt so abgestimmt, dass die Bruchlast eng streut.
    limits: >-
      Nach dem Auslösen muss das Teil ersetzt werden; Ermüdung kann es auch unterhalb der
      Grenzlast brechen lassen.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Weak point (shear pin)
    description: >-
      A weak point is a deliberately weakened cross-section that fails first, and at a predictable
      location, under overload. A shear pin in a drive shears off as soon as the torque exceeds
      a limit, interrupting the power flow before more expensive parts are damaged; perforations
      and notches make packaging or components tear deliberately along a line.
    example: >-
      Shear pins in snow blowers and boat drives, shear-off bolts, breakaway sign posts, tear
      strips on packaging, bursting discs
    conditions: >-
      Material and cross-section matched so that the breaking load varies little.
    limits: >-
      After it has failed, the part must be replaced; fatigue can make it break even below
      the limit load.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
