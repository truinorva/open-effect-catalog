text:
  de:
    name: Dampfkegel (Kondensationswolke)
    description: >-
      Fliegt ein Flugzeug nahe der Schallgeschwindigkeit, beschleunigt die Luft in bestimmten
      Bereichen stark und dehnt sich dabei aus, wodurch Druck und Temperatur sinken. Ist die
      Luft feucht genug, fällt ihre Temperatur unter den Taupunkt, und Wasserdampf kondensiert
      zu einer sichtbaren, oft kegel- oder scheibenförmigen Wolke. Hinter dem Verdichtungsstoß
      steigen Druck und Temperatur wieder an, und die Tröpfchen verdampfen sofort.
    example: >-
      Kondensationswolken an Kampfflugzeugen im Transschallflug, Wolkenscheiben bei Überflügen
      in feuchter Luft über dem Meer
    conditions: Hohe Luftfeuchte und Geschwindigkeiten im Transschallbereich.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Vapour cone
    description: >-
      When an aircraft flies close to the speed of sound, the air in certain regions accelerates
      strongly and expands, which lowers its pressure and temperature. If the air is humid
      enough, its temperature falls below the dew point and water vapour condenses into a
      visible cloud, often cone- or disc-shaped. Behind the shock wave, pressure and temperature
      rise again and the droplets evaporate immediately.
    example: >-
      Condensation clouds on fighter aircraft in transonic flight, cloud discs during flypasts
      in humid air over the sea
    conditions: High humidity and speeds in the transonic range.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
