text:
  de:
    name: Pumpe
    description: >-
      Eine Pumpe überträgt mechanische Energie auf ein Fluid, um es zu fördern oder seinen
      Druck zu erhöhen. Verdrängerpumpen wie Kolben-, Zahnrad- oder Schlauchpumpen schließen
      Fluidportionen in sich verkleinernden Kammern ein und schieben sie zum Auslass, Strömungspumpen
      wie Kreiselpumpen beschleunigen das Fluid mit einem Laufrad und wandeln die Geschwindigkeit
      in Druck um.
    example: >-
      Kreiselpumpen in Heizung und Wasserversorgung, Kraftstoff- und Hydraulikpumpen, Dosierpumpen,
      Vakuumpumpen, Blutpumpen, Strahlpumpen
    conditions: >-
      Ausreichender Zulaufdruck am Einlass, damit die Flüssigkeit nicht verdampft, und ein
      Antrieb durch Motor, Hand oder ein Treibmedium.
    limits: >-
      Saugend lassen sich Flüssigkeiten wegen des begrenzten Luftdrucks höchstens etwa 10
      m hoch heben, in der Praxis deutlich weniger.
    sideEffects: >-
      Kavitation, Druckpulsationen, Lärm und Verschleiß; Wellendichtungen können undicht werden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Pump
    description: >-
      A pump transfers mechanical energy to a fluid in order to convey it or raise its pressure.
      Positive displacement pumps such as piston, gear or peristaltic pumps trap portions
      of fluid in shrinking chambers and push them to the outlet, while rotodynamic pumps
      such as centrifugal pumps accelerate the fluid with an impeller and convert its velocity
      into pressure.
    example: >-
      Centrifugal pumps in heating and water supply, fuel and hydraulic pumps, metering pumps,
      vacuum pumps, blood pumps, jet pumps
    conditions: >-
      Sufficient inlet pressure so that the liquid does not vaporise, and a drive by motor,
      hand or a motive fluid.
    limits: >-
      On the suction side liquids can be lifted at most about 10 m because atmospheric pressure
      is limited, in practice considerably less.
    sideEffects: Cavitation, pressure pulsation, noise and wear; shaft seals can leak.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
