text:
  de:
    name: Elektrische Leitung
    description: >-
      Liegt an einem Stoff eine Spannung an, bewegen sich freie Ladungsträger im elektrischen
      Feld, und es fließt ein Strom. In Metallen sind das Elektronen, in Halbleitern Elektronen
      und Löcher, in Elektrolyten und Salzschmelzen Ionen. Wie gut ein Stoff leitet, hängt
      von Zahl und Beweglichkeit dieser Ladungsträger ab; Leiter wie Kupfer und Aluminium
      unterscheiden sich darin um viele Größenordnungen von Isolatoren.
    example: >-
      Stromkabel und Leiterbahnen, Leitfähigkeitsmessung von Wasser, Füllstands- und Leckagesonden,
      Erdungsleitungen
    conditions: >-
      Es müssen bewegliche Ladungsträger vorhanden sein und eine Spannung anliegen.
    limits: >-
      Jeder gewöhnliche Leiter hat einen Widerstand, der den Strom begrenzt und einen Teil
      der Energie in Wärme umsetzt.
    sideEffects: >-
      Stromwärme (Joulesche Wärme), bei Ionenleitern außerdem Elektrolyse an den Elektroden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electrical conduction
    description: >-
      When a voltage is applied to a material, free charge carriers move in the electric field
      and a current flows. In metals these are electrons, in semiconductors electrons and
      holes, in electrolytes and molten salts ions. How well a material conducts depends on
      the number and mobility of these carriers; conductors such as copper and aluminium differ
      from insulators by many orders of magnitude.
    example: >-
      Power cables and circuit tracks, conductivity measurement of water, level and leak probes,
      earthing conductors
    conditions: Mobile charge carriers must be present and a voltage must be applied.
    limits: >-
      Every ordinary conductor has a resistance that limits the current and turns part of
      the energy into heat.
    sideEffects: >-
      Joule heating; with ionic conductors also electrolysis at the electrodes.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
