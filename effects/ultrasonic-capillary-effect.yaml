text:
  de:
    name: Ultraschall-Kapillareffekt
    description: >-
      Wirkt Ultraschall auf eine Flüssigkeit an der Öffnung einer Kapillare, steigt die Flüssigkeit
      darin deutlich höher und schneller als durch die Kapillarwirkung allein. Als Ursache
      gelten Kavitationsblasen, die an der Kapillaröffnung zusammenfallen und dabei Flüssigkeit
      stoßweise hineindrücken. So lassen sich enge Poren und Spalte schneller und vollständiger
      füllen.
    example: >-
      Imprägnieren poröser Werkstoffe, Reinigung enger Bohrungen und Kapillaren, Füllen feiner
      Spalte mit Flüssigkeit
    conditions: >-
      Ultraschallintensität oberhalb der Kavitationsschwelle an der Kapillaröffnung.
    limits: ''
    sideEffects: Kavitation kann empfindliche Oberflächen angreifen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Ultrasonic capillary effect
    description: >-
      When ultrasound acts on a liquid at the mouth of a capillary, the liquid rises in it
      considerably higher and faster than by capillary action alone. The cause is thought
      to be cavitation bubbles that collapse at the capillary entrance and push liquid in
      with each collapse. Narrow pores and gaps can thus be filled faster and more completely.
    example: >-
      Impregnating porous materials, cleaning narrow bores and capillaries, filling fine gaps
      with liquid
    conditions: >-
      Ultrasonic intensity above the cavitation threshold at the capillary entrance.
    limits: ''
    sideEffects: Cavitation can attack sensitive surfaces.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
