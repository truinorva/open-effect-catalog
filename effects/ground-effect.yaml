text:
  de:
    name: Bodeneffekt
    description: >-
      Fliegt ein Flügel dicht über dem Boden oder einer Wasserfläche, behindert der Boden
      den Abwind und die Randwirbel. Der induzierte Widerstand sinkt und der Auftrieb steigt,
      sodass das Fluggerät mit weniger Leistung getragen wird.
    example: >-
      Bodeneffektfahrzeuge (Ekranoplane), langes Ausschweben von Flugzeugen bei der Landung,
      Pelikane und andere Seevögel im Tiefflug über dem Wasser
    conditions: >-
      Flughöhe kleiner als etwa die Spannweite, am stärksten unterhalb der halben Spannweite.
    limits: >-
      Die Wirkung schwindet mit zunehmender Höhe rasch; Wellen und Hindernisse begrenzen den
      Einsatz.
    sideEffects: >-
      Nahe am Boden ändern sich Längsmoment und Stabilität, was die Steuerung erschwert.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Ground effect
    description: >-
      When a wing flies close to the ground or a water surface, the ground obstructs the downwash
      and the wingtip vortices. Induced drag falls and lift rises, so the craft is carried
      with less power.
    example: >-
      Wing-in-ground-effect craft (ekranoplans), aircraft floating along before touchdown,
      pelicans and other seabirds skimming low over water
    conditions: >-
      Height above the surface smaller than about the wingspan, strongest below half the span.
    limits: >-
      The effect fades quickly with increasing height; waves and obstacles limit its use.
    sideEffects: >-
      Close to the ground the pitching moment and stability change, which makes control more
      difficult.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
