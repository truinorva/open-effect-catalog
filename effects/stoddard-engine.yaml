text:
  de:
    name: Stoddard-Motor
    description: >-
      Der Stoddard-Motor ist ein Heißgasmotor mit äußerer Wärmezufuhr, den Elliott J. Stoddard
      1919 vorstellte. Anders als beim Stirlingmotor steuern Ventile den Gasstrom zwischen
      den Zylindern und den Wärmetauschern, so dass Erhitzer und Kühler nicht ständig mit
      dem Arbeitsraum verbunden sind; das soll den schädlichen Totraum der Wärmetauscher verringern.
    example: Versuchs- und Demonstrationsmotoren mit äußerer Wärmequelle
