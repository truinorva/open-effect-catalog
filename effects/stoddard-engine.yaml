  en:
    name: Stoddard engine
    description: >-
      The Stoddard engine is a hot-gas engine with external heat supply, introduced by Elliott
      J. Stoddard in 1919. Unlike the Stirling engine, valves control the gas flow between
      the cylinders and the heat exchangers, so the heater and cooler are not permanently
      connected to the working space; this is intended to reduce the dead volume of the heat
      exchangers.
    example: Experimental and demonstration engines with an external heat source
