text:
  de:
    name: Aerogel
    description: >-
      Aerogele sind feste, offenporige Schäume aus einem Netzwerk nanometerfeiner Teilchen
      und bestehen zu über 90 Prozent aus Luft. Man gewinnt sie, indem man einem Gel die Flüssigkeit
      entzieht, ohne dass das Gerüst zusammenfällt, meist durch überkritisches Trocknen. Weil
      die Poren so klein sind, dass die Luftmoleküle darin kaum aufeinander stoßen, leiten
      Aerogele Wärme extrem schlecht.
    example: >-
      Hochleistungsdämmung von Rohrleitungen und Gebäuden, Dämmeinlagen in Outdoor-Bekleidung,
      Wärmeschutz in Raumfahrzeugen, Staubfänger der Raumsonde Stardust, Ölbindemittel
    conditions: ''
    limits: >-
      Silica-Aerogele sind spröde und mechanisch wenig belastbar, und die Herstellung ist
      aufwendig und teuer.
    sideEffects: >-
      Bei der Verarbeitung von Aerogelmatten entsteht feiner Staub, der Haut und Atemwege
      reizt.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Aerogel
    description: >-
      Aerogels are solid, open-pored foams made of a network of nanometre-sized particles
      and consist of more than 90 percent air. They are made by removing the liquid from a
      gel without the framework collapsing, usually by supercritical drying. Because the pores
      are so small that the air molecules inside hardly collide with each other, aerogels
      conduct heat extremely poorly.
    example: >-
      High-performance insulation of pipelines and buildings, insulating layers in outdoor
      clothing, thermal protection in spacecraft, dust collector of the Stardust probe, oil
      sorbents
    conditions: ''
    limits: >-
      Silica aerogels are brittle and mechanically weak, and their production is complex and
      expensive.
    sideEffects: >-
      Working with aerogel blankets releases fine dust that irritates skin and airways.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
