text:
  de:
    name: Deliqueszenz (Zerfließen)
    description: >-
      Stark hygroskopische Salze wie Calciumchlorid, Magnesiumchlorid oder Natriumhydroxid
      nehmen so viel Wasserdampf aus der Luft auf, dass sie sich darin lösen und zu einer
      Lösung zerfließen. Das geschieht, sobald die relative Luftfeuchte über der Feuchte liegt,
      die sich über ihrer gesättigten Lösung einstellt (Deliqueszenzfeuchte).
    example: >-
      Raumentfeuchter mit Calciumchlorid-Granulat, Staubbindung auf Schotterstraßen, Taumittel
      für Straßen
    conditions: >-
      Eine relative Luftfeuchte oberhalb der stoffspezifischen Deliqueszenzfeuchte.
    limits: >-
      Unterhalb dieser Feuchteschwelle wird kein Wasser aufgenommen, und ist das Salz zerflossen,
      muss es ersetzt oder wieder getrocknet werden.
    sideEffects: Die entstehende Salzlösung ist korrosiv und kann auslaufen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Deliquescence
    description: >-
      Strongly hygroscopic salts such as calcium chloride, magnesium chloride or sodium hydroxide
      absorb so much water vapour from the air that they dissolve in it and turn into a solution.
      This happens as soon as the relative humidity exceeds the humidity established above
      their saturated solution (deliquescence relative humidity).
    example: >-
      Room dehumidifiers with calcium chloride granules, dust control on gravel roads, road
      de-icing agents
    conditions: A relative humidity above the substance-specific deliquescence humidity.
    limits: >-
      Below this humidity threshold no water is taken up, and once the salt has dissolved
      it has to be replaced or dried again.
    sideEffects: The resulting salt solution is corrosive and can leak.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
