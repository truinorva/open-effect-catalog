text:
  de:
    name: Tesla-Ventil
    description: >-
      Das Tesla-Ventil ist ein Rückschlagventil ohne bewegliche Teile: ein Kanal mit seitlichen,
      bogenförmigen Schleifen. In Durchlassrichtung strömt das Fluid weitgehend geradeaus
      durch den Hauptkanal; in Gegenrichtung wird ein Teil in die Schleifen gelenkt und trifft
      entgegengesetzt wieder auf den Hauptstrom, wodurch Wirbel und ein hoher Druckverlust
      entstehen. Der Durchfluss hängt daher von der Richtung ab, wobei die Sperrwirkung erst
      bei höheren Strömungsgeschwindigkeiten deutlich wird.
    example: >-
      Ventillose Mikropumpen, Gleichrichten pulsierender Strömungen in der Mikrofluidik
    conditions: >-
      Strömung mit ausreichend hoher Reynolds-Zahl; bei sehr langsamer, zäher Strömung lässt
      die Wirkung stark nach.
    limits: >-
      Sperrt nicht vollständig, sondern erhöht nur den Widerstand in Gegenrichtung.
    sideEffects: Auch in Durchlassrichtung entsteht ein gewisser Druckverlust.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Tesla valve
    description: >-
      The Tesla valve is a check valve without moving parts: a channel with curved side loops.
      In the forward direction the fluid flows largely straight through the main channel;
      in the reverse direction part of it is diverted into the loops and meets the main stream
      head-on again, creating vortices and a high pressure loss. Flow therefore depends on
      direction, although the blocking effect becomes pronounced only at higher flow velocities.
    example: Valveless micropumps, rectifying pulsating flows in microfluidics
    conditions: >-
      Flow at a sufficiently high Reynolds number; in very slow, viscous flow the effect weakens
      strongly.
    limits: >-
      It does not block completely but only increases the resistance in the reverse direction.
    sideEffects: Some pressure loss occurs in the forward direction as well.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
