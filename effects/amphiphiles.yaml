text:
  de:
    name: Amphiphile Moleküle
    description: >-
      Amphiphile Moleküle haben einen wasserliebenden und einen wasserabweisenden Teil. In
      Wasser reichern sie sich deshalb an Grenzflächen an und senken die Grenzflächenspannung;
      oberhalb einer bestimmten Konzentration lagern sie sich von selbst zu Mizellen, Doppelschichten
      oder Vesikeln zusammen, die Öl oder Schmutz einschließen können.
    example: >-
      Tenside in Wasch- und Spülmitteln, Emulgatoren wie Lecithin in Lebensmitteln, Schaummittel,
      Zellmembranen aus Phospholipiden, Liposomen als Wirkstoffträger
    conditions: >-
      Ein Lösungsmittel, in dem ein Molekülteil gut und der andere schlecht löslich ist; Mizellen
      bilden sich erst oberhalb der kritischen Mizellbildungskonzentration.
    limits: >-
      Die Wirkung hängt von Temperatur, Salzgehalt und pH-Wert ab, und manche Tenside fallen
      in hartem Wasser aus.
    sideEffects: >-
      Ungewollte Schaumbildung und Gewässerbelastung, wenn die Stoffe schlecht abbaubar sind.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Amphiphilic molecules (amphiphiles)
    description: >-
      Amphiphilic molecules have a water-loving and a water-repelling part. In water they
      therefore accumulate at interfaces and lower the interfacial tension; above a certain
      concentration they assemble by themselves into micelles, bilayers or vesicles that can
      enclose oil or dirt.
    example: >-
      Surfactants in detergents and washing-up liquids, emulsifiers such as lecithin in food,
      foaming agents, cell membranes made of phospholipids, liposomes as drug carriers
    conditions: >-
      A solvent in which one part of the molecule dissolves well and the other poorly; micelles
      form only above the critical micelle concentration.
    limits: >-
      The effect depends on temperature, salt content and pH, and some surfactants precipitate
      in hard water.
    sideEffects: >-
      Unwanted foaming and water pollution if the substances biodegrade poorly.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
