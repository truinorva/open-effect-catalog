text:
  de:
    name: Sprengschweißen (Sprengplattieren)
    description: >-
      Eine Sprengstoffschicht beschleunigt eine Metallplatte so, dass sie unter einem kleinen
      Winkel mit hoher Geschwindigkeit auf eine zweite Platte prallt. Am Kollisionspunkt entsteht
      ein Metallstrahl, der Oxide und Verunreinigungen von beiden Oberflächen abträgt, und
      der hohe Druck presst die sauberen Oberflächen zu einer festen, meist wellenförmigen
      Verbindung zusammen, ohne dass die Werkstoffe nennenswert schmelzen.
    example: >-
      Plattierte Bleche für Druckbehälter und Wärmeübertrager, Übergangsstücke aus Aluminium
      und Stahl im Schiffbau, Verbinden von Titan oder Tantal mit Stahl
    conditions: >-
      Duktile Werkstoffe; passende Kollisionsgeschwindigkeit und passender Kollisionswinkel.
    limits: >-
      Nur für einfache, meist ebene oder zylindrische Geometrien; spröde Werkstoffe reißen.
    sideEffects: Lärm und Erschütterungen, daher Arbeiten im Freien oder in Bunkern.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Explosion welding
    description: >-
      A layer of explosive accelerates a metal plate so that it strikes a second plate at
      high speed and a small angle. At the collision point, a metal jet forms that strips
      oxides and contaminants from both surfaces, and the high pressure presses the clean
      surfaces into a strong, usually wavy bond without the materials melting appreciably.
    example: >-
      Clad plates for pressure vessels and heat exchangers, aluminium–steel transition joints
      in shipbuilding, joining titanium or tantalum to steel
    conditions: Ductile materials; suitable collision velocity and angle.
    limits: >-
      Only for simple, mostly flat or cylindrical geometries; brittle materials crack.
    sideEffects: Noise and vibration, so the work is done outdoors or in bunkers.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
