text:
  de:
    name: Wärmestrahlung (Glühen)
    description: >-
      Jeder Körper sendet aufgrund der Wärmebewegung seiner Teilchen elektromagnetische Strahlung
      aus, deren Leistung mit der vierten Potenz der absoluten Temperatur steigt. Mit zunehmender
      Temperatur verschiebt sich das Maximum zu kürzeren Wellenlängen: Bei Raumtemperatur
      strahlt ein Körper im Infraroten, ab etwa 500 °C beginnt er sichtbar rot zu glühen,
      bei noch höheren Temperaturen gelb bis weiß (Inkandeszenz).
    example: >-
      Glühlampen, Infrarotstrahler, Pyrometer und Wärmebildkameras, Abschätzen der Temperatur
      nach der Glühfarbe beim Schmieden, Wärmeabgabe von Satelliten ins All
    conditions: >-
      Die Strahlung breitet sich auch im Vakuum aus; die abgegebene Leistung hängt vom Emissionsgrad
      der Oberfläche ab.
    limits: >-
      Bei niedrigen Temperaturen ist der Wärmestrom klein; blanke Metalloberflächen strahlen
      wenig ab und erschweren die berührungslose Temperaturmessung.
    sideEffects: >-
      Glühlampen geben den größten Teil ihrer Energie als unsichtbare Infrarotstrahlung ab.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Thermal radiation (incandescence)
    description: >-
      Every body emits electromagnetic radiation due to the thermal motion of its particles,
      and the radiated power rises with the fourth power of absolute temperature. As temperature
      rises, the peak shifts to shorter wavelengths: at room temperature a body radiates in
      the infrared, from about 500 °C it begins to glow visibly red, and at even higher temperatures
      yellow to white (incandescence).
    example: >-
      Incandescent lamps, infrared heaters, pyrometers and thermal imaging cameras, judging
      temperature by glow colour in forging, heat rejection from satellites into space
    conditions: >-
      The radiation also travels through a vacuum; the emitted power depends on the emissivity
      of the surface.
    limits: >-
      At low temperatures the heat flow is small; bright metal surfaces emit little and make
      contactless temperature measurement difficult.
    sideEffects: >-
      Incandescent lamps emit most of their energy as invisible infrared radiation.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
