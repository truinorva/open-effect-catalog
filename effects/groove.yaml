text:
  de:
    name: Nut (Rille)
    description: >-
      Eine Nut ist eine lange, schmale Vertiefung in einer Oberfläche. Sie nimmt ein Gegenstück
      formschlüssig auf und führt oder hält es, etwa einen Dichtring, einen Sicherungsring
      oder eine Passfeder, oder sie leitet Flüssigkeiten und Schmierstoffe gezielt in eine
      Richtung ab.
    example: >-
      O-Ring-Nuten, Sicherungsringnuten, Nut-und-Feder-Verbindungen, Schmiernuten in Gleitlagern,
      Profilrillen von Reifen, T-Nuten in Maschinentischen
    conditions: ''
    limits: Nuten schwächen den Querschnitt und wirken als Kerben.
    sideEffects: Durch die Kerbwirkung können am Nutgrund Ermüdungsrisse entstehen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Groove
    description: >-
      A groove is a long, narrow recess in a surface. It receives a mating part by its shape
      and guides or holds it, such as an O-ring, a retaining ring or a key, or it channels
      liquids and lubricants in a chosen direction.
    example: >-
      O-ring grooves, retaining-ring grooves, tongue-and-groove joints, lubrication grooves
      in plain bearings, tyre tread grooves, T-slots in machine tables
    conditions: ''
    limits: Grooves weaken the cross-section and act as notches.
    sideEffects: >-
      Due to the notch effect, fatigue cracks can start at the bottom of grooves.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
