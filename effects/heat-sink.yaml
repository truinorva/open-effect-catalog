text:
  de:
    name: Kühlkörper
    description: >-
      Ein Kühlkörper aus gut wärmeleitendem Metall nimmt Wärme von einem Bauteil auf, verteilt
      sie und gibt sie über eine durch Rippen oder Stifte stark vergrößerte Oberfläche an
      die Umgebungsluft ab. Die Abgabe erfolgt durch Konvektion, frei oder mit Lüfter, und
      zu einem kleineren Teil durch Wärmestrahlung.
    example: >-
      Kühlung von Prozessoren und Leistungshalbleitern, LED-Leuchten, Verstärker, Motorgehäuse
      mit Kühlrippen
    conditions: Guter thermischer Kontakt zum Bauteil, meist mit Wärmeleitpaste.
    limits: >-
      Ohne Lüfter ist die abführbare Leistung begrenzt; zu eng stehende Rippen behindern die
      Luftströmung.
    sideEffects: Staubablagerungen zwischen den Rippen verschlechtern die Kühlung.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Heat sink
    description: >-
      A heat sink made of a highly conductive metal takes up heat from a component, spreads
      it and releases it to the surrounding air over a surface greatly enlarged by fins or
      pins. Heat is given off by convection, natural or fan-assisted, and to a smaller extent
      by thermal radiation.
    example: >-
      Cooling of processors and power semiconductors, LED luminaires, amplifiers, finned motor
      housings
    conditions: Good thermal contact with the component, usually with thermal paste.
    limits: >-
      Without a fan the heat that can be removed is limited; fins that are too close together
      obstruct the airflow.
    sideEffects: Dust deposits between the fins impair cooling.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
