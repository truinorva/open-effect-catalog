text:
  de:
    name: Diode
    description: >-
      Eine Diode lässt elektrischen Strom fast nur in einer Richtung durch. Bei der Halbleiterdiode
      beruht das auf einem pn-Übergang: In Durchlassrichtung verringert die angelegte Spannung
      die Sperrschicht, in Sperrrichtung verbreitert sie sie, so dass nur ein winziger Sperrstrom
      fließt. Je nach Bauart wandeln Dioden zusätzlich Licht in Strom um oder senden Licht
      aus.
    example: >-
      Gleichrichter in Netzteilen, Freilaufdioden zum Schutz vor Spannungsspitzen, Leuchtdioden,
      Fotodioden, Z-Dioden zur Spannungsstabilisierung, Temperaturmessung über die Durchlassspannung
    conditions: >-
      Richtige Polung, wobei in Durchlassrichtung die Schwellenspannung (bei Silizium etwa
      0,6 bis 0,7 V) überschritten werden muss.
    limits: >-
      Oberhalb der Durchbruchspannung leitet die Diode auch in Sperrrichtung, und Strom und
      Verlustleistung sind thermisch begrenzt.
    sideEffects: >-
      Spannungsabfall und Wärmeverluste im Durchlassbetrieb sowie Sperrverzögerung beim schnellen
      Umschalten.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Diode
    description: >-
      A diode lets electric current pass almost only in one direction. In a semiconductor
      diode this is based on a p-n junction: in the forward direction the applied voltage
      narrows the depletion layer, in the reverse direction it widens it, so that only a tiny
      reverse current flows. Depending on their design, diodes can also convert light into
      current or emit light.
    example: >-
      Rectifiers in power supplies, freewheeling diodes protecting against voltage spikes,
      light-emitting diodes, photodiodes, Zener diodes for voltage stabilisation, temperature
      measurement via the forward voltage
    conditions: >-
      Correct polarity, with the threshold voltage (about 0.6 to 0.7 V for silicon) exceeded
      in the forward direction.
    limits: >-
      Above the breakdown voltage the diode also conducts in reverse, and current and power
      dissipation are limited thermally.
    sideEffects: >-
      Voltage drop and heat losses in forward operation, and reverse recovery when switching
      quickly.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
