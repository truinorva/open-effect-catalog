text:
  de:
    name: Joulesche Wärme (Stromwärme)
    description: >-
      Fließt elektrischer Strom durch einen Leiter mit Widerstand, geben die Ladungsträger
      bei Stößen im Atomgitter Energie ab und der Leiter erwärmt sich. Die freigesetzte Leistung
      ist proportional zum Widerstand und zum Quadrat der Stromstärke. Da die Wärme direkt
      im Leiter entsteht, lässt sich der Stoff selbst ohne äußere Wärmequelle erhitzen.
    example: >-
      Heizdrähte in Toaster und Wasserkocher, Schmelzsicherung, Widerstandspunktschweißen,
      ohmsche Erhitzung von Lebensmitteln, Glühlampe, elektrisches Glasschmelzen mit Elektroden
    conditions: >-
      Ein elektrisch leitender Stoff mit endlichem Widerstand, also kein Supraleiter.
    limits: >-
      Die erreichbare Temperatur ist durch Schmelzen, Oxidation oder Zersetzung des Leiters
      begrenzt; bei Metallen steigt der Widerstand mit der Temperatur.
    sideEffects: >-
      In Leitungen, Wicklungen und Elektronik verursacht die Stromwärme Energieverluste und
      muss abgeführt werden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Joule heating
    description: >-
      When an electric current flows through a conductor with resistance, the charge carriers
      lose energy in collisions within the atomic lattice and the conductor heats up. The
      power released is proportional to the resistance and to the square of the current. Because
      the heat arises directly inside the conductor, the material itself can be heated without
      an external heat source.
    example: >-
      Heating wires in toasters and kettles, fuses, resistance spot welding, ohmic heating
      of food, incandescent lamp, electric glass melting with electrodes
    conditions: >-
      An electrically conducting material with finite resistance, i.e. not a superconductor.
    limits: >-
      The achievable temperature is limited by melting, oxidation or decomposition of the
      conductor; in metals the resistance rises with temperature.
    sideEffects: >-
      In cables, windings and electronics, Joule heating causes energy losses and has to be
      dissipated.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
