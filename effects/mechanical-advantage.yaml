text:
  de:
    name: Kraftübersetzung (mechanischer Vorteil)
    description: >-
      Einfache Maschinen wie Hebel, Flaschenzug, schiefe Ebene, Keil, Schraube, Zahnradgetriebe
      oder hydraulische Presse wandeln eine kleine Eingangskraft in eine große Ausgangskraft
      um. Das Verhältnis der beiden Kräfte heißt Kraftübersetzung oder mechanischer Vorteil.
      Nach der goldenen Regel der Mechanik wird der Kraftgewinn mit einem entsprechend längeren
      Weg auf der Eingangsseite bezahlt, so dass die Arbeit ohne Reibung gleich bleibt.
    example: >-
      Flaschenzug und Seilwinde, Wagenheber, Schraubstock, hydraulische Presse, Fahrradschaltung,
      Spaltkeil
    conditions: >-
      Ein Kraftwandler mit unterschiedlichen Wegen oder Hebelarmen an Ein- und Ausgang.
    limits: >-
      Reibung verringert die tatsächlich übertragene Kraft gegenüber dem idealen Übersetzungsverhältnis,
      und hohe Übersetzungen verlangsamen die Ausgangsbewegung entsprechend.
    sideEffects: >-
      Bei selbsthemmenden Übersetzungen wie Schraube und Keil geht ein großer Teil der Arbeit
      durch Reibung verloren.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Mechanical advantage
    description: >-
      Simple machines such as the lever, pulley block, inclined plane, wedge, screw, gear
      train or hydraulic press convert a small input force into a large output force. The
      ratio of the two forces is called mechanical advantage. According to the golden rule
      of mechanics, the gain in force is paid for with a correspondingly longer travel on
      the input side, so that without friction the work stays the same.
    example: >-
      Pulley block and winch, car jack, vice, hydraulic press, bicycle gears, splitting wedge
    conditions: >-
      A force converter with different travels or lever arms at input and output.
    limits: >-
      Friction reduces the actually transmitted force compared with the ideal ratio, and high
      ratios slow the output movement accordingly.
    sideEffects: >-
      In self-locking transmissions such as screws and wedges, a large part of the work is
      lost to friction.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
