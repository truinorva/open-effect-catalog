text:
  de:
    name: Elektromethanogenese
    description: >-
      Methanbildende Mikroorganismen auf der Kathode eines bioelektrochemischen Systems nehmen
      Elektronen aus der Elektrode auf – direkt oder über elektrochemisch gebildeten Wasserstoff
      – und reduzieren damit Kohlendioxid zu Methan. So lässt sich elektrische Energie, etwa
      überschüssiger Wind- oder Solarstrom, in einen speicherbaren Brennstoff umwandeln.
    example: >-
      Power-to-Gas-Forschung, Aufbereitung von Biogas durch Umsetzung des enthaltenen Kohlendioxids
    conditions: Anaerobe Bedingungen und Kohlendioxid als Kohlenstoffquelle.
    limits: Stromdichten und Methanbildungsraten sind bislang gering.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electromethanogenesis
    description: >-
      Methanogenic microorganisms on the cathode of a bioelectrochemical system take up electrons
      from the electrode – directly or via electrochemically formed hydrogen – and use them
      to reduce carbon dioxide to methane. This allows electrical energy, such as surplus
      wind or solar power, to be converted into a storable fuel.
    example: >-
      Power-to-gas research, upgrading biogas by converting its carbon dioxide content
    conditions: Anaerobic conditions and carbon dioxide as carbon source.
    limits: Current densities and methane production rates are still low.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
