text:
  de:
    name: Rad
    description: >-
      Ein Rad ersetzt Gleiten durch Rollen: Der Aufstandspunkt ruht kurz auf dem Boden und
      hebt wieder ab, statt über ihn zu schleifen. Der Rollwiderstand ist dadurch viel kleiner
      als die Gleitreibung, und die verbleibende Reibung wird in die Nabe verlagert, wo sie
      auf kleinem Radius in einem Lager wirkt. So lassen sich schwere Lasten mit wenig Kraft
      bewegen.
    example: >-
      Fahrzeuge, Schubkarren, Transportroller, Lenkrollen an Möbeln, Rollenförderer
    conditions: Ausreichend fester und ebener Untergrund.
    limits: >-
      Auf weichem Boden, in Sand oder an Stufen steigt der Rollwiderstand stark an oder das
      Rad bleibt stecken.
    sideEffects: Reifenabrieb und Rollgeräusche.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Wheel
    description: >-
      A wheel replaces sliding with rolling: the contact point rests briefly on the ground
      and lifts off again instead of dragging across it. Rolling resistance is therefore much
      smaller than sliding friction, and the remaining friction is moved to the hub, where
      it acts at a small radius in a bearing. Heavy loads can thus be moved with little force.
    example: Vehicles, wheelbarrows, dollies, castors on furniture, roller conveyors
    conditions: Sufficiently firm and level ground.
    limits: >-
      On soft ground, in sand or at steps, rolling resistance rises sharply or the wheel gets
      stuck.
    sideEffects: Tyre wear and rolling noise.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
