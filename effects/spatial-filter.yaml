text:
  de:
    name: Raumfilter (Optik)
    description: >-
      Eine Linse bündelt einen Laserstrahl auf eine kleine Lochblende in ihrer Brennebene.
      In dieser Ebene liegt das räumliche Frequenzspektrum des Strahls: Der saubere Grundanteil
      sammelt sich im Zentrum und tritt durch die Öffnung, während Störanteile durch Staub,
      Kratzer oder Linsenfehler weiter außen landen und abgeblockt werden. Hinter der Blende
      hat der Strahl ein glattes, nahezu gaußförmiges Profil.
    example: >-
      Strahlreinigung vor Holografie- und Interferometrieaufbauten, Strahlaufweitung in Lasersystemen,
      Fourier-optische Bildfilterung
    conditions: >-
      Kohärente Lichtquelle; Lochblende, deren Durchmesser zum Fokusdurchmesser passt, und
      genaue Justage.
    limits: >-
      Ein Teil der Leistung geht an der Blende verloren; bei Hochleistungslasern kann die
      Blende beschädigt werden oder im Fokus ein Plasma entstehen.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Spatial filter
    description: >-
      A lens focuses a laser beam onto a small pinhole in its focal plane. This plane holds
      the spatial frequency spectrum of the beam: the clean fundamental part gathers at the
      centre and passes through the aperture, while disturbances caused by dust, scratches
      or lens defects land farther out and are blocked. Behind the pinhole the beam has a
      smooth, nearly Gaussian profile.
    example: >-
      Beam cleaning ahead of holography and interferometry set-ups, beam expansion in laser
      systems, Fourier-optical image filtering
    conditions: >-
      Coherent light source; pinhole diameter matched to the focal spot, and precise alignment.
    limits: >-
      Some power is lost at the pinhole; with high-power lasers the pinhole can be damaged
      or a plasma can form at the focus.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
