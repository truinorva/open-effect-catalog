text:
  de:
    name: Thermophorese (Thermodiffusion, Soret-Effekt)
    description: >-
      In einem Temperaturgefälle wandern Partikel, Makromoleküle oder die Komponenten eines
      Gemisches bevorzugt in eine Richtung, in Gasen meist vom Warmen zum Kalten. Ursache
      ist, dass Moleküle von der heißen Seite mit mehr Impuls anstoßen als von der kalten;
      in Flüssigkeiten bestimmen zusätzlich Wechselwirkungen an der Partikeloberfläche Richtung
      und Stärke. So bauen sich Konzentrationsunterschiede auf, und Partikel schlagen sich
      auf kalten Flächen nieder.
    example: >-
      Thermalpräzipitator zur Aerosolprobenahme, Abscheidung von Glasruß bei der Herstellung
      von Glasfaser-Vorformen (MCVD), Trennrohr nach Clusius und Dickel zur Isotopentrennung,
      Microscale Thermophoresis zur Messung von Bindungsstärken
    conditions: >-
      Steiles Temperaturgefälle; in Gasen am wirksamsten bei Partikeln im Submikrometerbereich.
    limits: >-
      Die Driftgeschwindigkeit ist klein, daher braucht man kurze Wege oder lange Zeiten.
    sideEffects: >-
      Ruß und Staub lagern sich an kalten Wänden ab, etwa in Abgaskühlern oder an Wänden über
      Heizkörpern.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Thermophoresis (thermodiffusion, Soret effect)
    description: >-
      In a temperature gradient, particles, macromolecules or the components of a mixture
      drift preferentially in one direction, in gases usually from hot to cold. This is because
      molecules from the hot side strike with more momentum than those from the cold side;
      in liquids, interactions at the particle surface also determine direction and strength.
      Concentration differences build up, and particles deposit on cold surfaces.
    example: >-
      Thermal precipitator for aerosol sampling, soot deposition in optical fibre preform
      manufacture (MCVD), Clusius-Dickel column for isotope separation, microscale thermophoresis
      for measuring binding affinities
    conditions: >-
      Steep temperature gradient; in gases most effective for submicrometre particles.
    limits: >-
      The drift velocity is small, so short distances or long times are needed.
    sideEffects: >-
      Soot and dust build up on cold walls, for example in exhaust gas coolers or on walls
      above radiators.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
