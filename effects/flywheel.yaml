text:
  de:
    name: Schwungrad
    description: >-
      Ein Schwungrad ist eine drehende Masse mit großem Trägheitsmoment, die Bewegungsenergie
      speichert; die Energie wächst mit dem Quadrat der Drehzahl. Wird ihm Drehmoment zugeführt,
      beschleunigt es und nimmt Energie auf, bremst die Last, gibt es Energie ab. So glättet
      es Drehzahlschwankungen, etwa zwischen den Arbeitstakten eines Kolbenmotors, und kann
      kurzzeitig hohe Leistungen bereitstellen.
    example: >-
      Schwungscheibe am Verbrennungsmotor, Exzenterpressen, Schwungradspeicher für die unterbrechungsfreie
      Stromversorgung, Spielzeugautos mit Schwungradantrieb
    conditions: ''
    limits: >-
      Drehzahl und damit speicherbare Energie sind durch die Festigkeit des Rades gegen die
      Fliehkräfte begrenzt.
    sideEffects: >-
      Kreiselkräfte bei Lageänderungen; Lagerreibung entlädt den Speicher allmählich; Berstgefahr
      bei Überdrehzahl.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Flywheel
    description: >-
      A flywheel is a rotating mass with a large moment of inertia that stores kinetic energy;
      the energy grows with the square of the rotational speed. When torque is applied it
      speeds up and takes up energy, and when the load brakes it, it gives energy back. It
      thus smooths out speed fluctuations, for instance between the power strokes of a piston
      engine, and can deliver high power for short periods.
    example: >-
      Flywheel on combustion engines, eccentric presses, flywheel energy storage for uninterruptible
      power supplies, toy cars with flywheel drive
    conditions: ''
    limits: >-
      Speed, and thus storable energy, is limited by the wheel's strength against centrifugal
      forces.
    sideEffects: >-
      Gyroscopic forces when changing orientation; bearing friction gradually drains the stored
      energy; risk of bursting at overspeed.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
