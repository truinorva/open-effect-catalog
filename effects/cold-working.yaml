text:
  de:
    name: Kaltumformung
    description: >-
      Bei der Kaltumformung wird Metall unterhalb seiner Rekristallisationstemperatur, meist
      bei Raumtemperatur, durch Walzen, Ziehen, Pressen, Biegen oder Fließpressen bleibend
      verformt. Dabei vervielfachen sich die Versetzungen im Kristallgitter und behindern
      sich gegenseitig, sodass Festigkeit und Härte steigen, die Verformbarkeit aber sinkt
      (Kaltverfestigung). Zugleich erhält man genaue Maße und glatte, zunderfreie Oberflächen.
    example: >-
      Schrauben und Bolzen durch Kaltstauchen, kaltgewalzte Bleche, gezogene Drähte, Getränkedosen,
      Rohre und Profile
    conditions: Ein ausreichend verformbarer Werkstoff und hohe Umformkräfte.
    limits: >-
      Mit zunehmender Verfestigung nimmt die Restverformbarkeit ab; für weitere Umformschritte
      ist oft ein Zwischenglühen nötig.
    sideEffects: >-
      Es entstehen Eigenspannungen und eine richtungsabhängige Textur, und das Bauteil federt
      nach dem Umformen etwas zurück.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Cold working (cold forming)
    description: >-
      In cold working, metal is permanently deformed below its recrystallisation temperature,
      usually at room temperature, by rolling, drawing, pressing, bending or extrusion. Dislocations
      in the crystal lattice multiply and obstruct each other, so strength and hardness rise
      while ductility falls (work hardening). At the same time, accurate dimensions and smooth,
      scale-free surfaces are obtained.
    example: >-
      Screws and bolts by cold heading, cold-rolled sheet, drawn wire, beverage cans, tubes
      and profiles
    conditions: A sufficiently ductile material and high forming forces.
    limits: >-
      As hardening increases, the remaining formability drops; further forming steps often
      require intermediate annealing.
    sideEffects: >-
      Residual stresses and a direction-dependent texture develop, and the part springs back
      slightly after forming.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
