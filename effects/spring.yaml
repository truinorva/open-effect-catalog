text:
  de:
    name: Feder (Technik)
    description: >-
      Eine Feder ist ein Bauteil, das sich unter Last elastisch verformt, dabei mechanische
      Energie speichert und beim Entlasten in seine Ausgangsform zurückkehrt. Im elastischen
      Bereich ist die Federkraft meist proportional zum Federweg (hookesches Gesetz); über
      Form, Werkstoff und Abmessungen lässt sich diese Kennlinie gezielt einstellen. Federn
      halten Teile mit definierter Kraft zusammen, treiben Bewegungen an, fangen Stöße ab
      oder dienen als Kraftmesser.
    example: >-
      Ventilfedern, Fahrzeugfederung, Uhrfedern und Aufziehwerke, Tellerfedern zum Erhalt
      der Schraubenvorspannung, Federwaage, Kugelschreibermechanik
    conditions: >-
      Elastischer Werkstoff, meist Federstahl; Belastung unterhalb der Elastizitätsgrenze.
    limits: >-
      Überlastung führt zu bleibender Verformung, häufige Lastwechsel zu Ermüdungsbruch.
    sideEffects: >-
      Eine ungedämpfte Feder schwingt nach; über lange Zeit kann sie sich unter Last setzen
      und an Kraft verlieren.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Spring
    description: >-
      A spring is a component that deforms elastically under load, storing mechanical energy,
      and returns to its original shape when unloaded. Within the elastic range the spring
      force is usually proportional to the deflection (Hooke's law); shape, material and dimensions
      allow this characteristic to be tailored. Springs hold parts together with a defined
      force, drive movements, absorb shocks or serve as force gauges.
    example: >-
      Valve springs, vehicle suspension, clock mainsprings and wind-up mechanisms, disc springs
      for maintaining bolt preload, spring balance, ballpoint pen mechanism
    conditions: Elastic material, usually spring steel; load below the elastic limit.
    limits: >-
      Overload causes permanent deformation; frequent load cycles lead to fatigue failure.
    sideEffects: >-
      An undamped spring keeps oscillating; over long periods under load it can relax and
      lose force.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
