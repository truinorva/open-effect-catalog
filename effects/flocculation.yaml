text:
  de:
    name: Flockung
    description: >-
      Feinste, in einer Flüssigkeit schwebende Teilchen, die sich wegen ihrer gleichsinnigen
      Oberflächenladung abstoßen, lagern sich nach Zugabe von Flockungsmitteln zu größeren,
      lockeren Flocken zusammen. Metallsalze neutralisieren die Ladung, langkettige Polymere
      verbinden mehrere Teilchen brückenartig; die entstehenden Flocken setzen sich ab oder
      lassen sich abfiltrieren oder aufschwimmen.
    example: >-
      Trinkwasser- und Abwasseraufbereitung, Schlammentwässerung, Klärung von Bier und Wein,
      Papierherstellung, Eindicken von Bergbautrüben
    conditions: >-
      Passende Dosis des Flockungsmittels, geeigneter pH-Wert und langsames Rühren, damit
      die Flocken nicht zerschlagen werden.
    limits: Überdosierung kann die Teilchen erneut stabilisieren.
    sideEffects: >-
      Rückstände von Flockungsmitteln und zusätzlicher Schlamm, der entsorgt werden muss.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Flocculation
    description: >-
      Very fine particles suspended in a liquid, which repel each other because of their like
      surface charges, gather into larger, loose flocs after flocculants are added. Metal
      salts neutralise the charge, while long-chain polymers bridge several particles together;
      the resulting flocs settle or can be filtered off or floated.
    example: >-
      Drinking water and wastewater treatment, sludge dewatering, clarification of beer and
      wine, papermaking, thickening of mining slurries
    conditions: >-
      Suitable flocculant dose, suitable pH and gentle stirring so that the flocs are not
      broken up.
    limits: Overdosing can restabilise the particles.
    sideEffects: Residual flocculant and additional sludge that must be disposed of.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
