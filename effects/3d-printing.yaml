text:
  de:
    name: 3D-Druck
    description: >-
      Ein Bauteil entsteht Schicht für Schicht direkt aus einem digitalen Modell, wobei Material
      nur dort abgelegt oder verfestigt wird, wo es gebraucht wird. Je nach Verfahren wird
      ein Kunststoffstrang aufgeschmolzen und abgelegt, ein flüssiges Harz mit Licht ausgehärtet
      oder ein Pulverbett mit Laser, Elektronenstrahl oder Binder verbunden.
    example: >-
      Prototypenbau, Zahnschienen und Implantate, Leichtbauteile für die Luftfahrt, Ersatzteile
      auf Abruf, Gussformen und Kerne
    conditions: >-
      Ein digitales 3D-Modell und ein Werkstoff, der sich schichtweise verfestigen lässt,
      etwa thermoplastischer Strang, lichthärtendes Harz oder Metall- und Kunststoffpulver.
    limits: >-
      Baugeschwindigkeit und Bauraum sind begrenzt, und die Oberfläche zeigt Schichtstufen,
      sodass Passflächen meist nachbearbeitet werden müssen.
    sideEffects: >-
      Die Bauteile sind oft anisotrop, weil die Bindung zwischen den Schichten schwächer ist
      als innerhalb einer Schicht, und Eigenspannungen können Verzug verursachen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: 3D printing
    description: >-
      A part is built up layer by layer directly from a digital model, with material deposited
      or solidified only where it is needed. Depending on the process, a plastic filament
      is melted and laid down, a liquid resin is cured by light, or a powder bed is fused
      by a laser or electron beam or bound with a binder.
    example: >-
      Rapid prototyping, dental aligners and implants, lightweight aerospace parts, on-demand
      spare parts, casting moulds and cores
    conditions: >-
      A digital 3D model and a material that can be solidified layer by layer, such as thermoplastic
      filament, photocurable resin or metal and polymer powder.
    limits: >-
      Build speed and build volume are limited, and surfaces show layer steps, so mating faces
      usually need finishing.
    sideEffects: >-
      Parts are often anisotropic because bonding between layers is weaker than within a layer,
      and residual stresses can cause warping.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
