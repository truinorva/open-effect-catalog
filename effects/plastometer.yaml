text:
  de:
    name: Plastometer
    description: >-
      Ein Plastometer bestimmt, wie leicht ein plastischer Stoff unter festgelegter Last und
      Temperatur fließt. Beim Parallelplatten-Plastometer wird eine Probe eine bestimmte Zeit
      lang zwischen zwei Platten zusammengedrückt und die verbleibende Dicke gemessen; beim
      Extrusionsplastometer drückt ein Gewicht die Schmelze durch eine Düse, und die je Zeiteinheit
      austretende Masse ergibt den Schmelzindex.
    example: >-
      Plastizitätsprüfung von Kautschuk und Gummimischungen (Williams- und Wallace-Plastometer),
      Schmelzindex von Thermoplasten, Plastizität von Kohle beim Verkoken (Gieseler-Plastometer)
    conditions: >-
      Genormte Probengröße, Temperatur, Last und Prüfzeit, damit die Werte vergleichbar sind.
    limits: >-
      Das Ergebnis ist ein Einpunkt-Kennwert unter einer einzigen Belastungsbedingung; das
      Fließverhalten über einen weiten Scherratenbereich erfasst erst ein Rheometer.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Plastometer
    description: >-
      A plastometer determines how easily a plastic material flows under a defined load and
      temperature. In a parallel-plate plastometer a specimen is squeezed between two plates
      for a set time and the remaining thickness is measured; in an extrusion plastometer
      a weight pushes the melt through a die, and the mass extruded per unit time gives the
      melt flow index.
    example: >-
      Plasticity testing of raw rubber and compounds (Williams and Wallace plastometers),
      melt flow index of thermoplastics, plasticity of coal during coking (Gieseler plastometer)
    conditions: >-
      Standardised specimen size, temperature, load and test time so that results are comparable.
    limits: >-
      The result is a single-point value under one loading condition; flow behaviour across
      a wide range of shear rates needs a rheometer.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
