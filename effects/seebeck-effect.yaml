text:
  de:
    name: Seebeck-Effekt
    description: >-
      Verbindet man zwei unterschiedliche Leiter und hält die beiden Kontaktstellen auf verschiedenen
      Temperaturen, entsteht eine elektrische Spannung. Sie wächst mit dem Temperaturunterschied
      und dient deshalb zum Messen von Temperaturen oder zum Erzeugen kleiner Leistungen.
    example: >-
      Thermoelemente, thermoelektrische Generatoren in Raumsonden, Abwärmenutzung
    conditions: >-
      Zwei verschiedene Leiter- oder Halbleiterwerkstoffe; Temperaturunterschied zwischen
      den Kontaktstellen.
    limits: >-
      Die Spannung ist klein (Mikrovolt je Kelvin bei Metallen); als Generator ist der Wirkungsgrad
      niedrig.
    sideEffects: >-
      Die Vergleichsstelle muss bekannt oder ausgeglichen sein, sonst misst man falsch.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Seebeck effect
    description: >-
      If two different conductors are joined and their two junctions are kept at different
      temperatures, an electric voltage appears. It grows with the temperature difference
      and is therefore used to measure temperatures or to generate small amounts of power.
    example: >-
      Thermocouples, thermoelectric generators in space probes, waste-heat recovery
    conditions: >-
      Two different conductor or semiconductor materials; temperature difference between the
      junctions.
    limits: >-
      The voltage is small (microvolts per kelvin for metals); as a generator the efficiency
      is low.
    sideEffects: >-
      The reference junction must be known or compensated, otherwise the reading is wrong.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
