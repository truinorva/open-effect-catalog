text:
  de:
    name: Waage
    description: >-
      Eine Waage bestimmt die Masse eines Körpers über die Gewichtskraft, die er im Schwerefeld
      ausübt. Balkenwaagen vergleichen diese Kraft über einen Hebel mit bekannten Gewichtsstücken,
      Federwaagen und Wägezellen messen die Verformung eines elastischen Elements, und elektronische
      Präzisionswaagen kompensieren die Last elektromagnetisch.
    example: >-
      Laborwaagen, Küchen- und Personenwaagen, Fahrzeugwaagen, Dosier- und Abfüllwaagen in
      der Produktion, Bandwaagen für Schüttgut
    conditions: >-
      Eine ruhige Aufstellung; Federwaagen und Wägezellen müssen am Aufstellort kalibriert
      werden, weil die Fallbeschleunigung von Ort zu Ort leicht schwankt.
    limits: >-
      Erschütterungen, Luftströmungen, Temperaturänderungen und der Luftauftrieb begrenzen
      die Genauigkeit.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Weighing scale (balance)
    description: >-
      A scale determines the mass of a body from the weight force it exerts in a gravitational
      field. Beam balances compare this force via a lever with known weights, spring scales
      and load cells measure the deformation of an elastic element, and electronic precision
      balances compensate the load electromagnetically.
    example: >-
      Laboratory balances, kitchen and bathroom scales, weighbridges, dosing and filling scales
      in production, belt weighers for bulk solids
    conditions: >-
      A steady installation; spring scales and load cells must be calibrated where they are
      installed, because gravitational acceleration varies slightly from place to place.
    limits: >-
      Vibration, draughts, temperature changes and air buoyancy limit the accuracy.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
