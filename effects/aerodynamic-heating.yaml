text:
  de:
    name: Aerodynamische Erwärmung
    description: >-
      Bewegt sich ein Körper sehr schnell durch ein Gas, wird das Gas vor ihm und in der Grenzschicht
      an seiner Oberfläche stark abgebremst. Dabei wird Bewegungsenergie durch Verdichtung
      und innere Reibung in Wärme umgewandelt, und ein Teil dieser Wärme geht auf die Oberfläche
      des Körpers über.
    example: >-
      Hitzeschilde beim Wiedereintritt von Raumkapseln, Erwärmung von Rumpfnase und Flügelvorderkanten
      bei Überschallflugzeugen, Verglühen von Meteoren, Auslegung von Raketenspitzen
    conditions: >-
      Hohe Geschwindigkeit; technisch bedeutsam wird die Erwärmung etwa ab doppelter Schallgeschwindigkeit,
      im Hyperschall dominiert sie die Auslegung.
    limits: >-
      Bei niedrigen Geschwindigkeiten ist die Erwärmung vernachlässigbar, weil sie etwa mit
      dem Quadrat der Geschwindigkeit wächst.
    sideEffects: >-
      Werkstoffe verlieren bei der Erwärmung an Festigkeit, und die Wärmedehnung kann die
      Struktur verformen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Aerodynamic heating
    description: >-
      When a body moves very fast through a gas, the gas ahead of it and in the boundary layer
      on its surface is strongly decelerated. Kinetic energy is converted into heat by compression
      and internal friction, and part of this heat passes to the body's surface.
    example: >-
      Heat shields for re-entering space capsules, heating of the nose and wing leading edges
      of supersonic aircraft, meteors burning up, design of rocket nose cones
    conditions: >-
      High speed; the heating becomes technically significant from around twice the speed
      of sound and dominates design in hypersonic flight.
    limits: >-
      At low speeds the heating is negligible, because it grows roughly with the square of
      the speed.
    sideEffects: >-
      Materials lose strength as they heat up, and thermal expansion can distort the structure.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
