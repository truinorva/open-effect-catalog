text:
  de:
    name: Piezoelektrischer Effekt
    description: >-
      Bestimmte Kristalle und Keramiken bilden eine elektrische Spannung, wenn man sie verformt,
      weil sich die Ladungsschwerpunkte im Gitter gegeneinander verschieben. Umgekehrt verformen
      sie sich, wenn man eine Spannung anlegt; beide Richtungen nutzt die Technik.
    example: >-
      Kraft- und Drucksensoren, Gasanzünder, Quarzuhren, Ultraschallprüfköpfe, Piezo-Stellantriebe,
      Tintenstrahldruckköpfe
    conditions: >-
      Kristall ohne Symmetriezentrum (z. B. Quarz) oder polarisierte Keramik (z. B. PZT).
    limits: >-
      Eine statische Kraft lässt sich nur kurz messen, weil die Ladung abfließt. Die Stellwege
      liegen im Mikrometerbereich; über der Curie-Temperatur geht die Polarisation verloren.
    sideEffects: Hohe Betriebsspannungen; Hysterese und Kriechen bei Stellantrieben.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Piezoelectric effect
    description: >-
      Certain crystals and ceramics produce an electric voltage when deformed, because the
      centres of charge in the lattice shift against each other. Conversely, they deform when
      a voltage is applied; engineering uses both directions.
    example: >-
      Force and pressure sensors, gas lighters, quartz clocks, ultrasonic probes, piezo actuators,
      inkjet print heads
    conditions: >-
      Crystal without a centre of symmetry (e.g. quartz) or poled ceramic (e.g. PZT).
    limits: >-
      A static force can only be measured briefly because the charge leaks away. Strokes are
      in the micrometre range; above the Curie temperature the poling is lost.
    sideEffects: High operating voltages; hysteresis and creep in actuators.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
