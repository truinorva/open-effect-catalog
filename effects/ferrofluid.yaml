text:
  de:
    name: Ferrofluid
    description: >-
      Eine Flüssigkeit mit fein verteilten magnetischen Nanopartikeln, die von einem Magnetfeld
      als Ganzes angezogen wird. Mit Magneten lässt sie sich festhalten, verschieben und formen,
      ohne dass sie ihre Fließfähigkeit verliert.
    example: >-
      Dichtungen für rotierende Wellen (z. B. in Vakuumdurchführungen), Kühlung und Dämpfung
      von Lautsprecherspulen, Magnetfeld-Visualisierung
    conditions: Stabile Suspension (Partikel mit Tensidhülle); Magnetfeld mit Gradient.
    limits: >-
      Hält nur geringe Druckunterschiede; die Partikel können bei hohen Temperaturen oder
      durch Alterung ausflocken.
    sideEffects: Verschmutzt Oberflächen; schwer zu entfernen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Ferrofluid
    description: >-
      A liquid with finely dispersed magnetic nanoparticles that is attracted by a magnetic
      field as a whole. Magnets can hold, move and shape it without the liquid losing its
      ability to flow.
    example: >-
      Seals for rotating shafts (e.g. vacuum feedthroughs), cooling and damping of loudspeaker
      coils, visualising magnetic fields
    conditions: >-
      Stable suspension (particles with a surfactant coating); magnetic field with a gradient.
    limits: >-
      Holds only small pressure differences; the particles can flocculate at high temperatures
      or with ageing.
    sideEffects: Soils surfaces; hard to remove.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
