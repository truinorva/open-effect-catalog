    updated: '2026-11-19'
  en:
    name: Swashplate
    description: >-
      A disc is mounted at an angle to a shaft; parts that bear on it or are linked to it
      by joints are moved back and forth along the axis periodically as it rotates. The stroke
      depends on the tilt angle, so changing the angle alters the delivery of a pump. A two-part
      swashplate can also transmit control movements from a stationary to a rotating system.
    example: >-
      Axial piston pumps and motors in hydraulics, automotive air-conditioning compressors,
      blade pitch control of helicopter rotors
    conditions: ''
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
