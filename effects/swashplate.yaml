text:
  de:
    name: Taumelscheibe (Schrägscheibe)
    description: >-
      Eine Scheibe sitzt schräg zu einer Welle; Teile, die an ihr anliegen oder über Gelenke
      mit ihr verbunden sind, werden bei der Drehung periodisch in Achsrichtung hin- und herbewegt.
      Der Hub hängt vom Neigungswinkel ab, so dass sich durch Verstellen des Winkels die Fördermenge
      einer Pumpe ändern lässt. Eine zweiteilige Taumelscheibe überträgt außerdem Stellbewegungen
      von einem feststehenden auf ein drehendes System.
    example: >-
      Axialkolbenpumpen und -motoren in der Hydraulik, Klimakompressoren in Fahrzeugen, Blattverstellung
      von Hubschrauberrotoren
