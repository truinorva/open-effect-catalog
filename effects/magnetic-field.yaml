text:
  de:
    name: Magnetfeld (statisch und wechselnd)
    description: >-
      Ein Magnetfeld geht von Dauermagneten und elektrischen Strömen aus und übt Kräfte auf
      magnetisierbare Stoffe, andere Magnete und bewegte Ladungen aus. Ein statisches Feld
      zieht ferromagnetische Teile an und richtet sie aus; ein zeitlich wechselndes Feld induziert
      zusätzlich Spannungen und Wirbelströme in Leitern, die diese erwärmen oder in Bewegung
      versetzen können.
    example: >-
      Haftmagnete und Lasthebemagnete, Magnetscheider, Elektromotoren, Transformatoren, Induktionskochfelder,
      Magnetresonanztomographie
    conditions: >-
      Der beeinflusste Körper muss magnetisierbar sein, bewegte Ladungen tragen oder, bei
      Wechselfeldern, elektrisch leiten.
    limits: >-
      Die Feldstärke und damit die Kraft nehmen mit dem Abstand von der Quelle rasch ab, und
      ferromagnetische Stoffe verlieren oberhalb ihrer Curie-Temperatur ihre starke Magnetisierbarkeit.
    sideEffects: >-
      Wechselfelder erwärmen benachbarte Metallteile durch Wirbelströme, und starke Felder
      stören Elektronik und Herzschrittmacher.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Magnetic field (static and alternating)
    description: >-
      A magnetic field arises from permanent magnets and electric currents and exerts forces
      on magnetisable materials, other magnets and moving charges. A static field attracts
      ferromagnetic parts and aligns them; an alternating field also induces voltages and
      eddy currents in conductors, which can heat them or set them in motion.
    example: >-
      Holding and lifting magnets, magnetic separators, electric motors, transformers, induction
      hobs, magnetic resonance imaging
    conditions: >-
      The body acted on must be magnetisable, carry moving charges or, for alternating fields,
      conduct electricity.
    limits: >-
      Field strength, and with it the force, falls off quickly with distance from the source,
      and ferromagnetic materials lose their strong magnetisability above their Curie temperature.
    sideEffects: >-
      Alternating fields heat nearby metal parts through eddy currents, and strong fields
      disturb electronics and pacemakers.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
