text:
  de:
    name: Isoelektrische Fokussierung
    description: >-
      Amphotere Moleküle wie Proteine wandern in einem elektrischen Feld durch einen stabilen
      pH-Gradienten, bis sie die Stelle erreichen, an der der pH-Wert ihrem isoelektrischen
      Punkt entspricht. Dort ist ihre Nettoladung null und sie bleiben stehen; diffundieren
      sie davon weg, laden sie sich wieder auf und werden zurückgetrieben. So sammeln sich
      die Moleküle in scharfen Banden und werden nach ihrem isoelektrischen Punkt getrennt.
    example: >-
      Erste Dimension der zweidimensionalen Gelelektrophorese, Kapillar-IEF zur Charakterisierung
      therapeutischer Antikörper, präparative Proteinreinigung
    conditions: >-
      Ein stabiler pH-Gradient, meist aus Trägerampholyten oder im Gel immobilisiert, und
      eine hohe elektrische Spannung.
    limits: >-
      Proteine, die an ihrem isoelektrischen Punkt schlecht löslich sind, können ausfallen;
      Moleküle mit fast gleichem isoelektrischen Punkt lassen sich nur mit sehr flachen Gradienten
      trennen.
    sideEffects: Die hohe Spannung erwärmt das Gel, das deshalb gekühlt werden muss.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Isoelectric focusing
    description: >-
      In an electric field, amphoteric molecules such as proteins migrate through a stable
      pH gradient until they reach the point where the pH equals their isoelectric point.
      There their net charge is zero and they stop; if they diffuse away, they pick up charge
      again and are driven back. The molecules thus collect in sharp bands and are separated
      by their isoelectric point.
    example: >-
      First dimension of two-dimensional gel electrophoresis, capillary IEF for characterising
      therapeutic antibodies, preparative protein purification
    conditions: >-
      A stable pH gradient, usually formed by carrier ampholytes or immobilised in the gel,
      and a high voltage.
    limits: >-
      Proteins with low solubility at their isoelectric point may precipitate; molecules with
      almost identical isoelectric points can only be separated with very shallow gradients.
    sideEffects: The high voltage heats the gel, which therefore has to be cooled.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
