text:
  de:
    name: Metastabilität
    description: >-
      Ein metastabiler Zustand entspricht nicht dem energetisch günstigsten Gleichgewicht,
      ist aber durch eine Energiebarriere geschützt und bleibt deshalb lange bestehen. Erst
      ein Anstoß wie ein Kristallkeim, eine Erschütterung, eine Verunreinigung oder ein durchfliegendes
      geladenes Teilchen überwindet die Barriere, und das System geht oft schlagartig in den
      stabilen Zustand über. Dabei wird die gespeicherte Energie frei, etwa die Kristallisationswärme.
    example: >-
      Wärmekissen mit unterkühlter Natriumacetatlösung, Nebel- und Blasenkammern zum Nachweis
      ionisierender Teilchen, unterkühltes Wasser und übersättigte Lösungen, Diamant und Gläser
      bei Raumtemperatur, gehärteter Stahl (Martensit)
    conditions: >-
      Eine Energiebarriere zwischen dem metastabilen und dem stabilen Zustand und das Fehlen
      von Auslösern wie Keimen oder Erschütterungen.
    limits: >-
      Der Zustand ist störungsempfindlich und kann unerwartet umschlagen; je weiter er vom
      Gleichgewicht entfernt ist, desto kürzer bleibt er meist erhalten.
    sideEffects: >-
      Ungewolltes Umschlagen kann zu Siedeverzug mit herausspritzender heißer Flüssigkeit
      oder zu plötzlichem Auskristallisieren in Leitungen führen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Metastability
    description: >-
      A metastable state does not correspond to the energetically most favourable equilibrium
      but is protected by an energy barrier and therefore persists for a long time. Only a
      trigger such as a crystal seed, a shock, an impurity or a passing charged particle overcomes
      the barrier, and the system then often changes abruptly into the stable state. The stored
      energy is released in the process, for instance the heat of crystallisation.
    example: >-
      Heat packs with supercooled sodium acetate solution, cloud and bubble chambers for detecting
      ionising particles, supercooled water and supersaturated solutions, diamond and glasses
      at room temperature, hardened steel (martensite)
    conditions: >-
      An energy barrier between the metastable and the stable state, and the absence of triggers
      such as seeds or shocks.
    limits: >-
      The state is sensitive to disturbances and can flip unexpectedly; the further it is
      from equilibrium, the shorter it usually lasts.
    sideEffects: >-
      Unintended flipping can cause delayed boiling with hot liquid spurting out, or sudden
      crystallisation in pipes.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
