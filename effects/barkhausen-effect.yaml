text:
  de:
    name: Barkhausen-Effekt
    description: >-
      Wird ein ferromagnetischer Werkstoff ummagnetisiert, ändert sich seine Magnetisierung
      nicht stetig, sondern in vielen kleinen Sprüngen, weil Blochwände an Gitterfehlern hängen
      bleiben und sich dann ruckartig losreißen. In einer Spule erzeugen diese Sprünge Spannungsimpulse,
      das Barkhausen-Rauschen, dessen Stärke von Gefüge, Härte und mechanischen Spannungen
      im Werkstoff abhängt.
    example: >-
      Prüfung von Zahnrädern und Nockenwellen auf Schleifbrand, Messung von Eigenspannungen
      in Stahl, Wiegand-Sensoren mit sprunghafter Ummagnetisierung
    conditions: Ein ferromagnetischer Werkstoff und ein wechselndes äußeres Magnetfeld.
    limits: >-
      Die Messung erfasst nur eine oberflächennahe Schicht von meist unter einem Millimeter
      und muss für jeden Werkstoff kalibriert werden.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Barkhausen effect
    description: >-
      When a ferromagnetic material is remagnetised, its magnetisation does not change smoothly
      but in many small jumps, because domain walls get pinned at lattice defects and then
      break free abruptly. In a pick-up coil these jumps produce voltage pulses, the Barkhausen
      noise, whose strength depends on the microstructure, hardness and mechanical stresses
      in the material.
    example: >-
      Inspection of gears and camshafts for grinding burn, measurement of residual stresses
      in steel, Wiegand sensors with abrupt magnetisation reversal
    conditions: A ferromagnetic material and an alternating external magnetic field.
    limits: >-
      The measurement covers only a near-surface layer, usually less than one millimetre deep,
      and has to be calibrated for each material.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
