text:
  de:
    name: Freier Fall
    description: >-
      Wirkt auf einen Körper nur die Schwerkraft, beschleunigt er unabhängig von seiner Masse
      gleichmäßig mit der Fallbeschleunigung, auf der Erde mit etwa 9,81 m/s². Alles, was
      gemeinsam frei fällt, ist relativ zueinander schwerelos.
    example: >-
      Fallturm für Schwerelosigkeitsexperimente, Parabelflug, Schrotturm zur Herstellung von
      Bleikugeln, Absolutgravimeter, Fallprüfungen
    conditions: >-
      Keine nennenswerten anderen Kräfte, etwa im Vakuum oder bei kurzen Fallstrecken kompakter,
      schwerer Körper.
    limits: >-
      In Luft begrenzt der Strömungswiderstand die Geschwindigkeit auf eine Endgeschwindigkeit;
      die Dauer der Schwerelosigkeit hängt von der Fallhöhe ab.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Free fall
    description: >-
      When gravity is the only force acting on a body, it accelerates uniformly at the gravitational
      acceleration, about 9.81 m/s² on Earth, regardless of its mass. Everything falling freely
      together is weightless relative to each other.
    example: >-
      Drop towers for microgravity experiments, parabolic flights, shot towers for making
      lead shot, absolute gravimeters, drop tests
    conditions: >-
      No significant other forces, for instance in a vacuum or over short drops of compact,
      heavy bodies.
    limits: >-
      In air, drag limits the speed to a terminal velocity; the duration of weightlessness
      depends on the drop height.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
