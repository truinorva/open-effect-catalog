text:
  de:
    name: Rayleigh-Streuung
    description: >-
      Licht wird an Teilchen gestreut, die viel kleiner als seine Wellenlänge sind, etwa an
      Luftmolekülen: Das Wechselfeld der Welle regt die Elektronen zu Schwingungen an, und
      diese strahlen wie kleine Dipole in alle Richtungen ab. Die Streustärke wächst mit der
      vierten Potenz der Frequenz, sodass blaues Licht etwa fünf- bis sechsmal stärker gestreut
      wird als rotes.
    example: >-
      Blauer Himmel und rote Abendsonne, Dämpfungsgrenze und Rückstreumessung (OTDR) in Glasfasern,
      Rayleigh-Lidar für Temperatur und Dichte der oberen Atmosphäre, laserbasierte Dichte-
      und Temperaturmessung in Flammen
    conditions: >-
      Streuende Teilchen, die deutlich kleiner als die Wellenlänge sind, typischerweise unter
      etwa einem Zehntel davon.
    limits: >-
      Bei größeren Teilchen geht die Rayleigh-Streuung in die kaum farbabhängige Mie-Streuung
      über, weshalb Wolken und Nebel weiß erscheinen.
    sideEffects: >-
      In Glasfasern verursacht die Rayleigh-Streuung an Dichteschwankungen einen Großteil
      der Dämpfung.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Rayleigh scattering
    description: >-
      Light is scattered by particles much smaller than its wavelength, such as air molecules:
      the oscillating field of the wave makes the electrons oscillate, and they re-radiate
      in all directions like small dipoles. The scattering strength grows with the fourth
      power of the frequency, so blue light is scattered roughly five to six times more strongly
      than red.
    example: >-
      Blue sky and red sunsets, attenuation limit and backscatter measurement (OTDR) in optical
      fibres, Rayleigh lidar for temperature and density of the upper atmosphere, laser-based
      density and temperature measurement in flames
    conditions: >-
      Scattering particles much smaller than the wavelength, typically below about a tenth
      of it.
    limits: >-
      For larger particles Rayleigh scattering turns into Mie scattering, which hardly depends
      on colour; this is why clouds and fog look white.
    sideEffects: >-
      In optical fibres Rayleigh scattering from density fluctuations causes most of the attenuation.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
