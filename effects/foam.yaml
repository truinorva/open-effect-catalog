text:
  de:
    name: Schaum
    description: >-
      Ein Schaum besteht aus vielen Gasblasen, die durch dünne Wände aus Flüssigkeit oder
      Feststoff voneinander getrennt sind. Das eingeschlossene Gas macht ihn sehr leicht,
      behindert den Wärmetransport und lässt ihn unter Last nachgeben und Stoßenergie aufnehmen;
      flüssige Schäume decken Oberflächen ab und tragen Teilchen, feste Schäume entstehen
      durch Aufschäumen und Erstarren von Kunststoffen, Metallen oder Keramik.
    example: >-
      Dämmplatten aus Polystyrol und PU-Schaum, Verpackungspolster, Schaumstoffmatratzen,
      Löschschaum, Schaumflotation, Akustikschaumstoff, Schwämme
    conditions: >-
      Für flüssige Schäume grenzflächenaktive Stoffe, die die Blasenwände stabilisieren.
    limits: >-
      Flüssige Schäume zerfallen mit der Zeit, weil die Flüssigkeit abläuft und Blasen platzen;
      feste Schäume haben eine geringe Festigkeit.
    sideEffects: >-
      Viele Kunststoffschäume sind brennbar; in vielen Prozessen ist Schaumbildung unerwünscht.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Foam
    description: >-
      A foam consists of many gas bubbles separated from one another by thin walls of liquid
      or solid. The trapped gas makes it very light, hinders heat transport and lets it yield
      under load and absorb impact energy; liquid foams cover surfaces and carry particles,
      while solid foams are made by foaming and then solidifying plastics, metals or ceramics.
    example: >-
      Polystyrene and PU foam insulation boards, packaging cushions, foam mattresses, fire-fighting
      foam, froth flotation, acoustic foam, sponges
    conditions: For liquid foams, surfactants that stabilise the bubble walls.
    limits: >-
      Liquid foams break down over time as liquid drains and bubbles burst; solid foams have
      low strength.
    sideEffects: >-
      Many plastic foams are flammable; foaming is undesirable in many processes.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
