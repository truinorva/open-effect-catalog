text:
  de:
    name: Elektropermanentmagnet
    description: >-
      Ein Elektropermanentmagnet kombiniert einen hartmagnetischen Dauermagneten mit einem
      zweiten Magnetwerkstoff geringerer Koerzitivfeldstärke, etwa AlNiCo, der von einer Spule
      umgeben ist. Ein kurzer Stromstoß magnetisiert diesen Werkstoff um, so dass sich die
      Felder beider Magnete entweder an der Polfläche addieren oder im Inneren kurzschließen;
      danach hält der Magnet seinen Zustand ohne weitere Energiezufuhr.
    example: >-
      Lasthebemagnete für Stahlbleche, Magnetspannplatten an Werkzeugmaschinen, Greifer in
      der Robotik
    conditions: Ferromagnetisches Werkstück, das den Magnetkreis schließt.
    limits: >-
      Die Haltekraft sinkt stark mit Luftspalt, Oberflächenrauheit und bei dünnen Werkstücken.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electropermanent magnet
    description: >-
      An electropermanent magnet combines a hard permanent magnet with a second magnetic material
      of lower coercivity, such as AlNiCo, surrounded by a coil. A short current pulse reverses
      the magnetisation of this material, so that the fields of the two magnets either add
      up at the pole face or short-circuit internally; afterwards the magnet keeps its state
      with no further energy input.
    example: >-
      Lifting magnets for steel plates, magnetic chucks on machine tools, grippers in robotics
    conditions: Ferromagnetic workpiece that closes the magnetic circuit.
    limits: >-
      Holding force drops sharply with air gap, surface roughness and thin workpieces.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
