text:
  de:
    name: Resonante makrosonische Synthese (RMS)
    description: >-
      Bei der resonanten makrosonischen Synthese wird ein gasgefüllter, gezielt geformter
      Resonator periodisch angeregt, sodass sich darin eine stehende Schallwelle sehr hoher
      Amplitude aufbaut. In einem einfachen Rohr würden bei großen Amplituden Oberwellen entstehen
      und die Welle zu Stoßwellen aufsteilen; die besondere Form des Resonators verschiebt
      seine Eigenfrequenzen so, dass diese Energieübertragung unterdrückt wird und weit höhere
      Druckamplituden möglich sind.
    example: Akustische Verdichter für Kältemittel und andere Gase
    conditions: >-
      Eine Resonatorform, die auf Betriebsfrequenz und Gas abgestimmt ist, und ein Antrieb,
      der den Resonator genau in Resonanz anregt.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Resonant macrosonic synthesis (RMS)
    description: >-
      In resonant macrosonic synthesis a gas-filled resonator of specially designed shape
      is driven periodically so that a standing sound wave of very high amplitude builds up
      inside it. In a plain tube, large amplitudes would create harmonics and the wave would
      steepen into shock waves; the special shape of the resonator shifts its natural frequencies
      so that this energy transfer is suppressed and much higher pressure amplitudes are possible.
    example: Acoustic compressors for refrigerants and other gases
    conditions: >-
      A resonator shape tuned to the operating frequency and the gas, and a drive that excites
      the resonator exactly at resonance.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
