text:
  de:
    name: Kegeldorn (Spanndorn)
    description: >-
      Ein Kegeldorn ist ein leicht kegeliger, gehärteter und geschliffener Stahldorn, auf
      den ein Werkstück mit Bohrung aufgeschoben oder aufgepresst wird. Wegen der sehr geringen
      Kegelneigung klemmt das Werkstück selbsthemmend durch Reibung und sitzt dabei genau
      zentrisch zur Dornachse; der Dorn wird anschließend zwischen Spitzen gespannt, so dass
      Außenflächen rundlaufend zur Bohrung bearbeitet oder geprüft werden können.
    example: >-
      Drehen und Schleifen von Buchsen, Zahnrädern und Riemenscheiben bezogen auf ihre Bohrung,
      Rundlaufprüfung
    conditions: >-
      Bohrung mit enger Toleranz; geringe Kegelneigung, damit die Reibung das Werkstück hält.
    limits: >-
      Nur begrenzte Schnittkräfte sind übertragbar; die axiale Lage des Werkstücks hängt vom
      Bohrungsdurchmesser ab.
    sideEffects: Zu kräftiges Aufpressen kann die Bohrung aufweiten oder beschädigen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Taper mandrel
    description: >-
      A taper mandrel is a slightly tapered, hardened and ground steel arbor onto which a
      workpiece with a bore is pushed or pressed. Because the taper is very slight, the workpiece
      locks by friction and sits precisely concentric with the mandrel axis; the mandrel is
      then held between centres so that outer surfaces can be machined or checked to run true
      with the bore.
    example: >-
      Turning and grinding bushes, gears and pulleys relative to their bore, run-out inspection
    conditions: >-
      A bore with a close tolerance; a slight taper so that friction holds the workpiece.
    limits: >-
      Only limited cutting forces can be transmitted; the axial position of the workpiece
      depends on the bore diameter.
    sideEffects: Pressing on too hard can expand or damage the bore.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
