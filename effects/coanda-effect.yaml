text:
  de:
    name: Coandă-Effekt
    description: >-
      Ein Flüssigkeits- oder Gasstrahl, der dicht an einer gewölbten Oberfläche entlangströmt,
      legt sich an sie an und folgt ihrer Krümmung, statt geradeaus weiterzuströmen. Der Strahl
      reißt Umgebungsfluid mit; zwischen Strahl und Wand kann aber kaum etwas nachströmen,
      sodass dort ein Unterdruck entsteht, der den Strahl zur Wand zieht. So lassen sich Strömungen
      ohne bewegliche Teile umlenken und zusätzlich Umgebungsluft ansaugen.
    example: >-
      Ausblaseklappen und Hochauftriebshilfen an Flugzeugen, rotorblattlose Ventilatoren,
      heckrotorloses NOTAR-System bei Hubschraubern, Fluidik-Schalter und -Oszillatoren
    conditions: >-
      Ein Strahl, der tangential an einer glatten, nicht zu stark gekrümmten Oberfläche austritt.
    limits: >-
      Ist die Krümmung zu stark oder der Strahl zu langsam, löst er sich von der Wand ab.
    sideEffects: >-
      Strahlen können ungewollt an Wänden haften und dadurch in falsche Richtungen gelenkt
      werden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Coandă effect
    description: >-
      A jet of liquid or gas flowing close to a curved surface attaches to it and follows
      its curvature instead of continuing straight on. The jet entrains surrounding fluid,
      but little can flow in between jet and wall, so a low pressure develops there that pulls
      the jet towards the wall. This allows flows to be deflected without moving parts and
      additional ambient air to be drawn in.
    example: >-
      Blown flaps and high-lift devices on aircraft, bladeless fans, NOTAR anti-torque system
      on helicopters, fluidic switches and oscillators
    conditions: >-
      A jet emerging tangentially along a smooth, not too strongly curved surface.
    limits: >-
      If the curvature is too strong or the jet too slow, it separates from the wall.
    sideEffects: >-
      Jets can unintentionally cling to walls and be deflected in the wrong direction.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
