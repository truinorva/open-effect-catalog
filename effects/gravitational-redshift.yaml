text:
  de:
    name: Gravitative Rotverschiebung
    description: >-
      Licht, das aus einem Gravitationsfeld heraus nach oben läuft, verliert Energie und kommt
      mit niedrigerer Frequenz an; entsprechend gehen Uhren tiefer im Schwerefeld langsamer.
      Auf der Erde ist der Effekt winzig, lässt sich aber mit Atomuhren und Gammastrahlung
      nachweisen.
    example: >-
      Korrektur der Satellitenuhren beim GPS, Pound-Rebka-Experiment, Höhenvergleich mit optischen
      Atomuhren (relativistische Geodäsie), Spektrallinien Weißer Zwerge
    conditions: >-
      Ein Höhen- bzw. Potenzialunterschied im Schwerefeld zwischen Sender und Empfänger.
    limits: >-
      Auf der Erde beträgt die relative Frequenzänderung nur etwa 10⁻¹⁶ pro Meter Höhenunterschied,
      sodass extrem stabile Uhren nötig sind.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Gravitational redshift
    description: >-
      Light travelling upwards out of a gravitational field loses energy and arrives with
      a lower frequency; correspondingly, clocks deeper in the gravitational field run slower.
      On Earth the effect is tiny but can be detected with atomic clocks and gamma radiation.
    example: >-
      Correcting satellite clocks in GPS, Pound-Rebka experiment, height comparison with optical
      atomic clocks (relativistic geodesy), spectral lines of white dwarfs
    conditions: >-
      A height or potential difference in the gravitational field between emitter and receiver.
    limits: >-
      On Earth the relative frequency shift is only about 10⁻¹⁶ per metre of height difference,
      so extremely stable clocks are needed.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
