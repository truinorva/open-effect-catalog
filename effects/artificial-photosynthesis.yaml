text:
  de:
    name: Künstliche Photosynthese
    description: >-
      Bei der künstlichen Photosynthese wird Sonnenlicht genutzt, um Wasser in Wasserstoff
      und Sauerstoff zu spalten oder Kohlendioxid zu Brennstoffen wie Kohlenmonoxid, Methanol
      oder Ameisensäure zu reduzieren. Lichtabsorbierende Halbleiter oder Farbstoffe erzeugen
      dabei angeregte Ladungsträger, die an Katalysatoren die chemischen Reaktionen antreiben
      und so Lichtenergie in chemischen Bindungen speichern.
    example: >-
      Photoelektrochemische Zellen zur Wasserspaltung, Photokatalysatoren für solaren Wasserstoff,
      künstliche Blätter, Forschung zu solaren Kraftstoffen aus CO2
    conditions: >-
      Licht mit ausreichender Photonenenergie, stabile Katalysatoren und eine Trennung der
      entstehenden Gase.
    limits: >-
      Wirkungsgrad, Langzeitstabilität und Kosten reichen bisher nicht für eine breite wirtschaftliche
      Nutzung.
    sideEffects: >-
      Bei der Wasserspaltung entsteht ein explosives Gemisch, wenn Wasserstoff und Sauerstoff
      nicht getrennt abgeführt werden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Artificial photosynthesis
    description: >-
      Artificial photosynthesis uses sunlight to split water into hydrogen and oxygen or to
      reduce carbon dioxide to fuels such as carbon monoxide, methanol or formic acid. Light-absorbing
      semiconductors or dyes generate excited charge carriers that drive the chemical reactions
      at catalysts, storing light energy in chemical bonds.
    example: >-
      Photoelectrochemical cells for water splitting, photocatalysts for solar hydrogen, artificial
      leaves, research on solar fuels from CO2
    conditions: >-
      Light with sufficient photon energy, stable catalysts and separation of the gases produced.
    limits: >-
      Efficiency, long-term stability and cost are not yet sufficient for broad commercial
      use.
    sideEffects: >-
      Water splitting produces an explosive mixture if hydrogen and oxygen are not removed
      separately.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
