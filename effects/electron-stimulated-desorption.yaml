text:
  de:
    name: Elektronenstimulierte Desorption (Elektronenstoßdesorption)
    description: >-
      Treffen Elektronen auf eine Oberfläche, können sie adsorbierte Atome oder Moleküle elektronisch
      anregen oder ionisieren; die angeregten Teilchen lösen sich daraufhin als Neutralteilchen
      oder Ionen von der Oberfläche. Der Vorgang ist nicht thermisch: Elektronen mit Energien
      von einigen zehn Elektronenvolt genügen, ohne die Unterlage nennenswert zu erwärmen.
    example: >-
      Oberflächenanalyse (ESD, ESDIAD), Konditionieren von Vakuumkammern in Teilchenbeschleunigern
    conditions: >-
      Adsorbierte Schicht auf der Oberfläche und Elektronenenergien oberhalb der Anregungsschwelle.
    limits: Die Desorptionsausbeute je auftreffendem Elektron ist meist klein.
    sideEffects: >-
      In Vakuumanlagen erhöht die Desorption den Gasdruck, etwa an Wänden, die von Elektronen
      getroffen werden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Electron-stimulated desorption (electron impact desorption)
    description: >-
      When electrons strike a surface, they can electronically excite or ionise adsorbed atoms
      or molecules; the excited particles then leave the surface as neutrals or ions. The
      process is not thermal: electrons with energies of a few tens of electronvolts are sufficient,
      without appreciably heating the substrate.
    example: >-
      Surface analysis (ESD, ESDIAD), conditioning of vacuum chambers in particle accelerators
    conditions: >-
      Adsorbed layer on the surface and electron energies above the excitation threshold.
    limits: The desorption yield per incident electron is usually small.
    sideEffects: >-
      In vacuum systems, desorption raises the gas pressure, for instance on walls struck
      by electrons.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
