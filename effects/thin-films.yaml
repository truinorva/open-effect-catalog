text:
  de:
    name: Dünne Schichten
    description: >-
      Schichten von wenigen Nanometern bis einigen Mikrometern Dicke, die durch Aufdampfen,
      Sputtern, chemische Gasphasenabscheidung oder Beschichten aus Lösung auf ein Substrat
      aufgebracht werden, geben dessen Oberfläche Eigenschaften, die der Grundwerkstoff nicht
      hat. Weil die Schichtdicke im Bereich der Lichtwellenlänge liegen kann, lassen sich
      über Interferenz Reflexion und Farbe gezielt einstellen; andere Schichten sperren Gase,
      schützen vor Verschleiß und Korrosion oder leiten Strom.
    example: >-
      Entspiegelung von Brillengläsern, Wärmeschutzglas, Hartstoffschichten aus Titannitrid
      auf Werkzeugen, Barriereschichten in Lebensmittelverpackungen, Dünnschicht-Solarzellen,
      Leiterbahnen in Mikrochips
    conditions: >-
      Saubere Substratoberfläche und gute Haftung; viele Verfahren arbeiten im Vakuum.
    limits: >-
      Eigenspannungen begrenzen die Schichtdicke, da dickere Schichten reißen oder abplatzen.
    sideEffects: Unerwünschte Interferenzfarben, wo die Dicke ungleichmäßig ist.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Thin films
    description: >-
      Layers a few nanometres to several micrometres thick, applied to a substrate by evaporation,
      sputtering, chemical vapour deposition or coating from solution, give its surface properties
      the base material lacks. Because the thickness can be comparable to the wavelength of
      light, interference can be used to tune reflection and colour; other films block gases,
      protect against wear and corrosion or conduct electricity.
    example: >-
      Anti-reflection coatings on spectacle lenses, low-emissivity glazing, titanium nitride
      hard coatings on tools, barrier layers in food packaging, thin-film solar cells, interconnects
      in microchips
    conditions: >-
      Clean substrate surface and good adhesion; many processes work in vacuum.
    limits: >-
      Internal stresses limit the film thickness, since thicker films crack or delaminate.
    sideEffects: Unwanted interference colours where the thickness is uneven.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
