text:
  de:
    name: Scherverdickung (Dilatanz)
    description: >-
      In dilatanten Flüssigkeiten steigt die Viskosität, je schneller sie geschert werden.
      Typisch sind hochkonzentrierte Suspensionen: Bei langsamer Bewegung gleiten die Teilchen
      auf einem Flüssigkeitsfilm aneinander vorbei, bei schneller Belastung drängen sie sich
      zu Clustern zusammen und verhaken sich, so dass das Gemisch kurzzeitig fast fest wird.
      Lässt die Belastung nach, fließt es wieder.
    example: >-
      Aufprallschutz-Polster in Sport- und Motorradbekleidung, mit scherverdickender Flüssigkeit
      getränkte Schutzgewebe, Brei aus Maisstärke und Wasser
    conditions: >-
      Suspension mit sehr hohem Feststoffanteil nahe der dichtesten Packung; schnelle Scherung
      oder Stoß.
    limits: ''
    sideEffects: >-
      Beim Pumpen, Mischen oder Versprühen konzentrierter Suspensionen kann die plötzliche
      Verdickung Leitungen und Düsen blockieren.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Shear thickening (dilatancy)
    description: >-
      In dilatant fluids the viscosity rises the faster they are sheared. Typical examples
      are highly concentrated suspensions: under slow motion the particles slide past each
      other on a film of liquid, but under rapid loading they crowd together into clusters
      and jam, so the mixture briefly becomes almost solid. Once the load eases, it flows
      again.
    example: >-
      Impact-protection pads in sports and motorcycle clothing, protective fabrics impregnated
      with shear-thickening fluid, cornstarch-and-water slurry
    conditions: >-
      Suspension with a very high solids fraction close to maximum packing; rapid shear or
      impact.
    limits: ''
    sideEffects: >-
      When pumping, mixing or spraying concentrated suspensions, sudden thickening can block
      pipes and nozzles.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
