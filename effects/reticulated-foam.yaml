text:
  de:
    name: Retikulierter Schaumstoff
    description: >-
      Retikulierter Schaumstoff ist ein offenzelliger Schaum, meist aus Polyurethan, bei dem
      die dünnen Zellwände nachträglich entfernt wurden, etwa durch eine kontrollierte Verpuffung
      in einer Kammer oder durch chemisches Herauslösen. Übrig bleibt ein dreidimensionales
      Netz aus Stegen mit sehr hohem Hohlraumanteil, das Gase und Flüssigkeiten fast ungehindert
      durchströmen lässt und dabei Partikel zurückhält.
    example: >-
      Luft- und Aquarienfilter, Füllung von Kraftstofftanks in Rennwagen und Flugzeugen gegen
      Schwappen und Explosionen, Lautsprecherabdeckungen, Schaumstofftupfer, Vorlagen für
      Metall- und Keramikschäume
    conditions: ''
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Reticulated foam
    description: >-
      Reticulated foam is an open-cell foam, usually polyurethane, in which the thin cell
      windows have been removed afterwards, for example by a controlled deflagration in a
      chamber or by chemical dissolution. What remains is a three-dimensional network of struts
      with very high void fraction that lets gases and liquids pass almost unhindered while
      retaining particles.
    example: >-
      Air and aquarium filters, filling for fuel tanks in racing cars and aircraft against
      sloshing and explosions, loudspeaker grilles, foam swabs, templates for metal and ceramic
      foams
    conditions: ''
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
