text:
  de:
    name: Tritium
    description: >-
      Tritium ist das radioaktive Isotop des Wasserstoffs mit einer Halbwertszeit von rund
      12,3 Jahren. Es zerfällt unter Aussendung sehr energiearmer Betastrahlung, die schon
      dünnes Glas vollständig zurückhält; in einem innen mit Leuchtstoff beschichteten Glasröhrchen
      regt sie diesen über Jahre ohne Stromquelle zum Leuchten an. Als Bestandteil von Wasser
      eignet es sich außerdem als Markierungsstoff und zur Altersbestimmung von Grundwasser.
    example: >-
      Selbstleuchtende Notausgangsschilder, Leuchtmarkierungen an Uhren, Kompassen und Zielvorrichtungen,
      Grundwasser-Altersbestimmung, Brennstoff für die Kernfusion
    conditions: Dicht verschlossene Glaskapsel mit Leuchtstoffbeschichtung.
    limits: Die Leuchtdichte ist gering und halbiert sich etwa alle 12 Jahre.
    sideEffects: >-
      Gelangt freigesetztes Tritium als Gas oder Wasser in den Körper, belastet es ihn mit
      Strahlung; Herstellung und Entsorgung unterliegen dem Strahlenschutzrecht.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Tritium
    description: >-
      Tritium is the radioactive isotope of hydrogen, with a half-life of about 12.3 years.
      It decays by emitting very low-energy beta radiation that is completely stopped even
      by thin glass; in a glass tube coated inside with phosphor it makes the phosphor glow
      for years without any power source. As part of water it is also suitable as a tracer
      and for dating groundwater.
    example: >-
      Self-luminous exit signs, luminous markings on watches, compasses and sights, groundwater
      dating, fuel for nuclear fusion
    conditions: Hermetically sealed glass capsule with a phosphor coating.
    limits: Luminance is low and halves roughly every 12 years.
    sideEffects: >-
      Released tritium taken into the body as gas or water exposes it to radiation; manufacture
      and disposal are subject to radiation protection regulations.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
