text:
  de:
    name: Argonblitz (Argonbombe)
    description: >-
      Eine Sprengladung treibt eine starke Stoßwelle in ein mit Argon gefülltes Gefäß oder
      eine Hülle. Hinter der Stoßfront wird das Edelgas schlagartig auf viele tausend Kelvin
      erhitzt und sendet einen sehr hellen, nur Mikrosekunden dauernden Lichtblitz aus; als
      einatomiges Gas verliert Argon dabei keine Energie an Molekülschwingungen oder Dissoziation
      und wird deshalb besonders heiß.
    example: >-
      Beleuchtung für Hochgeschwindigkeitsaufnahmen von Detonationen und Einschlägen, Pumplichtquelle
      für explosionsgepumpte Laser
    conditions: >-
      Sprengstoff und eine Argonfüllung; nur auf Sprengplätzen und in Versuchsanlagen anwendbar.
    limits: >-
      Jede Lichtquelle wird beim Blitz zerstört und kann nur einmal verwendet werden.
    sideEffects: >-
      Detonation, Splitter und Druckwelle erfordern ein abgesichertes Sprenggelände.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Argon flash (argon bomb)
    description: >-
      An explosive charge drives a strong shock wave into a vessel or envelope filled with
      argon. Behind the shock front the noble gas is heated abruptly to many thousands of
      kelvin and emits a very bright flash lasting only microseconds; being monatomic, argon
      loses no energy to molecular vibration or dissociation and therefore gets particularly
      hot.
    example: >-
      Illumination for high-speed photography of detonations and impacts, pump light source
      for explosively pumped lasers
    conditions: >-
      Explosive and an argon fill; usable only on blasting ranges and in test facilities.
    limits: Each light source is destroyed by the flash and can be used only once.
    sideEffects: Detonation, fragments and blast wave require a secured blasting area.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
