text:
  de:
    name: Trockenmittel
    description: >-
      Trockenmittel sind Stoffe, die Wasser aus Luft, Gasen oder Flüssigkeiten binden – durch
      Adsorption an einer großen inneren Oberfläche wie Kieselgel, Zeolith und Aktivtonerde
      oder chemisch und durch Zerfließen wie Calciumchlorid. In geschlossenen Verpackungen
      oder Trockenkolonnen halten sie so die Feuchte niedrig. Adsorptive Trockenmittel lassen
      sich durch Erhitzen regenerieren.
    example: >-
      Kieselgel-Beutel in Verpackungen, Exsikkator im Labor, Drucklufttrockner, Trocknen von
      Lösemitteln mit Molekularsieb, Isolierglasscheiben, Sorptionsräder in Klimaanlagen
    conditions: >-
      Ein geschlossener oder durchströmter Raum, damit das Trockenmittel nicht ständig neue
      Feuchte aus der Umgebung aufnimmt.
    limits: >-
      Die Aufnahmefähigkeit ist begrenzt, und gesättigtes Trockenmittel muss ersetzt oder
      regeneriert werden.
    sideEffects: >-
      Bei der Wasseraufnahme wird Wärme frei, und manche Trockenmittel sind ätzend oder als
      Staub gesundheitsschädlich.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Desiccant
    description: >-
      Desiccants are substances that bind water from air, gases or liquids – by adsorption
      on a large internal surface, like silica gel, zeolite and activated alumina, or chemically
      and by deliquescence, like calcium chloride. In closed packaging or drying columns they
      keep humidity low. Adsorptive desiccants can be regenerated by heating.
    example: >-
      Silica gel sachets in packaging, laboratory desiccators, compressed-air dryers, drying
      solvents with molecular sieves, insulating glass units, desiccant wheels in air-conditioning
    conditions: >-
      A closed or flowed-through space, so that the desiccant does not continuously take up
      new moisture from the surroundings.
    limits: >-
      The uptake capacity is limited, and saturated desiccant has to be replaced or regenerated.
    sideEffects: >-
      Heat is released when water is taken up, and some desiccants are corrosive or harmful
      as dust.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
