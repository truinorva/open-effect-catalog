text:
  de:
    name: Piezoventilator
    description: >-
      Ein Piezoventilator besteht aus einem dünnen, biegsamen Blatt, an dessen Fuß ein piezoelektrisches
      Biegeelement sitzt. Eine Wechselspannung nahe der Resonanzfrequenz lässt das Blatt mit
      großer Amplitude hin und her schlagen, sodass es wie ein Fächer einen gerichteten Luftstrom
      erzeugt. Weil Motor und Lager fehlen, ist er leise, sparsam und langlebig.
    example: >-
      Kühlung von LED-Leuchten und Elektronik in engen Gehäusen, gezielte Kühlung heißer Bauteile
      auf Leiterplatten
    conditions: Betrieb nahe der Resonanzfrequenz des Blatts.
    limits: >-
      Luftmenge und Druckaufbau sind deutlich geringer als bei rotierenden Lüftern.
    sideEffects: >-
      Je nach Frequenz können hörbare Töne entstehen oder Vibrationen auf das Gehäuse übertragen
      werden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Piezoelectric fan
    description: >-
      A piezoelectric fan consists of a thin, flexible blade with a piezoelectric bending
      element at its base. An alternating voltage near the resonance frequency makes the blade
      swing back and forth with a large amplitude, so that like a hand fan it produces a directed
      air flow. Having no motor or bearings, it is quiet, economical and long-lived.
    example: >-
      Cooling of LED luminaires and electronics in confined housings, targeted cooling of
      hot components on circuit boards
    conditions: Operation close to the resonance frequency of the blade.
    limits: Air flow and pressure are much lower than with rotary fans.
    sideEffects: >-
      Depending on the frequency, audible tones can arise or vibrations can be transmitted
      to the housing.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
