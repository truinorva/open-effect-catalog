text:
  de:
    name: Agglomeration
    description: >-
      Feine Partikel haften aneinander und bilden größere Verbände, die Agglomerate. Die Haftung
      beruht auf Van-der-Waals-Kräften, Flüssigkeitsbrücken, elektrostatischer Anziehung,
      Bindemitteln oder Sinterbrücken; technisch wird sie durch Rollen, Mischen, Pressen,
      Sprühen oder Flocken gezielt herbeigeführt, um Pulver staubarm, rieselfähig oder leichter
      abtrennbar zu machen.
    example: >-
      Granulieren von Düngemitteln und Arzneipulvern, Pelletieren von Erz, Instantpulver,
      Flockung in der Wasseraufbereitung, Brikettieren
    conditions: >-
      Enge Kontakte zwischen den Partikeln und haftvermittelnde Kräfte oder Bindemittel.
    limits: >-
      Ohne feste Bindungen bleiben Agglomerate empfindlich und zerfallen unter mechanischer
      Belastung wieder.
    sideEffects: >-
      Ungewollt führt Agglomeration zu Klumpen, Brückenbildung in Silos und schlecht dosierbaren
      Pulvern.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Agglomeration
    description: >-
      Fine particles stick together and form larger clusters, the agglomerates. Adhesion comes
      from van der Waals forces, liquid bridges, electrostatic attraction, binders or sinter
      bridges; in industry it is brought about deliberately by tumbling, mixing, pressing,
      spraying or flocculation to make powders low-dust, free-flowing or easier to separate.
    example: >-
      Granulation of fertilisers and pharmaceutical powders, iron ore pelletising, instant
      powders, flocculation in water treatment, briquetting
    conditions: Close contact between the particles and adhesive forces or binders.
    limits: >-
      Without solid bonds, agglomerates remain fragile and break apart again under mechanical
      load.
    sideEffects: >-
      When unwanted, agglomeration causes lumps, bridging in silos and powders that are hard
      to dose.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
