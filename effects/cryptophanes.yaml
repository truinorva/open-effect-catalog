text:
  de:
    name: Kryptophane
    description: >-
      Kryptophane sind käfigförmige organische Moleküle aus zwei schalenförmigen Hälften,
      die über Brücken miteinander verbunden sind. In ihren Hohlraum passen kleine neutrale
      Gäste wie Xenon, Methan oder Chloroform, die dort durch schwache Van-der-Waals-Kräfte
      festgehalten werden. Je nach Käfiggröße binden sie bestimmte Gäste bevorzugt.
    example: >-
      Xenon-Biosensoren für die Magnetresonanztomographie mit hyperpolarisiertem Xenon-129,
      optische Methansensoren in der Forschung, Modellsysteme der Wirt-Gast-Chemie
    conditions: >-
      Ein Gastmolekül passender Größe, wobei viele Kryptophane nur in organischen Lösemitteln
      löslich sind und für wässrige Anwendungen wasserlösliche Varianten nötig sind.
    limits: >-
      Wegen der aufwendigen, mehrstufigen Synthese mit geringen Ausbeuten werden sie bisher
      kaum außerhalb des Labors eingesetzt.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Cryptophanes
    description: >-
      Cryptophanes are cage-shaped organic molecules made of two bowl-shaped halves joined
      by bridges. Their cavity can hold small neutral guests such as xenon, methane or chloroform,
      which are held there by weak van der Waals forces. Depending on the size of the cage,
      they preferentially bind certain guests.
    example: >-
      Xenon biosensors for magnetic resonance imaging with hyperpolarised xenon-129, optical
      methane sensors in research, model systems for host-guest chemistry
    conditions: >-
      A guest molecule of suitable size, and since many cryptophanes dissolve only in organic
      solvents, water-soluble variants for aqueous applications.
    limits: >-
      Because of their elaborate multi-step synthesis with low yields they are hardly used
      outside the laboratory so far.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
