text:
  de:
    name: Laserstrahlschweißen
    description: >-
      Beim Laserstrahlschweißen wird ein fokussierter Laserstrahl auf die Fügestelle gerichtet
      und schmilzt die Werkstoffe dort örtlich auf, die beim Erstarren eine Schweißnaht bilden.
      Bei hoher Leistungsdichte verdampft Metall und bildet eine schmale Dampfkapillare, über
      die der Strahl tief in das Werkstück eindringt (Tiefschweißen); bei geringerer Leistungsdichte
      schmilzt nur die Oberfläche (Wärmeleitungsschweißen). Die Wärme wirkt dabei nur auf
      eine sehr kleine Zone, so dass schmale Nähte mit wenig Verzug entstehen.
    example: >-
      Karosseriebau, Batteriezellen und -module, Getriebeteile, Medizinimplantate, Laserdurchstrahlschweißen
      von Kunststoffen, Schmuckreparatur
    conditions: >-
      Gut passende Fügeflächen mit kleinem Spalt und ein Werkstoff, der die Laserwellenlänge
      ausreichend absorbiert.
    limits: >-
      Wegen des kleinen Brennflecks sind enge Spalttoleranzen nötig; stark reflektierende
      Metalle wie Kupfer sind mit infraroten Lasern schwer zu schweißen.
    sideEffects: >-
      Schnelle Abkühlung kann härtbare Stähle aufhärten und rissig machen; reflektierte Strahlung
      erfordert eine abgeschirmte Arbeitszelle.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Laser beam welding
    description: >-
      In laser beam welding, a focused laser beam is directed at the joint and locally melts
      the materials, which form a weld seam as they solidify. At high power density, metal
      evaporates and forms a narrow vapour capillary (keyhole) through which the beam penetrates
      deep into the workpiece; at lower power density only the surface melts (conduction welding).
      The heat acts on a very small zone, producing narrow seams with little distortion.
    example: >-
      Car body construction, battery cells and modules, gearbox parts, medical implants, laser
      transmission welding of plastics, jewellery repair
    conditions: >-
      Well-fitting joint faces with a small gap and a material that absorbs the laser wavelength
      sufficiently.
    limits: >-
      Because of the small focal spot, tight gap tolerances are needed; highly reflective
      metals such as copper are difficult to weld with infrared lasers.
    sideEffects: >-
      Rapid cooling can harden and crack hardenable steels; reflected radiation requires a
      shielded work cell.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
