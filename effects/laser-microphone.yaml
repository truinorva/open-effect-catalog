text:
  de:
    name: Lasermikrofon
    description: >-
      Ein Lasermikrofon richtet einen Laserstrahl auf eine Fläche, die von Schallwellen in
      feine Schwingungen versetzt wird, etwa eine Fensterscheibe. Die Schwingungen verändern
      Laufweg oder Richtung des reflektierten Lichts geringfügig; ein Fotodetektor oder ein
      Interferometer wandelt diese Schwankungen wieder in ein Tonsignal um. So lässt sich
      Schall aus der Ferne aufnehmen, ohne dass sich ein Mikrofon im Raum befindet.
    example: >-
      Abhören von Gesprächen hinter Fensterscheiben, berührungslose Schallmessung an schwer
      zugänglichen Flächen
    conditions: >-
      Sichtverbindung zu einer reflektierenden Fläche, die vom Schall angeregt wird.
    limits: >-
      Umgebungsgeräusche, Gebäudeerschütterungen und Luftunruhe im Strahlweg überlagern das
      Signal.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Laser microphone
    description: >-
      A laser microphone aims a laser beam at a surface that sound waves set into tiny vibrations,
      such as a window pane. The vibrations slightly change the path length or direction of
      the reflected light; a photodetector or an interferometer converts these fluctuations
      back into an audio signal. Sound can thus be picked up from a distance without a microphone
      in the room.
    example: >-
      Eavesdropping on conversations behind window panes, contactless sound measurement on
      surfaces that are hard to reach
    conditions: Line of sight to a reflecting surface excited by sound.
    limits: >-
      Ambient noise, building vibrations and air turbulence in the beam path overlay the signal.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
