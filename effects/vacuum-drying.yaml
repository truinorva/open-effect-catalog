text:
  de:
    name: Vakuumtrocknung
    description: >-
      Das feuchte Gut kommt in eine Kammer unter Unterdruck, in der Wasser oder Lösemittel
      schon bei niedriger Temperatur verdampfen. Weil im Vakuum kaum Konvektion stattfindet,
      wird die Wärme über beheizte Platten, Strahlung oder Mikrowellen zugeführt, und der
      Dampf wird abgepumpt oder kondensiert. So trocknen wärmeempfindliche Produkte schonend
      und ohne Kontakt mit Luftsauerstoff.
    example: >-
      Trocknung von Arzneimittelwirkstoffen, Vakuumtrocknung von Schnittholz, Trocknung von
      Transformatorisolierungen, Gefriertrocknung von Lebensmitteln als Sonderform
    conditions: Dichte Kammer, Vakuumpumpe und Wärmezufuhr ohne Luftströmung.
    limits: >-
      Der Wärmeübergang ins Gut ist schlecht, daher dauert das Trocknen dicker Schichten lange.
    sideEffects: Flüchtige Aromastoffe können mit dem Wasser entweichen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Vacuum drying
    description: >-
      The moist material is placed in a chamber under reduced pressure, where water or solvents
      evaporate at a low temperature. Because there is hardly any convection in a vacuum,
      heat is supplied via heated plates, radiation or microwaves, and the vapour is pumped
      off or condensed. Heat-sensitive products thus dry gently and without contact with atmospheric
      oxygen.
    example: >-
      Drying of pharmaceutical ingredients, vacuum kiln drying of timber, drying of transformer
      insulation, freeze-drying of food as a special case
    conditions: Tight chamber, vacuum pump and heat supply without air flow.
    limits: >-
      Heat transfer into the material is poor, so drying thick layers takes a long time.
    sideEffects: Volatile aroma compounds can escape together with the water.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
