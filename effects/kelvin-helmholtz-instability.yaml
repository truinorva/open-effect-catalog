text:
  de:
    name: Kelvin-Helmholtz-Instabilität
    description: >-
      Gleiten zwei Fluidschichten mit unterschiedlicher Geschwindigkeit aneinander vorbei,
      wachsen kleine Wellen an ihrer Grenzfläche an, weil der Druck über den Wellenbergen
      sinkt und sie weiter anhebt. Die Wellen rollen sich schließlich zu Wirbeln auf, die
      die beiden Schichten miteinander vermischen. Eine Dichteschichtung mit dem schwereren
      Fluid unten und die Oberflächenspannung wirken stabilisierend.
    example: >-
      Windwellen auf Wasser, Wogenwolken am Himmel, Durchmischung von Meeres- und Luftschichten,
      Zerfall von Flüssigkeitsstrahlen in Luftzerstäuberdüsen, Wolkenbänder auf Jupiter
    conditions: >-
      Eine ausreichend große Geschwindigkeitsdifferenz an der Grenzfläche im Verhältnis zur
      stabilisierenden Schichtung; bei kontinuierlicher Schichtung ist eine Richardson-Zahl
      unter 0,25 notwendig.
    limits: >-
      Stabile Dichteschichtung und Oberflächenspannung unterdrücken das Anwachsen kurzer Wellen;
      bei zu geringer Scherung bleibt die Grenzfläche glatt.
    sideEffects: >-
      In der Atmosphäre verursacht die Instabilität Turbulenz in wolkenfreier Luft, die den
      Flugverkehr stört.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Kelvin-Helmholtz instability
    description: >-
      When two fluid layers slide past each other at different speeds, small waves on their
      interface grow because the pressure above the wave crests drops and lifts them further.
      The waves eventually roll up into vortices that mix the two layers. Density stratification
      with the heavier fluid below, as well as surface tension, has a stabilising effect.
    example: >-
      Wind waves on water, billow clouds, mixing of ocean and atmospheric layers, break-up
      of liquid jets in air-blast atomisers, cloud bands on Jupiter
    conditions: >-
      A sufficiently large velocity difference at the interface relative to the stabilising
      stratification; in a continuously stratified flow a Richardson number below 0.25 is
      necessary.
    limits: >-
      Stable density stratification and surface tension suppress the growth of short waves;
      with too little shear the interface stays smooth.
    sideEffects: >-
      In the atmosphere the instability causes clear-air turbulence, which disturbs air traffic.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
