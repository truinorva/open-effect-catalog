text:
  de:
    name: Cheerios-Effekt
    description: >-
      Kleine Gegenstände, die auf einer Flüssigkeitsoberfläche schwimmen, ziehen einander
      und den Gefäßrand an. Jeder Gegenstand verformt die Oberfläche zu einem Meniskus; ein
      benachbarter Gegenstand mit gleich gerichtetem Meniskus gleitet in diese Mulde bzw.
      auf diese Erhebung, weil er dadurch seine Energie aus Auftrieb und Oberflächenspannung
      verringert. Gegenstände mit entgegengesetzt gekrümmten Menisken stoßen sich dagegen
      ab.
    example: >-
      Zusammenklumpen von Frühstücksflocken in der Milch, Blasen auf Bier und Kaffee, die
      sich am Rand sammeln, Selbstanordnung von Mikrobauteilen an Flüssigkeitsgrenzflächen,
      Insekten, die Menisken hinaufklettern
    conditions: >-
      Leichte, schwimmende Gegenstände, die die Oberfläche merklich verformen, in Abständen
      in der Größenordnung der Kapillarlänge (bei Wasser einige Millimeter).
    limits: >-
      Über Abstände, die deutlich größer sind als die Kapillarlänge, ist die Kraft vernachlässigbar.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Cheerios effect
    description: >-
      Small objects floating on a liquid surface attract each other and the wall of the container.
      Each object deforms the surface into a meniscus; a neighbouring object with a meniscus
      of the same orientation slides into this dip or onto this rise, because doing so lowers
      its energy from buoyancy and surface tension. Objects with oppositely curved menisci
      repel each other.
    example: >-
      Clumping of breakfast cereal in milk, bubbles on beer and coffee gathering at the rim,
      self-assembly of micro-components at liquid interfaces, insects climbing menisci
    conditions: >-
      Light floating objects that noticeably deform the surface, at distances of the order
      of the capillary length (a few millimetres for water).
    limits: >-
      At distances much larger than the capillary length the force is negligible.
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
