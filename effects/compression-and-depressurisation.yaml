text:
  de:
    name: Kompression und Druckentlastung
    description: >-
      Wirken auf einen Körper von mehreren Seiten nach innen gerichtete Kräfte, wird er zusammengedrückt:
      Sein Volumen nimmt ab, seine Dichte zu, und im Inneren baut sich ein Druck bzw. eine
      Druckspannung auf. Gase lassen sich stark, Flüssigkeiten und Feststoffe nur wenig verdichten;
      lose Schüttgüter verdichten sich vor allem, weil die Hohlräume zwischen den Körnern
      verschwinden. Bei der umgekehrten Druckentlastung dehnt sich der Stoff wieder aus –
      gelöste Gase perlen aus, Flüssigkeiten können schlagartig verdampfen, und Zellen oder
      Körner können aufplatzen.
    example: >-
      Pressen von Pulvern zu Tabletten und Grünlingen, Ballenpressen, Bodenverdichtung, Puffreis
      aus der Puffkanone, Dampfexplosion zum Aufschluss von Biomasse, Ausperlen von Getränken
      beim Öffnen, Zellaufschluss durch Druckentspannung
    conditions: ''
    limits: >-
      Flüssigkeiten und Feststoffe lassen sich selbst unter sehr hohem Druck nur um wenige
      Prozent verdichten.
    sideEffects: >-
      Schnelles Verdichten erwärmt Gase, schnelles Entspannen kühlt sie ab; plötzliche Druckentlastung
      kann Behälter, Bauteile und Lebewesen schädigen (z. B. Dekompressionskrankheit).
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Compression and depressurisation
    description: >-
      When inward forces act on a body from several sides, it is squeezed together: its volume
      decreases, its density increases and a pressure or compressive stress builds up inside.
      Gases can be compressed strongly, liquids and solids only slightly; loose bulk solids
      compact mainly because the voids between the grains disappear. On the reverse, depressurisation,
      the material expands again – dissolved gases bubble out, liquids can flash into vapour
      and cells or grains can burst open.
    example: >-
      Pressing powders into tablets and green compacts, baling presses, soil compaction, puffed
      rice from puffing guns, steam explosion pretreatment of biomass, drinks fizzing on opening,
      cell disruption by pressure release
    conditions: ''
    limits: >-
      Liquids and solids can be compressed by only a few per cent even under very high pressure.
    sideEffects: >-
      Rapid compression heats gases and rapid expansion cools them; sudden depressurisation
      can damage containers, components and living beings (e.g. decompression sickness).
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
