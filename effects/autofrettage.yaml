text:
  de:
    name: Autofrettage
    description: >-
      Ein dickwandiges Rohr oder Druckbauteil wird einmalig mit einem Druck beaufschlagt,
      der deutlich über dem späteren Betriebsdruck liegt, sodass die inneren Wandschichten
      plastisch fließen, während die äußeren elastisch bleiben. Nach dem Entlasten drücken
      die äußeren Schichten die bleibend gedehnte Innenzone zusammen; die so entstandenen
      Druckeigenspannungen an der Bohrung senken die Spannungen im Betrieb und verzögern das
      Wachstum von Ermüdungsrissen.
    example: >-
      Geschützrohre, Hochdruckleitungen und Rails von Diesel-Einspritzsystemen, Hochdruckteile
      von Wasserstrahlschneidanlagen, Hochdruckpumpen und -reaktoren
    conditions: >-
      Ein zäher, ausreichend verformbarer Werkstoff und eine im Verhältnis zum Durchmesser
      dicke Wand.
    limits: >-
      Der Bauschinger-Effekt begrenzt die erreichbaren Eigenspannungen, und hohe Betriebstemperaturen
      können sie teilweise wieder abbauen.
    sideEffects: >-
      Die Bohrung wird bleibend aufgeweitet und muss oft nachbearbeitet werden.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Autofrettage
    description: >-
      A thick-walled tube or pressure component is loaded once with a pressure well above
      its later working pressure, so that the inner wall layers yield plastically while the
      outer layers stay elastic. After unloading, the outer layers squeeze the permanently
      stretched inner zone; the resulting compressive residual stresses at the bore lower
      the stresses in service and delay the growth of fatigue cracks.
    example: >-
      Gun barrels, high-pressure lines and rails of diesel injection systems, high-pressure
      parts of waterjet cutting machines, high-pressure pumps and reactors
    conditions: >-
      A tough, sufficiently ductile material and a wall that is thick relative to the diameter.
    limits: >-
      The Bauschinger effect limits the residual stresses that can be achieved, and high service
      temperatures can partly relax them again.
    sideEffects: >-
      The bore is permanently enlarged and often has to be machined afterwards.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
