text:
  de:
    name: Kondensation
    description: >-
      Kühlt ein Dampf an einer Oberfläche oder im Gasraum unter seinen Taupunkt ab, geht er
      in die flüssige Phase über. Dabei wird die Verdampfungswärme wieder frei; das macht
      kondensierenden Dampf zu einem sehr wirksamen Wärmeträger, der bei konstanter Temperatur
      heizt. Zugleich wird die kondensierbare Komponente aus dem Gas abgeschieden.
    example: >-
      Dampfheizung, Kondensator im Kraftwerk, Wärmerohr, Luftentfeuchter, Lösemittelrückgewinnung,
      Tau- und Wolkenbildung
    conditions: >-
      Der Partialdruck des Dampfes muss den Sättigungsdampfdruck bei der herrschenden Temperatur
      erreichen, etwa durch Abkühlen oder Verdichten.
    limits: >-
      Nicht kondensierbare Gase wie Luft sammeln sich an der Kondensationsfläche und verschlechtern
      den Wärmeübergang stark.
    sideEffects: >-
      Kondenswasser kann Korrosion, Schimmel oder Wasserschläge in Dampfleitungen verursachen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Condensation
    description: >-
      When a vapour cools below its dew point at a surface or within the gas, it turns into
      liquid. The latent heat of vaporisation is released again, which makes condensing steam
      a very effective heat carrier that heats at constant temperature. At the same time the
      condensable component is removed from the gas.
    example: >-
      Steam heating, power-plant condenser, heat pipe, dehumidifier, solvent recovery, dew
      and cloud formation
    conditions: >-
      The partial pressure of the vapour must reach the saturation vapour pressure at the
      prevailing temperature, e.g. by cooling or compression.
    limits: >-
      Non-condensable gases such as air accumulate at the condensing surface and severely
      impair heat transfer.
    sideEffects: Condensate can cause corrosion, mould or water hammer in steam lines.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
