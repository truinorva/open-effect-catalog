text:
  de:
    name: Photoakustischer Effekt (optohydraulischer Effekt)
    description: >-
      Absorbiert ein Stoff gepulstes oder in der Stärke moduliertes Licht, erwärmt er sich
      im Takt der Modulation, dehnt sich aus und sendet dadurch Druckwellen, also Schall,
      aus. Weil die Schallstärke davon abhängt, wie viel Licht bei einer Wellenlänge absorbiert
      wird, lassen sich Gase, Flüssigkeiten und Gewebe so spektroskopisch untersuchen und
      abbilden. Sehr kurze, energiereiche Laserpulse in Flüssigkeiten erzeugen durch schlagartiges
      Verdampfen oder optischen Durchbruch Stoßwellen mit hohem Druck; dieser Grenzfall wird
      auch optohydraulischer Effekt genannt.
    example: >-
      Photoakustische Gassensoren für CO₂ und Spurengase, photoakustische Bildgebung von Blutgefäßen,
      Spektroskopie an Pulvern und undurchsichtigen Proben, laserinduzierte Stoßwellen in
      Flüssigkeiten
    conditions: >-
      Licht einer Wellenlänge, die der Stoff absorbiert, und eine zeitliche Modulation oder
      Pulsung der Lichtleistung.
    limits: >-
      Im Messbetrieb sind die Schallsignale schwach und empfindlich gegenüber Umgebungsgeräuschen
      und Erschütterungen.
    sideEffects: >-
      Energiereiche Pulse können Kavitationsblasen bilden und angrenzendes Material oder Gewebe
      schädigen.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Photoacoustic effect (opto-hydraulic effect)
    description: >-
      When a substance absorbs pulsed or intensity-modulated light, it heats up in step with
      the modulation, expands and thereby emits pressure waves, that is sound. Because the
      sound level depends on how much light is absorbed at a given wavelength, gases, liquids
      and tissue can be examined spectroscopically and imaged this way. Very short, high-energy
      laser pulses in liquids create high-pressure shock waves through sudden vaporisation
      or optical breakdown; this extreme case is also called the opto-hydraulic effect.
    example: >-
      Photoacoustic gas sensors for CO₂ and trace gases, photoacoustic imaging of blood vessels,
      spectroscopy of powders and opaque samples, laser-induced shock waves in liquids
    conditions: >-
      Light of a wavelength the substance absorbs and a temporal modulation or pulsing of
      the light power.
    limits: >-
      In sensing, the acoustic signals are weak and sensitive to ambient noise and vibration.
    sideEffects: >-
      High-energy pulses can create cavitation bubbles and damage adjacent material or tissue.
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
