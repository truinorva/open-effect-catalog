text:
  de:
    name: Druckgradientkraft
    description: >-
      Ändert sich der Druck in einem Fluid von Ort zu Ort, wirkt auf jedes Volumenelement
      eine Nettokraft vom hohen zum niedrigen Druck, die proportional zum Druckgefälle ist.
      Diese Kraft treibt Strömungen in Rohren und Kanälen an, erzeugt Winde zwischen Hoch-
      und Tiefdruckgebieten und hält im ruhenden Fluid dem Gewicht das Gleichgewicht, woraus
      der Auftrieb eingetauchter Körper entsteht.
    example: >-
      Rohrströmung durch Pumpendruck, Wind zwischen Hoch- und Tiefdruckgebieten, Durchströmung
      poröser Medien nach dem Darcy-Gesetz, Ansaugen von Flüssigkeit in Pipette und Trinkhalm,
      Auftrieb
    conditions: Ein räumlich ungleichmäßiger Druck in einem Gas oder einer Flüssigkeit.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
  en:
    name: Pressure gradient force
    description: >-
      When the pressure in a fluid varies from place to place, every volume element experiences
      a net force from high to low pressure, proportional to the pressure gradient. This force
      drives flow in pipes and channels, creates winds between high- and low-pressure areas,
      and in a fluid at rest it balances the weight, which gives rise to the buoyancy of immersed
      bodies.
    example: >-
      Pipe flow driven by pump pressure, wind between high- and low-pressure systems, flow
      through porous media following Darcy's law, drawing liquid into a pipette or straw,
      buoyancy
    conditions: Non-uniform pressure in a gas or liquid.
    limits: ''
    sideEffects: ''
    kind: maschinell
    author: ''
    model: claude-opus-5-5
    updated: '2026-11-19'
